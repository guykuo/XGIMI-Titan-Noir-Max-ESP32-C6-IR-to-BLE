substitutions:

  ssid_name: "ESP32 Xgimi Setup" # KUO name for generic esp32
  device_name: esp32-xgimi # KUO name for generic esp32
  friendly_name: "esp32 xgimi" # KUO name for generic esp32

  shortcut_1_name: Shortcut 1 - HDMI 1
  shortcut_2_name: Shortcut 2 - HDMI 2
  shortcut_3_name: Shortcut 3 - HDMI 3
  shortcut_4_name: Shortcut 4 - 3D Settings

# ======================================================================
# ============= BEGIN Configuration Options KUO ==========
# ***** basic board and GPIO wiring
  ble_remote_name: "LG to Xgimi"  # Name remote to indicate IR remote expected. KUO
  
  board_type: "esp32-c3-devkitm-1" # <== set board type here
  framework_type: "esp-idf" # <====  set board framewark. 
  pin_ir_receiver: GPIO1 # <======= set GPIO pin for IR sensor. 
  pin_optional_wake_btn: GPIO3 # <= set GPIO pin for optional wake button. 

# ***** i2c Display Pins
# We always define a set of i2c pins to allow sharing of code base between boards with/without display

# Pins for #ESP32-C3 with built in OLED i2c display
i2c: 
  sda: GPIO5
  scl: GPIO6
  scan: true
  id: bus_a

# # Pins for # ESP32-C6-wroom-1 and dummy or optional i2c display. Also display defintions near end of file
# i2c: 
#   sda: GPIO21
#   scl: GPIO22
#   frequency: 400kHz
#   scan: false # Required for ESP32-C6 to prevent startup crashes during boot scans
#   id: bus_a


packages: 
  mrmachine_BLE_package: !include ir-common-kuo/mrmachine_bluetoothV_old.yaml # core bluetooth stack implementaton base by mrmachine
  
  # ***** IR mapping options
  # Select IR code mapping is desired by leaving the desired one uncommented. 
  # Choices are TiVo Roamio, Hisense 50U6G, LG Cinebeam HU810P, or JVC HR-9600 VCR
  # One and ONLY ONE irmap_package should be uncommented.
  
  #  irmap_package: !include ir-common-kuo/ir-map-tivo-roamio.yaml # TiVo Roamio IR mapping
  #  irmap_package: !include ir-common-kuo/ir-map-hisense-50u6g.yaml # Hisense 50U6G IR mapping
  irmap_package: !include ir-common-kuo/ir-map-LG-cinebeam-hu810p.yaml # LG Cinebeam HU810P IR mapping
  #  irmap_package: !include ir-common-kuo/ir-map-jvc-hr-S9600u.yaml # JVC HR-9600 VCR IR mapping


# ============= END Configuration Options KUO ===========
# ======================================================================

preferences:
  flash_write_interval: 3s # More quickly commits sniffed tokens to flash. Global data rarely changes.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: General-purpose ESP32 with XGIMI BLE wake and remote emulation # KUO name for generic ESP32
  includes:
    - <sstream>
    - <iomanip>
    - <array>
    - secrets_bridge.h

  project:
    name: xgimi.titan-noir-max-esp32-rc # KUO name for generic ESP32
    version: 2.23.0


  on_boot:
    - priority: 250 
      then:
        - binary_sensor.template.publish:
            id: sniffer_status
            state: OFF
        
        - lambda: |-
           id(OLED_line2) = "${ble_remote_name}"; // set 2nd OLED line

           bool learned_wake_token_exists = false; // check if any bytes are not 0x00
            for (int i = 0; i < 15; i++) {
              if (id(learned_wake_token)[i] != 0x00) {
                learned_wake_token_exists = true;
                break;
              }
            }
            
            if (learned_wake_token_exists) {
              // There is a token stored in flash. Copy it to runtime array memory.
              memcpy(id(active_wake_token), id(learned_wake_token), 15);

              std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                            
              // create human readable hex string of active_wake_token
              std::string formatted_hex = "";
              
              // 🛠️ FIXED: Turned a single 'char' variable into a sized character array to fix line 79 crash
              char slice_buf[4];
              for (size_t i = 0; i < 5; i++) {
                uint8_t byte = id(active_wake_token)[i];
                snprintf(slice_buf, sizeof(slice_buf), "%02X ", byte);
                formatted_hex += slice_buf;
              }
              if (!formatted_hex.empty()) formatted_hex.pop_back();
              formatted_hex += "..."; 
              
              ESP_LOGD("boot_loader", "Using learned 15-byte token from NVS flash: %s", formatted_hex.c_str());
              id(OLED_line1) = formatted_hex; 
              
            } else {
              std::vector<uint8_t> active_token_vector = get_secret_wake_token();
              
              for (size_t i = 0; i < 15; ++i) {
                id(active_wake_token)[i] = active_token_vector[i];
              }
            
              std::string formatted_hex = "";
              for (size_t i = 0; i < 15; ++i) {
                  if (i > 0) formatted_hex += " ";
                  char buf[3];
                  snprintf(buf, sizeof(buf), "%02x", id(active_wake_token)[i]);
                  formatted_hex += buf;
              }
              ESP_LOGD("boot_loader", "Using secrets token via C++ bridge text parser: %s", formatted_hex.c_str());
              
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                  
              id(OLED_line1) = formatted_hex;
              id(OLED_line2) = "None Learned";
              id(OLED_line3) = "Using Default";
              ESP_LOGD("boot_loader", "Flash memory is empty. Suggest sniffing BLE new wake token.");
 
              // 🛠️ ADDED: Build and print the active_token_vector hex payload directly to the ESPHome logs
              std::string hex_log_str = "";
              for (size_t i = 0; i < active_token_vector.size(); ++i) {
                  if (i > 0) hex_log_str += " ";
                  char buf[3];
                  snprintf(buf, sizeof(buf), "%02x", active_token_vector[i]);
                  hex_log_str += buf;
              }
      
              ESP_LOGD("boot_loader", "Active wake token vector now set to hex: %s", hex_log_str.c_str());
       
 
 
            }

        - script.execute: display_timeout_handler



  
external_components:
- source:
    type: local
    path: components
  components: [esp32_ble_server, xgimi_remote]
  

esp32:
  board: ${board_type}
  framework:
    type: ${framework_type}
    
  partitions: partitions.csv  
      


logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    


    
  

globals:

    # ======= wake_token globals
    # During boot, if a token has been previously stored, this overrides the one supplied secrets      
  - id: learned_wake_token # Learned wake token is stored here. Persistent upon globals sync.
    type: uint8_t[15]
    restore_value: yes
    initial_value: '{0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00}'
 
  - id: active_wake_token # this copy of wake token is submitted to set_wake_token. 
    type: uint8_t[15]
    restore_value: no
    initial_value: '{0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00}'
                 
  - id: sniffer_candidate_token # used for token sniffing
    type: std::string
    restore_value: no
    initial_value: '"None"'

  - id: sniffer_hit_counter # used for token sniffing
    type: int
    restore_value: no
    initial_value: '0'

    # ======= OLED display globals
  - id: OLED_line1
    type: std::string  
    restore_value: no
    initial_value: '"IR to BLE Kuo"'

  - id: OLED_line2
    restore_value: no
    type: std::string  
    #assign at boot
    
  - id: OLED_line3
    restore_value: no
    type: std::string  
    initial_value: '"Translator"'

  - id: OLED_small_text
    type: bool
    restore_value: no
    initial_value: 'false'  # This acts as your default value!
    
    
# Dashboard helper to see if the sniffer is active or asleep
binary_sensor:
  - platform: template
    name: "XGIMI Sniffer Active Status"
    id: sniffer_status
    icon: "mdi:radar"


button:
  - platform: template # ===== button implements sniffing episode
    name: "Token Sniff"
    id: token_sniff
    icon: "mdi:bluetooth-audio"
    on_press:
      then:
        - logger.log: "Button token_scan pressed. Starting capture sequence..."

        # prep globals for sniffing
        - lambda: |-
            id(sniffer_candidate_token) = "None";
            id(sniffer_hit_counter) = 0;

        # start sniffing
        - esp32_ble_tracker.start_scan: 
            continuous: false
      
        - binary_sensor.template.publish: # publish as sniffing
            id: sniffer_status
            state: ON
        - logger.log: "BLE Wake Token ===" 
        - logger.log: "BLE Wake Token === SNIFFING for Token." 
        - logger.log: "BLE Wake Token === Repeatedly press xgimi power button." 
        - logger.log: "BLE Wake Token ===" 
        # show on OLED display
        - lambda: |-
            id(OLED_line1) = "SNIFFING Token"; 
            id(OLED_line2) = "Repeat Press";
            id(OLED_line3) = "Xgimi Power";
        - script.execute: display_timeout_handler
            
        - delay: 20s # how long sniffing should continue.

        - esp32_ble_tracker.stop_scan: {} # stop sniffing
 
        - binary_sensor.template.publish:
            id: sniffer_status
            state: OFF          
        - logger.log: "BLE Wake Token === Sniffing Ended."
        # show on OLED display
        - lambda: |-
            id(OLED_line1) = "Wake Token"; 
            id(OLED_line2) = "Sniffing";
            id(OLED_line3) = "ENDED";
        - script.execute: display_timeout_handler
 
 
 # retrieve stored template, display, and use as active token
  - platform: template
    name: "Token Recall"
    id: token_recall
    icon: "mdi:bluetooth"
    on_press:
      then:
        - lambda: |-
            bool learned_wake_token_exists = false; // check if any bytes are not 0x00
            for (int i = 0; i < 15; i++) {
              if (id(learned_wake_token)[i] != 0x00) {
                learned_wake_token_exists = true;
                break;
              }
            }
            
            if (learned_wake_token_exists) {

              // Copy learned_wake_token into active_wake_token
              memcpy(id(active_wake_token), id(learned_wake_token), 15);
              
              // submit active_wake_token as one to use
              std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);

              // Display entire learned token via a display script
              //   must convert array into integer vector for to pass as script
              std::vector<int> token_int_pass(id(active_wake_token), id(active_wake_token) + 15); 
              id(display_wake_token).execute(token_int_pass);            
              
            } else {

              // 🛠️ THE C HELPER BRIDGE INJECTION: Safely sync parsed secret vector data to active arrays
              std::vector<uint8_t> active_token_vector = get_secret_wake_token();
              for (size_t i = 0; i < 15; ++i) {
                id(active_wake_token)[i] = active_token_vector[i];
              }

              // 🛠️ ADDED: Build full hexadecimal string of active_wake_token for OLED_line1
              std::string formatted_hex = "";
              for (size_t i = 0; i < 15; ++i) {
                  if (i > 0) {
                      formatted_hex += " ";
                  }
                  char buf[3];
                  snprintf(buf, sizeof(buf), "%02x", id(active_wake_token)[i]);
                  formatted_hex += buf;
              }
 
              id(OLED_line1) = formatted_hex;
              id(OLED_line2) = "Default Token";
              id(OLED_line3) = "Being Used";
              id(display_timeout_handler).execute(); 
            }


  - platform: template
    name: "Token Clear"
    id: token_clear
    icon: "mdi:bluetooth"
    on_press:
      then:
        - logger.log: "Clearing BLE wake token"

        - esp32_ble_tracker.stop_scan: {}

        - binary_sensor.template.publish:
            id: sniffer_status
            state: OFF          
        - logger.log: "BLE Clear Token === Sniffing Ended."
        - logger.log: "BLE Clear Token === Zeroing Token."

        # Show on OLED display
        - lambda: |-
            id(OLED_line1) = "Wake Token"; 
            id(OLED_line2) = "Sniffing";
            id(OLED_line3) = "ENDED";
        - script.execute: display_timeout_handler

        - lambda: |-
            bool learned_wake_token_exists = false; // check if any bytes are not 0x00
            for (int i = 0; i < 15; i++) {
              if (id(learned_wake_token)[i] != 0x00) {
                learned_wake_token_exists = true;
                break;
              }
            }
            
            if (learned_wake_token_exists) {
              // Wipe flash persistent memory 
              memset(id(learned_wake_token), 0x00, 15);  
              global_preferences->sync();

              // Clear operational array memory as well
              memset(id(active_wake_token), 0x00, 15);

              id(OLED_line1) = "Clear Learned";
              id(OLED_line2) = "Using Default";
              id(OLED_line3) = "Pending 5 sec";
            } else {
            
              // 🛠️ THE C HELPER BRIDGE INJECTION: Safely sync parsed secret vector data to active arrays
              std::vector<uint8_t> active_token_vector = get_secret_wake_token();
              for (size_t i = 0; i < 15; ++i) {
                id(active_wake_token)[i] = active_token_vector[i];
              }
              
              id(OLED_line1) = "Already Cleared";
              id(OLED_line2) = "(no learned)";
              id(OLED_line3) = "Using Default";
          
            }  
            
            // Submit active_wake_token wrapped inside a temporary runtime vector object
            std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
            id(xgimi_remote_controller)->set_wake_token(active_token_vector);
  
            // 🛠️ ADDED: Build and print the active_token_vector hex payload directly to the ESPHome logs
            std::string hex_log_str = "";
            for (size_t i = 0; i < active_token_vector.size(); ++i) {
                if (i > 0) hex_log_str += " ";
                char buf[3];
                snprintf(buf, sizeof(buf), "%02x", active_token_vector[i]);
                hex_log_str += buf;
            }
            ESP_LOGD("token_clear", "Active wake token vector now set to hex: %s", hex_log_str.c_str());

  
        - script.execute: display_timeout_handler


 


        
# ==========================================
# BLE TRACKING performs sniffing for wake tokens
# Upon finding one, stores and beings using new token
# ==========================================
esp32_ble_tracker:
  id: my_ble_tracker   
  scan_parameters:
    active: true
    continuous: false  
  on_ble_advertise:
    - then:
        - lambda: |-
            for (auto &data : x.get_manufacturer_datas()) {
              if (data.uuid.get_uuid().uuid.uuid16 == 0x0046) {
                
                auto const& raw_payload = data.data;

                // Compare raw memory bytes against global byte array
                if (raw_payload.size() >= 15) {
                  const uint8_t* incoming_last15_ptr = raw_payload.data() + (raw_payload.size() - 15);
  
                  if (memcmp(incoming_last15_ptr, id(active_wake_token), 15) == 0) {
                    continue; 
                  }
                }

                // 2. Parse payload text characters for architectural masking routines
                std::string token_hex = "";
                char buffer[4]; // Restored fixed size allocation array bounds
                for (unsigned char byte : raw_payload) {
                  snprintf(buffer, sizeof(buffer), "%02X", byte);
                  token_hex += buffer;
                }
                
                if (token_hex.length() < 30) continue; 

                ESP_LOGI("xgimi_sniffer", "Detected raw XGIMI token: %s", token_hex.c_str());

                std::string current_masked = token_hex;
                std::string candidate_masked = id(sniffer_candidate_token);
                
                if (current_masked.length() >= 4) {
                  size_t mask_pos = current_masked.length() - 4;
                  current_masked.replace(mask_pos, 2, "XX");
                  
                  if (candidate_masked != "None" && candidate_masked.length() == current_masked.length()) {
                    candidate_masked.replace(mask_pos, 2, "XX");
                  }
                }

                if (id(sniffer_candidate_token) != "None" && current_masked == candidate_masked) {
                  id(sniffer_hit_counter)++;
                  ESP_LOGI("xgimi_sniffer", "Token matched architecture. Match count: %d for Token: %s", id(sniffer_hit_counter), token_hex.c_str());
                  
                  if (id(sniffer_hit_counter) >= 4) {
                    
                    if (raw_payload.size() >= 15) {
                      // Copy last 15 bytes of raw_payload into sniffed_token_last15
                      std::vector<uint8_t> sniffed_token_last15(raw_payload.end() - 15, raw_payload.end());
                      
                      std::string sniffed_token_last15_hex = ""; // create human readable hex
                      char slice_buf[4]; // Restored array buffer boundaries
                      for (uint8_t byte : sniffed_token_last15) {
                        snprintf(slice_buf, sizeof(slice_buf), "%02X ", byte);
                        sniffed_token_last15_hex += slice_buf;
                      }

                      ESP_LOGI("xgimi_sniffer", "New TOKEN %s", sniffed_token_last15_hex.c_str());

                      // Copy 15 vector bytes into active active_wake_token and learned_wake_token. Request NVS sync
                      memcpy(id(active_wake_token), sniffed_token_last15.data(), 15);
                      memcpy(id(learned_wake_token), sniffed_token_last15.data(), 15);
                      global_preferences->sync(); // flush to physical flash sectors

                      // submit active_wake_token as one to use
                      std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
                      id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                                            
                      ESP_LOGI("xgimi_sniffer", "Successfully passed the final 15 bytes to XgimiRemote component.");

                      id(sniffer_hit_counter) = 0; 

                      
                      ESP_LOGI("xgimi_sniffer", "SUCCESS! Token queued for Flash memory.");

                      // display
                      id(OLED_line1) = sniffed_token_last15_hex;
                      id(OLED_line2) = "Storing Token";
                      id(OLED_line3) = "Pending 5 sec";
                      id(display_timeout_handler).execute();
                      
                      id(my_ble_tracker)->stop_scan(); 
                      
                      ESP_LOGI("xgimi_sniffer", "SUCCESS! Repeated XGIMI Wake Token detected and updated.");
                    } else {
                    
                      ESP_LOGE("xgimi_sniffer", "Token is too short at byte count of %d", raw_payload.size());
                      
                      id(OLED_line1) = "Failure";
                      id(OLED_line2) = "Bad Format";
                      id(OLED_line3) = "Token";
                      id(display_timeout_handler).execute();
                    }
                  }

                } else {
                  id(sniffer_candidate_token) = token_hex;
                  id(sniffer_hit_counter) = 1;
                  ESP_LOGI("xgimi_sniffer", "New unique signature. Target candidate updated to: %s", token_hex.c_str());
                }
              }
            }


#=====================  utility scripts
script:
                
  # OLED timeout handler script ===================
  - id: display_timeout_handler
    mode: restart 
    # FIXED: No parameter block needed. It reads the global state instead.
    then:
      - lambda: |-
          if (id(OLED_small_text)) {
            id(oled_display).show_page(id(active_page_small));
          } else {
            id(oled_display).show_page(id(active_page_std));
          }

      - delay: 40s
      
      - display.page.show: blank_page


  - id: display_wake_token
    mode: restart 
    parameters:
      token_param: int[]
    then:
      - lambda: |-
          if (token_param.size() >= 15) {
            // FIXED: Fully declared array bounds buffer to stop compiler panics
            char slice_buf[4];

            // Line 1: First 5 bytes (Indices 0 to 4)
            std::string line1_hex = "";
            for (size_t i = 0; i < 5; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line1_hex += slice_buf;
            }
            if (!line1_hex.empty()) line1_hex.pop_back();
            id(OLED_line1) = line1_hex;

            // Line 2: Next 5 bytes (Indices 5 to 9)
            std::string line2_hex = "";
            for (size_t i = 5; i < 10; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line2_hex += slice_buf;
            }
            if (!line2_hex.empty()) line2_hex.pop_back();
            id(OLED_line2) = line2_hex;

            // Line 3: Last 5 bytes (Indices 10 to 14)
            std::string line3_hex = "";
            for (size_t i = 10; i < 15; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line3_hex += slice_buf;
            }
            if (!line3_hex.empty()) line3_hex.pop_back();
            id(OLED_line3) = line3_hex;

          } else {
            id(OLED_line1) = "Error:";
            id(OLED_line2) = "Token Size";
            id(OLED_line3) = "Invalid";
          }
          
      - globals.set:
          id: OLED_small_text
          value: 'true'
      - script.execute: display_timeout_handler
 



# Download font for text rendering
font:
  - file: "gfonts://Roboto"
    id: my_fontSmall
    size: 9

  - file: "gfonts://Roboto"
    id: my_fontMedium
    size: 10

  - file: "gfonts://Roboto"
    id: my_fontLarge
    size: 12

    
# Built-in 72x40 SSD1306 OLED screen
display:
  - platform: ssd1306_i2c
    model: "SSD1306 72x40"
    address: 0x3C
    id: oled_display
    update_interval: 0.3s
    offset_x: 0
    offset_y: 0
    rotation: 0
    pages:
      - id: active_page_std
        lambda: |-
          it.print(0, 0,  id(my_fontMedium), id(OLED_line1).c_str());
          it.print(0, 11, id(my_fontLarge), id(OLED_line2).c_str());
          it.print(0, 24, id(my_fontLarge), id(OLED_line3).c_str());

      # FIXED: Aligned list item dash and nested lambda text exactly 4 spaces deep
      - id: active_page_small
        lambda: |-
          it.print(0, 0,  id(my_fontSmall), id(OLED_line1).c_str());
          it.print(0, 12, id(my_fontSmall), id(OLED_line2).c_str());
          it.print(0, 24, id(my_fontSmall), id(OLED_line3).c_str());

      # FIXED: Aligned list item dash and nested comment string safely
      - id: blank_page
        lambda: |-
          // Leaving lambda completely blank turns all pixels off safely
