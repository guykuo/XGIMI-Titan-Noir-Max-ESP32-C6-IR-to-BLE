substitutions:
# ============ set name for remote, ESP32 board, board framework, and pin for IR receiver KUO
# also see end of this file and set included package for IR reciver and button action mapping to be correct for desired IR remote.

  ble_remote_name: "TiVo IR to Xgimi"  # Name remote to indicate IR remote expected. KUO
  
  board_type: "esp32-c3-devkitm-1" # set board type here. KUO
  framework_type: "esp-idf" # set board framewark. Kuo
  pin_ir_receiver: GPIO4 # define which pin is used by IR sensor. KUO


  ssid_name: "ESP32 Xgimi Setup" # KUO name for generic esp32
  device_name: esp32-xgimi # KUO name for generic esp32
  friendly_name: "esp32 xgimi" # KUO name for generic esp32
 
  pin_optional_wake_btn: GPIO11

# ============ 

  shortcut_1_name: Shortcut 1 - HDMI 1
  shortcut_2_name: Shortcut 2 - HDMI 2
  shortcut_3_name: Shortcut 3 - HDMI 3
  shortcut_4_name: Shortcut 4 - 3D Settings

  
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: General-purpose ESP32 with XGIMI BLE wake and remote emulation # KUO name for generic ESP32
  includes:
    - <sstream>
    - <iomanip>
  project:
    name: xgimi.titan-noir-max-esp32-rc # KUO name for generic ESP32
    version: 2.23.0
  on_boot:
    # Template-number restoration happens during setup; apply its restored value
    # to the HID component after every component has initialised.
    - priority: -100
      then:
        - lambda: |-
            id(xgimi_remote_controller).set_tap_duration_ms(
                static_cast<uint16_t>(id(tap_duration).state));
        - script.execute: display_timeout_handler
        
external_components:
  - source:
      type: local
      path: components
    components: [esp32_ble_server, xgimi_remote]

esp32:
  board: ${board_type} #Kuo sub for board type
  framework:
    type: ${framework_type} #Kuo sub for board framework

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password


# Global variable to save the latest parsed IR data
globals:
  - id: last_xgimi_TN_command
    type: std::string  
    initial_value: '"IR to BLE Kuo"'

  - id: last_IR_address
    type: std::string  
    initial_value: '"TiVo to Xgimi"'
    
  - id: last_IR_instruction
    type: std::string  
    initial_value: '"READY"'
    

# OLED timeout handler script
script:
  - id: display_timeout_handler
    mode: restart 
    then:
      - display.page.show: active_page
      - delay: 10s
      - display.page.show: blank_page   

 
# Configures the built-in I2C bus for the OLED display
i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true
  id: bus_a

# Download font for text rendering
font:
  - file: "gfonts://Roboto"
    id: my_fontSmall
    size: 10
  - file: "gfonts://Roboto"
    id: my_fontMedium
    size: 12

# Built-in 72x40 SSD1306 OLED screen
display:
  - platform: ssd1306_i2c
    model: "SSD1306 72x40"
    address: 0x3C
    id: oled_display
    update_interval: 0.5s
    offset_x: 0
    offset_y: 0
    rotation: 0
    pages:
      - id: active_page
        lambda: |-
          it.print(0, 0, id(my_fontSmall), id(last_xgimi_TN_command).c_str());
          it.print(0, 11, id(my_fontMedium), id(last_IR_address).c_str());
          it.print(0, 24, id(my_fontMedium), id(last_IR_instruction).c_str());
      - id: blank_page
        lambda: |-
          // Leaving lambda completely blank turns all pixels off safely
         
            
packages: 
  main_package: !include ir-common-kuo/core_bluetooth.yaml # core bluetooth stack implementaton base upon mrmachine
  irmap_package: !include ir-common-kuo/ir-map-tivo-nec-protocol.yaml # hisense IR reciver and button action mapping
  