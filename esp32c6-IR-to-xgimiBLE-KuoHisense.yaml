substitutions:
  device_name: esp32-xgimi # KUO name for generic esp32
  friendly_name: "esp32 xgimi" # KUO name for generic esp32
  # Use "XGIMI RC" only when replacing the original remote and its Shortcut
  # 1–4 settings must be exposed. Sharing that identity can replace the real
  # remote's pairing on the projector.
  ble_remote_name: "Hisense IR to Xgimi"  # KUO name indicating Hisense IR
  # Labels only: change these to match the four functions assigned in the
  # projector's Shortcut settings. The button IDs remain stable in HA.
  shortcut_1_name: Shortcut 1 - HDMI 1
  shortcut_2_name: Shortcut 2 - HDMI 2
  shortcut_3_name: Shortcut 3 - HDMI 3
  shortcut_4_name: Shortcut 4 - 3D Settings

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: General-purpose ESP32 with XGIMI BLE wake and remote emulation # KUO name for generic ESP32
  project:
    name: xgimi.titan-noir-max-esp32-rc # KUO name for generic ESP32
    version: 2.23.0
  on_boot:
    # Template-number restoration happens during setup; apply its restored value
    # to the HID component after every component has initialised.
    - priority: -100
      then:
        - lambda: |-
            id(xgimi_remote_controller).set_tap_duration_ms(
                static_cast<uint16_t>(id(tap_duration).state));

external_components:
  - source:
      type: local
      path: components
    components: [esp32_ble_server, xgimi_remote]

esp32:
  board: esp32-c6-devkitc-1 # KUO for esp32-c6 board
  framework:
    type: esp-idf

logger:
#  level: DEBUG # KUO verbose logging during testing
  
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  reboot_timeout: 0s
  ap:
    ssid: "ESP32 Xgimi Setup" # Kuo generic ESP 32 rename
    password: !secret fallback_ap_password
    ap_timeout: 15s

captive_portal:
improv_serial:

esp32_ble:
  id: atom_ble
  name: "${ble_remote_name}"
  io_capability: none
  auth_req_mode: bond
  min_key_size: 7
  max_key_size: 16
  max_connections: 1

esp32_ble_server:
  id: atom_ble_server
  appearance: 0x0180
  manufacturer_data: [0x46, 0x00]
  max_clients: 1
  services:
    # Exact identity fields reported by the original remote.
    - uuid: 0x180A
      characteristics:
        - uuid: 0x2A29
          read: true
          value: "Seneasy"
        - uuid: 0x2A24
          read: true
          value: "${ble_remote_name}"
        - uuid: 0x2A25
          read: true
          value: "20260205"
        - uuid: 0x2A26
          read: true
          value: "V1.0.0"
        - uuid: 0x2A50
          read: true
          # USB VID source, VID 000D, PID 3843, version 0003 (little-endian).
          value: [0x02, 0x0D, 0x00, 0x43, 0x38, 0x03, 0x00]

    - uuid: 0x180F
      characteristics:
        - uuid: 0x2A19
          read: true
          notify: true
          value: [100]

    - uuid: 0x1812
      advertise: true
      characteristics:
        - uuid: 0x2A4A
          read: true
          # HID 1.11, no country code, normally connectable + remote wake.
          value: [0x11, 0x01, 0x00, 0x03]

        - uuid: 0x2A4B
          read: true
          # Byte-for-byte descriptor captured from the original XGIMI remote.
          value:
            [
              0x05, 0x01, 0x09, 0x06, 0xA1, 0x01, 0x05, 0x07,
              0x09, 0x06, 0xA1, 0x01, 0x85, 0x01, 0x95, 0x08,
              0x75, 0x08, 0x15, 0x00, 0x25, 0xFF, 0x19, 0x00,
              0x29, 0xFF, 0x81, 0x00, 0xC0, 0x05, 0x0C, 0x09,
              0x01, 0xA1, 0x01, 0x85, 0x02, 0x95, 0x03, 0x75,
              0x10, 0x15, 0x00, 0x26, 0x9C, 0x02, 0x19, 0x00,
              0x2A, 0x9C, 0x02, 0x81, 0x00, 0xC0, 0xC0
            ]

        - uuid: 0x2A4C
          write_no_response: true
          value: [0x00]

        - uuid: 0x2A4E
          read: true
          write_no_response: true
          value: [0x01]

        - uuid: 0x2A4D
          id: xgimi_keyboard_report
          read: true
          notify: true
          value: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          descriptors:
            - uuid: 0x2908
              read: true
              write: false
              value: [0x01, 0x01]

        - uuid: 0x2A4D
          id: xgimi_consumer_report
          read: true
          notify: true
          value: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          descriptors:
            - uuid: 0x2908
              read: true
              write: false
              value: [0x02, 0x01]

xgimi_remote:
  id: xgimi_remote_controller
  remote_name: "${ble_remote_name}"
  tap_duration_ms: 100
  wake_token: !secret xgimi_wake_token
  ble_id: atom_ble
  ble_server_id: atom_ble_server
  keyboard_report_id: xgimi_keyboard_report
  consumer_report_id: xgimi_consumer_report


# ======= KUO Begin remote_receiver on GPIO10 ============
remote_receiver:
  id: ir_receiver
  pin:
    number: GPIO10
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us
  idle: 10ms
  tolerance: 25%
  dump: nec
# ======= KUO End remote_receiver ============


sensor:
  - platform: template
    name: "Wake Counter Last Sent"
    id: wake_counter_last_sent
    icon: mdi:counter
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      if (!id(xgimi_remote_controller).has_last_wake_counter())
        return NAN;
      return id(xgimi_remote_controller).last_wake_counter();

  - platform: template
    name: "Wake Sweep Values Sent"
    id: wake_sweep_values_sent
    icon: mdi:counter
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 1s
    lambda: return id(xgimi_remote_controller).wake_values_sent();

  - platform: template
    name: "Wake Sweep Cycles"
    id: wake_sweep_cycles
    icon: mdi:sync
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 1s
    lambda: return id(xgimi_remote_controller).wake_cycles_completed();

number:
  - platform: template
    name: "Wake Counter"
    id: wake_counter
    icon: mdi:counter
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    entity_category: config

  - platform: template
    name: "Tap Duration"
    id: tap_duration
    icon: mdi:gesture-tap-button
    unit_of_measurement: ms
    min_value: 20
    max_value: 1000
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 100
    entity_category: config
    set_action:
      - lambda: |-
          id(xgimi_remote_controller).set_tap_duration_ms(
              static_cast<uint16_t>(x));

  - platform: template
    name: "Wake Counter Dwell"
    id: wake_counter_dwell
    icon: mdi:timer-outline
    unit_of_measurement: ms
    min_value: 1500
    max_value: 5000
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1500
    entity_category: config

  - platform: template
    name: "Wake Advertisement Gap"
    id: wake_advertisement_gap
    icon: mdi:timer-pause-outline
    unit_of_measurement: ms
    min_value: 500
    max_value: 1000
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 500
    entity_category: config

  - platform: template
    name: "Exact Wake Duration"
    id: exact_wake_duration
    icon: mdi:timer-outline
    unit_of_measurement: ms
    min_value: 20
    max_value: 5000
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 4000
    entity_category: config

binary_sensor:
  - platform: template
    name: "Power"
    id: actual_power
    icon: mdi:power
    device_class: power
    lambda: return id(xgimi_remote_controller).actual_power_state();

  - platform: template
    name: "Projector Remote Connected"
    id: projector_remote_connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(xgimi_remote_controller).is_connected();

  - platform: template
    name: "Projector Remote Authenticated"
    id: projector_remote_authenticated
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(xgimi_remote_controller).is_authenticated();

  - platform: template
    name: "Projector Keyboard Notifications"
    id: projector_keyboard_notifications
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(xgimi_remote_controller).is_keyboard_subscribed();

  - platform: template
    name: "Projector Consumer Notifications"
    id: projector_consumer_notifications
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(xgimi_remote_controller).is_consumer_subscribed();

  - platform: gpio
    id: optional_wake_button # KUO no front button on generic ESP32
    internal: true
    pin:
      number: GPIO11 # KUO implement on GPIO11 if user adds a buttton
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: |-
          id(xgimi_remote_controller).set_wake_counter_dwell_ms(
              static_cast<uint16_t>(id(wake_counter_dwell).state));
          id(xgimi_remote_controller).set_wake_advertisement_gap_ms(
              static_cast<uint16_t>(id(wake_advertisement_gap).state));
          id(xgimi_remote_controller).request_power_on();


