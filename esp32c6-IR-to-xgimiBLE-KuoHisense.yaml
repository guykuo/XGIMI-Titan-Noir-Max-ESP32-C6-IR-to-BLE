switch:
  - platform: template
    name: "Power"
    id: projector_power
    icon: mdi:power
    restore_mode: DISABLED
    lambda: return id(xgimi_remote_controller).desired_power_state();
    turn_on_action:
      - lambda: |-
          id(xgimi_remote_controller).set_wake_counter_dwell_ms(
              static_cast<uint16_t>(id(wake_counter_dwell).state));
          id(xgimi_remote_controller).set_wake_advertisement_gap_ms(
              static_cast<uint16_t>(id(wake_advertisement_gap).state));
          id(xgimi_remote_controller).request_power_on();
    turn_off_action:
      # A stateful switch must actually reach Off, so use the confirmed
      # immediate-shutdown hold rather than opening the confirmation dialog.
      - lambda: id(xgimi_remote_controller).request_immediate_power_off();

button:
