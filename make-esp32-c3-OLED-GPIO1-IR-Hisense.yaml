# ============= BEGIN Configuration Options KUO ==========

# Only three things to configure here
#   ble_remote_name
#   hardware_package
#   irmap_package

substitutions:
  ble_remote_name: "Hisense Xgimi"  # <===== Name your IR remote. (20 char max)

packages: 

  # ******* NB do not accidentally leave out prefix ir-common-kuo/

  # --- hardware settings of ESP32 board
  hardware_package: !include ir-common-kuo/hardware-c3.yaml # <===== Replace HARDWAREFILE.yaml with your board.yaml

  # --- IR mapping options
  irmap_package:    !include ir-common-kuo/irmap-hisense-50u6g.yaml # <===== Replace IRMAP.yaml with your IRMAP.yaml 


  # do not change mrmachine_BLE_package line
  mrmachine_BLE_package: !include ir-common-kuo/appkit/mrmachine_bluetoothV_old.yaml # required, modified mrmachine original BLE package
  # do not change mrmachine_BLE_package line

# ============= END Configuration Options KUO ===========

# code after this point typically does not need to be changed.


preferences:
  flash_write_interval: 3s # More quickly commits sniffed tokens to flash. Global data rarely changes.
  
external_components:
- source:
    type: local
    path: components
  components: [esp32_ble_server, xgimi_remote]
  
esp32:
  partitions: ir-common-kuo/appkit/partitions.csv  #larger app partition needed 
      

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    
  
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: General-purpose ESP32 with XGIMI BLE wake and remote emulation # KUO name for generic ESP32
  includes:
    - <sstream>
    - <iomanip>
    - <array>
    - ir-common-kuo/appkit/secrets_bridge.h

  project:
    name: xgimi.titan-noir-esp32-rc # KUO name for generic ESP32
    version: 2.23.0


  on_boot:
    - priority: 250 
      then:
        - binary_sensor.template.publish:
            id: sniffer_status
            state: OFF
        
        - lambda: |-
           id(myDisplay_line2) = "${ble_remote_name}"; // set 2nd myDisplay line

           bool learned_wake_token_exists = false; // check if any bytes are not 0x00
            for (int i = 0; i < 15; i++) {
              if (id(learned_wake_token)[i] != 0x00) {
                learned_wake_token_exists = true;
                break;
              }
            }
            
            if (learned_wake_token_exists) {
              // There is a token stored in flash. Copy it to runtime array memory.
              memcpy(id(active_wake_token), id(learned_wake_token), 15);

              std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                            
              // create human readable hex string of active_wake_token
              std::string formatted_hex = "";
              
              // 🛠️ FIXED: Turned a single 'char' variable into a sized character array to fix line 79 crash
              char slice_buf[4];
              for (size_t i = 0; i < 5; i++) {
                uint8_t byte = id(active_wake_token)[i];
                snprintf(slice_buf, sizeof(slice_buf), "%02X ", byte);
                formatted_hex += slice_buf;
              }
              if (!formatted_hex.empty()) formatted_hex.pop_back();
              formatted_hex += "..."; 
              
              ESP_LOGD("boot_loader", "Using learned 15-byte token from NVS flash: %s", formatted_hex.c_str());
              id(myDisplay_line1) = formatted_hex; 
              
              id(flash_led_custom).execute(8, 0.0, 0.2, 0.0); // flash 8 times indicate has learned token.

            } else {
              std::vector<uint8_t> active_token_vector = get_secret_wake_token();
              
              for (size_t i = 0; i < 15; ++i) {
                id(active_wake_token)[i] = active_token_vector[i];
              }
            
              std::string formatted_hex = "";
              for (size_t i = 0; i < 15; ++i) {
                  if (i > 0) formatted_hex += " ";
                  char buf[3];
                  snprintf(buf, sizeof(buf), "%02x", id(active_wake_token)[i]);
                  formatted_hex += buf;
              }
              ESP_LOGD("boot_loader", "Using secrets token via C++ bridge text parser: %s", formatted_hex.c_str());
              
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                  
              id(myDisplay_line1) = formatted_hex;
              id(myDisplay_line2) = "None Learned";
              id(myDisplay_line3) = "Using Default";
              ESP_LOGD("boot_loader", "Flash memory is empty. Suggest sniffing BLE new wake token.");
 
              // 🛠️ ADDED: Build and print the active_token_vector hex payload directly to the ESPHome logs
              std::string hex_log_str = "";
              for (size_t i = 0; i < active_token_vector.size(); ++i) {
                  if (i > 0) hex_log_str += " ";
                  char buf[3];
                  snprintf(buf, sizeof(buf), "%02x", active_token_vector[i]);
                  hex_log_str += buf;
                  
              id(flash_led_custom).execute(2, 0.0, 0.0, 0.2); // flash two indicate default token.
              }
      
              ESP_LOGD("boot_loader", "Active wake token vector now set to hex: %s", hex_log_str.c_str());
            }        
        - script.execute: display_timeout_handler


globals:

    # ======= wake_token globals
    # During boot, if a token has been previously stored, this overrides the one supplied secrets      
  - id: learned_wake_token # Learned wake token is stored here. Persistent upon globals sync.
    type: uint8_t[15]
    restore_value: yes
    initial_value: '{0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00}'
 
  - id: active_wake_token # this copy of wake token is submitted to set_wake_token. 
    type: uint8_t[15]
    restore_value: no
    initial_value: '{0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00}'
                 
  - id: sniffer_candidate_token # used for token sniffing
    type: std::string
    restore_value: no
    initial_value: '"None"'

  - id: sniffer_hit_counter # used for token sniffing
    type: int
    restore_value: no
    initial_value: '0'

    # ======= myDisplay display globals
  - id: myDisplay_line1
    type: std::string  
    restore_value: no
    initial_value: '"IR to BLE Kuo"'

  - id: myDisplay_line2
    restore_value: no
    type: std::string  
    #assign at boot
    
  - id: myDisplay_line3
    restore_value: no
    type: std::string  
    initial_value: '"Translator"'

  - id: myDisplay_small_text
    type: bool
    restore_value: no
    initial_value: 'false'  # This acts as your default value!
    
  # ===== State flag: true means we are waiting for the 2nd click of clear_token action
  - id: clear_window_active
    type: bool
    initial_value: 'false'

  
binary_sensor:
  - platform: template
    name: "XGIMI Sniffer Active Status"
    id: sniffer_status
    icon: "mdi:radar"

  - platform: gpio # Implement physical button for sniff
    pin:
      number: ${pin_sniff_btn}
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Physical sniff button"
    id: physical_sniff_button
    on_press:
      then:
        - button.press: token_sniff


button:

  - platform: template # retrieve stored template, display, and use as active token
    name: "Token Recall"
    id: token_recall
    icon: "mdi:bluetooth"
    on_press:
      then:
        - lambda: |-
            bool learned_wake_token_exists = false; // check if any bytes are not 0x00
            for (int i = 0; i < 15; i++) {
              if (id(learned_wake_token)[i] != 0x00) {
                learned_wake_token_exists = true;
                break;
              }
            }
            
            if (learned_wake_token_exists) {

              // Copy learned_wake_token into active_wake_token
              memcpy(id(active_wake_token), id(learned_wake_token), 15);
              
              // submit active_wake_token as one to use
              std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);

              // Display entire learned token via a display script
              //   must convert array into integer vector for to pass as script
              std::vector<int> token_int_pass(id(active_wake_token), id(active_wake_token) + 15); 
              id(display_wake_token).execute(token_int_pass);            
              
            } else {

              // 🛠️ THE C HELPER BRIDGE INJECTION: Safely sync parsed secret vector data to active arrays
              std::vector<uint8_t> active_token_vector = get_secret_wake_token();
              for (size_t i = 0; i < 15; ++i) {
                id(active_wake_token)[i] = active_token_vector[i];
              }

              // 🛠️ ADDED: Build full hexadecimal string of active_wake_token for myDisplay_line1
              std::string formatted_hex = "";
              for (size_t i = 0; i < 15; ++i) {
                  if (i > 0) {
                      formatted_hex += " ";
                  }
                  char buf[3];
                  snprintf(buf, sizeof(buf), "%02x", id(active_wake_token)[i]);
                  formatted_hex += buf;
              }
 
              id(myDisplay_line1) = formatted_hex;
              id(myDisplay_line2) = "Default Token";
              id(myDisplay_line3) = "Being Used";
              id(display_timeout_handler).execute(); 
            }


  - platform: template # clear stored template. Revert to secrets wake token
    name: "Token Clear"
    id: token_clear
    on_press:
      then:
        
        - script.execute:
            id: turn_led_on_custom
            red: 0.3
            green: 0.2
            blue: 0.0
            brightness: 0.2
        
        
        - lambda: |-
            if (id(clear_window_active)) {
              // --- CONFIRMED: 2ND PHYSICAL PRESS RECEIVED ---
              id(clear_window_active) = false;
              id(clear_timeout_tracker).stop(); 
              id(run_token_clear_worker).execute(); 
            } else {
              // --- INITIALIZATION: 1ST PHYSICAL PRESS RECEIVED ---
              id(clear_window_active) = true;
              
              id(myDisplay_line1) = "Press Again!";
              id(myDisplay_line2) = "To Confirm";
              id(myDisplay_line3) = "Within 5 Sec";
              id(display_timeout_handler).execute();
              
              id(clear_timeout_tracker).execute();
            }            
            
  - platform: template # button to start sniffing for wake token. W
    name: "Token Sniff"
    id: token_sniff
    icon: "mdi:bluetooth-audio"
    on_press:
      then:
        - script.execute: sniffing_sequence
            
            
# ====== BLE TRACKING performs sniffing for wake tokens
# Upon finding one, stores and begins using new token

esp32_ble_tracker:
  id: my_ble_tracker   
  scan_parameters:
    active: true
    continuous: false  
  on_ble_advertise:
    - then:
        - lambda: |-
            for (auto &data : x.get_manufacturer_datas()) {
              if (data.uuid.get_uuid().uuid.uuid16 == 0x0046) {
                
                auto const& raw_payload = data.data;

                // 1. Parse payload text characters for architectural masking routines
                std::string token_hex = "";
                char buffer[4]; 
                for (unsigned char byte : raw_payload) {
                  snprintf(buffer, sizeof(buffer), "%02X", byte);
                  token_hex += buffer;
                }
                
                if (token_hex.length() < 30) continue; 

                ESP_LOGI("xgimi_sniffer", "Detected raw XGIMI token: %s", token_hex.c_str());

                std::string current_masked = token_hex;
                std::string candidate_masked = id(sniffer_candidate_token);
                
                if (current_masked.length() >= 4) {
                  size_t mask_pos = current_masked.length() - 4;
                  current_masked.replace(mask_pos, 2, "XX");
                  
                  if (candidate_masked != "None" && candidate_masked.length() == current_masked.length()) {
                    candidate_masked.replace(mask_pos, 2, "XX");
                  }
                }

                if (id(sniffer_candidate_token) != "None" && current_masked == candidate_masked) {
                  id(sniffer_hit_counter)++;
                  ESP_LOGI("xgimi_sniffer", "Token matched architecture. Match count: %d for Token: %s", id(sniffer_hit_counter), token_hex.c_str());
                  
                  if (id(sniffer_hit_counter) >= 4) {
                    
                    if (raw_payload.size() >= 15) {
                      // Copy last 15 bytes of raw_payload into sniffed_token_last15
                      std::vector<uint8_t> sniffed_token_last15(raw_payload.end() - 15, raw_payload.end());
                      
                      std::string sniffed_token_last15_hex = ""; 
                      char slice_buf[4]; 
                      for (uint8_t byte : sniffed_token_last15) {
                        snprintf(slice_buf, sizeof(slice_buf), "%02X ", byte);
                        sniffed_token_last15_hex += slice_buf;
                      }

                      // MODIFIED PROTECTION: Notify myDisplay and skip flash write if token is already active
                      if (memcmp(sniffed_token_last15.data(), id(active_wake_token), 15) == 0) {
                        ESP_LOGD("xgimi_sniffer", "Token matches active_wake_token. Skipping duplicate flash write.");
                        
                        // 1. Kill the 20s delay script instantly
                        id(sniffing_sequence).stop(); 
                      
                        // 2. Halt the BLE hardware scan and turn off the status sensor
                        id(my_ble_tracker)->stop_scan(); 
                        id(sniffer_status)->publish_state(false);
                      
                        id(flash_led_custom).execute(4, 0.0, 1.0, 0.0); // Flash 4 indicates matches stored
                        
                        id(sniffer_led)->turn_off();

                        // 3. Clear display routine backlogs and push static info
                        id(display_timeout_handler).stop();
                        id(myDisplay_line1) = "Token Recognized";
                        id(myDisplay_line2) = "Matches";
                        id(myDisplay_line3) = "Existing";
                        id(display_timeout_handler).execute();
                        
                        id(sniffer_hit_counter) = 0; 
                        continue;
                      }

                      ESP_LOGI("xgimi_sniffer", "New TOKEN %s", sniffed_token_last15_hex.c_str());

                      // Copy 15 vector bytes into active active_wake_token and learned_wake_token. Request NVS sync
                      memcpy(id(active_wake_token), sniffed_token_last15.data(), 15);
                      memcpy(id(learned_wake_token), sniffed_token_last15.data(), 15);
                      global_preferences->sync(); 

                      // submit active_wake_token as one to use
                      std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
                      id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                                            
                      ESP_LOGI("xgimi_sniffer", "Successfully passed the final 15 bytes to XgimiRemote component.");

                      id(sniffer_hit_counter) = 0; 

                      ESP_LOGI("xgimi_sniffer", "SUCCESS! Token queued for Flash memory.");

                      // 1. KILL THE 20s DELAY INSTANTLY
                      id(sniffing_sequence).stop(); 
                      
                      id(flash_led_custom).execute(8, 0.0, 1.0, 0.0); // flash 8 times to indicate stored new token
                      
                      id(sniffer_led)->turn_off();

                      // 2. Safely cleanup the state toggles manually since the script was aborted
                      id(my_ble_tracker)->stop_scan(); 
                      id(sniffer_status)->publish_state(false);
                      
                      // 3. Clear display delays and push your new text
                      id(display_timeout_handler).stop();
                      id(myDisplay_line1) = sniffed_token_last15_hex;
                      id(myDisplay_line2) = "Storing Token";
                      id(myDisplay_line3) = "Wait 5 sec";
                      id(display_timeout_handler).execute(); 
                      
                      ESP_LOGI("xgimi_sniffer", "SUCCESS! Repeated XGIMI Wake Token detected and updated.");
                    } else {
                    
                      ESP_LOGE("xgimi_sniffer", "Token is too short at byte count of %d", raw_payload.size());
                      
                      id(myDisplay_line1) = "Failure";
                      id(myDisplay_line2) = "Bad Format";
                      id(myDisplay_line3) = "Token";
                      id(display_timeout_handler).execute();
                    }
                  }

                } else {
                  id(sniffer_candidate_token) = token_hex;
                  id(sniffer_hit_counter) = 1;
                  ESP_LOGI("xgimi_sniffer", "New unique signature. Target candidate updated to: %s", token_hex.c_str());
                }
              }
            }




#=================  utility scripts ==============
script:

  # --- ASYNCHRONOUS TIMEOUT TRACKER ---
  - id: clear_timeout_tracker
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(clear_window_active);'
          then:
            - globals.set: { id: clear_window_active, value: 'false' }
            - script.execute: turn_led_off_custom

            - script.execute:
                id: turn_led_off_custom
               
            - lambda: |-
                id(myDisplay_line1) = "Clear Canceled";
                id(myDisplay_line2) = "Timed Out";
                id(myDisplay_line3) = "";
            - script.execute: display_timeout_handler


  # --- THREAD-ISOLATED CLEAR ACTION ---
  - id: run_token_clear_worker
    mode: single
    then:
      - script.execute: turn_led_off_custom
      - logger.log: "Clearing BLE wake token"
      - esp32_ble_tracker.stop_scan: {}
      - binary_sensor.template.publish: { id: sniffer_status, state: OFF }          
      - logger.log: "BLE Clear Token === Sniffing Ended."
      - logger.log: "BLE Clear Token === Zeroing Token."

      - script.execute:
          id: turn_led_off_custom
               
      - lambda: |-
          id(myDisplay_line1) = "Clear Learned"; 
          id(myDisplay_line2) = "Using Default";
          id(myDisplay_line3) = "Wait 5 sec";
      - script.execute: display_timeout_handler

      - lambda: |-
          bool learned_wake_token_exists = false;
          for (int i = 0; i < 15; i++) {
            if (id(learned_wake_token)[i] != 0x00) {
              learned_wake_token_exists = true;
              break;
            }
          }
          
          if (learned_wake_token_exists) {
            memset(id(learned_wake_token), 0x00, 15);  
            global_preferences->sync();
            memset(id(active_wake_token), 0x00, 15);
            id(flash_led_custom).execute(2, 1.0, 1.0, 0.0);
            
            id(myDisplay_line1) = "Clear Learned";
            id(myDisplay_line2) = "Using Default";
            id(myDisplay_line3) = "Wait 5 sec";
          } else {
            std::vector<uint8_t> active_token_vector = get_secret_wake_token();
            for (size_t i = 0; i < 15; ++i) {
              id(active_wake_token)[i] = active_token_vector[i];
            }
            id(flash_led_custom).execute(1, 0.0, 1.0, 0.0);

            id(myDisplay_line1) = "Already Cleared";
            id(myDisplay_line2) = "(no learned)";
            id(myDisplay_line3) = "Using Default";
          }  
          
          std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
          id(xgimi_remote_controller)->set_wake_token(active_token_vector);

          std::string hex_log_str = "";
          for (size_t i = 0; i < active_token_vector.size(); ++i) {
              if (i > 0) hex_log_str += " ";
              
              char buf[3]; 
              
              snprintf(buf, sizeof(buf), "%02x", active_token_vector[i]);
              hex_log_str += buf;
          }
          ESP_LOGD("token_clear", "Active wake token vector now set to hex: %s", hex_log_str.c_str());

      - script.execute: display_timeout_handler      
      
      
  # --- Sniff for Wake Tokens ---
  - id: sniffing_sequence
    mode: restart
    then:
      - logger.log: "Preparing for token sniffing"

      # Prep globals for sniffing
      - lambda: |-
          id(sniffer_candidate_token) = "None";
          id(sniffer_hit_counter) = 0;

      # --- Turn on LED before radio locks timers ---
      - script.execute:
          id: turn_led_on_custom
          red: 0.0
          green: 0.0
          blue: 1.0
          brightness: 0.2

      # Give the RMT driver a microscopic window to finish shifting data bits out
      - delay: 10ms 

      # Start sniffing now that the light is safely glowing
      - esp32_ble_tracker.start_scan: 
          continuous: false
     
      # ----------

      - binary_sensor.template.publish: 
          id: sniffer_status
          state: ON
      - logger.log: "BLE === SNIFFING for Wake Token." 
      
      # Show on myDisplay display
      - lambda: |-
          id(myDisplay_line1) = "SNIFFING Token"; 
          id(myDisplay_line2) = "Repeat Press";
          id(myDisplay_line3) = "Xgimi Power";
      - script.execute: display_timeout_handler
          
      - delay: 20s 

      # This section only runs if the 20s completely expires without finding a token
      - esp32_ble_tracker.stop_scan: {} 
      
      # Give the BLE stack a small window to release hardware resources
      - delay: 10ms

      - binary_sensor.template.publish:
          id: sniffer_status
          state: OFF          
      - logger.log: "BLE === Sniffing Ended."

      # turn off light (Safe now that scan has officially stopped)
      - script.execute: turn_led_off_custom

      - lambda: |-
          id(myDisplay_line1) = "Wake Token"; 
          id(myDisplay_line2) = "Sniffing";
          id(myDisplay_line3) = "ENDED";
      - script.execute: display_timeout_handler



  # --- myDisplay timeout handler ---
  - id: display_timeout_handler
    mode: restart 
    # FIXED: No parameter block needed. It reads the global state instead.
    then:
      - lambda: |-
          if (id(myDisplay_small_text)) {
            id(myDisplay).show_page(id(active_page_small));
          } else {
            id(myDisplay).show_page(id(active_page_std));
          }
      - delay: 40s
      - display.page.show: blank_page


  # --- show token_param on display ---
  - id: display_wake_token
    mode: restart 
    parameters:
      token_param: int[]
    then:
      - lambda: |-
          if (token_param.size() >= 15) {
            // FIXED: Fully declared array bounds buffer to stop compiler panics
            char slice_buf[4];

            // Line 1: First 5 bytes (Indices 0 to 4)
            std::string line1_hex = "";
            for (size_t i = 0; i < 5; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line1_hex += slice_buf;
            }
            if (!line1_hex.empty()) line1_hex.pop_back();
            id(myDisplay_line1) = line1_hex;

            // Line 2: Next 5 bytes (Indices 5 to 9)
            std::string line2_hex = "";
            for (size_t i = 5; i < 10; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line2_hex += slice_buf;
            }
            if (!line2_hex.empty()) line2_hex.pop_back();
            id(myDisplay_line2) = line2_hex;

            // Line 3: Last 5 bytes (Indices 10 to 14)
            std::string line3_hex = "";
            for (size_t i = 10; i < 15; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line3_hex += slice_buf;
            }
            if (!line3_hex.empty()) line3_hex.pop_back();
            id(myDisplay_line3) = line3_hex;

          } else {
            id(myDisplay_line1) = "Error:";
            id(myDisplay_line2) = "Token Size";
            id(myDisplay_line3) = "Invalid";
          }
          
      - globals.set:
          id: myDisplay_small_text
          value: 'true'
      - script.execute: display_timeout_handler
 



