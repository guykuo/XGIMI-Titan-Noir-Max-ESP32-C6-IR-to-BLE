esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ESP32 with XGIMI BLE Translator
  includes:
    - <sstream>
    - <iomanip>
    - <array>
    - <vector>
    - ir-common-kuo/appkit/secrets_bridge.h
    - ir-common-kuo/appkit/ir_profile.h

  build_flags: "-Wl,--require-defined=cJSON_Parse"
  
  project:
    name: xgimi.titan-noir-esp32-ir-kuo
    version: 26.09.18.001

  on_boot:

    - priority: -50
      then:
        - binary_sensor.template.publish:
            id: sniffer_status
            state: OFF
        
        - lambda: |-
            bool learned_wake_token_exists = false; // check if any bytes are not 0x00
            for (int i = 0; i < 15; i++) {
              if (id(learned_wake_token)[i] != 0x00) {
                learned_wake_token_exists = true;
                break;
              }
            }
            
            if (learned_wake_token_exists) {
              // There is a token stored in flash. Copy it to runtime array memory.
              memcpy(id(active_wake_token), id(learned_wake_token), 15);

              std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                            
              // create human readable hex string of active_wake_token
              std::string formatted_hex = "";
              
              // turn single 'char' variable into a sized character array to avoid crash
              char slice_buf[8];
              for (size_t i = 0; i < 5; i++) {
                uint8_t byte = id(active_wake_token)[i];
                snprintf(slice_buf, sizeof(slice_buf), "%02X ", byte);
                formatted_hex += slice_buf;
              }
              if (!formatted_hex.empty()) formatted_hex.pop_back();
              formatted_hex += "..."; 
              
              ESP_LOGD("boot_loader", "Using learned 15-byte token from NVS flash: %s", formatted_hex.c_str());
              
              id(flash_led_custom).execute(8, 150, 0.0, 0.5, 0.0); // flash 8 times indicate has learned token.


            } else {
              std::vector<uint8_t> active_token_vector = get_secret_wake_token();
              
              for (size_t i = 0; i < 15; ++i) {
                id(active_wake_token)[i] = active_token_vector[i];
              }
            
              std::string formatted_hex = "";
              for (size_t i = 0; i < 15; ++i) {
                  if (i > 0) formatted_hex += " ";
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%02x", id(active_wake_token)[i]);
                  formatted_hex += buf;
              }
              ESP_LOGD("boot_loader", "Using secrets token via C++ bridge text parser: %s", formatted_hex.c_str());
              
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                  

              ESP_LOGD("boot_loader", "Flash memory is empty. Suggest sniffing BLE new wake token.");
 
              // Build and print the active_token_vector hex payload directly to the ESPHome logs
              std::string hex_log_str = "";
              for (size_t i = 0; i < active_token_vector.size(); ++i) {
                  if (i > 0) hex_log_str += " ";
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%02x", active_token_vector[i]);
                  hex_log_str += buf;
              }    
              id(flash_led_custom).execute(2, 200, 1.0, 0.5, 0.0); // flash two indicate default token.
              
              ESP_LOGD("boot_loader", "Active wake token vector now set to hex: %s", hex_log_str.c_str());
            }        
            
    - priority: 150
      then: # if display is disabled briefly show a message how to enable screen
        - if:
            condition:
              lambda: |-
                return id(myDisplay_disabled);
            then:
              # temporarily set display active
              - globals.set:
                  id: myDisplay_disabled
                  value: 'false'
              # briefly show display disabling msg
              - script.execute: 
                  id: display_show
                  small_text: false
                  line1: 'Display Disabled'
                  line2: 'To Re-enable'
                  line3: 'Hold Boot Btn'
              - delay: 10s    
              # disable display
              - globals.set:
                  id: myDisplay_disabled
                  value: 'true'

              - script.execute: 
                  id: display_show
                  small_text: false
                  line1: ''
                  line2: ''
                  line3: ''

# ============================================================
globals:
  - id: default_profile
    type: int
    initial_value: ${def_profile}

  - id: selected_profile_slot # Avalones ---------------
    type: int
    restore_value: yes          # test
    initial_value: '0'          # 0 = first internal profile (LG-cinebeam-hu810p)

  - id: last_active_idx_seen # Avalones ---------------
    type: int
    restore_value: no
    initial_value: '-999'
          
    # ======= wake_token globals
    # During boot, if a token has been previously stored, this overrides the one supplied by secrets      
  - id: learned_wake_token # Learned wake token is stored here. Persistent upon globals sync.
    type: uint8_t[15]
    restore_value: yes
    initial_value: '{0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00}'
 
  - id: active_wake_token # this copy of wake token is submitted to set_wake_token. 
    type: uint8_t[15]
    restore_value: no
    initial_value: '{0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00}'
                 
  - id: sniffer_candidate_token # used for token sniffing
    type: std::string
    restore_value: no
    initial_value: '"None"'

  - id: sniffer_hit_counter # used for token sniffing
    type: int
    restore_value: no
    initial_value: '0'

  - id: myDisplay_disabled # stops display from showing if true
    type: bool
    restore_value: yes # remember display suppression between boots.
    initial_value: 'false'

  - id: showing_special_info
    type: bool
    restore_value: no
    initial_value: 'false'


