    name: "IR Active Profile"
    id: ir_active_profile_ts
    icon: "mdi:remote"
    web_server:
      sorting_group_id: profileGroup
      sorting_weight: 20

    update_interval: 2s
    lambda: |-
      int idx = id(active_remote_layout);
      // Normalize the legacy negative convention used by ir_hub.yaml
      if (idx < 0) {
        int custom_slot = (idx * -1) - 1;
        idx = (int) factory_count + custom_slot;
      }
      char buf[160];
      if (idx < 0 || idx >= (int) remote_profiles.size()) {
        snprintf(buf, sizeof(buf), "idx=%d (profile not loaded)", idx);
        return std::string(buf);
      }
      const char* kind = (idx < (int) factory_count) ? "internal" : "custom";
      snprintf(buf, sizeof(buf), "idx=%d  %s  [%s]",
               idx,
               remote_profiles[idx].profile_name.c_str(),
               kind);
      return std::string(buf);


  - platform: template # Avalones ---------------
    name: "IR Profile Selected JSON"
    id: ir_profile_selected_json
    icon: "mdi:code-json"
    web_server:
      sorting_group_id: profileGroup
      sorting_weight: 21

    update_interval: never


# ============================================================
binary_sensor:
  - platform: template
    name: "XGIMI Sniffer Active Status"
    id: sniffer_status
    icon: "mdi:radar"
    web_server:
      sorting_group_id: settingsGroup
      sorting_weight: 7

  - platform: gpio # Implement physical button for sniff
    pin:
      number: ${pin_action_btn}
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Action Button"
    id: action_button
    web_server:
        sorting_group_id: settingsGroup
        sorting_weight: 14


    filters:
      - delayed_on: 50 ms
    on_multi_click:
      # 1. TRIPLE CLICK starts learning mode
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.35s
          - ON for at most 0.5s
          - OFF for at most 0.35s
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - lambda: |-
              id(flash_led_custom).execute(3, 100, 0.4, 0.6, 0.4); // flash 3 times indicate triple click.

          - script.execute: start_learning_mode
          - logger.log: "Triple click detected. IR hub entering sequential learning mode."

      # 2. DOUBLE CLICK starts setting of IRmap (Profile Selection Mode)
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.35s
          - ON for at most 0.5s
          - OFF for at least 0.35s
        then:
          - script.execute: 
              id: display_show
              small_text: true
              line1: 'Set IR Profile'
              line2: 'Press a Btn'
              line3: 'On Remote'
          - lambda: |-
              id(ir_receiver_allowed_protocol) = "ALL";
              id(ir_receiver_mode) = 2; // set profile mode active
              id(set_profile_timeout_watcher).execute();
              id(flash_led_custom).execute(2, 150, 0.8, 0.6, 0.2); // flash 2 times indicate double click.

          - logger.log: "Double click detected. IR hub in set profile mode."

      # 3. SINGLE CLICK starts token sniffing
      - timing:
          - ON for at most 400ms
          - OFF for at least 0.4s
        then:
          - button.press: token_sniff
          - logger.log: "Boot button short click. Starting token sniffing"

      # 4. LONG HOLD (Wipes dynamic slots if in Learning Mode, otherwise toggles screen display)
      - timing: 
          - ON for at least 5s
        then: 
          - if: 
              condition: 
                lambda: |-
                  return id(ir_receiver_mode) == 3;
              then: 
                - script.stop: learn_mode_timeout_watcher
                - script.execute: wipe_all_nvs_profiles
                - lambda: |-
                    id(ir_receiver_mode) = 1; // Safely re-engage normal active state
              else:
                # FIXED: The nested condition must open as a distinct list element item
                - if:
                    condition: 
                      lambda: |-
                        return id(myDisplay_disabled);
                    then:
                      - globals.set:
                          id: myDisplay_disabled
                          value: 'false'
                      - script.execute: 
                          id: display_show
                          small_text: false
                          line1: 'Setting'
                          line2: 'Display'
                          line3: 'Enabled'
                      - logger.log: "Display enabled via long hold."
                    else:
                      - script.execute: 
                          id: display_show
                          small_text: false
                          line1: 'Disabling Display'
                          line2: 'To Re-enable'
                          line3: 'Hold Boot Btn'
                      - delay: 3s
                      - globals.set:
                          id: myDisplay_disabled
                          value: 'true'
                      - script.execute: 
                          id: display_show
                          small_text: false
                          line1: ''
                          line2: ''
                          line3: ''
                      - logger.log: "Display suppressed via long hold."

# ============================================================
button:
  
            
  - platform: template # button to start sniffing for wake token. W
    name: "token_sniff"
    id: token_sniff
    icon: "mdi:bluetooth-audio"
    web_server:
        sorting_group_id: settingsGroup
        sorting_weight: 9
    on_press:
      then:
        - script.execute: sniffing_sequence
    
    
  - platform: template # clear stored template. Revert to secrets wake token
    name: "token_clear"
    id: token_clear
    web_server:
        sorting_group_id: settingsGroup
        sorting_weight: 10
    on_press:
      then:
        - script.execute:
            id: turn_led_on_custom
            red: 0.3
            green: 0.2
            blue: 0.0
            brightness: 0.8
        - lambda: |-
            // Force fire your local hardware data-erasing flash worker
            id(run_token_clear_worker).execute(); 


  - platform: template # retrieve stored template, display, and use as active token
    name: "token_recall"
    id: token_recall
    icon: "mdi:bluetooth"
    web_server:
        sorting_group_id: settingsGroup
        sorting_weight: 11
    on_press:
      then:
        - script.execute: execute_token_recall_routine
      



# ============================================================

script:
  - id: execute_token_recall_routine
    mode: single       
    then:
      - globals.set: 
          id: showing_special_info # indicate we are showing special info that should not be overwritten
          value: 'true'
      
      - lambda: |-
          bool learned_wake_token_exists = false; // check if any bytes are not 0x00
          for (int i = 0; i < 15; i++) {
            if (id(learned_wake_token)[i] != 0x00) {
              learned_wake_token_exists = true;
              break;
            }
          }
          
          if (learned_wake_token_exists) {

            // Copy learned_wake_token into active_wake_token
            memcpy(id(active_wake_token), id(learned_wake_token), 15);
            
            // submit active_wake_token as one to use
            std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
            id(xgimi_remote_controller)->set_wake_token(active_token_vector);
            
            
          } else {

            // Safely sync parsed secret vector data to active array
            std::vector<uint8_t> active_token_vector = get_secret_wake_token();
            for (size_t i = 0; i < 15; ++i) {
              id(active_wake_token)[i] = active_token_vector[i];
            }
            
          }
          // Display entire learned token via a display script
          // must convert array into integer vector for script
          std::vector<int> token_int_pass(id(active_wake_token), id(active_wake_token) + 15); 
          id(display_wake_token).execute(token_int_pass);            


  # --- THREAD-ISOLATED CLEAR ACTION ---
  - id: run_token_clear_worker
    mode: single
    then:
      - script.execute: turn_led_off_custom
      - logger.log: "Clearing BLE wake token"
      - binary_sensor.template.publish: { id: sniffer_status, state: OFF }          
      - logger.log: "BLE Clear Token === Sniffing Ended."
      - logger.log: "BLE Clear Token === Zeroing Token."

      - script.execute:
          id: turn_led_off_custom
               
      - lambda: |-
          bool learned_wake_token_exists = false;
          for (int i = 0; i < 15; i++) {
            if (id(learned_wake_token)[i] != 0x00) {
              learned_wake_token_exists = true;
              break;
            }
          }
          
          if (learned_wake_token_exists) {
            memset(id(learned_wake_token), 0x00, 15);  
            global_preferences->sync();
            memset(id(active_wake_token), 0x00, 15);
            id(flash_led_custom).execute(2, 250, 1.0, 0.6, 0.0);
            id(display_show).execute(false,
                                     "Clear Learned",
                                     "Using Default",
                                     "Wait 5 sec");
          } else {
            std::vector<uint8_t> active_token_vector = get_secret_wake_token();
            for (size_t i = 0; i < 15; ++i) {
              id(active_wake_token)[i] = active_token_vector[i];
            }
            id(flash_led_custom).execute(1, 250, 0.0, 1.0, 0.0);
            id(display_show).execute(false,
                                     "Already Cleared",
                                     "(no learned)",
                                     "Using Default");
          }  
          
          // set wake token in xgimi_remote_controller
          std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
          id(xgimi_remote_controller)->set_wake_token(active_token_vector);

          // build hex_log_str for logging report
          std::string hex_log_str = "";
          for (size_t i = 0; i < active_token_vector.size(); ++i) {
              if (i > 0) hex_log_str += " ";
              
              char buf[8]; 
              
              snprintf(buf, sizeof(buf), "%02x", active_token_vector[i]);
              hex_log_str += buf;
          }
          ESP_LOGD("token_clear", "Active wake token vector now set to hex: %s", hex_log_str.c_str());
          
      
  # --- Sniff for Wake Tokens using Native Bluedroid Stack ---
  - id: sniffing_sequence
    mode: restart
    then:
      - logger.log: "Preparing Bluedroid token sniffing..."

      # Prep globals for sniffing
      - lambda: |-
          id(sniffer_candidate_token) = "None";
          id(sniffer_hit_counter) = 0;

      - script.execute:
          id: turn_led_on_custom
          red: 0.0
          green: 0.0
          blue: 1.0
          brightness: 0.8

      - delay: 10ms 

      # Start Bluedroid Scanning via Lambda
      - lambda: |-
          esp_ble_gap_register_callback([](esp_gap_ble_cb_event_t event, esp_ble_gap_cb_param_t *param) {
              if (event == ESP_GAP_BLE_SCAN_RESULT_EVT) {
                  auto &scan_result = param->scan_rst; 
                  
                  if (scan_result.adv_data_len > 0) {
                      uint8_t *adv = scan_result.ble_adv;
                      uint8_t len = scan_result.adv_data_len;
                      
                      for (int i = 0; i < len - 3; i++) {
                          if (adv[i] == 0xFF && adv[i+1] == 0x46 && adv[i+2] == 0x00) {
                              
                              // FIXED: Firm array declaration dimension limits prevent compiler crash
                              char token_hex[64] = {0};
                              size_t offset = 0;
                              for (int j = 0; j < len && offset < 60; j++) {
                                  offset += snprintf(token_hex + offset, 4, "%02X", adv[j]);
                              }

                              // Reject automated background pairing token
                              if (std::strcmp(token_hex, "0201060319800103FF460003031218") == 0) {
                                  continue; 
                              }

                              if (offset < 30) continue;
                              
                              // Zero-allocation masking comparison using basic pointer logic
                              bool is_match = false;
                              if (id(sniffer_candidate_token) != "None") {
                                  std::string cand_str = id(sniffer_candidate_token);
                                  if (cand_str.length() == offset) {
                                      is_match = true;
                                      for(size_t m = 0; m < offset; m++) {
                                          if (offset >= 4 && m >= (offset - 4) && m < (offset - 2)) continue;
                                          if (cand_str[m] != token_hex[m]) {
                                              is_match = false;
                                              break;
                                          }
                                      }
                                  }
                              }
                              
                              if (is_match) {
                                  id(sniffer_hit_counter)++;
                                  ESP_LOGI("xgimi_bluedroid", "Match count: %d for Token: %s", id(sniffer_hit_counter), token_hex);
                                  
                                  if (id(sniffer_hit_counter) >= 5) {
                                      if (len >= 15) {
                                          uint8_t *tail_ptr = adv + (len - 15);
                                          
                                          std::string sniffed_token_last15_hex = ""; 
                                          // FIXED: Solid array dimensions assigned to stop boundary overwrites
                                          char slice_buf[8] = {0}; 
                                          for (int k = 0; k < 15; k++) {
                                              snprintf(slice_buf, sizeof(slice_buf), "%02X ", tail_ptr[k]);
                                              sniffed_token_last15_hex += slice_buf;
                                          }

                                          if (memcmp(tail_ptr, id(active_wake_token), 15) == 0) {
                                              ESP_LOGD("xgimi_bluedroid", "Token matches active_wake_token. Skipping write.");
                                              
                                              esp_ble_gap_stop_scanning();
                                              esp_ble_gap_register_callback(nullptr);
                                              
                                              id(flash_led_custom).execute(4, 200, 0.0, 1.0, 0.0);
                                              id(indicator_led)->turn_off();
                                              id(display_show).stop();
                                              id(display_show).execute(false, "Token Recognized", "Matches", "Existing");
                                              
                                              id(sniffer_status)->publish_state(false);
                                              id(xgimi_sniffer_switch).publish_state(false);
                                              id(sniffing_sequence).stop(); 
                                              return;
                                          }
                                          
                                          memcpy(id(active_wake_token), tail_ptr, 15);
                                          memcpy(id(learned_wake_token), tail_ptr, 15);
                                          global_preferences->sync(); 
                                          
                                          std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
                                          id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                                          
                                          esp_ble_gap_stop_scanning();
                                          esp_ble_gap_register_callback(nullptr);
                                          
                                          id(flash_led_custom).execute(8, 200, 0.0, 1.0, 0.0);
                                          id(indicator_led)->turn_off();
                                          id(display_show).stop();
                                          id(display_show).execute(false, sniffed_token_last15_hex, "Storing Token", "Wait 5 sec");
                                          
                                          id(sniffer_status)->publish_state(false);
                                          id(xgimi_sniffer_switch).publish_state(false);
                                          id(sniffing_sequence).stop(); 
                                          return;
                                      }
                                  }
                              } else {
                                  id(sniffer_candidate_token) = std::string(token_hex);
                                  id(sniffer_hit_counter) = 1;
                                  ESP_LOGI("xgimi_bluedroid", "New unique signature target: %s", token_hex);
                              }
                          }
                      }
                  }
              }
          });
          
          esp_ble_scan_params_t scan_params = {
              .scan_type           = BLE_SCAN_TYPE_PASSIVE,
              .own_addr_type       = BLE_ADDR_TYPE_PUBLIC,
              .scan_filter_policy  = BLE_SCAN_FILTER_ALLOW_ALL,
              .scan_interval       = 0xA0, 
              .scan_window         = 0x40
          };
          
          esp_ble_gap_set_scan_params(&scan_params);
          esp_ble_gap_start_scanning(0);
          
      - binary_sensor.template.publish: 
          id: sniffer_status
          state: ON
      - logger.log: "Bluedroid stack active. SNIFFING for 20 seconds..." 
      
      - script.execute: 
          id: display_show
          small_text: false
          line1: "SNIFFING Token"
          line2: 'Repeat Press'
          line3: 'Xgimi Power'              
      
      - delay: 20s 

      - lambda: |-
          esp_ble_gap_stop_scanning();
          esp_ble_gap_register_callback(nullptr); 
          
      - delay: 10ms

      - binary_sensor.template.publish:
          id: sniffer_status
          state: OFF    
      - lambda: 'id(xgimi_sniffer_switch).publish_state(false);'
      - logger.log: "Bluedroid Sniffing Window Ended via Timeout."

      - script.execute: turn_led_off_custom
      - script.execute: 
          id: display_show
          small_text: false
          line1: 'Wake Token'
          line2: 'Sniffing'
          line3: 'TIMEOUT/ENDED'




# --- myDisplay display 3 lines and auto dim display ---
  - id: display_show
    mode: restart 
    parameters:
      small_text: bool
      line1: std::string
      line2: std::string
      line3: std::string
   
    then:
      - lambda: |-
          id(myDisplay_line1) = line1; 
          id(myDisplay_line2) = line2;
          id(myDisplay_line3) = line3;
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 40s #how long display remains on
      - display.page.show: blank_page


# --- myDisplay modify a line and auto dim display ---
  - id: display_modify_a_line
    mode: restart 
    parameters:
      small_text: bool
      whichLine: int
      aline: std::string
   
    then:
      - lambda: |-
          switch (whichLine) {
            case 1:
              id(myDisplay_line1) = aline; 
              break;
            case 2:
              id(myDisplay_line2) = aline;
              break;
            case 3:
              id(myDisplay_line3) = aline;
              break;
            default:
              break;
          }
          
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 40s #how long display remains on
      - display.page.show: blank_page



  # --- show token_param on display ---
  - id: display_wake_token
    mode: restart 
    parameters:
      token_param: int[]
    then:
      - lambda: |-
          if (token_param.size() >= 15) {
            // fully declare array bounds buffer to stop compiler panics
            char slice_buf[8];

            // Line 1: First 5 bytes (Indices 0 to 4)
            std::string line1_hex = "";
            for (size_t i = 0; i < 5; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line1_hex += slice_buf;
            }
            if (!line1_hex.empty()) line1_hex.pop_back();

            // Line 2: Next 5 bytes (Indices 5 to 9)
            std::string line2_hex = "";
            for (size_t i = 5; i < 10; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line2_hex += slice_buf;
            }
            if (!line2_hex.empty()) line2_hex.pop_back();

            // Line 3: Last 5 bytes (Indices 10 to 14)
            std::string line3_hex = "";
            for (size_t i = 10; i < 15; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line3_hex += slice_buf;
            }
            if (!line3_hex.empty()) line3_hex.pop_back();

            id(display_show).execute(true,
                                     line1_hex,
                                     line2_hex,
                                     line3_hex);


          } else {
             id(display_show).execute(false,
                                     "Error:",
                                     "Token Size",
                                     "Invalid");
          }
          

  # --- show token, name of remote, active profile on display ---
  - id: display_token_remote_profile
    then:
      - lambda: |-
      
          // build token_hex_str for logging report
          std::string token_hex_str = "";
          // Use the underlying C-array via ->value()
          unsigned char* token_bytes = active_wake_token->value();
          
          for (size_t i = 0; i < 15; ++i) {
            if (i > 0) token_hex_str += " ";
            
            char buf[8]; // Fixed buffer size to hold 2 hex digits + null terminator
            // Force cast to int to prevent compiler warnings with %02X
            snprintf(buf, sizeof(buf), "%02X", static_cast<int>(token_bytes[i]));
            token_hex_str += buf;
          }
          
          // get current profile name
          int current_idx = id(active_remote_layout);
          if (!(0 <= current_idx && current_idx < remote_profiles.size())) {
            id(display_show).execute(true,
                                     "${ble_remote_name}",
                                     token_hex_str,
                                     "No profile");
          } else {
            const auto& active_profile = remote_profiles[current_idx]; // Get the active_profile struct
              
            id(display_show).execute(true,
                                     token_hex_str,
                                     "${ble_remote_name}",
                                     active_profile.profile_name);

          }

