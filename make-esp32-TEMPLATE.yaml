# --- HYBRID SEQUENTIAL JSON EXPORT --- modified Avalones
  - id: publish_selected_profile_json
    mode: restart
    then:
      - delay: 100ms
      - lambda: |-
          // Allocate buffer space on the HEAP to prevent stack overflow crashes
          size_t buf_sz = 8192; // Increased to 8KB to comfortably hold Epson 39+ custom keys
          char *json_buf = new (std::nothrow) char[buf_sz];
          
          if (json_buf == nullptr) {
            ESP_LOGE("json_export", "Heap allocation failed! Out of memory.");
            return;
          }
          
          // Zero out our newly allocated heap block memory footprint
          std::memset(json_buf, 0, buf_sz);
          size_t offset = 0;

          const int idx = id(selected_profile_slot);

          if (remote_profiles.empty()) {
            offset += snprintf(json_buf + offset, buf_sz - offset, "{\n  \"sta\":\"warming\"\n}");
          } else {
            int factory = (int) factory_count;
            const int custom  = 50; // Aligned with MAX_LEARNED_PROFILES boundary footprint
            const int max_idx = factory + custom;
            
            if (idx < 0 || idx >= max_idx) {
              offset += snprintf(json_buf + offset, buf_sz - offset, 
                                 "{\n  \"err\":\"range\",\n  \"idx\":%d,\n  \"cnt\":%d\n}", 
                                 idx, (int) remote_profiles.size());
            } else if (idx >= (int) remote_profiles.size()) {
              offset += snprintf(json_buf + offset, buf_sz - offset, 
                                 "{\n  \"err\":\"empty\",\n  \"idx\":%d,\n  \"slt\":%d,\n  \"typ\":\"custom\"\n}", 
                                 idx, idx - factory);
            } else {
              const IRProfile &p = remote_profiles[idx];
              if (p.profile_name.empty() || p.profile_name.rfind("Placeholder", 0) == 0) {
                offset += snprintf(json_buf + offset, buf_sz - offset, "{\n  \"err\":\"empty\",\n  \"idx\":%d", idx);
                if (idx >= factory) {
                  offset += snprintf(json_buf + offset, buf_sz - offset, ",\n  \"slt\":%d,\n  \"typ\":\"custom\"\n}", idx - factory);
                } else {
                  offset += snprintf(json_buf + offset, buf_sz - offset, ",\n  \"typ\":\"internal\"\n}");
                }
              } else {
                // Header block
                offset += snprintf(json_buf + offset, buf_sz - offset, 
                                   "{\n  \"idx\":%d,\n  \"int\":%d,\n  \"nam\":\"%s\",\n  \"pro\":\"%s\",\n  \"adr\":\"%04X\",\n  \"car\":\"%04X\",\n  \"cfr\":\"%04X\",\n  \"key\":[\n",
                                   idx, (idx < factory) ? 1 : 0, p.profile_name.c_str(), p.protocol.c_str(),
                                   (unsigned int) p.device_address, (unsigned int) p.cmd_clear_token_arm, (unsigned int) p.cmd_clear_token_fire);

                static const char* const export_sequence[] = {
                  "power_on", "power_off", "cursor_left", "cursor_right", "cursor_up", "cursor_down",
                  "cursor_enter", "settings_menu", "back", "home", "game_menu", "input", "picture",
                  "focus_manual", "focus_auto", "shortcut_1", "shortcut_2", "shortcut_3", "shortcut_4",
                  "volume_up", "volume_down", "mute", "token_sniff", "token_clear", "token_recall",
                  "BT_start_pair", "BT_clear_pair" 
                };
                constexpr size_t TOTAL_SEQUENTIAL_KEYS = sizeof(export_sequence) / sizeof(export_sequence[0]);

                std::vector<uint32_t> exported_codes;
                exported_codes.reserve(p.cmd_codes.size());

                // PASS 1: Sequential Base and Substring Grouping (Case-Insensitive)
                for (size_t seq_i = 0; seq_i < TOTAL_SEQUENTIAL_KEYS; seq_i++) {
                  std::string target = export_sequence[seq_i];
                  
                  for (const auto &pair : p.cmd_codes) {
                    std::string current_name = pair.second.name;
                    
                    std::string current_name_lower = current_name;
                    std::transform(current_name_lower.begin(), current_name_lower.end(), current_name_lower.begin(), ::tolower);

                    if (current_name_lower == target || current_name_lower.rfind(target, 0) == 0) {
                      if (std::find(exported_codes.begin(), exported_codes.end(), pair.first) == exported_codes.end()) {
                        exported_codes.push_back(pair.first);
                      }
                    }
                  }
                }

                // FIXED / PASS 2: True catch-all ensures ALL elements left out of export_sequence 
                // (like Epson specific "input LAN", "blank", "lens1", etc.) are cleanly caught and appended.
                for (const auto &pair : p.cmd_codes) {
                  if (std::find(exported_codes.begin(), exported_codes.end(), pair.first) == exported_codes.end()) {
                    exported_codes.push_back(pair.first);
                  }
                }

                // Render JSON structure safely into expanded buffer footprint
                for (size_t i = 0; i < exported_codes.size(); i++) {
                  if (offset >= buf_sz - 128) break; // Keep defensive guard rails intact
                  
                  uint32_t code = exported_codes[i];
                  std::string b_name = p.cmd_codes.at(code).name;
                  bool is_last = (i == exported_codes.size() - 1);

                  offset += snprintf(json_buf + offset, buf_sz - offset, 
                                     "    {\"x\":\"%X\",\"b\":\"%s\"}%s\n",
                                     (unsigned int)code, b_name.c_str(),
                                     is_last ? "" : ",");
                }
                
                offset += snprintf(json_buf + offset, buf_sz - offset, "  ]\n}");
              }
            }
          }

          std::string result(json_buf);
          id(ir_profile_selected_json).publish_state(result);
          
          // CLEANUP: Free the heap block to guarantee zero memory leaks
          delete[] json_buf;


