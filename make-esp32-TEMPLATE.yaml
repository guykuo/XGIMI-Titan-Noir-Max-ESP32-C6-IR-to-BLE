# ======================================
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 30min #time before reboot if HomeAssistant is not present. 

  actions:
    # ---------- 1) Import ----------
    - action: import_json_profiles # Avalones ---------------
      variables:
        json_data: string
      then:
        - lambda: |-
            ESP_LOGW("JSON Import", "Incoming remote migration configuration data packet received from Home Assistant API.");
            bool import_success = import_profiles_from_json(json_data);
            if (import_success) {
              ESP_LOGI("JSON Import", "Migration successful. Re-linking layout action object pointers...");
              link_hardware_buttons();
              id(setup_ir_receiver_for_current_profile).execute();
              id(ir_receiver_mode) = 1;
              id(display_token_remote_profile).execute();
              id(display_show)->execute(true, "JSON Imported!", "Profiles Recovered", "Database Active");
            } else {
              ESP_LOGE("JSON Import", "Failed parsing configuration payload string! Incompatible or corrupted JSON layout format.");
              id(display_show)->execute(false, "Import Failed", "Corrupted File", "Rejected");
            }

    # ---------- 2) Count ----------
    - action: get_profile_count # Avalones ---------------
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              root["count"]         = (int) remote_profiles.size();
              root["factory_count"] = (int) factory_count;


    # ---------- 3) Export one profile ----------
    - action: export_json_profile # modified from Avalones
      variables:
        index: int
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              const int idx = index;

              if (idx < 0 || idx >= (int) remote_profiles.size()) {
                root["error"] = "index out of range";
                root["count"] = (int) remote_profiles.size();
                return;
              }

              const IRProfile &p = remote_profiles[idx];
              if (p.profile_name.empty() ||
                  p.profile_name.rfind("Placeholder", 0) == 0) {
                root["error"] = "empty slot";
                root["index"] = idx;
                return;
              }

              char buf[32]; // Fixed array buffer tracking definition bounds
              root["index"]    = idx;
              root["name"]     = p.profile_name;
              root["protocol"] = p.protocol;

              snprintf(buf, sizeof(buf), "0x%08X", (unsigned int) p.device_address);
              root["address"] = buf;

              snprintf(buf, sizeof(buf), "0x%08X", (unsigned int) p.cmd_clear_token_arm);
              root["clear_arm"] = buf;

              snprintf(buf, sizeof(buf), "0x%08X", (unsigned int) p.cmd_clear_token_fire);
              root["clear_fire"] = buf;

              JsonArray keys_arr = root["keys"].to<JsonArray>();

              static const char* const export_sequence[] = {
                "power_on", "power_off", "cursor_left", "cursor_right", "cursor_up", "cursor_down",
                "cursor_enter", "settings_menu", "back", "home", "game_menu", "input", "picture",
                "focus_manual", "focus_auto", "shortcut_1", "shortcut_2", "shortcut_3", "shortcut_4",
                "volume_up", "volume_down", "mute", "token_sniff", "token_clear", "token_recall",
                "BT_start_pair", "BT_clear_pair"
              };
              // FIXED: Corrected array element size tracking math
              constexpr size_t TOTAL_SEQUENTIAL_KEYS = sizeof(export_sequence) / sizeof(export_sequence[0]);

              std::vector<uint32_t> exported_codes;
              exported_codes.reserve(p.cmd_codes.size());

              // PASS 1: Sequence matching using case-insensitive substring logic
              for (size_t seq_i = 0; seq_i < TOTAL_SEQUENTIAL_KEYS; seq_i++) {
                std::string target = export_sequence[seq_i];
                
                for (const auto &pair : p.cmd_codes) {          
                  std::string current_name = pair.second.name;
                  
                  std::string current_name_lower = current_name;
                  std::transform(current_name_lower.begin(), current_name_lower.end(), current_name_lower.begin(), ::tolower);

                  if (current_name_lower == target || current_name_lower.rfind(target, 0) == 0) {
                    if (std::find(exported_codes.begin(), exported_codes.end(), pair.first) == exported_codes.end()) {
                      exported_codes.push_back(pair.first);
                    }
                  }
                }
              }

              // FIXED / PASS 2: Appends ALL leftover custom parameters (like Epson specific "input LAN", "blank", "lens1", etc.)
              for (const auto &pair : p.cmd_codes) {
                if (std::find(exported_codes.begin(), exported_codes.end(), pair.first) == exported_codes.end()) {
                  exported_codes.push_back(pair.first);
                }
              }

              // Build the native JSON objects sequentially for the API response packet
              for (uint32_t code : exported_codes) {
                JsonObject k = keys_arr.add<JsonObject>();
                snprintf(buf, sizeof(buf), "0x%04X", (unsigned int) code); // Formatted to 4 hex characters for cleaner mapping arrays
                k["code"]   = buf;
                k["button"] = p.cmd_codes.at(code).name;
              }

