# ============= BEGIN Main Configuration Options KUO ======================================================================

# Three things must be configured here
#   ble_remote_name
#   Default IR profile
#   board_pkg

substitutions:
  # 1 ======= ble_remote_name, Bluetooth Name for your IR remote ===========================
  ble_remote_name: "IR Xgimi Kuo"  # (20 char max. No special characters. No underscore) 
 
  # may optionally change these other three names 
  ssid_name:     ${ble_remote_name} # Name of AP wifi network
  friendly_name: ${ble_remote_name} # Displayed name in Home Assitant
  device_name:   esp32-xgimi # formal Home Assitant ID. lowercase a-z, digits 0-9, hyphen (no spaces, no caps, no underscore)


  # 2 ======= Default IR profile. Uncomment one (and only one) ============================

  #def_profile: "0"  # AWOL vision aetherion max
  #def_profile: "1"  # benq-w5800
  def_profile: "2"  # epson-pro-cinema-LS12000
  #def_profile: "3"  # hisense-50u6g
  #def_profile: "4"  # jvc-hr-S9600u
  #def_profile: "5"  # jvc-rs2-codeset-A 
  #def_profile: "6"  # jvc-rs2-codeset-B 
  #def_profile: "7"  # LG-cinebeam-hu810p 
  #def_profile: "8"  # optoma-UHD50X
  #def_profile: "9"  # sony-VPL-XW600ES 
  #def_profile: "10" # sony-XBR-77A9G 
  #def_profile: "11" # tivo-roamio-TCD846500 
  #def_profile: "12" # panasonic projector
  

packages: 
  # 3 =======  ESP32 board, Uncomment one (and only one) to specify board ===================
                                                                           # Number is recommendation ranking
  board_pkg: !include ir-common-kuo/board-esp32-c3-0.42-OLED.yaml         # 1 Lowest cost good board w OLED. EZ solder
  #board_pkg: !include ir-common-kuo/board-esp32-c6-wroom-1.yaml           # 8 Ample RAM. Add 0.9 inch i2c OLED display
  #board_pkg: !include ir-common-kuo/board-heltec-s3-0.96-OLED-v3.yaml     # 7 Needs special cable for logging
  #board_pkg: !include ir-common-kuo/board-hosyond-s3-lcd-3.5-touch.yaml   # 9 Supports touchscreen control buttons
  #board_pkg: !include ir-common-kuo/board-ideaspark-esp32-OLED.yaml       #11 USB-micro cable, ltd heap, noisy IR
  #board_pkg: !include ir-common-kuo/board-ideaspark-esp32-lcd-1.14.yaml   #12 USB-c to USB-A cable to flash. Ltd heap
  #board_pkg: !include ir-common-kuo/board-lafvintech-c6-lcd-1.47.yaml     # 2 Low cost, LCD, RGB LED. Ample heap. EZ solder
  #board_pkg: !include ir-common-kuo/board-m5stack-S3-atom-lite.yaml # 5 No-Solder. Add grove IR and i2c OLED. Ample RAM
  #board_pkg: !include ir-common-kuo/board-m5stack-pico-d4-atom-lite.yaml  # 6 No-Solder. Add grove IR and i2c OLED. Ltd RAM
  #board_pkg: !include ir-common-kuo/board-waveshare-s3-lcd-1.47B.yaml     # 4 Requires IR sensor WITHOUT LED (VS1838B)
  #board_pkg: !include ir-common-kuo/board-waveshare-c6-lcd-1.47.yaml      # 3 Ample ram. good board with LCD. EZ solder.
  #board_pkg: !include ir-common-kuo/board-waveshare-s3-touch-lcd-2.8V2.yaml #10 Mid-size LCD, lacks indicator LED. Does touch.
   
  # ===== following board(s) are NOT recommendable. Included only for development purposes
  #board_pkg: !include ir-common-kuo/board-waveshare-c5-lcd-1.47.yaml  # incompatible. Far too little heap space


# ====================== END Main Configuration Options KUO =================================================
# Code after this point typically does not need to be changed.
# ===========================================================================================================

  ir-hub-pkg:         !include ir-common-kuo/appkit/ir-hub.yaml
  mrmachine-ble-pkg:  !include ir-common-kuo/appkit/ble-mrmachine-avalones-kuo-2026-10-25-1112.yaml # required, heavily modified mrmachine BLE package

logger:
  #level: DEBUG
  level: INFO
    
external_components:
- source:
    type: local
    path: components
  components: [esp32_ble_server, xgimi_remote]


wifi:
  reboot_timeout: 13h
  output_power: ${wifi_tx_power}
  # Crucial for stability on multi-node or mesh routers
  power_save_mode: LIGHT   
  fast_connect: false
  ap:
    ssid: "${ble_remote_name}"
    password: !secret fallback_ap_password
    ap_timeout: 30sec
    
  on_connect:
    then:
      lambda: |-
        std::string current_ip = id(my_ip_address).state;
        id(display_modify_a_line).execute(true,
                         2,
                         current_ip);

# ============================================================
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ESP32 with XGIMI BLE Translator
  project:
    name: xgimi.titan-noir-esp32-ir-kuo
    version: 26.10.26.1745
    
  includes:
    - <sstream>
    - <iomanip>
    - <array>
    - <vector>
    - <algorithm>
    - <cctype>
    - ir-common-kuo/appkit/ir-profile.h

  build_flags: 
    # ============================================================
    # Advanced options
    # Uncomment line(s) below to activate special options. Just delete # to uncomment

    #- '-DENABLE_GOOGLETV_BLE_CODES' # for Xgimi Horizon 20 and other GoogleTV. Leave commented for Titan Noir AndroidTV)

    #- '-DENABLE_GENERIC_POWER'      # use simple power on/off instead of Xgimi specific power sequences

    #- '-DENABLE_EXTRA_BUTTONS'      # add power user custom buttons

    # ============================================================
    # Leave below two items uncommented.
    - '-DBLE_REMOTE_NAME_STR=\"${ble_remote_name}\"'
    - '-DWAKE_NAME_MACRO="${ble_remote_name}"'
    # ============================================================

  on_boot:

    - priority: -100.0
      then:
        - lambda: !lambda |-
            extern void start_custom_web_server(); 
            start_custom_web_server(); 

    - priority: -50
      then:
  
        - binary_sensor.template.publish:
            id: sniffer_status
            state: OFF
                
        - lambda: |-
            bool learned_wake_token_exists = false; // check if any bytes are not 0x00
            for (int i = 0; i < 15; i++) {
              if (id(learned_wake_token)[i] != 0x00) {
                learned_wake_token_exists = true;
                break;
              }
            }
            
            if (learned_wake_token_exists) {
              // There is a token stored in flash. Copy it to runtime array memory.
              memcpy(id(active_wake_token), id(learned_wake_token), 15);

              std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                            
              // create human readable hex string of active_wake_token
              std::string formatted_hex = "";
              
              // turn single 'char' variable into a sized character array to avoid crash
              char slice_buf[8];
              for (size_t i = 0; i < 5; i++) {
                uint8_t byte = id(active_wake_token)[i];
                snprintf(slice_buf, sizeof(slice_buf), "%02X ", byte);
                formatted_hex += slice_buf;
              }
              if (!formatted_hex.empty()) formatted_hex.pop_back();
              formatted_hex += "..."; 
              
              ESP_LOGD("boot_loader", "Using learned 15-byte token from NVS flash: %s", formatted_hex.c_str());
              
              id(flash_led_custom).execute(8, 150, 0.0, 1.0, 0.0); // flash 8 times indicate has learned token.


            } else {
              std::vector<uint8_t> active_token_vector = get_secret_wake_token();
              
              for (size_t i = 0; i < 15; ++i) {
                id(active_wake_token)[i] = active_token_vector[i];
              }
            
              std::string formatted_hex = "";
              for (size_t i = 0; i < 15; ++i) {
                  if (i > 0) formatted_hex += " ";
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%02x", id(active_wake_token)[i]);
                  formatted_hex += buf;
              }
              ESP_LOGD("boot_loader", "Using secrets token via C++ bridge text parser: %s", formatted_hex.c_str());
              
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                  

              ESP_LOGD("boot_loader", "Flash memory is empty. Suggest sniffing BLE new wake token.");
 
              // Build and print the active_token_vector hex payload directly to the ESPHome logs
              std::string hex_log_str = "";
              for (size_t i = 0; i < active_token_vector.size(); ++i) {
                  if (i > 0) hex_log_str += " ";
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%02x", active_token_vector[i]);
                  hex_log_str += buf;
              }    
              id(flash_led_custom).execute(2, 200, 0.0, 1.0, 0.5); // flash two indicate default token.
              
              ESP_LOGD("boot_loader", "Active wake token vector now set to hex: %s", hex_log_str.c_str());
            }        
            
    - priority: 150
      then: # if display is disabled briefly show a message how to enable screen
        - if:
            condition:
              lambda: |-
                return id(myDisplay_disabled);
            then:
              # temporarily set display active
              - globals.set:
                  id: myDisplay_disabled
                  value: 'false'
              # briefly show display disabling msg
              - script.execute: 
                  id: display_show
                  small_text: false
                  line1: 'Display Disabled'
                  line2: 'To Re-enable'
                  line3: 'Hold Boot Btn'
              - delay: 10s    
              # disable display
              - globals.set:
                  id: myDisplay_disabled
                  value: 'true'

              - script.execute: 
                  id: display_show
                  small_text: false
                  line1: ''
                  line2: ''
                  line3: ''

# ============= end esphome ======================

preferences:
  flash_write_interval: 5s # More quickly commits sniffed tokens to flash. Global data rarely changes.

captive_portal:

esp32:
  partitions: ir-common-kuo/appkit/partitions.csv
  framework:
    sdkconfig_options:
      CONFIG_BT_BLE_EST_LINK_CONN_NUM: "2"
      CONFIG_BT_ACL_CONNECTIONS: "2"
      
      # ====== NEW HIGH-UTILITY MEMORY RECLAIMS ======
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "n"  # Forces internal ultra-fast RAM mapping
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"        # Dynamically releases pairing context blocks to heap
      CONFIG_BT_SMP_ENABLE: "y"                    # Required for your secure key exchange pairs
      CONFIG_BT_BLE_SMP_ENABLE: "y"                # Keep this active for Xgimi handshake lines
      
      # ====== REMOVE ALL MULTI-DEVICE OVERHEAD ======
      CONFIG_BT_BLE_MAX_ACT_PARAMS: "2"            # Drops background parallel device tracking down to 2

# ============================================================
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 13h #time before reboot if HomeAssistant is not present. 

  actions:

    # ---------- Direct Bluetooth Native Action Injection ----------
    - action: execute_native_bluetooth_action
      variables:
        action_name: string
        event_state: int # 0=DOWN, 1=HOLD, 2=UP
      then:
        - lambda: |-
            fire_bluetooth_hid_action(action_name.c_str(), event_state);

    # ---------- Count ----------
    - action: get_profile_count
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              root["count"]         = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;
              root["factory_count"] = (int) factory_count;


    # ---------- Export one profile via flat CSV string ----------
    - action: export_csv_profile
      variables:
        index: int
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              std::string csv_data = generate_profile_csv(index);
              if (!csv_data.empty()) {
                root["csv"] = csv_data;
              } else {
                root["error"] = "CSV stream generation failed";
              }

    # ---------- 2) Import a profile via flat CSV string ----------
    - action: import_csv_profile
      variables:
        csv_data: string
      then:
        - lambda: |-
            ESP_LOGW("CSV Import", "Incoming profile migration package stream received via Native API.");
            
            bool import_success = import_profile_from_csv(csv_data);
            
            if (import_success) {
              ESP_LOGI("CSV Import", "Migration successful. Mapping workspace component action indicators...");
              id(setup_ir_receiver_for_current_profile).execute();
              commit_database_to_flash(id(selected_profile_slot));
              id(ir_receiver_mode) = 1; // Return safely to normal Action Mode
              id(display_token_remote_profile).execute();
              id(display_show)->execute(true, "CSV Imported!", "Profile Active", active_profile_workspace.profile_name);
              id(publish_selected_profile_csv).execute();
            } else {
              ESP_LOGE("CSV Import", "Profile rejected! Incompatible data streams or parsing validation failure.");
              id(display_show)->execute(false, "Import Failed", "Corrupted CSV", "Rejected");
            }
            
# ============================================================
globals:

  - id: default_profile # use to give lambdas easy access to default profile index.
    type: int
    restore_value: yes
    initial_value: ${def_profile}

  - id: boot_hydration_latch
    type: bool
    initial_value: "false"
    restore_value: no
    
  - id: selectRepopulated
    type: bool
    initial_value: "false"
    restore_value: no
  
  - id: selected_profile_slot # Avalones ---------------
    type: int
    restore_value: no          # test
    initial_value: '0'          # 0 = first internal profile (LG-cinebeam-hu810p)

  - id: last_active_idx_seen # Avalones ---------------
    type: int
    restore_value: no
    initial_value: '-999'
          
    # ======= wake_token globals
    # During boot, if a token has been previously stored, this overrides the one supplied by secrets      
  - id: learned_wake_token # Learned wake token is stored here. Persistent upon globals sync.
    type: uint8_t[15]
    restore_value: yes
    initial_value: '{0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00}'
 
  - id: active_wake_token # this copy of wake token is submitted to set_wake_token. 
    type: uint8_t[15]
    restore_value: no
    initial_value: '{0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00}'
                 
  - id: sniffer_candidate_token # used for token sniffing
    type: std::array<char, 64>
    restore_value: no
    initial_value: '{"None"}' # Initializes raw array indices cleanly with zero heap impact

  - id: sniffer_hit_counter # used for token sniffing
    type: int
    restore_value: no
    initial_value: '0'

  - id: myDisplay_disabled # stops display from showing if true
    type: bool
    restore_value: yes # remember display suppression between boots.
    initial_value: 'false'

  - id: showing_special_info
    type: bool
    restore_value: no
    initial_value: 'false'


# ============================================================
debug:
  update_interval: 30s

sensor:
  - platform: debug

    free:
      name: "Heap Free RAM"
    fragmentation:
      name: "Heap Fragmentation"
    block:
      name: "Max Free Heap Block"
    loop_time:
      name: "Main Loop Time"

# ============================================================

text_sensor:
  - platform: debug
    device:
      name: "Device Hardware Info" # Shows flash chip size, speed, mode, and ESP ver      
    reset_reason:
      name: "Last Reset Reason"

  - platform: wifi_info
    ip_address:
      id: my_ip_address
      
      
  - platform: template # changed from Avalones
    name: "IR Active Profile"
    id: ir_active_profile_ts
    lambda: |-
      int idx = id(active_remote_profile);
      int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;
      
      // STATIC STORAGE ASSIGNMENT: Prevents continuous heap re-allocation spikes
      static char static_telemetry_buffer[128]; 
      
      if (idx < 0 || idx >= total_valid_slots) {
        snprintf(static_telemetry_buffer, sizeof(static_telemetry_buffer), "idx=%d (profile not loaded)", idx);
        return {static_telemetry_buffer};
      }
      
      const char* kind = (idx < (int) factory_count) ? "internal" : "custom";
      snprintf(static_telemetry_buffer, sizeof(static_telemetry_buffer), "idx=%d  %s  [%s]",
               idx,
               active_profile_workspace.profile_name.c_str(), 
               kind);
               
      return {static_telemetry_buffer};



# ============================================================
binary_sensor:
  - platform: template
    name: "XGIMI Sniffer Active Status"
    id: sniffer_status
    icon: "mdi:radar"

  - platform: gpio # Implement physical button for sniff
    pin:
      number: ${pin_action_btn}
      inverted: true
      mode:
        input: true
        pullup: ${pin_action_btn_pullup}
    name: "Action Button"
    id: action_button

    filters:
      - delayed_on_off: 25 ms
      
    on_multi_click:
      # 1. TRIPLE CLICK starts learning mode
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.30s
          - ON for at most 0.4s
          - OFF for at most 0.30s
          - ON for at most 0.4s
          - OFF for at least 0.1s # Triggers fast! No 4-click to wait fo
        then:
          - lambda: |-
              id(flash_led_custom).execute(3, 100, 0.4, 0.6, 0.4); // flash 3 times indicate triple click.

          - script.execute: start_learning_mode
          - logger.log: "Triple click detected. IR hub entering sequential learning mode."

      # 2. DOUBLE CLICK starts setting of IRmap (Profile Selection Mode)
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.30s
          - ON for at most 0.4s
          - OFF for at least 0.30s # Must match the "OFF for at most" of triple click
        then:
          - script.execute: 
              id: display_show
              small_text: true
              line1: 'Set IR Profile'
              line2: 'Press a Btn'
              line3: 'On Remote'
          - lambda: |-
              id(ir_receiver_allowed_protocol) = 255; // 255 is ALL
              id(ir_receiver_mode) = 2; // set profile mode active
              id(set_profile_timeout_watcher).execute();
              id(flash_led_custom).execute(2, 150, 0.8, 0.6, 0.2); // flash 2 times indicate double click.

          - logger.log: "Double click detected. IR hub in set profile mode."

      # 3. SINGLE CLICK starts token sniffing
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.8s # Must be longer to avoid triggering before double and triple click
        then:
          - button.press: token_sniff
          - logger.log: "Boot button short click. Starting token sniffing"

     # 4. LONG HOLD (Contextual dynamic erasure checks / fallback display toggler)
      - timing: 
          - ON for at least 5s
        then: 
          - if: 
              condition: 
                lambda: |-
                  return id(macro_workflow_state) == 1;
              then: 
                - script.stop: macro_record_timeout_watcher
                - script.execute: wipe_nvs_profiles_or_macros
              else:
                - if:
                    condition:
                      lambda: |-
                        return id(ir_receiver_mode) == 3;
                    then:
                      - script.stop: learn_mode_timeout_watcher
                      - script.execute: wipe_nvs_profiles_or_macros
                      - lambda: |-
                          id(ir_receiver_mode) = 1; // Safely re-engage normal active state
                    else:
                      - if:
                          condition: 
                            lambda: |-
                              return id(myDisplay_disabled);
                          then:
                            - globals.set:
                                id: myDisplay_disabled
                                value: 'false'
                            - script.execute: 
                                id: display_show
                                small_text: false
                                line1: 'Setting'
                                line2: 'Display'
                                line3: 'Enabled'
                            - display.page.show: active_page_std
                            - logger.log: "Display enabled via long hold."
                          else:
                            - script.execute: 
                                id: display_show
                                small_text: false
                                line1: 'Disabling Display'
                                line2: 'To Re-enable'
                                line3: 'Hold Boot Btn'
                            - delay: 3s
                            - globals.set:
                                id: myDisplay_disabled
                                value: 'true'
                            - script.execute: 
                                id: display_show
                                small_text: false
                                line1: ''
                                line2: ''
                                line3: ''
                            - logger.log: "Display suppressed via long hold."

# ============================================================
button:
              
  - platform: template # button to start sniffing for wake token. W
    name: "token_sniff"
    id: token_sniff
    icon: "mdi:bluetooth-audio"
    on_press:
      then:
        - script.execute: sniffing_sequence
    
    
  - platform: template # clear stored template. Revert to secrets wake token
    name: "token_clear"
    id: token_clear
    icon: "mdi:bluetooth-audio"
    on_press:
      then:
        - script.execute:
            id: turn_led_on_custom
            red: 0.3
            green: 0.2
            blue: 0.0
            brightness: 0.8
        - lambda: |-
            // Force fire your local hardware data-erasing flash worker
            id(run_token_clear_worker).execute(); 


  - platform: template # retrieve stored template, display, and use as active token
    name: "token_recall"
    id: token_recall
    icon: "mdi:bluetooth"
    on_press:
      then:
        - script.execute: execute_token_recall_routine
      

# ============================================================
script:
  
  - id: execute_token_recall_routine
    mode: single       
    then:
      - globals.set: 
          id: showing_special_info # indicate we are showing special info that should not be overwritten
          value: 'true'
      
      - lambda: |-
          bool learned_wake_token_exists = false; // check if any bytes are not 0x00
          for (int i = 0; i < 15; i++) {
            if (id(learned_wake_token)[i] != 0x00) {
              learned_wake_token_exists = true;
              break;
            }
          }
          
          if (learned_wake_token_exists) {

            // Copy learned_wake_token into active_wake_token
            memcpy(id(active_wake_token), id(learned_wake_token), 15);
            
            // submit active_wake_token as one to use
            std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
            id(xgimi_remote_controller)->set_wake_token(active_token_vector);
            
            
          } else {

            // Safely sync parsed secret vector data to active array
            std::vector<uint8_t> active_token_vector = get_secret_wake_token();
            for (size_t i = 0; i < 15; ++i) {
              id(active_wake_token)[i] = active_token_vector[i];
            }
            
          }
          // Display entire learned token via a display script
          id(display_wake_token).execute(reinterpret_cast<uint32_t>(id(active_wake_token)));


  # --- THREAD-ISOLATED CLEAR ACTION ---
  - id: run_token_clear_worker
    mode: single
    then:
      - script.execute: turn_led_off_custom
      - logger.log: "Clearing BLE wake token"
      - binary_sensor.template.publish: { id: sniffer_status, state: OFF }          
      - logger.log: "BLE Clear Token === Sniffing Ended."
      - logger.log: "BLE Clear Token === Zeroing Token."

      - script.execute:
          id: turn_led_off_custom
               
      - lambda: |-
          bool learned_wake_token_exists = false;
          for (int i = 0; i < 15; i++) {
            if (id(learned_wake_token)[i] != 0x00) {
              learned_wake_token_exists = true;
              break;
            }
          }
          
          if (learned_wake_token_exists) {
            memset(id(learned_wake_token), 0x00, 15);  
            global_preferences->sync();
            memset(id(active_wake_token), 0x00, 15);
            id(flash_led_custom).execute(2, 250, 1.0, 0.6, 0.0);
            id(display_show).execute(false,
                                     "Clear Learned",
                                     "Using Default",
                                     "Wait 5 sec");
          } else {
            std::vector<uint8_t> active_token_vector = get_secret_wake_token();
            for (size_t i = 0; i < 15; ++i) {
              id(active_wake_token)[i] = active_token_vector[i];
            }
            id(flash_led_custom).execute(1, 250, 0.0, 1.0, 0.0);
            id(display_show).execute(false,
                                     "Already Cleared",
                                     "(no learned)",
                                     "Using Default");
          }  
          
          // set wake token in xgimi_remote_controller
          std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
          id(xgimi_remote_controller)->set_wake_token(active_token_vector);

          // build hex_log_str for logging report
          std::string hex_log_str = "";
          for (size_t i = 0; i < active_token_vector.size(); ++i) {
              if (i > 0) hex_log_str += " ";
              
              char buf[8]; 
              
              snprintf(buf, sizeof(buf), "%02x", active_token_vector[i]);
              hex_log_str += buf;
          }
          ESP_LOGD("token_clear", "Active wake token vector now set to hex: %s", hex_log_str.c_str());
          
      
  # --- Sniff for Wake Tokens using Native Bluedroid Stack ---
  - id: sniffing_sequence
    mode: restart
    then:
      - logger.log: "Preparing NimBLE token sniffing..."

      # Prep globals for sniffing (Kept to zero-heap static footprint definitions)
      - lambda: |-
          std::memset(id(sniffer_candidate_token).data(), 0, id(sniffer_candidate_token).size());
          std::strcpy(id(sniffer_candidate_token).data(), "None");
          id(sniffer_hit_counter) = 0;

      - script.execute:
          id: turn_led_on_custom
          red: 0.0
          green: 0.0
          blue: 1.0
          brightness: 0.8

      - delay: 10ms 

      # Start Bluedroid Scanning via Lambda
      - lambda: |-
          esp_ble_gap_register_callback([](esp_gap_ble_cb_event_t event, esp_ble_gap_cb_param_t *param) {
              if (event != ESP_GAP_BLE_SCAN_RESULT_EVT) return;
              
              auto &scan_result = param->scan_rst; 
              if (scan_result.adv_data_len == 0) return;

              uint8_t *adv = scan_result.ble_adv;
              uint8_t len = scan_result.adv_data_len;
                            
              // 1. FAST POINTER SCAN (Avoids string operations entirely unless structure keys match)
              for (int i = 0; i < len - 3; i++) {
                  if (adv[i] == 0xFF && adv[i+1] == 0x46 && adv[i+2] == 0x00) {
                      
                      // 2. STACK BUFFER PROTECTION: Enforce absolute flat bounds upfront
                      char token_hex[32]; // Drastically scaled down to fit standard 15-byte token streams comfortably
                      std::memset(token_hex, 0, sizeof(token_hex));
                      
                      size_t offset = 0;
                      // Bound length loop execution tightly inside stack limit matrices
                      for (int j = 0; j < len && offset < (sizeof(token_hex) - 3); j++) {
                          offset += snprintf(token_hex + offset, 3, "%02X", adv[j]);
                      }

                      // Reject automated background pairing tokens using flat pointer arrays
                      if (std::strcmp(token_hex, "0201060319800103FF460003031218") == 0) {
                          continue; 
                      }

                      if (offset < 30) continue;
                      
                      // 3. ZERO-ALLOCATION MASKING ENGINE
                      bool is_match = false;
                      const char* candidate = id(sniffer_candidate_token).data();
                      
                      if (candidate != nullptr && std::strcmp(candidate, "None") != 0) {
                          size_t cand_len = std::strlen(candidate);
                          if (cand_len == offset) {
                              is_match = true;
                              for (size_t m = 0; m < offset; m++) {
                                  // Mask out the dynamic rolling validation bytes cleanly
                                  if (offset >= 4 && m >= (offset - 4) && m < (offset - 2)) continue;
                                  if (candidate[m] != token_hex[m]) {
                                      is_match = false;
                                      break;
                                  }
                              }
                          }
                      }
                      
                      // 4. PROCESS MATCH LOGIC EXCLUSIVELY VIA CONTIGUOUS BUFFERS
                      if (is_match) {
                          id(sniffer_hit_counter)++;
                          ESP_LOGI("xgimi_bluedroid", "Match count: %d for Token: %s", id(sniffer_hit_counter), token_hex);
                          
                          if (id(sniffer_hit_counter) >= 5) {
                              if (len >= 15) {
                                  uint8_t *tail_ptr = adv + (len - 15);
                                  
                                  if (std::memcmp(tail_ptr, id(active_wake_token), 15) == 0) {
                                      ESP_LOGD("xgimi_bluedroid", "Token matches active_wake_token. Skipping write.");
                                      
                                      esp_ble_gap_stop_scanning();
                                      esp_ble_gap_register_callback(nullptr);
                                      
                                      id(flash_led_custom).execute(4, 200, 0.0, 1.0, 0.0);
                                      id(indicator_led)->turn_off();
                                      id(display_show).stop();
                                      id(display_show).execute(false, "Token Recognized", "Matches", "Existing");
                                      
                                      id(sniffer_status)->publish_state(false);
                                      id(xgimi_sniffer_switch).publish_state(false);
                                      id(sniffing_sequence).stop(); 
                                      return;
                                  }
                                  
                                  // HEAP SAFE: Instantly commit raw bytes to memory structures
                                  std::memcpy(id(active_wake_token), tail_ptr, 15);
                                  std::memcpy(id(learned_wake_token), tail_ptr, 15);
                                  global_preferences->sync(); 
                                  
                                  std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
                                  id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                                  
                                  esp_ble_gap_stop_scanning();
                                  esp_ble_gap_register_callback(nullptr);
                                  
                                  // OPTIMIZED: Format directly into a flat fixed stack scratchpad 
                                  char ui_buf[32];
                                  std::memset(ui_buf, 0, sizeof(ui_buf));
                                  snprintf(ui_buf, sizeof(ui_buf), 
                                           "%02X %02X %02X %02X %02X...", 
                                           tail_ptr[0], tail_ptr[1], tail_ptr[2], tail_ptr[3], tail_ptr[4]);

                                  id(flash_led_custom).execute(8, 200, 0.0, 1.0, 0.0);
                                  id(indicator_led)->turn_off();
                                  id(display_show).stop();
                                  
                                  // ZERO HEAP CHURN: Pass the array pointer directly into string parameter
                                  id(display_show).execute(false, std::string(ui_buf), "Storing Token", "Wait 5 sec");
                                  
                                  id(sniffer_status)->publish_state(false);
                                  id(xgimi_sniffer_switch).publish_state(false);
                                  id(sniffing_sequence).stop(); 
                                  return;
                                  
                              }
                          }
                      } else {
                          // Copy strings via explicitly bounded safe flat allocations
                          char* cand_dest = id(sniffer_candidate_token).data();
                          size_t dest_max = id(sniffer_candidate_token).size();
                          std::strncpy(cand_dest, token_hex, dest_max - 1);
                          cand_dest[dest_max - 1] = '\0';
                          
                          id(sniffer_hit_counter) = 1;
                          ESP_LOGI("xgimi_bluedroid", "New unique signature target: %s", token_hex);
                      }
                  }
              }
          });
          
          esp_ble_scan_params_t scan_params = {
              .scan_type           = BLE_SCAN_TYPE_PASSIVE,
              .own_addr_type       = BLE_ADDR_TYPE_PUBLIC,
              .scan_filter_policy  = BLE_SCAN_FILTER_ALLOW_ALL,
              .scan_interval       = 0xA0, 
              .scan_window         = 0x40
          };
          
          esp_ble_gap_set_scan_params(&scan_params);
          esp_ble_gap_start_scanning(0);
          
      - binary_sensor.template.publish: 
          id: sniffer_status
          state: ON
      - logger.log: "Bluedroid stack active. SNIFFING for 20 seconds..." 
      
      - script.execute: 
          id: display_show
          small_text: false
          line1: "SNIFFING Token"
          line2: 'Repeat Press'
          line3: 'Xgimi Power'              
      
      - delay: 20s 

      - lambda: |-
          esp_ble_gap_stop_scanning();
          esp_ble_gap_register_callback(nullptr); 
          
      - delay: 10ms

      - binary_sensor.template.publish:
          id: sniffer_status
          state: OFF    
      - lambda: 'id(xgimi_sniffer_switch).publish_state(false);'
      - logger.log: "Bluedroid Sniffing Window Ended via Timeout."

      - script.execute: turn_led_off_custom
      - script.execute: 
          id: display_show
          small_text: false
          line1: 'Wake Token'
          line2: 'Sniffing'
          line3: 'TIMEOUT/ENDED'


  # --- show token_param on display ---
  - id: display_wake_token
    mode: restart 
    parameters:
      token_param: uint32_t  # 100% legal character type that clears the YAML parser
    then:
      - lambda: |-
          // Safely reconstruct our raw data pointer in-place using a zero-overhead C-cast
          const uint8_t* token_ptr = reinterpret_cast<const uint8_t*>(token_param);

          if (token_ptr != nullptr) {
            char slice_buf[8];

            // Line 1: First 5 bytes (Indices 0 to 4)
            std::string line1_hex = "";
            for (size_t i = 0; i < 5; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_ptr[i]);
              line1_hex += slice_buf;
            }
            if (!line1_hex.empty()) line1_hex.pop_back();

            // Line 2: Next 5 bytes (Indices 5 to 9)
            std::string line2_hex = "";
            for (size_t i = 5; i < 10; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_ptr[i]);
              line2_hex += slice_buf;
            }
            if (!line2_hex.empty()) line2_hex.pop_back();

            // Line 3: Last 5 bytes (Indices 10 to 14)
            std::string line3_hex = "";
            for (size_t i = 10; i < 15; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_ptr[i]);
              line3_hex += slice_buf;
            }
            if (!line3_hex.empty()) line3_hex.pop_back();

            id(display_show).execute(true,
                                     line1_hex,
                                     line2_hex,
                                     line3_hex);

          } else {
             id(display_show).execute(false,
                                     "Error:",
                                     "Token Size",
                                     "Invalid");
          }
          

  # --- show token, name of remote, active profile on display ---
  - id: display_token_remote_profile
    then:
      - lambda: |-
          std::string token_hex_str = "";
          unsigned char* token_bytes = active_wake_token->value();
          for (size_t i = 0; i < 15; ++i) {
            char buf[8];
            snprintf(buf, sizeof(buf), "%02X ", static_cast<int>(token_bytes[i]));
            token_hex_str += buf;
          }
          if (!token_hex_str.empty()) token_hex_str.pop_back();
          
          int current_idx = id(active_remote_profile);
          
          // FIXED: Check against pure integer math limits instead of proxy structure arrays
          int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;

          if (current_idx < 0 || current_idx >= total_valid_slots) {
            id(display_show)->execute(true, "${ble_remote_name}", token_hex_str, "No profile");
          } else {
            id(display_show)->execute(true,
                                     token_hex_str,
                                     "${ble_remote_name}",
                                     active_profile_workspace.profile_name); // FIXED: Reads directly from workspace memory
          }


# ====================================
  - id: publish_selected_profile_csv
    mode: restart
    then: 
      - delay: 100ms
      - lambda: |-
          // Simply log the sync event. We do not push to a text sensor 
          // to completely protect dynamic heap memory stability.
          ESP_LOGD("csv_sync", "Profile dropdown select synchronized with index slot %d", id(selected_profile_slot));


#=================================================================
select:
  - platform: template
    name: "IR Profile to Export"
    id: ir_profile_slot_selector
    icon: "mdi:format-list-numbered"
    optimistic: true
    restore_value: yes
    options:
      - "0 initializing"
    initial_option: "0 initializing"
    
    on_value:
      then:
        - lambda: |-
            if (x.empty() || x[0] < '0' || x[0] > '9') return;

            int extracted_idx = 0;
            size_t pos = 0;
            while (pos < x.size() && x[pos] >= '0' && x[pos] <= '9') {
              extracted_idx = extracted_idx * 10 + (x[pos] - '0');
              pos++;
            }

            int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;
            if (extracted_idx < 0 || extracted_idx >= total_valid_slots) return;

            id(selected_profile_slot) = extracted_idx;

            int cur = id(active_remote_profile);
            if (cur != extracted_idx) {
              id(active_remote_profile) = extracted_idx;
              
              // 1. Hydrate the active workspace container state immediately
              load_profile_to_workspace(extracted_idx);
              
              id(setup_ir_receiver_for_current_profile).execute();
              
              // 2. Clear the guard to allow future background loops to process correctly
              id(last_active_idx_seen) = -999; 
              
              // 3. Construct and force push state update to text_sensor instantly
              static char change_buf[128];
              const char* kind = (extracted_idx < (int)factory_count) ? "internal" : "custom";
              snprintf(change_buf, sizeof(change_buf), "idx=%d  %s  [%s]",
                       extracted_idx,
                       active_profile_workspace.profile_name.c_str(),
                       kind);
                       
              id(ir_active_profile_ts).publish_state(change_buf);
            }
        - script.execute: publish_selected_profile_csv
#=================================================================

switch:
  - platform: template
    name: "Xgimi Token Sniffer"
    id: xgimi_sniffer_switch
    icon: mdi:radar
      
    lambda: |-
      return id(sniffer_status).state;
    turn_on_action:
      - if:
          condition:
            script.is_running: sniffing_sequence
          then:
            - logger.log: "Sniffing sequence is already running, ignoring switch trigger."
          else:
            - script.execute: sniffing_sequence
    turn_off_action:
      - if:
          condition:
            script.is_running: sniffing_sequence
          then:
            - script.stop: sniffing_sequence
            - lambda: |-
                esp_ble_gap_stop_scanning();
                esp_ble_gap_register_callback(nullptr);
            - binary_sensor.template.publish:
                id: sniffer_status
                state: OFF
            - script.execute: turn_led_off_custom
            - script.execute: 
                id: display_show
                small_text: false
                line1: 'Wake Token'
                line2: 'Sniffing'
                line3: 'CANCELLED'
          else:
            - logger.log: "Sniffer already stopped. Clean loop break."
            
            
# ====================================================================
interval:
  # ====================================================================
  # ZERO-ALLOCATION ON-DEMAND DROPDOWN METADATA HYDRATION
  # ====================================================================
  - interval: 2.0s
    id: dynamic_select_hydration_timer
    then:
      - if:
          condition:
            lambda: 'return flash_hydration_complete;'
          then:
            - lambda: |-
                // 1. STACK & STATIC PERSISTENCE: Allocate fixed memory boundaries upfront.
                // This completely prevents runtime heap allocations or vector re-growing.
                constexpr size_t TOTAL_SLOTS = 13 + 3; // factory_count + MAX_LEARNED_PROFILES
                static char option_strings[TOTAL_SLOTS][64]; 
                static const char* permanent_pointer_matrix[TOTAL_SLOTS];

                int factory = 13; // Hardcoded fallback match to your factory_count ceiling specs

                // 2. CHIP RECOVERY PATH: Map hardcoded profile choices cleanly into pre-allocated memory
                for (int i = 0; i < factory; i++) {
                  snprintf(option_strings[i], sizeof(option_strings[i]), "%d  internal  (%s)", i, factory_names[i]);
                  permanent_pointer_matrix[i] = option_strings[i];
                }

                // 3. NVS PROFILE PATH: Read custom profile strings directly out of NVRAM slots
                for (uint16_t k = 0; k < 3; k++) {
                  size_t custom_idx = factory + k;
                  uint64_t slot_nvs_key = 1948204712ULL + k;
                  auto pref_obj = esphome::global_preferences->make_preference<FlashStoredProfile>(slot_nvs_key);
                  
                  static FlashStoredProfile flash_p;
                  std::memset(&flash_p, 0, sizeof(flash_p));
                  
                  if (pref_obj.load(&flash_p) && flash_p.total_keys > 0 && std::strlen(flash_p.profile_name) > 0) {
                    snprintf(option_strings[custom_idx], sizeof(option_strings[custom_idx]), "%d  custom    (%s)", (int)custom_idx, flash_p.profile_name);
                  } else {
                    snprintf(option_strings[custom_idx], sizeof(option_strings[custom_idx]), "%d  custom    (slot %d)", (int)custom_idx, (int)k);
                  }
                  permanent_pointer_matrix[custom_idx] = option_strings[custom_idx];
                }

                // 4. RESTORE ACTIVE WORKSPACE LAYOUT IN COLD MEMORY 
                int current_boot_layout_idx = id(active_remote_profile);
                load_profile_to_workspace(current_boot_layout_idx);

                // 5. MEMORY LAYOUT TRICKERY: Spoof an esphome::FixedVector using our contiguous array pointers
                struct FakeVectorLayout {
                  const char* const* data;
                  size_t size;
                  size_t capacity;
                };

                FakeVectorLayout fake_vector;
                fake_vector.data = permanent_pointer_matrix;
                fake_vector.size = TOTAL_SLOTS;
                fake_vector.capacity = TOTAL_SLOTS;

                // Safely cast our contiguous fake layout struct directly into the framework expectation
                const auto* native_vector_ptr = reinterpret_cast<const esphome::FixedVector<const char*>*>(&fake_vector);
                id(ir_profile_slot_selector).traits.set_options(*native_vector_ptr);
                
                // 6. SAFE STATE PUBLISHING
                int active_idx = id(selected_profile_slot);
                if (active_idx >= 0 && active_idx < (int)TOTAL_SLOTS) {
                  id(ir_profile_slot_selector).publish_state(option_strings[active_idx]);
                } else {
                  id(ir_profile_slot_selector).publish_state(option_strings[0]);
                }

                // 7. TELEMETRY SYNCHRONIZATION
                static char dropdown_sync_buf[64];
                const char* final_kind = (current_boot_layout_idx < factory) ? "internal" : "custom";
                snprintf(dropdown_sync_buf, sizeof(dropdown_sync_buf), "idx=%d  %s  [%s]",
                         current_boot_layout_idx,
                         active_profile_workspace.profile_name.c_str(),
                         final_kind);
                id(ir_active_profile_ts).publish_state(dropdown_sync_buf);

                ESP_LOGI("custom_select", "Select dropdown optimized safely without any heap allocations!");
                id(selectRepopulated) = true;
                
            - component.suspend: dynamic_select_hydration_timer


  - interval: 2.3s # Avalones ---------------
    id: publish_when_profiles_ready
    then:
      - if:
          condition:
            # Checks flash hydration completeness directly instead of querying the removed proxy structure object
            lambda: 'return flash_hydration_complete && id(selectRepopulated);'
          then:
            - logger.log: "Profiles fully loaded (factory + custom); publishing selected JSON."
            - script.execute: publish_selected_profile_csv
            - component.suspend: publish_when_profiles_ready
