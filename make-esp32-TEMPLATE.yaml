# ============= BEGIN Configuration Options KUO ======================================================================

# Only three things to configure here
#   ble_remote_name
#   Default IR profile
#   hardware_package

substitutions:
  ble_remote_name: "IR to Xgimi Kuo"  # <===== Name your IR remote. (20 char max. No special characters)


  # --- Default IR profile. Uncomment one (and only one)
  #def_profile: "0"  # AWOL-projector (untested, Hisense IR codes)
  #def_profile: "1"  # benq-w5800
  def_profile: "2"  # epson-pro-cinema-LS12000
  #def_profile: "3"  # hisense-50u6g
  #def_profile: "4"  # jvc-hr-S9600u
  #def_profile: "5"  # jvc-rs2-codeset-A 
  #def_profile: "6"  # jvc-rs2-codeset-B 
  #def_profile: "7"  # LG-cinebeam-hu810p 
  #def_profile: "8"  # optoma-UHD50X
  #def_profile: "9"  # sony-VPL-XW600ES 
  #def_profile: "10" # sony-XBR-77A9G 
  #def_profile: "11" # tivo-roamio-TCD846500 
  #def_profile: "13" # xgimi-titan (untested, published Original Titan IR codes)


packages: 
  # --- ESP32 board, Uncomment one (and only one) for your board
  hardware_package: !include ir-common-kuo/hardware-c3.yaml                  # supports built-in 0.42 inch OLED display
  #hardware_package: !include ir-common-kuo/hardware-c6.yaml                 # supports external 0.9 inch i2c OLED display
  #hardware_package: !include ir-common-kuo/hardware-m5stack-atom-lite.yaml  # supports external 0.9 inch i2c OLED display
  #hardware_package: !include ir-common-kuo/hardware-s3-hosyond-lcd-3.5-touch.yaml
  #hardware_package: !include ir-common-kuo/hardware-s3-waveshare-esp32-s3-touch-lcd-2.8.yaml
  #hardware_package: !include ir-common-kuo/hardware-s3-waveshare-lcd-1.47B.yaml # This board MUST use IR Sensor WITHOUT LED
                                                                             # Like the Vishay TSOP series.  Otherwise 3Vcc load causes crash durng boot.
                                                                                
  #hardware_package: !include ir-common-kuo/HARDWARE.YAML # Or uncomment this line and replace HARDWARE.YAML with your file.



# ========== END Configuration Options KUO ==============================================================================
# Code after this point typically does not need to be changed.
# =======================================================================================================================

  ir_hub_package:         !include ir-common-kuo/appkit/ir_hub.yaml
  mrmachine_BLE_package:  !include ir-common-kuo/appkit/mrmachine_bluetooth_V1.0.0.yaml # required, modified mrmachine BLE package

preferences:
  flash_write_interval: 3s # More quickly commits sniffed tokens to flash. Global data rarely changes.
  
external_components:
- source:
    type: local
    path: components
  components: [esp32_ble_server, xgimi_remote]

esp32:
  partitions: ir-common-kuo/appkit/partitions.csv  #larger app partition needed 

  
logger:
  level: INFO 
  # level: DEBUG 
  hardware_uart: USB_CDC      # Directs logs to the native internal S3 USB port
  baud_rate: 115200

captive_portal:

  
wifi:
  reboot_timeout: 0s
  ap:
    ssid: "${ble_remote_name}"
    password: !secret fallback_ap_password
    ap_timeout: 60s


# Enable v3 Web Server component
web_server:
  port: 80
  version: 3
  local: true # Hosts the interface completely offline
  auth:
    username: "admin"
    password: !secret fallback_ap_password

    
ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 30min #time before reboot if HomeAssistant is not present. 
  services:
    - service: import_json_profiles
      variables:
        json_data: string
      then:
        - lambda: |-
            ESP_LOGW("JSON Import", "Incoming remote migration configuration data packet received from Home Assistant API.");
            
            // Execute the import verification logic built right inside your ir_profile.h header file
            bool import_success = import_profiles_from_json(json_data);
            
            if (import_success) {
              ESP_LOGI("JSON Import", "Migration successful. Re-linking layout action object pointers...");
              
              // Safely refresh structural layout pointers and refresh physical layout display entities
              link_hardware_buttons();
              id(setup_ir_receiver_for_current_profile).execute();
              id(ir_receiver_mode) = 1; // Set to action mode
              
              id(display_token_remote_profile).execute();
                            
              id(display_show)->execute(true, "JSON Imported!", "Profiles Recovered", "Database Active");
            } else {
              ESP_LOGE("JSON Import", "Failed parsing configuration payload string! Incompatible or corrupted JSON layout format.");
              id(display_show)->execute(false, "Import Failed", "Corrupted File", "Rejected");
            }

# ============================================================
  
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ESP32 with XGIMI BLE Translator
  includes:
    - <sstream>
    - <iomanip>
    - <array>
    - <vector>
    - ir-common-kuo/appkit/secrets_bridge.h
    - ir-common-kuo/appkit/ir_profile.h

  build_flags: "-Wl,--require-defined=cJSON_Parse"
  
  project:
    name: xgimi.titan-noir-esp32-ir-kuo
    version: 26.09.18.001

  on_boot:

    - priority: -50
      then:
        - binary_sensor.template.publish:
            id: sniffer_status
            state: OFF
        
        - lambda: |-
            bool learned_wake_token_exists = false; // check if any bytes are not 0x00
            for (int i = 0; i < 15; i++) {
              if (id(learned_wake_token)[i] != 0x00) {
                learned_wake_token_exists = true;
                break;
              }
            }
            
            if (learned_wake_token_exists) {
              // There is a token stored in flash. Copy it to runtime array memory.
              memcpy(id(active_wake_token), id(learned_wake_token), 15);

              std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                            
              // create human readable hex string of active_wake_token
              std::string formatted_hex = "";
              
              // turn single 'char' variable into a sized character array to avoid crash
              char slice_buf[8];
              for (size_t i = 0; i < 5; i++) {
                uint8_t byte = id(active_wake_token)[i];
                snprintf(slice_buf, sizeof(slice_buf), "%02X ", byte);
                formatted_hex += slice_buf;
              }
              if (!formatted_hex.empty()) formatted_hex.pop_back();
              formatted_hex += "..."; 
              
              ESP_LOGD("boot_loader", "Using learned 15-byte token from NVS flash: %s", formatted_hex.c_str());
              
              id(flash_led_custom).execute(8, 150, 0.0, 0.5, 0.0); // flash 8 times indicate has learned token.


            } else {
              std::vector<uint8_t> active_token_vector = get_secret_wake_token();
              
              for (size_t i = 0; i < 15; ++i) {
                id(active_wake_token)[i] = active_token_vector[i];
              }
            
              std::string formatted_hex = "";
              for (size_t i = 0; i < 15; ++i) {
                  if (i > 0) formatted_hex += " ";
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%02x", id(active_wake_token)[i]);
                  formatted_hex += buf;
              }
              ESP_LOGD("boot_loader", "Using secrets token via C++ bridge text parser: %s", formatted_hex.c_str());
              
              id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                  

              ESP_LOGD("boot_loader", "Flash memory is empty. Suggest sniffing BLE new wake token.");
 
              // Build and print the active_token_vector hex payload directly to the ESPHome logs
              std::string hex_log_str = "";
              for (size_t i = 0; i < active_token_vector.size(); ++i) {
                  if (i > 0) hex_log_str += " ";
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%02x", active_token_vector[i]);
                  hex_log_str += buf;
              }    
              id(flash_led_custom).execute(2, 200, 1.0, 0.5, 0.0); // flash two indicate default token.
              
              ESP_LOGD("boot_loader", "Active wake token vector now set to hex: %s", hex_log_str.c_str());
            }        
            
    - priority: 150
      then: # if display is disabled briefly show a message how to enable screen
        - if:
            condition:
              lambda: |-
                return id(myDisplay_disabled);
            then:
              # temporarily set display active
              - globals.set:
                  id: myDisplay_disabled
                  value: 'false'
              # briefly show display disabling msg
              - script.execute: 
                  id: display_show
                  small_text: false
                  line1: 'Display Disabled'
                  line2: 'To Re-enable'
                  line3: 'Hold Boot Btn'
              - delay: 10s    
              # disable display
              - globals.set:
                  id: myDisplay_disabled
                  value: 'true'

              - script.execute: 
                  id: display_show
                  small_text: false
                  line1: ''
                  line2: ''
                  line3: ''

# ============================================================
globals:
  - id: default_profile
    type: int
    initial_value: ${def_profile}
      
    # ======= wake_token globals
    # During boot, if a token has been previously stored, this overrides the one supplied secrets      
  - id: learned_wake_token # Learned wake token is stored here. Persistent upon globals sync.
    type: uint8_t[15]
    restore_value: yes
    initial_value: '{0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00}'
 
  - id: active_wake_token # this copy of wake token is submitted to set_wake_token. 
    type: uint8_t[15]
    restore_value: no
    initial_value: '{0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00}'
                 
  - id: sniffer_candidate_token # used for token sniffing
    type: std::string
    restore_value: no
    initial_value: '"None"'

  - id: sniffer_hit_counter # used for token sniffing
    type: int
    restore_value: no
    initial_value: '0'

  - id: myDisplay_disabled # stops display from showing if true
    type: bool
    restore_value: yes # remember display suppression between boots.
    initial_value: 'false'

  - id: showing_special_info
    type: bool
    restore_value: no
    initial_value: 'false'


# ============================================================
debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: "Heap Free RAM"
    fragmentation:
      name: "Heap Fragmentation"
    block:
      name: "Max Free Heap Block"
    loop_time:
      name: "Main Loop Time"
    # # Optional: If your hardware has PSRAM (like some ESP32 variants)
    # psram:
    #   name: "Free PSRAM"

# ============================================================

text_sensor:
  - platform: debug
    device:
      name: "Device Hardware Info" # Shows flash chip size, speed, mode, and ESP version
    reset_reason:
      name: "Last Reset Reason"

# ============================================================
binary_sensor:
  - platform: template
    name: "XGIMI Sniffer Active Status"
    id: sniffer_status
    icon: "mdi:radar"

  - platform: gpio # Implement physical button for sniff
    pin:
      number: ${pin_action_btn}
      inverted: true
      mode:
        input: true
        pullup: true
    name: "physical action button"
    id: physical_action_button
    filters:
      - delayed_on: 50 ms
    on_multi_click:
      # 1. TRIPLE CLICK starts learning mode
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.35s
          - ON for at most 0.5s
          - OFF for at most 0.35s
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - lambda: |-
              id(flash_led_custom).execute(3, 100, 0.4, 0.6, 0.4); // flash 3 times indicate triple click.

          - script.execute: start_learning_mode
          - logger.log: "Triple click detected. IR hub entering sequential learning mode."

      # 2. DOUBLE CLICK starts setting of IRmap (Profile Selection Mode)
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.35s
          - ON for at most 0.5s
          - OFF for at least 0.35s
        then:
          - script.execute: 
              id: display_show
              small_text: true
              line1: 'Set IR Profile'
              line2: 'Press a Btn'
              line3: 'On Remote'
          - lambda: |-
              id(ir_receiver_allowed_protocol) = "ALL";
              id(ir_receiver_mode) = 2; // set profile mode active
              id(set_profile_timeout_watcher).execute();
              id(flash_led_custom).execute(2, 150, 0.8, 0.6, 0.2); // flash 2 times indicate double click.

          - logger.log: "Double click detected. IR hub in set profile mode."

      # 3. SINGLE CLICK starts token sniffing
      - timing:
          - ON for at most 400ms
          - OFF for at least 0.4s
        then:
          - button.press: token_sniff
          - logger.log: "Boot button short click. Starting token sniffing"

      # 4. LONG HOLD (Wipes dynamic slots if in Learning Mode, otherwise toggles screen display)
      - timing: 
          - ON for at least 5s
        then: 
          - if: 
              condition: 
                lambda: |-
                  return id(ir_receiver_mode) == 3;
              then: 
                - script.stop: learn_mode_timeout_watcher
                - script.execute: wipe_all_nvs_profiles
                - lambda: |-
                    id(ir_receiver_mode) = 1; // Safely re-engage normal active state
              else:
                # FIXED: The nested condition must open as a distinct list element item
                - if:
                    condition: 
                      lambda: |-
                        return id(myDisplay_disabled);
                    then:
                      - globals.set:
                          id: myDisplay_disabled
                          value: 'false'
                      - script.execute: 
                          id: display_show
                          small_text: false
                          line1: 'Setting'
                          line2: 'Display'
                          line3: 'Enabled'
                      - logger.log: "Display enabled via long hold."
                    else:
                      - script.execute: 
                          id: display_show
                          small_text: false
                          line1: 'Disabling Display'
                          line2: 'To Re-enable'
                          line3: 'Hold Boot Btn'
                      - delay: 3s
                      - globals.set:
                          id: myDisplay_disabled
                          value: 'true'
                      - script.execute: 
                          id: display_show
                          small_text: false
                          line1: ''
                          line2: ''
                          line3: ''
                      - logger.log: "Display suppressed via long hold."

# ============================================================
button:
  
  - platform: template # retrieve stored template, display, and use as active token
    name: "token_recall"
    id: token_recall
    icon: "mdi:bluetooth"
    on_press:
      then:
        - script.execute: execute_token_recall_routine
      


  - platform: template # clear stored template. Revert to secrets wake token
    name: "token_clear"
    id: token_clear
    on_press:
      then:
        - script.execute:
            id: turn_led_on_custom
            red: 0.3
            green: 0.2
            blue: 0.0
            brightness: 0.8
        - lambda: |-
            // Force fire your local hardware data-erasing flash worker
            id(run_token_clear_worker).execute(); 

            
  - platform: template # button to start sniffing for wake token. W
    name: "token_sniff"
    id: token_sniff
    icon: "mdi:bluetooth-audio"
    on_press:
      then:
        - script.execute: sniffing_sequence
    



# ============================================================

script:
  - id: execute_token_recall_routine
    mode: single       
    then:
      - globals.set: 
          id: showing_special_info # indicate we are showing special info that should not be overwritten
          value: 'true'
      
      - lambda: |-
          bool learned_wake_token_exists = false; // check if any bytes are not 0x00
          for (int i = 0; i < 15; i++) {
            if (id(learned_wake_token)[i] != 0x00) {
              learned_wake_token_exists = true;
              break;
            }
          }
          
          if (learned_wake_token_exists) {

            // Copy learned_wake_token into active_wake_token
            memcpy(id(active_wake_token), id(learned_wake_token), 15);
            
            // submit active_wake_token as one to use
            std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
            id(xgimi_remote_controller)->set_wake_token(active_token_vector);
            
            
          } else {

            // Safely sync parsed secret vector data to active array
            std::vector<uint8_t> active_token_vector = get_secret_wake_token();
            for (size_t i = 0; i < 15; ++i) {
              id(active_wake_token)[i] = active_token_vector[i];
            }
            
          }
          // Display entire learned token via a display script
          // must convert array into integer vector for script
          std::vector<int> token_int_pass(id(active_wake_token), id(active_wake_token) + 15); 
          id(display_wake_token).execute(token_int_pass);            


  # --- THREAD-ISOLATED CLEAR ACTION ---
  - id: run_token_clear_worker
    mode: single
    then:
      - script.execute: turn_led_off_custom
      - logger.log: "Clearing BLE wake token"
      - binary_sensor.template.publish: { id: sniffer_status, state: OFF }          
      - logger.log: "BLE Clear Token === Sniffing Ended."
      - logger.log: "BLE Clear Token === Zeroing Token."

      - script.execute:
          id: turn_led_off_custom
               
      - lambda: |-
          bool learned_wake_token_exists = false;
          for (int i = 0; i < 15; i++) {
            if (id(learned_wake_token)[i] != 0x00) {
              learned_wake_token_exists = true;
              break;
            }
          }
          
          if (learned_wake_token_exists) {
            memset(id(learned_wake_token), 0x00, 15);  
            global_preferences->sync();
            memset(id(active_wake_token), 0x00, 15);
            id(flash_led_custom).execute(2, 250, 1.0, 0.6, 0.0);
            id(display_show).execute(false,
                                     "Clear Learned",
                                     "Using Default",
                                     "Wait 5 sec");
          } else {
            std::vector<uint8_t> active_token_vector = get_secret_wake_token();
            for (size_t i = 0; i < 15; ++i) {
              id(active_wake_token)[i] = active_token_vector[i];
            }
            id(flash_led_custom).execute(1, 250, 0.0, 1.0, 0.0);
            id(display_show).execute(false,
                                     "Already Cleared",
                                     "(no learned)",
                                     "Using Default");
          }  
          
          // set wake token in xgimi_remote_controller
          std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
          id(xgimi_remote_controller)->set_wake_token(active_token_vector);

          // build hex_log_str for logging report
          std::string hex_log_str = "";
          for (size_t i = 0; i < active_token_vector.size(); ++i) {
              if (i > 0) hex_log_str += " ";
              
              char buf[8]; 
              
              snprintf(buf, sizeof(buf), "%02x", active_token_vector[i]);
              hex_log_str += buf;
          }
          ESP_LOGD("token_clear", "Active wake token vector now set to hex: %s", hex_log_str.c_str());
          
      
  # --- Sniff for Wake Tokens using Native Bluedroid Stack ---
  # --- Sniff for Wake Tokens using Native Bluedroid Stack ---
  - id: sniffing_sequence
    mode: restart
    then:
      - logger.log: "Preparing Bluedroid token sniffing..."

      # Prep globals for sniffing
      - lambda: |-
          id(sniffer_candidate_token) = "None";
          id(sniffer_hit_counter) = 0;

      - script.execute:
          id: turn_led_on_custom
          red: 0.0
          green: 0.0
          blue: 1.0
          brightness: 0.8

      - delay: 10ms 

      # Start Bluedroid Scanning via Lambda
      - lambda: |-
          // 1. Register raw callback into the Bluedroid stack
          esp_ble_gap_register_callback([](esp_gap_ble_cb_event_t event, esp_ble_gap_cb_param_t *param) {
              if (event == ESP_GAP_BLE_SCAN_RESULT_EVT) {
                  // FIX: Access the scan result structure natively from the param union pointer
                  auto &scan_result = param->scan_rst; 
                  
                  if (scan_result.adv_data_len > 0) {
                      uint8_t *adv = scan_result.ble_adv;
                      uint8_t len = scan_result.adv_data_len;
                      
                      // Traverse the BLE advertisement structural blocks looking for XGIMI
                      for (int i = 0; i < len - 3; i++) {
                          // Filter for Manufacturer Data type (0xFF) and XGIMI ID (0x46 0x00)
                          if (adv[i] == 0xFF && adv[i+1] == 0x46 && adv[i+2] == 0x00) {
                              
                              // Found a candidate packet! Reconstruct the payload string
                              std::string token_hex = "";
                              char buffer[8]; 
                              for (int j = 0; j < len; j++) {
                                  snprintf(buffer, sizeof(buffer), "%02X", adv[j]);
                                  token_hex += buffer;
                              }

                              // Reject automated background pairing token
                              if (token_hex == "0201060319800103FF460003031218") {
                                  continue; // Skip processing this packet structural loop entirely
                              }

                              if (token_hex.length() < 30) continue;
                              
                              // --- ARCHITECTURAL MATCH LOGIC ---
                              std::string current_masked = token_hex;
                              std::string candidate_masked = id(sniffer_candidate_token);
                              
                              if (current_masked.length() >= 4) {
                                  size_t mask_pos = current_masked.length() - 4;
                                  current_masked.replace(mask_pos, 2, "XX");
                                  if (candidate_masked != "None" && candidate_masked.length() == current_masked.length()) {
                                      candidate_masked.replace(mask_pos, 2, "XX");
                                  }
                              }
                              
                              if (id(sniffer_candidate_token) != "None" && current_masked == candidate_masked) {
                                  id(sniffer_hit_counter)++;
                                  ESP_LOGI("xgimi_bluedroid", "Match count: %d for Token: %s", id(sniffer_hit_counter), token_hex.c_str());
                                  
                                  if (id(sniffer_hit_counter) >= 4) {
                                      // Extract the last 15 bytes manually from the raw payload
                                      if (len >= 15) {
                                          uint8_t *tail_ptr = adv + (len - 15);
                                          
                                          std::string sniffed_token_last15_hex = ""; 
                                          char slice_buf[8]; 
                                          for (int k = 0; k < 15; k++) {
                                              snprintf(slice_buf, sizeof(slice_buf), "%02X ", tail_ptr[k]);
                                              sniffed_token_last15_hex += slice_buf;
                                          }
                                          
                                          // Sync string to HA Sensor Entity
                                          std::string ha_payload = "";
                                          char ha_buf[8];
                                          for (int j = 0; j < len; j++) {
                                              snprintf(ha_buf, sizeof(ha_buf), "%02X", adv[j]);
                                              ha_payload += ha_buf;
                                          }

                                          // Protection Check: Duplicate verification
                                          if (memcmp(tail_ptr, id(active_wake_token), 15) == 0) {
                                              ESP_LOGD("xgimi_bluedroid", "Token matches active_wake_token. Skipping write.");
                                              
                                              // Teardown Bluedroid Scan completely
                                              esp_ble_gap_stop_scanning();
                                              esp_ble_gap_register_callback(nullptr);
                                              
                                              id(flash_led_custom).execute(4, 200, 0.0, 1.0, 0.0);
                                              id(indicator_led)->turn_off();
                                              id(display_show).stop();
                                              id(display_show).execute(false, "Token Recognized", "Matches", "Existing");
                                              
                                              id(sniffer_status)->publish_state(false);
                                              id(xgimi_sniffer_switch).publish_state(false);
                                              id(sniffing_sequence).stop(); // Halts the remaining 20s script window
                                              return;
                                          }
                                          
                                          // Update Runtime and Persistent Storage Arrays
                                          memcpy(id(active_wake_token), tail_ptr, 15);
                                          memcpy(id(learned_wake_token), tail_ptr, 15);
                                          global_preferences->sync(); 
                                          
                                          std::vector<uint8_t> active_token_vector(id(active_wake_token), id(active_wake_token) + 15);
                                          id(xgimi_remote_controller)->set_wake_token(active_token_vector);
                                          
                                          // Teardown Bluedroid Scan completely
                                          esp_ble_gap_stop_scanning();
                                          esp_ble_gap_register_callback(nullptr);
                                          
                                          id(flash_led_custom).execute(8, 200, 0.0, 1.0, 0.0);
                                          id(indicator_led)->turn_off();
                                          id(display_show).stop();
                                          id(display_show).execute(false, sniffed_token_last15_hex, "Storing Token", "Wait 5 sec");
                                          
                                          id(sniffer_status)->publish_state(false);
                                          id(xgimi_sniffer_switch).publish_state(false);
                                          id(sniffing_sequence).stop(); 
                                          return;
                                      }
                                  }
                              } else {
                                  id(sniffer_candidate_token) = token_hex;
                                  id(sniffer_hit_counter) = 1;
                                  ESP_LOGI("xgimi_bluedroid", "New unique signature target: %s", token_hex.c_str());
                              }
                          }
                      }
                  }
              }
          });
          
          // 2. Configure passive background scan parameters
          esp_ble_scan_params_t scan_params = {
              .scan_type           = BLE_SCAN_TYPE_PASSIVE,
              .own_addr_type       = BLE_ADDR_TYPE_PUBLIC,
              .scan_filter_policy  = BLE_SCAN_FILTER_ALLOW_ALL,
              .scan_interval       = 0xA0, 
              .scan_window         = 0x40
              // FIX: Removed invalid '.turn_by_turn = false' entry entirely
          };
          
          esp_ble_gap_set_scan_params(&scan_params);
          esp_ble_gap_start_scanning(0); // Continuous scan within this script window

          
      - binary_sensor.template.publish: 
          id: sniffer_status
          state: ON
      - logger.log: "Bluedroid stack active. SNIFFING for 20 seconds..." 
      
      - script.execute: 
          id: display_show
          small_text: false
          line1: "SNIFFING Token"
          line2: 'Repeat Press'
          line3: 'Xgimi Power'              
      
      # Keep the window open for 20 seconds
      - delay: 20s 

      # --- TIMEOUT CLEANUP ---
      # This block will ONLY execute if 20 seconds expire completely without hitting a valid token
      - lambda: |-
          esp_ble_gap_stop_scanning();
          esp_ble_gap_register_callback(nullptr); // Release callback memory completely
          
      - delay: 10ms

      - binary_sensor.template.publish:
          id: sniffer_status
          state: OFF    
      - lambda: 'id(xgimi_sniffer_switch).publish_state(false);'
      - logger.log: "Bluedroid Sniffing Window Ended via Timeout."

      - script.execute: turn_led_off_custom
      - script.execute: 
          id: display_show
          small_text: false
          line1: 'Wake Token'
          line2: 'Sniffing'
          line3: 'TIMEOUT/ENDED'




# --- myDisplay timeout auto dims display ---
  - id: display_show
    mode: restart 
    parameters:
      small_text: bool
      line1: std::string
      line2: std::string
      line3: std::string
   
    then:
      - lambda: |-
          id(myDisplay_line1) = line1; 
          id(myDisplay_line2) = line2;
          id(myDisplay_line3) = line3;
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 40s #how long display remains on
      - display.page.show: blank_page



  # --- show token_param on display ---
  - id: display_wake_token
    mode: restart 
    parameters:
      token_param: int[]
    then:
      - lambda: |-
          if (token_param.size() >= 15) {
            // fully declare array bounds buffer to stop compiler panics
            char slice_buf[8];

            // Line 1: First 5 bytes (Indices 0 to 4)
            std::string line1_hex = "";
            for (size_t i = 0; i < 5; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line1_hex += slice_buf;
            }
            if (!line1_hex.empty()) line1_hex.pop_back();

            // Line 2: Next 5 bytes (Indices 5 to 9)
            std::string line2_hex = "";
            for (size_t i = 5; i < 10; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line2_hex += slice_buf;
            }
            if (!line2_hex.empty()) line2_hex.pop_back();

            // Line 3: Last 5 bytes (Indices 10 to 14)
            std::string line3_hex = "";
            for (size_t i = 10; i < 15; i++) {
              snprintf(slice_buf, sizeof(slice_buf), "%02X ", token_param[i]);
              line3_hex += slice_buf;
            }
            if (!line3_hex.empty()) line3_hex.pop_back();

            id(display_show).execute(true,
                                     line1_hex,
                                     line2_hex,
                                     line3_hex);


          } else {
             id(display_show).execute(false,
                                     "Error:",
                                     "Token Size",
                                     "Invalid");
          }
          

  # --- show token, name of remote, active profile on display ---
  - id: display_token_remote_profile
    then:
      - lambda: |-
      
          // build token_hex_str for logging report
          std::string token_hex_str = "";
          // Use the underlying C-array via ->value()
          unsigned char* token_bytes = active_wake_token->value();
          
          for (size_t i = 0; i < 15; ++i) {
            if (i > 0) token_hex_str += " ";
            
            char buf[8]; // Fixed buffer size to hold 2 hex digits + null terminator
            // Force cast to int to prevent compiler warnings with %02X
            snprintf(buf, sizeof(buf), "%02X", static_cast<int>(token_bytes[i]));
            token_hex_str += buf;
          }
          
          // get current profile name
          int current_idx = id(active_remote_layout);
          if (!(0 <= current_idx && current_idx < remote_profiles.size())) {
            id(display_show).execute(true,
                                     "${ble_remote_name}",
                                     token_hex_str,
                                     "No profile");
          } else {
            const auto& active_profile = remote_profiles[current_idx]; // Get the active_profile struct
              
            id(display_show).execute(true,
                                     token_hex_str,
                                     "${ble_remote_name}",
                                     active_profile.profile_name);

          }


#===========================


switch:
  - platform: template
    name: "Xgimi Token Sniffer"
    id: xgimi_sniffer_switch
    icon: mdi:radar
    lambda: |-
      return id(sniffer_status).state;
    turn_on_action:
      - if:
          condition:
            script.is_running: sniffing_sequence
          then:
            - logger.log: "Sniffing sequence is already running, ignoring switch trigger."
          else:
            - script.execute: sniffing_sequence
    turn_off_action:
      - if:
          condition:
            script.is_running: sniffing_sequence
          then:
            - script.stop: sniffing_sequence
            - lambda: |-
                esp_ble_gap_stop_scanning();
                esp_ble_gap_register_callback(nullptr);
            - binary_sensor.template.publish:
                id: sniffer_status
                state: OFF
            - script.execute: turn_led_off_custom
            - script.execute: 
                id: display_show
                small_text: false
                line1: 'Wake Token'
                line2: 'Sniffing'
                line3: 'CANCELLED'
          else:
            - logger.log: "Sniffer already stopped. Clean loop break."
