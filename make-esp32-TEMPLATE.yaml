select:
  - platform: template # Avalones ---------------
    name: "IR Profile to Export"
    id: ir_profile_slot_selector
    icon: "mdi:format-list-numbered"
    web_server:
      sorting_group_id: profileGroup
      sorting_weight: 22

    optimistic: true
    restore_value: yes
    options:
      - "0  internal  (AWOL-projector)"
      - "1  internal  (benq-w5800)"
      - "2  internal  (epson-pro-cinema-LS12000)"
      - "3  internal  (hisense-50u6g)"
      - "4  internal  (jvc-hr-S9600u)"
      - "5  internal  (jvc-rs2-codeset-A)"
      - "6  internal  (jvc-rs2-codeset-B)"
      - "7  internal  (LG-cinebeam-hu810p)"
      - "8  internal  (optoma-UHD50X)"
      - "9  internal  (sony-VPL-XW600ES)"
      - "10 internal  (sony-XBR-77A9G)"
      - "11 internal  (tivo-roamio-TCD846500)"
      - "12 internal  (xgimi-titan)"
      - "13 custom    (slot 0)"
      - "14 custom    (slot 1)"
      - "15 custom    (slot 2)"
      - "16 custom    (slot 3)"
      - "17 custom    (slot 4)"
    initial_option: "7  internal  (LG-cinebeam-hu810p)"
    
    on_value:
      then:
        - lambda: |-
            int idx = 0;
            size_t pos = 0;
            while (pos < x.size() && x[pos] >= '0' && x[pos] <= '9') {
              idx = idx * 10 + (x[pos] - '0');
              pos++;
            }

            id(selected_profile_slot) = idx;

            if (!remote_profiles.empty() && idx < (int) remote_profiles.size()) {
              int cur = id(active_remote_layout);
              if (cur < 0) {
                int cs = (cur * -1) - 1;
                cur = (int) factory_count + cs;
              }
              if (cur != idx) {
                id(active_remote_layout) = idx;
                id(setup_ir_receiver_for_current_profile).execute();
                ESP_LOGI("webui", "Active IR profile changed to idx=%d via selector", idx);
                id(last_active_idx_seen) = idx;
                id(ir_active_profile_ts).update();
              }
            }
        - script.execute: publish_selected_profile_json

