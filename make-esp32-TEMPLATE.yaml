switch:
  - platform: template
    name: "Xgimi Token Sniffer"
    id: xgimi_sniffer_switch
    icon: mdi:radar
    web_server:
      sorting_group_id: settingsGroup
      sorting_weight: 8
      
      
    lambda: |-
      return id(sniffer_status).state;
    turn_on_action:
      - if:
          condition:
            script.is_running: sniffing_sequence
          then:
            - logger.log: "Sniffing sequence is already running, ignoring switch trigger."
          else:
            - script.execute: sniffing_sequence
    turn_off_action:
      - if:
          condition:
            script.is_running: sniffing_sequence
          then:
            - script.stop: sniffing_sequence
            - lambda: |-
                esp_ble_gap_stop_scanning();
                esp_ble_gap_register_callback(nullptr);
            - binary_sensor.template.publish:
                id: sniffer_status
                state: OFF
            - script.execute: turn_led_off_custom
            - script.execute: 
                id: display_show
                small_text: false
                line1: 'Wake Token'
                line2: 'Sniffing'
                line3: 'CANCELLED'
          else:
            - logger.log: "Sniffer already stopped. Clean loop break."
            
            
#======================
interval:
  - interval: 1s # Avalones ---------------
    id: publish_when_profiles_ready
    then:
      - if:
          condition:
            lambda: 'return !remote_profiles.empty() && flash_hydration_complete;'
          then:
            - logger.log: "Profiles fully loaded (factory + custom); publishing selected JSON."
            - script.execute: publish_selected_profile_json
            - component.suspend: publish_when_profiles_ready

  - interval: 2s # Avalones ---------------
    then:
      - lambda: |-
          if (remote_profiles.empty()) return;

          int idx = id(active_remote_layout);
          if (idx < 0) {
            int cs = (idx * -1) - 1;
            idx = (int) factory_count + cs;
          }
          if (idx == id(last_active_idx_seen)) return;

          id(last_active_idx_seen) = idx;
          id(ir_active_profile_ts).update();
