
# Global variables to save the latest parsed IR data
globals:
  - id: last_xgimi_TN_command
    type: std::string  
    restore_value: no
    initial_value: '"IR to BLE Kuo"'

  - id: last_IR_address
    type: std::string  
    restore_value: no
    initial_value: '"TiVo to Xgimi"'
    
  - id: last_IR_instruction
    type: std::string  
    restore_value: no
    initial_value: '"READY"'


 # ======= KUO Begin remote_receiver =========
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us
  idle: 10ms
  tolerance: 25%
  dump: 
    - nec
    - pioneer
    
  on_nec:
      then:
        - script.execute: display_timeout_handler
        - lambda: |-
            struct IRCommand {
              std::string name;
              esphome::template_::TemplateButton* button_obj;
            };
 
            static const std::map<uint16_t, IRCommand> nec_codes = {
              { 0xB044,       { "back",          id(back) } },
              { 0xE016,       { "cursor_down",   id(cursor_down) } },
              { 0xE019,       { "cursor_enter",  id(cursor_enter) } },
              { 0xE017,       { "cursor_left",   id(cursor_left) } },
              { 0xE015,       { "cursor_right",  id(cursor_right) } },
              { 0xE014,       { "cursor_up",     id(cursor_up) } },
              { 0xD02E,       { "focus_auto",    id(focus_auto) } },
              { 0xD02F,       { "focus_manual",  id(focus_manual) } },
              { 0xE01E,       { "home",          id(home) } },
              { 0xC034,       { "input",         id(input) } },
              { 0xF00C,       { "settings_menu", id(settings_menu) } },
              { 0xF00D,       { "settings_menu", id(settings_menu) } },
              { 0xC036,       { "game_menu",     id(game_menu) } },
              { 0xE01B,       { "mute",          id(mute) } },
              { 0xE013,       { "picture",       id(picture) } },
              { 0xE010,       { "power_on",      id(power_on) } },
              { 0xE011,       { "power_off",     id(power_off_held) } },
              { 0xC031,       { "power_off",     id(power_off_held) } },
              { 0x9060,       { "shortcut_1",    id(shortcut_1) } },
              { 0x9061,       { "shortcut_2",    id(shortcut_2) } },
              { 0x9062,       { "shortcut_3",    id(shortcut_3) } },
              { 0x9063,       { "shortcut_4",    id(shortcut_4) } },
              { 0xE01D,       { "volume_down",   id(volume_down) } },
              { 0xE01C,       { "volume_up",     id(volume_up) } },
              { 0xC033,       { "BT_start_pair", id(bluetooth_pairing_start) } },
              { 0xC032,       { "BT_clear_pair", id(bluetooth_pairing_clear) } },
            };

            
            std::stringstream ss1;
            // x.command provides the 16-bit NEC data command sequence
            ss1 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.command;
            std::string rc_code_1_str = ss1.str(); 
            
            
            std::stringstream ss2;
            // x.address provides the 16-bit NEC device address block
            ss2 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.address;
            std::string rc_code_2_str = ss2.str(); 

            // TiVo should always be x.address 0x3085 
            // Only execute the button mapping lookup if the address matches 0x3085
            if (x.address == 0x3085) {
              // It is a TiVo device address, but we must also check its command for a match
              rc_code_2_str = "TiVo"; // report address as human readable TiVo
              
              auto it = nec_codes.find(x.command); // search table for IR command match
              
              if (it != nec_codes.end()) {
                id(last_xgimi_TN_command) = it->second.name; // remember xgimi command
                
                if (it->second.button_obj != nullptr) {
                  it->second.button_obj->press(); // press associated template button
                }
                
              } else {
                id(last_xgimi_TN_command) = "Unassigned";
                
 
              }
            } else {
              // It is an NEC code, but not a TiVo
              id(last_xgimi_TN_command) = "Not TiVo IR";
            }
            
            id(last_IR_address) = rc_code_2_str;
            id(last_IR_instruction) = rc_code_1_str;
# ======= KUO End remote_receiver ============
