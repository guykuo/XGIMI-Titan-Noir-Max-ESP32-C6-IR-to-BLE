# Ideaspark classic ESP32 with OLED
# Adequate RAM, but not as good safety margin as C3 OLED boards
# Overall OK choice and would work in most setups.


# ============= BEGIN Configuration Options KUO ==========

substitutions:
  pin_ir_receiver: GPIO4   # IR sensor. 
  pin_indicator_LED: GPIO2 # LED indicator
  pin_action_btn: GPIO0     # use boot button for actions. Both ESP32-c3 and ESP32-C6 use pin 9 for boot button. 
  pin_action_btn_pullup: true
  wifi_tx_power: "15dB"
  
# Core Architecture Declaration
esp32:
  board: esp32dev
  framework:
    type: esp-idf
  
# i2c Display Pins
i2c: 
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz
  scan: false # to prevent startup crashes during boot scans
  id: bus_a
  
# ============= END Configuration Options KUO ==========
  
globals:
    # ======= myDisplay display globals
  - id: myDisplay_line1
    type: std::string  
    restore_value: no
    initial_value: ''

  - id: myDisplay_line2
    restore_value: no
    type: std::string  
    initial_value: ''
    
  - id: myDisplay_line3
    restore_value: no
    type: std::string  
    initial_value: ''
    
switch:
  - platform: gpio # indicator LED that lights up when sniffing
    pin:
      number: ${pin_indicator_LED}
      inverted: false
    id: indicator_led
  
script:
  - id: flash_led_custom
    parameters:
      count: int         # Number of flashes
      dwell: int         # duration of flash in msec
      red: float         # Ignored on C3, kept for API matching
      green: float       # Ignored on C3, kept for API matching
      blue: float        # Ignored on C3, kept for API matching
    mode: queued
    then:
      - repeat:
          count: !lambda "return count;"
          then:
            # --- TURN BINARY LED ON ---
            - switch.turn_on: indicator_led
            - delay: !lambda "return dwell;"
  
            # --- TURN BINARY LED OFF ---
            - switch.turn_off: indicator_led
            - delay: !lambda "return dwell;"
               
  - id: turn_led_on_custom
    parameters:
      red: float         # Ignored on C3, kept for API matching
      green: float       # Ignored on C3, kept for API matching
      blue: float        # Ignored on C3, kept for API matching
      brightness: float  # Ignored on C3, kept for API matching
    mode: single
    then:
      - switch.turn_on: indicator_led

  - id: turn_led_off_custom
    mode: single
    then:
      - switch.turn_off: indicator_led


# ============ General Display Scripts =============
# --- myDisplay display 3 lines and auto dim display ---
  - id: display_show
    mode: restart 
    parameters:
      small_text: bool
      line1: std::string
      line2: std::string
      line3: std::string
   
    then:
      - lambda: |-
          id(myDisplay_line1) = line1; 
          id(myDisplay_line2) = line2;
          id(myDisplay_line3) = line3;
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 40s #how long display remains on
      - display.page.show: blank_page


# --- myDisplay modify a line and auto dim display ---
  - id: display_modify_a_line
    mode: restart 
    parameters:
      small_text: bool
      whichLine: int
      aline: std::string
   
    then:
      - lambda: |-
          switch (whichLine) {
            case 1:
              id(myDisplay_line1) = aline; 
              break;
            case 2:
              id(myDisplay_line2) = aline;
              break;
            case 3:
              id(myDisplay_line3) = aline;
              break;
            default:
              break;
          }
          
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 40s #how long display remains on
      - display.page.show: blank_page

# ========  Display Specific Implementation ========

font:
  - file: "gfonts://Roboto"
    id: my_fontSmall
    size: 9

  - file: "gfonts://Roboto"
    id: my_fontMedium
    size: 10

  - file: "gfonts://Roboto"
    id: my_fontLarge
    size: 12

    
# Built-in 72x40 SSD1306 OLED screen
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: myDisplay
    offset_x: 0
    offset_y: 0
    rotation: 180
    update_interval: 0.1s

    
    pages:
      - id: active_page_std
        lambda: |-
          it.print(0, 0,  id(my_fontMedium), id(myDisplay_line1).c_str());
          it.print(0, 13, id(my_fontLarge), id(myDisplay_line2).c_str());
          it.print(0, 26, id(my_fontLarge), id(myDisplay_line3).c_str());

      - id: active_page_small
        lambda: |-
          it.print(0, 0,  id(my_fontSmall), id(myDisplay_line1).c_str());
          it.print(0, 13, id(my_fontSmall), id(myDisplay_line2).c_str());
          it.print(0, 26, id(my_fontSmall), id(myDisplay_line3).c_str());

      - id: blank_page
        lambda: |-
          // Leaving lambda completely blank turns all pixels off safely
