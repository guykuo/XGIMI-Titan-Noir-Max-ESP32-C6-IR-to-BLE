# irmap-jvc-rs2-codeset-A.yaml
# JVC RS2 projector code set B (alternative set)

packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

remote_receiver:
  id: ir_receiver
  dump: jvc
  on_nec: !remove
  on_sony: !remove
  on_lg: !remove
  
substitutions:
  #target_ir_address: "0xCE" # JVC remote code set A (default)
  target_ir_address: "0x36" # JVC remote code B

  remote_display_name: "JVC Proj"
  
  # =============================================================
  # DEFINE token clearing gate buttons
  cmd_token_clear_arm: "0xBE"      # JVC: color down
  cmd_token_clear_fire: "0xF4"     # JVC: OK / ENTER

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t
      is_hold: bool
    then:
      - lambda: |-
          // JVC Payload Matrix: Extract address (upper 8 bits) and command (lower 8 bits)
          id(jvc_broadcast_processor).execute(command, (uint16_t)((command >> 8) & 0xFF), (uint16_t)(command & 0xFF), is_hold);

  - id: jvc_broadcast_processor
    parameters:
      command: uint32_t     
      device_addr: uint16_t  
      pure_cmd: uint16_t     
      is_hold: bool       
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // Strict unique map loaded with genuine JVC production command data codes
          static const std::map<uint16_t, IRCommand> cmd_codes = {
            { 0xA0,       { "power_on",      id(power_on) } },          // power on
            { 0x60,       { "power_off", id(power_off_immediately) } }, // power off
            { 0x80,       { "cursor_up",     id(cursor_up) } },       // up arrow
            { 0x40,       { "cursor_down",   id(cursor_down) } },     // down arrow
            { 0x6C,       { "cursor_left",   id(cursor_left) } },     // left arrow
            { 0x2C,       { "cursor_right",  id(cursor_right) } },    // right arrow
            { 0xF4,       { "cursor_enter",  id(cursor_enter) } },    // enter/ok
            { 0x74,       { "settings_menu", id(settings_menu) } },   // menu
            { 0xC0,       { "back",          id(back) } },            // exit
            { 0xB8,       { "home",          id(home) } },            // hide
            { 0xAE,       { "game_menu",     id(game_menu) } },       // gamma
            { 0x0E,       { "input",         id(input) } },           // input HDMI 1
            { 0x8E,       { "picture",       id(picture) } },         // input HDMI 2
            { 0xCC,       { "focus_manual",  id(focus_manual) } },    // focus -
            { 0x8C,       { "focus_auto",    id(focus_auto) } },      // focus +
            { 0xD2,       { "shortcut_1",    id(shortcut_1) } },      // input video
            { 0x32,       { "shortcut_2",    id(shortcut_2) } },      // input s-video
            { 0xB2,       { "shortcut_3",    id(shortcut_3) } },      // input component
            { 0x56,       { "shortcut_4",    id(shortcut_4) } },      // natural
            { 0x5E,       { "volume_up",     id(volume_up) } },       // brightness up
            { 0xDE,       { "volume_down",   id(volume_down) } },     // brightness down
            { 0xB8,       { "mute",          id(mute) } },            // hide
            { 0x3E,       { "token_sniff",   id(token_sniff) } },     // color up
            { 0xBE,       { "token_clear",   id(token_clear) } },     // color down
            { 0x6E,       { "token_recall",  id(token_recall) } },    // color temp
            { 0xEE,       { "BT_start_pair",  id(bluetooth_pairing_start) } },    // aspect
            { 0x96,       { "BT_clear_pair",  id(bluetooth_pairing_clear) } },    // cinema
            
            
            { 0x9E,       { "contrast down", id(home) } },    // contrast down
            { 0x1E,       { "contast up",    id(home) } },    // contrast up
            { 0xD6,       { "dynamic",       id(home) } },    // dynamic
            { 0xE0,       { "light",         id(home) } },    // light
            { 0xFE,       { "sharp down",    id(home) } },    // sharp down
            { 0x9A,       { "sharp up",      id(home) } },    // sharp up
            { 0x36,       { "test",          id(home) } },    // test
            { 0x36,       { "user 1",        id(home) } },    // user 1
            { 0xB6,       { "user 2",        id(home) } },    // user 2
            { 0x76,       { "user 3",        id(home) } },    // user 3
            { 0xAC,       { "zoom T",        id(home) } },    // zoom T
            { 0xEC,       { "zoom W",        id(home) } }     // zoom W

          };

          auto it = cmd_codes.find(pure_cmd);
          if (it != cmd_codes.end()) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                id(commandName) = it->second.name + " (Hold)";
                ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
              } else {
                id(commandName) = it->second.name;
                ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
              }
            }
            // press button action
            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
            
          } else {
            // did not find in map
            id(commandName) = "Unassigned"; // indicate no command was found
            
          }
