# waveshare S3 LCD 2.8 inch with touch
# large LCD display
# Does not have a usable indicator LED, but rather a battery charge indicator

# ============= BEGIN Configuration Options KUO ==========

substitutions:
  pin_ir_receiver:   GPIO44 # on UART RXD. 4 pin JIS 1.0 connector also has 3V and Gnd connections for IR receiver.
  pin_indicator_LED: GPIO43 # on UART TXD. No indicator LED on this board. Use GPIO43 as dummy
  pin_action_btn: GPIO0 # use boot button to start actions
  pin_action_btn_pullup: true
  wifi_tx_power: "15dB"

# Core Architecture Declaration
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3 # variant needed to keep compiler tuned for the S3 chip core
  framework:
    type: esp-idf

# ============= END Configuration Options KUO ==========

esphome:
  on_boot:
    priority: 200.0            # Dim display backlight after hardware components setup
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 0.7%

globals:
    # ======= myDisplay display globals
  - id: myDisplay_line1
    type: std::string  
    restore_value: no
    initial_value: ''

  - id: myDisplay_line2
    restore_value: no
    type: std::string  
    initial_value: ''
    
  - id: myDisplay_line3
    restore_value: no
    type: std::string  
    initial_value: ''
              
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO5   
    frequency: 12000 Hz       # Keeps frequency high to narrow the transistor's gate threshold
    channel: 0                
    min_power: 0.001          # MOVED HERE: Scales the hardware floor mapping
    max_power: 0.40           # MOVED HERE: Caps the hardware ceiling mapping
          
light:
  - platform: esp32_rmt_led_strip # neopixel
    id: indicator_led
    pin: ${pin_indicator_LED}
    chipset: WS2812
    num_leds: 1
    rgb_order: RGB
    name: "Sniffer Indicator"
    internal: true

  - platform: monochromatic  
    name: "Display Backlight"
    id: display_backlight
    output: backlight_pwm
    default_transition_length: 0.5s
    gamma_correct: 0          # Keeps response linear 
    restore_mode: ALWAYS_ON     
    internal: true

script:
  - id: flash_led_custom
    parameters:
      count: int         # Number of flashes
      dwell: int         # duration of flash in msec
      red: float         # Red value (0.0 to 1.0)
      green: float       # Green value (0.0 to 1.0)
      blue: float        # Blue value (0.0 to 1.0)
    mode: queued
    then:
      - repeat:
          count: !lambda "return count;"
          then:
            # --- TURN RGB LED ON WITH DYNAMIC COLOR ---
            - light.turn_on:
                id: indicator_led
                red: !lambda "return red;"
                green: !lambda "return green;"
                blue: !lambda "return blue;"
                brightness: 0.2
                transition_length: 0s
            - delay: !lambda "return dwell;"
            # --- TURN RGB LED OFF ---
            - light.turn_off:
                id: indicator_led
                transition_length: 0s
            - delay: !lambda "return dwell;"
            
                        
  - id: turn_led_on_custom
    parameters:
      red: float         # Red channel (0.0 to 1.0)
      green: float       # Green channel (0.0 to 1.0)
      blue: float        # Blue channel (0.0 to 1.0)
      brightness: float  # Brightness (0.0 to 1.0)
    mode: single
    then:
      - light.turn_on:
          id: indicator_led
          red: !lambda "return red;"
          green: !lambda "return green;"
          blue: !lambda "return blue;"
          brightness: !lambda "return brightness;"
          transition_length: 0s  
          
  - id: turn_led_off_custom
    mode: single
    then:
      - light.turn_off:
          id: indicator_led
          transition_length: 0s  

# ============ General Display Scripts =============
# --- myDisplay display 3 lines and auto dim display ---
  - id: display_show
    mode: restart 
    parameters:
      small_text: bool
      line1: std::string
      line2: std::string
      line3: std::string
   
    then:
      - lambda: |-
          id(myDisplay_line1) = line1; 
          id(myDisplay_line2) = line2;
          id(myDisplay_line3) = line3;
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 40s #how long display remains on
      - display.page.show: blank_page


# --- myDisplay modify a line and auto dim display ---
  - id: display_modify_a_line
    mode: restart 
    parameters:
      small_text: bool
      whichLine: int
      aline: std::string
   
    then:
      - lambda: |-
          switch (whichLine) {
            case 1:
              id(myDisplay_line1) = aline; 
              break;
            case 2:
              id(myDisplay_line2) = aline;
              break;
            case 3:
              id(myDisplay_line3) = aline;
              break;
            default:
              break;
          }
          
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 40s #how long display remains on
      - display.page.show: blank_page


# ========  Display Specific Implementation ========

font:
  - file: "gfonts://Roboto"
    id: my_fontSmall
    size: 25
  - file: "gfonts://Roboto"
    id: my_fontMedium
    size: 30
  - file: "gfonts://Roboto"
    id: my_fontLarge
    size: 35

    
spi:
  clk_pin: GPIO40
  mosi_pin: GPIO45
  miso_pin: GPIO46  # Required for the bus to compile properly
  id: lcd_spi_bus


# Master Display Component Configuration
display:
  - platform: mipi_spi
    id: myDisplay
    model: ST7789V
    spi_id: lcd_spi_bus

    cs_pin: GPIO42
    dc_pin: GPIO41
    reset_pin: GPIO39

    rotation: 270
    dimensions: 240X320
    invert_colors: true
    color_order: BGR    
    data_rate: 80MHz    
                    
    update_interval: 0.1s
 
    on_page_change:
      - then:
          - if:
              condition:
                lambda: 'return to == id(blank_page);'
              then:
                - light.turn_off:
                    id: display_backlight

              else:
                - light.turn_on:
                    id: display_backlight
                    brightness: 100%




    pages:
      - id: active_page_std
        lambda: |-
            auto L1color = Color(255, 100, 0);
            auto L2color = Color(255, 120, 0);
            auto L3color = Color(255, 150, 0);

            it.print(5, 30,  id(my_fontSmall), L1color, id(myDisplay_line1).c_str());
            it.print(5, 75,  id(my_fontSmall), L2color, id(myDisplay_line2).c_str());
            it.print(5, 115, id(my_fontLarge), L3color,  id(myDisplay_line3).c_str());

      - id: active_page_small
        lambda: |-
            auto L1color = Color(255, 130, 0);
            auto L2color = Color(255, 130, 0);
            auto L3color = Color(255, 130, 0);
            
            it.print(5, 30,  id(my_fontMedium), L1color, id(myDisplay_line1).c_str());
            it.print(5, 70,  id(my_fontMedium), L2color, id(myDisplay_line2).c_str());
            it.print(5, 110,  id(my_fontMedium),L3color, id(myDisplay_line3).c_str());

      - id: blank_page
        lambda: |-
          // Leaving lambda completely blank turns all pixels off safely

