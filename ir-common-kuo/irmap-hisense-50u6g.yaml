# hisense tv / projector
packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

remote_receiver:
  id: ir_receiver
  dump: nec
  on_sony: !remove
  on_lg: !remove
  on_jvc: !remove
  
substitutions:
  target_ir_address: "0xFB04"
  remote_display_name: "Hisense"
  
  # =============================================================
  # DEFINE token clearing gate buttons
  cmd_token_clear_arm: "0xEA15"    # 5
  cmd_token_clear_fire: "0xA55A"   # select

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t
      is_hold: bool
    then:
      - lambda: |-
          id(nec_broadcast_processor).execute(command, (uint16_t)(command >> 16), (uint16_t)(command & 0xFFFF), is_hold);

  - id: nec_broadcast_processor
    parameters:
      command: uint32_t     
      device_addr: uint16_t  
      pure_cmd: uint16_t     
      is_hold: bool       
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // Strict unique map to prevent compiler errors and map overwrites
          static const std::map<uint16_t, IRCommand> nec_codes = {
            { 0xFB04,       { "back",          id(back) } },           // back
            { 0xA857,       { "cursor_down",   id(cursor_down) } },    // arrow down
            { 0xA55A,       { "cursor_enter",  id(cursor_enter) } },   // select
            { 0xA758,       { "cursor_left",   id(cursor_left) } },    // arrow left
            { 0xA659,       { "cursor_right",  id(cursor_right) } },   // arrow right
            { 0xA956,       { "cursor_up",     id(cursor_up) } },      // arrow up
            { 0xE817,       { "focus_auto",    id(focus_auto) } },     // 7
            { 0xE718,       { "focus_manual",  id(focus_manual) } },   // 8
            { 0xBC43,       { "home",          id(home) } },           // home
            { 0xF40B,       { "input",         id(input) } },          // input
            { 0xB54A,       { "settings_menu", id(settings_menu) } },  // menu
            { 0x718E,       { "settings_menu_alt", id(settings_menu) } }, // menu (variant)
            { 0x35CA,       { "game_menu",     id(game_menu) } },      // apps
            { 0xF609,       { "mute",          id(mute) } },           // mute
            { 0xFF00,       { "picture",       id(picture) } },        // channel up
            { 0xF708,       { "power_on",      id(power_on) } },       // discrete power on
            { 0x8E71,       { "power_on_alt",  id(power_on) } },       // discrete power on (variant)
            { 0xEF10,       { "power_off_immediately", id(power_off_immediately) } }, // discrete power off
            { 0x8D72,       { "power_off_alt", id(power_off_immediately) } }, // 0
            { 0xAB54,       { "shortcut_1",    id(shortcut_1) } },     // yellow
            { 0xAA55,       { "shortcut_2",    id(shortcut_2) } },     // blue
            { 0xAD52,       { "shortcut_3",    id(shortcut_3) } },     // red
            { 0xAC53,       { "shortcut_4",    id(shortcut_4) } },     // green
            { 0xFC03,       { "volume_down",   id(volume_down) } },    // volume down
            { 0xFD02,       { "volume_up",     id(volume_up) } },      // volume up
            { 0xEB14,       { "token_sniff",   id(token_sniff) } },    // 4
            { 0xEA15,       { "token_clear",   id(token_clear) } },    // 5
            { 0xE916,       { "token_recall",  id(token_recall) } },   // 6
            { 0xB847,       { "BT_start_pair", id(bluetooth_pairing_start) } },  // prime video
            { 0xB649,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }   // youtube
          };

          auto it = nec_codes.find(pure_cmd);
          if (it != nec_codes.end()) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                id(myDisplay_line1) = it->second.name + " (Hold)";
                id(myDisplay_line2) = "${remote_display_name}"; 
                id(myDisplay_line3) = ""; 
                ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
              } else {
                id(myDisplay_line1) = it->second.name;
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
                ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
              }
            }

            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!id(global_token_clear_armed)) {
              if (!is_hold) {
                id(myDisplay_line1) = "Unassigned";
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
              }
            }
          }
