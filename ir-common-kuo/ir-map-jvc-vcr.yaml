
# Global variables to save the latest parsed IR data
globals:
  - id: last_xgimi_TN_command
    type: std::string  
    initial_value: '"IR to BLE Kuo"'

  - id: last_IR_address
    type: std::string  
    initial_value: '"JVC VCR to Xgimi"'
    
  - id: last_IR_instruction
    type: std::string  
    initial_value: '"READY"'


 # ======= KUO Begin remote_receiver =========
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us
  idle: 10ms
  tolerance: 25%
  dump: 
    - jvc
        
  on_jvc:
    then:
      - script.execute: display_timeout_handler
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          static const std::map<uint16_t, IRCommand> jvc_codes = {
            { 0xC2C3,       { "back",          id(back) } },
            { 0xC218,       { "cursor_down",   id(cursor_down) } },
            { 0xC261,       { "cursor_down",   id(cursor_down) } },
            { 0xC23C,       { "cursor_enter",  id(cursor_enter) } },
            { 0xC2A8,       { "cursor_left",   id(cursor_left) } },
            { 0xC228,       { "cursor_right",  id(cursor_right) } },
            { 0xC241,       { "cursor_up",     id(cursor_up) } },
            { 0xC298,       { "cursor_up",     id(cursor_up) } },
            { 0xC2E4,       { "focus_auto",    id(focus_auto) } },
            { 0xC214,       { "focus_manual",  id(focus_manual) } },
            { 0xC26C,       { "cancel",        id(home) } },
            { 0xC2C8,       { "input",         id(input) } },
            { 0xC2EC,       { "settings_menu", id(settings_menu) } },
            { 0xC207,       { "settings_menu", id(settings_menu) } },
            { 0xC230,       { "game_menu",     id(game_menu) } },
            { 0xC2B0,       { "mute",          id(mute) } },
            { 0xC260,       { "picture",       id(picture) } },
            { 0xC2D0,       { "power_on",      id(power_on) } },
            { 0xC2B8,       { "power_on",      id(power_on) } },
            { 0xC258,       { "power_off",     id(power_off_held) } },
            { 0xC2CC,       { "power_off",     id(power_off_held) } },
            { 0xC283,       { "shortcut_1",    id(shortcut_1) } },
            { 0xC2BC,       { "shortcut_2",    id(shortcut_2) } },
            { 0xC28C,       { "shortcut_3",    id(shortcut_3) } },
            { 0xC269,       { "shortcut_4",    id(shortcut_4) } },
            { 0xC293,       { "volume_down",   id(volume_down) } },
            { 0xC213,       { "volume_up",     id(volume_up) } },
            { 0xC284,       { "BT_start_pair", id(bluetooth_pairing_start) } },
            { 0xC244,       { "BT_clear_pair", id(bluetooth_pairing_clear) } },
          };

          std::stringstream ss1;
          // x.data provides the 16-bit jvc data command sequence
          ss1 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.data;
          std::string rc_code_1_str = ss1.str(); 
          
          std::stringstream ss2;
          ss2 << "JVC protocol";
          std::string rc_code_2_str = ss2.str(); 

          auto it = jvc_codes.find(x.data); 
            
          if (it != jvc_codes.end()) {
            id(last_xgimi_TN_command) = it->second.name; // remember xgimi command
              
            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press(); 
            } else {
              id(last_xgimi_TN_command) = "Unassigned";
            } // Fixed: Missing bracket closed here
          } else {
            id(last_xgimi_TN_command) = "Unassigned";
          }
          
          id(last_IR_address) = rc_code_2_str;
          id(last_IR_instruction) = rc_code_1_str;
# ======= KUO End remote_receiver ============
