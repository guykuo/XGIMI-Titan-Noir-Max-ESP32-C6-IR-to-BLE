# irmap-benq-w5800.yaml
# BenQ W5800 projector

packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

remote_receiver:
  id: ir_receiver
  dump: nec
  on_sony: !remove
  on_lg: !remove
  on_jvc: !remove

substitutions:
  target_ir_address: "0x3000"
  remote_display_name: "BenQ Proj"

  # =============================================================
  # DEFINE token clearing gate buttons
  cmd_token_clear_arm: "0x629D"    # BenQ: Play
  cmd_token_clear_fire: "0xEA15"   # BenQ: ENTER / OK

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t
      is_hold: bool
    then:
      - lambda: |-
          id(nec_broadcast_processor).execute(command, (uint16_t)(command >> 16), (uint16_t)(command & 0xFFFF), is_hold);

  - id: nec_broadcast_processor
    parameters:
      command: uint32_t     
      device_addr: uint16_t  
      pure_cmd: uint16_t     
      is_hold: bool       
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // Resolved duplicate mapping entries to prevent compiler warnings or key overwrites
          static const std::map<uint16_t, IRCommand> nec_codes = {
            { 0xB04F,       { "power_on",      id(power_on) } },              // power on
            { 0xB14E,       { "power_off",     id(power_off_immediately) } }, // power off
            { 0xF40B,       { "cursor_up",     id(cursor_up) } },      // up arrow
            { 0xF30C,       { "cursor_down",   id(cursor_down) } },    // down arrow
            { 0xF20D,       { "cursor_left",   id(cursor_left) } },    // left arrow
            { 0xF10E,       { "cursor_right",  id(cursor_right) } },   // right arrow
            { 0xEA15,       { "cursor_enter",  id(cursor_enter) } },   // ok
            { 0xF00F,       { "settings_menu", id(settings_menu) } },  // menu
            { 0x7A85,       { "back",          id(back) } },           // back
            { 0x8778,       { "home",          id(home) } },           // default
            { 0xEA15,       { "game_menu",     id(game_menu) } },      // guide
            { 0xFB04,       { "input",         id(input) } },          // source
            { 0xEF10,       { "picture",       id(picture) } },        // picure mode
            { 0xEC13,       { "focus_manual",  id(focus_manual) } },   // aspect
            { 0xF708,       { "focus_auto",    id(focus_auto) } },     // auto
            { 0xE916,       { "shortcut_1",    id(shortcut_1) } },     // brightness
            { 0xEE11,       { "shortcut_2",    id(shortcut_2) } },     // contrast
            { 0x837C,       { "shortcut_3",    id(shortcut_3) } },     // dynamic iris
            { 0xCF30,       { "shortcut_4",    id(shortcut_4) } },     // light mode
            { 0xA15E,       { "volume_up",     id(volume_up) } },      // gamma
            { 0x817E,       { "volume_down",   id(volume_down) } },    // sharp
            { 0xF807,       { "mute",          id(mute) } },           // eco blank
            { 0xF30C,       { "token_sniff",   id(token_sniff) } },    // info
            { 0x629D,       { "token_clear",   id(token_clear) } },    // invert
            { 0x639C,       { "token_recall",  id(token_recall) } },   // 3D
            { 0xA05F,       { "BT_start_pair", id(bluetooth_pairing_start) } },  // color temp
            { 0xA45B,       { "BT_clear_pair", id(bluetooth_pairing_clear) } },  // color manage
            
            { 0x41BE,       { "cinema master", id(home) } },           // cinema master
            { 0xC33C,       { "HDR",           id(home) } },           // HDR
            { 0x6B94,       { "test pattern",  id(home) } }            // test pattern            
            
          };

          auto it = nec_codes.find(pure_cmd);
          if (it != nec_codes.end()) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                id(myDisplay_line1) = it->second.name + " (Hold)";
                id(myDisplay_line2) = "${remote_display_name}"; 
                id(myDisplay_line3) = ""; 
                ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
              } else {
                id(myDisplay_line1) = it->second.name;
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
                ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
              }
            }

            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!id(global_token_clear_armed)) {
              if (!is_hold) {
                id(myDisplay_line1) = "Unassigned";
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
              }
            }
          }
