# Tivo Roamio

# ======= KUO Begin remote_receiver =========
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us
  idle: 10ms
  tolerance: 25%
  dump: 
    - nec
    - pioneer
    
  on_nec:
      then:
        - script.execute: display_timeout_handler
        - lambda: |-
            struct IRCommand {
              std::string name;
              esphome::template_::TemplateButton* button_obj;
            };
 
            static const std::map<uint16_t, IRCommand> nec_codes = {
              { 0xB044,       { "back",          id(back) } },            // zoom
              { 0xE016,       { "cursor_down",   id(cursor_down) } },     // arrow down
              { 0xE019,       { "cursor_enter",  id(cursor_enter) } },    // select
              { 0xE017,       { "cursor_left",   id(cursor_left) } },     // arrow left
              { 0xE015,       { "cursor_right",  id(cursor_right) } },    // arrow right
              { 0xE014,       { "cursor_up",     id(cursor_up) } },       // arrow up
              { 0xD02E,       { "focus_auto",    id(focus_auto) } },      // 7
              { 0xD02F,       { "focus_manual",  id(focus_manual) } },    // 8
              { 0xE01E,       { "home",          id(home) } },            // channel up
              { 0xC034,       { "input",         id(input) } },           // input
              { 0xF00C,       { "settings_menu", id(settings_menu) } },   // tivo
              { 0xF00D,       { "settings_menu", id(settings_menu) } },   // tivo (myHarmony version)
              { 0xC036,       { "game_menu",     id(game_menu) } },       // guide
              { 0xE01B,       { "mute",          id(mute) } },            // mute
              { 0xE013,       { "picture",       id(picture) } },         // into
              { 0xE010,       { "power_on",      id(power_on) } },                          // tv power (as discrete on)
              // { 0xE01A,       { "power_on_counter",   id(power_on_counter) } },          // (reserved for debug)
              { 0xE011,       { "power_off_immediately", id(power_off_immediately) } }, // live TV (as discrete off)
              { 0xC031,       { "power_off",     id(power_off) } },       // 0 
              { 0x9060,       { "shortcut_1",    id(shortcut_1) } },      // A yellow
              { 0x9061,       { "shortcut_2",    id(shortcut_2) } },      // B blue
              { 0x9062,       { "shortcut_3",    id(shortcut_3) } },      // C red
              { 0x9063,       { "shortcut_4",    id(shortcut_4) } },      // D green
              { 0xE01D,       { "volume_down",   id(volume_down) } },     // volume down
              { 0xE01C,       { "volume_up",     id(volume_up) } },       // volume up
              { 0xD02B,       { "token_sniff",   id(token_sniff) } },     // 4
              { 0xD02C,       { "token_clear",   id(token_clear) } },     // 5
              { 0xD02D,       { "token_recall",  id(token_recall) } },    // 6
              { 0xC033,       { "BT_start_pair", id(bluetooth_pairing_start) } },    //enter
              { 0xC032,       { "BT_clear_pair", id(bluetooth_pairing_clear) } },    //clear
            };
            
            static uint32_t last_global_ir_time = 0;
            uint32_t now = millis();
            
            // Drop hardware bouncing clone signals from trailing IR packet streams
            if (now - last_global_ir_time < 250) {
              return;
            }

            std::stringstream ss1;
            ss1 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.command;
            std::string rc_code_1_str = ss1.str(); 
            
            std::stringstream ss2;
            ss2 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.address;
            std::string rc_code_2_str = ss2.str(); 
            
            id(OLED_line2) = rc_code_2_str; 
            id(OLED_line3) = rc_code_1_str; 
            
            if (x.address == 0x3085) {
              id(OLED_line2) = "TiVo"; 
              
              auto it = nec_codes.find(x.command); 
              
              if (it != nec_codes.end()) {
                last_global_ir_time = now; 
                
                id(OLED_line1) = it->second.name; 
                ESP_LOGD("IR Translated", "IR ---> : %s", it->second.name.c_str());
            
                if (it->second.button_obj != nullptr) {
                  it->second.button_obj->press(); 
                }
              } else {
                id(OLED_line1) = "Unassigned"; 
              }
            } else {
              id(OLED_line1) = "Not TiVo IR"; 
            }
            
# ======= KUO End remote_receiver ============
