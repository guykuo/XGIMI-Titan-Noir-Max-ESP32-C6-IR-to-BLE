# M5stack S3 Atom Lite (Avalones supplied)

# Better choice than pico version due to larger RAM space.
#
# Practical choice if user completely unable to solder. Plug in M5stack IR Unit IR and OLED display without need
# for any soldering. Not cheapest solution, but works for those without soldering skills.
#
# Flashing process for this board often includes harmless error messags about chip connection or clock speed.
# Usually reduces serial flash speed, but not harmful to usability
# 
# Modest heap availability but able to upload/download macros and profiles.
#

# ============= BEGIN Configuration Options KUO ==========

  # M5stack IR Unit IR SKU:U002 has IR receiver and emitter compatible with end HY2.0-4P connector of Atom Lite
  # If using other IR sensor, beware that HY2.0-4P connector Vcc is 5 volts. Connector J4 supplies safer 3 volt Vcc.

substitutions:
  pin_ir_receiver: GPIO1       # header pad G5 - external IR receiver output
  pin_indicator_LED: GPIO35    # onboard WS2812B RGB LED
  pin_action_btn: GPIO41       # onboard user button (active low)
  pin_action_btn_pullup: true  # internal pull-up (harmless with board pull-up)
  wifi_tx_power: "15dB"

  # == Uncomment one line for display model
  i2c_display_model: "SSD1306 128x32" # 0.91 inch SSD1306 128x32 i2c OLED display
  #i2c_display_model: "SSD1306 128x64" # 0.96 inch SSD1306 128x64 i2c OLED display
  
# Core Architecture Declaration

esp32:
  board: m5stack-atoms3
  variant: esp32s3 # variant needed to keep compiler tuned for the S3 chip core
  framework:
    type: esp-idf

# Optional OLED display plugs directly into 4 pin J2 Grove Connector
# Must set -display model (earlier in this file) to match screen used.  

# display sda to GPIO39
# display scl to GPIO38
# display Vcc to 5V
# display GND to GND

i2c: 
  sda: GPIO39
  scl: GPIO38
  frequency: 400kHz
  scan: false # to prevent startup crashes during boot scans
  id: bus_a

# ============= END Configuration Options KUO ==========

     
globals:
    # ======= myDisplay display globals
  - id: myDisplay_line1
    type: std::string  
    restore_value: no
    initial_value: ''

  - id: myDisplay_line2
    restore_value: no
    type: std::string  
    initial_value: ''
    
  - id: myDisplay_line3
    restore_value: no
    type: std::string  
    initial_value: ''
              
light:
  - platform: esp32_rmt_led_strip # neopixel
    id: indicator_led
    pin: ${pin_indicator_LED}
    chipset: WS2812
    num_leds: 1
    rgb_order: RGB
    name: "Sniffer Indicator"
    internal: true

script:
  - id: flash_led_custom
    parameters:
      count: int         # Number of flashes
      dwell: int         # duration of flash in msec
      red: float         # Red value (0.0 to 1.0)
      green: float       # Green value (0.0 to 1.0)
      blue: float        # Blue value (0.0 to 1.0)
    mode: queued
    then:
      - repeat:
          count: !lambda "return count;"
          then:
            # --- TURN RGB LED ON WITH DYNAMIC COLOR ---
            - light.turn_on:
                id: indicator_led
                red: !lambda "return red;"
                green: !lambda "return green;"
                blue: !lambda "return blue;"
                brightness: 0.2
                transition_length: 0s
            - delay: !lambda "return dwell;"

            # --- TURN RGB LED OFF ---
            - light.turn_off:
                id: indicator_led
                transition_length: 0s
            - delay: !lambda "return dwell;"
            
  - id: turn_led_on_custom
    parameters:
      red: float         # Red channel (0.0 to 1.0)
      green: float       # Green channel (0.0 to 1.0)
      blue: float        # Blue channel (0.0 to 1.0)
      brightness: float  # Brightness (0.0 to 1.0)
    mode: single
    then:
      - light.turn_on:
          id: indicator_led
          red: !lambda "return red;"
          green: !lambda "return green;"
          blue: !lambda "return blue;"
          brightness: !lambda "return brightness;"
          transition_length: 0s  
          
  - id: turn_led_off_custom
    mode: single
    then:
      - light.turn_off:
          id: indicator_led
          transition_length: 0s  


# ============ General Display Scripts =============
# --- myDisplay display 3 lines and auto dim display ---
  - id: display_show
    mode: restart 
    parameters:
      small_text: bool
      line1: std::string
      line2: std::string
      line3: std::string
   
    then:
      - lambda: |-
          id(myDisplay_line1) = line1; 
          id(myDisplay_line2) = line2;
          id(myDisplay_line3) = line3;
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 40s #how long display remains on
      - display.page.show: blank_page



# --- myDisplay modify a line and auto dim display ---
  - id: display_modify_a_line
    mode: restart 
    parameters:
      small_text: bool
      whichLine: int
      aline: std::string
   
    then:
      - lambda: |-
          switch (whichLine) {
            case 1:
              id(myDisplay_line1) = aline; 
              break;
            case 2:
              id(myDisplay_line2) = aline;
              break;
            case 3:
              id(myDisplay_line3) = aline;
              break;
            default:
              break;
          }
          
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 40s #how long display remains on
      - display.page.show: blank_page


# ========  Display Specific Implementation ========

font:
  - file: "gfonts://Roboto"
    id: my_fontSmall
    size: 9
    
  - file: "gfonts://Roboto"
    id: my_fontMedium
    size: 10

  - file: "gfonts://Roboto"
    id: my_fontLarge
    size: 11

    
# External OLED screen
display:
  - platform: ssd1306_i2c
    model: ${i2c_display_model}
    address: 0x3C
    id: myDisplay
    offset_x: 0
    offset_y: 0
    rotation: 0
    update_interval: 0.1s

    pages:
      - id: active_page_std
        lambda: |-
          int screen_h = it.get_height();
          int Y1 = 0; 
          int Y2 = screen_h * 9 / 32;
          int Y3 = screen_h * 20 / 32;

          it.print(0, Y1,  id(my_fontMedium), id(myDisplay_line1).c_str());
          it.print(0, Y2, id(my_fontLarge), id(myDisplay_line2).c_str());
          it.print(0, Y3, id(my_fontLarge), id(myDisplay_line3).c_str());

      - id: active_page_small
        lambda: |-
          int screen_h = it.get_height();
          int Y1 = 0; 
          int Y2 = screen_h * 10 / 32;
          int Y3 = screen_h * 20 / 32;
          
          it.print(0, Y1,  id(my_fontSmall), id(myDisplay_line1).c_str());
          it.print(0, Y2, id(my_fontSmall), id(myDisplay_line2).c_str());
          it.print(0, Y3, id(my_fontSmall), id(myDisplay_line3).c_str());

      - id: blank_page
        lambda: |-
          // Leaving lambda completely blank turns all pixels off safely
