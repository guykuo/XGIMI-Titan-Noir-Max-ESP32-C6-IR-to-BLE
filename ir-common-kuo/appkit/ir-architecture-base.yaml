# ir-common-kuo/ir-architecture-base.yaml
  
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us       
  idle: 20ms         
  tolerance: 35%     
  #dump: [raw]           # Baseline configuration placeholder
    
  # 1. Updates timestamp every single time ANY raw IR pulse or repeat packet burst hits the pin
  on_raw:
    - lambda: |-
        id(global_last_raw_packet_time) = millis();
        if (!id(ir_timeout_watcher).is_running()) {
          id(ir_timeout_watcher).execute();
        }

  # ======= MULTI-PROTOCOL INTERCEPT CORE GATES =======

  # 2. NEC Handler
  on_nec:
    - lambda: |-
        // set up common format address, command, command_repeats
        std::string wrong_addressStr = "NEC Prot Addr Different";
        
        uint16_t ir_address = x.address;
        uint16_t ir_command = x.command;
        uint16_t ir_command_repeats = x.command_repeats;

        ESP_LOGD("main", "NEC Address:-- 0x%02X --, Command:---- 0x%02X ----", ir_address, ir_command);
        
        id(general_IR_received_handler)->execute(wrong_addressStr, ir_address, ir_command, ir_command_repeats);
        

  # 3. LG Handler
  on_lg:
    - lambda: |-
        // set up common format address, command, command_repeats, etc
        std::string wrong_addressStr = "LG Prot Addr Different";
        
        uint16_t ir_address = (x.data >> 16) & 0xFFF;
        uint16_t ir_command = x.data & 0xFFFF;
        uint16_t ir_command_repeats = 0; // LG protocol does not have have command_repeats 

        ESP_LOGD("main", "LG Address:-- 0x%02X --, Command:---- 0x%02X ----", ir_address, ir_command);

        id(general_IR_received_handler)->execute(wrong_addressStr, ir_address, ir_command, ir_command_repeats);

  # 4. JVC Handler
  on_jvc:
    - lambda: |-
        // set up common format address, command, command_repeats, etc
        std::string wrong_addressStr = "JVC Prot Addr Different";
        
        uint16_t ir_address = (x.data >> 8) & 0xFF;
        uint16_t ir_command = x.data & 0xFF;
        uint16_t ir_command_repeats = 0; // JVC protocol does not have have command_repeats 

        ESP_LOGD("main", "JVC Address:-- 0x%02X --, Command:---- 0x%02X ----", ir_address, ir_command);

        id(general_IR_received_handler)->execute(wrong_addressStr, ir_address, ir_command, ir_command_repeats);

  # 5. Sony Handler
  on_sony:
    # Sony is handled differently because it does not have a true, separate per device address
    # Instead, Sony has a single long code of variable length. The entirety of which must be tested against.
    - lambda: |-
        // set up common format address, command, command_repeats
        std::string wrong_addressStr = "Sony Prot Addr Different"; 
        
        uint16_t ir_address = 0; // Sony does not have separate address. In Sony IRmaps we also set target_address to zero so it ALWAYS matches.
        uint16_t ir_command = x.data;
        uint16_t ir_command_repeats = 0; // Sony does not have command_repeats

        ESP_LOGD("main", "Sony Command:---- 0x%04X ----", ir_command);

        id(general_IR_received_handler)->execute(wrong_addressStr, ir_address, ir_command, ir_command_repeats);
      

globals:
  - id: global_cached_command
    type: uint32_t
    initial_value: '0'
  - id: global_last_raw_packet_time
    type: uint32_t
    initial_value: '0'
  - id: global_initial_press_time
    type: uint32_t
    initial_value: '0'
  - id: global_last_processed_time
    type: uint32_t
    initial_value: '0'
  - id: global_sony_stream_time
    type: uint32_t
    initial_value: '0'
  - id: global_sony_frame_count
    type: int
    initial_value: '0'
  - id: global_is_holding
    type: bool
    initial_value: 'false'
  # SEQUENTIAL ENGINE STATE VARIABLES
  - id: global_token_clear_armed
    type: bool
    initial_value: 'false'
  - id: debounce_safety_lock
    type: bool
    initial_value: 'false'
  - id: global_intercept_active
    type: bool
    initial_value: 'false'
  - id: last_ir_press #time data for debouncing.
    type: uint32_t
    initial_value: '0'
  - id: commandName # used to pass name of command back from IRmap
    type: std::string
    restore_value: no
    initial_value: ''


script:
  // handle ir button presses for all protocols after IR data converted to common format address, command, command_repeats
  - id: general_IR_received_handler
    parameters:
      wrong_addressStr: std::string
      ir_address: uint16_t
      ir_command: uint16_t
      ir_command_repeats: uint16_t
    then:
      - lambda: |-
          uint32_t target_address = ${target_ir_address};
          uint32_t arm_code = ${cmd_token_clear_arm};
          uint32_t fire_code = ${cmd_token_clear_fire};

          uint32_t now = millis();
          if (now - id(last_ir_press) < 30) return;
          id(last_ir_press) = now;

          // Handle token clear arming, and trigger first
          
          if (ir_address == target_address) {
            if (ir_command == arm_code) {
              id(global_token_clear_armed) = true;
              id(token_clear_safety_timeout).execute();
              
              id(display_show)->execute(false,
                                       "Token Clear Requested",
                                       "To Confirm",
                                       "Press Select");
              return; // STOP FLOW Armed to await fire_code
              
            }
            if (ir_command == fire_code && id(global_token_clear_armed)) {
              id(global_token_clear_armed) = false;
              id(token_clear_safety_timeout).stop();
              id(token_clear)->press(); // clears token and reports on myDisplay
              return; // STOP FLOW Fire_code received. Token cleared.
              
            }
            if (ir_command != fire_code && ir_command != arm_code && id(global_token_clear_armed)) {
              id(global_token_clear_armed) = false;
              id(token_clear_safety_timeout).stop();
    
              id(display_show)->execute(false,
                                       "Not Confirmed",
                                       "Wrong Key",
                                       "Canceled");
              return; // STOP FLOW Unexpected non-fire code arrived. Cancel arming
              
            }
          }  
  
          // --- Normal Fallthrough Path ---
  
          std::stringstream commandStrStream, addressStrStream; 
          commandStrStream << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << ir_command;
          addressStrStream << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << ir_address;
                  
          // Extract raw hex strings first
          std::string commandStr = commandStrStream.str();
          std::string addressStr = addressStrStream.str();
                  
          if (ir_address != ${target_ir_address}) {
            // does not match target device adddress
            id(display_show)->execute(false,
                           wrong_addressStr,
                           addressStr,
                           commandStr);
            
            id(global_cached_command) = 0;
            id(global_is_holding) = false;
            return; // STOP FLOW
  
          } else { 
            // matches device address. Change addressStr to human readable name
            addressStr = "${remote_display_name}"; 
  
            if (id(global_cached_command) != ir_command || id(global_initial_press_time) == 0) {
              id(global_cached_command) = ir_command;
              id(global_initial_press_time) = now; 
              id(global_last_processed_time) = now;
              id(global_is_holding) = false;      
              id(master_ir_processor).execute(ir_command, false);
              
            } else if (now - id(global_last_processed_time) > 130) {
              id(global_initial_press_time) = now; 
              id(global_last_processed_time) = now;
              id(global_is_holding) = true;      
              id(master_ir_processor).execute(ir_command, true);
            }
          }
          
          // Usually display of commandName, addressStr, and commandStr
          // However, if during processing the command, special info became displayed, showing_special_info indicates
          // we should not immediately overwrite special info. However, start a timer to clear showing_special_info state.

          if (id(showing_special_info) == true) {
            ESP_LOGD("Info Show", "Showing special info. Timer started.");
            id(showing_special_expiration_timer).execute();
          
          } else {
            // do usual showing of info. commandName is global in which IRmap leaves human readable name of successfully mapped command.
            id(display_show)->execute(false,
                                         id(commandName),
                                         addressStr,
                                         commandStr);
          }       
      
  
  #----------------------------------------
  # High Speed Timeout Watcher Register Cleanup
  - id: ir_timeout_watcher
    mode: restart
    then:
      - while:
          condition:
            lambda: |-
               return (millis() - id(global_last_raw_packet_time) < 200);
          then:
            - delay: 15ms
      - lambda: |-
          id(global_cached_command) = 0;
          id(global_initial_press_time) = 0;  
          id(global_sony_stream_time) = 0;
          id(global_is_holding) = false;
          id(global_sony_frame_count) = 0;

  # Automatic hardware lock release timer step
  - id: release_debounce_lock
    then:
      - delay: 110ms
      - globals.set:
          id: debounce_safety_lock
          value: 'false'

  # Automated 5-Second Expiration Timer
  - id: token_clear_safety_timeout
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(global_token_clear_armed);'
          then:
            - globals.set:
                id: global_token_clear_armed
                value: 'false'
            - lambda: |-
                ESP_LOGI("IR Safety", "Sequence timed out. Gate locked.");
                id(myDisplay_line1) = "Timed Out";
                id(myDisplay_line2) = "Clear Token";
                id(myDisplay_line3) = "Canceled";


  # Showing special info expiration timer
  - id: showing_special_expiration_timer
    mode: restart
    then:
      - delay: 2s // how long without another IR button press before special display times out.
      - lambda: |-
                ESP_LOGD("Info Show", "Showing special info timed out.");
                id(showing_special_info) = false;


interval: # implement repeat of IR button held down
  - interval: 80ms # must be sooner than limit time
    then:
      - lambda: |-
          uint32_t now = millis();
          
          if (id(global_cached_command) != 0) {
            uint32_t command = id(global_cached_command);

            if (now - id(global_last_raw_packet_time) >= 100) return; // rate faster with lower limit time here

            if (id(global_is_holding)) {
              id(master_ir_processor).execute(id(global_cached_command), true);
            } else {
              if (now - id(global_initial_press_time) >= 300) { // required time held before hold takes effect
                id(global_is_holding) = true;
                id(master_ir_processor).execute(id(global_cached_command), true);
              }
            }
          }

