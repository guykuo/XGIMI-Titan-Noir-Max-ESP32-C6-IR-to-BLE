# ir-common-kuo/ir-hub.yaml

#====================================================================
#=========================== IR Receiver ============================  
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us       
  idle: 10ms         
  tolerance: 35%     
  # dump:
  #   - raw
  #   - nec
  #   - jvc
  #   - sony
  #   - lg
  #   - panasonic
  #   - rc5
  #   - rc6
    
  # 1. Updates timestamp every single time ANY raw IR pulse or repeat packet burst hits the pin    
  on_raw:
    - lambda: |-
        id(global_last_raw_packet_time) = millis();

    - lambda: |-
        // 1. FAST BOUNDARY GUARD: Escape instantly if pulse stream array contains insufficient metrics
        size_t total_pulses = x.size();
        if (total_pulses < 2) return;

        // Re-added the explicit explicit array index brackets to satisfy the compiler and YAML parser
        uint32_t head_mark = x[0];
        
        // OPTIMIZED: Bitwise/conditional inversion instead of triggering math standard library std::abs()
        uint32_t head_space = (x[1] < 0) ? -x[1] : x[1];

        uint8_t proto = PROTO_UNKNOWN;

        // --- 1. MANCHESTER / SHORT-HEADER PROTOCOLS (RC5 & RC6) ---
        if (head_mark >= 700 && head_mark <= 1100 && total_pulses >= 18 && total_pulses <= 30) {
          proto = PROTO_RC5;
        }
        else if (head_mark >= 2400 && head_mark <= 2900 && head_space >= 700 && head_space <= 1100) {
          if (total_pulses >= 34 && total_pulses <= 46) {
            proto = PROTO_RC6;
          }
        }

        // --- 2. STANDARD SPACE/DISTANCE PROTOCOLS ---
        if (proto == PROTO_UNKNOWN) {
          // JVC Test: 8.4ms Mark / 4.2ms Space
          if (head_mark >= 7600 && head_mark < 8800 && head_space >= 3800 && head_space <= 4600) {
            proto = PROTO_JVC;
          }
          // SONY Test: Header pulse 2.4ms, short space < 900us, max 42 pulses
          else if (head_mark >= 2100 && head_mark <= 2700 && head_space < 900 && total_pulses <= 42) {
            proto = PROTO_SONY;
          }
          // PANASONIC Test: Header 3.4ms, space 1.7ms
          else if (head_mark >= 3100 && head_mark <= 3700 && head_space >= 1400 && head_space <= 2000) {
            proto = PROTO_PANASONIC;
          }
          // LG Test: Symmetric 4.5ms Mark / 4.5ms Space
          else if (head_mark >= 4000 && head_mark <= 4000 && head_space >= 4000 && head_space <= 4000) {
            proto = PROTO_LG;
          }
          // NEC / TViX Test: 9.0ms Mark
          else if (head_mark >= 8400 && head_mark <= 9400) {
            proto = PROTO_NEC;
          }
        }
        
        // --- 3. FALLBACK SANITY CHECK (For Headerless Repeat Packets) ---
        if (proto == PROTO_UNKNOWN) {
          if (total_pulses == 34 && head_mark >= 400 && head_mark <= 600 && head_space >= 1400 && head_space <= 1800) {
            proto = PROTO_JVC;
          }
          else if (total_pulses >= 24 && total_pulses <= 42 && head_space < 1000) {
            proto = PROTO_SONY;
          } 
          else if (total_pulses >= 64 && total_pulses <= 68) { proto = PROTO_NEC; }
          else if (total_pulses >= 96 && total_pulses <= 102) { proto = PROTO_PANASONIC; }
        }

        id(learn_detected_protocol) = proto;
        
        ESP_LOGD("IR_RECOGNIZER", "Detected Protocol: %s (Mark: %uus, Space: %uus, Pulses: %u)", 
         to_string(proto), (unsigned int)head_mark, (unsigned int)head_space, total_pulses);

        // ============================================================
        // UNIVERSAL PROTOCOL REPEAT INJECTION LAYER
        // ============================================================
        if (id(global_cached_command) != 0) {
          uint8_t allowed = id(ir_receiver_allowed_protocol);
          
          // A: NEC / LG Repeat Detection (4 pulses, massive header mark)
          if (total_pulses == 4 && head_mark >= 8400 && head_mark <= 9400) {
            if (allowed == PROTO_NEC || allowed == PROTO_LG || allowed == 255) {
              std::string p_str = (allowed == PROTO_LG) ? "LG" : "NEC";
              id(general_IR_received_handler)->execute(p_str, id(learn_active_address), id(learned_best_command), 1);
            }
          }
          // B: JVC Repeat Detection (Continuous 34-pulse sub-streams stripped of structural headers)
          else if (total_pulses == 34 && (allowed == PROTO_JVC || allowed == 255)) {
            id(general_IR_received_handler)->execute("JVC", id(learn_active_address), id(learned_best_command), 1);
          }
          // C: Panasonic Repeat Detection (Continuous 96 to 102-pulse arrays containing continuous hold metrics)
          else if (total_pulses >= 96 && total_pulses <= 102 && (allowed == PROTO_PANASONIC || allowed == 255)) {
            id(general_IR_received_handler)->execute("PANASONIC", id(learn_active_address), id(learned_best_command), 1);
          }
        }



  #====================================================================
  #=======           MULTI-PROTOCOL CONVERSION GATES            =======
  #====================================================================

  on_nec:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_NEC || id(ir_receiver_allowed_protocol) == 255) {
          std::string ir_protocolStr = "NEC";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = x.command_repeats;
  
          ESP_LOGD("main", "NEC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
          
          // CRITICAL: Cache these variables so our repeat runner can use them when data-less repeats hit
          id(learn_active_address) = ir_address;
          id(learned_best_command) = ir_command;

          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }

  on_jvc:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_JVC || id(ir_receiver_allowed_protocol) == 255) {
          std::string ir_protocolStr = "JVC";
          uint32_t ir_address = (x.data >> 8) & 0xFF;
          uint32_t ir_command = x.data & 0xFF;
          uint16_t ir_command_repeats = 0; 
  
          // Cache current fields for structural hold injections
          id(learn_active_address) = ir_address;
          id(learned_best_command) = ir_command;

          ESP_LOGD("main", "JVC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }

  on_sony:
    # Sony is handled differently because it does not have a true, separate per device address
    # Instead, Sony has a single long code of variable length. The entirety of which must be tested against.
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_SONY || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "SONY"; 
          
          uint32_t ir_address = 0; // Sony does not have separate address. In Sony IRmaps we set target_address to zero.
          uint32_t ir_command = x.data;
          
          // Use local comparison instead of non-existent x.command_repeats property.
          // If the incoming command matches our live running cache register, force it into repeat execution mode.
          uint16_t ir_command_repeats = (id(global_cached_command) == ir_command) ? 1 : 0;
  
          // Hydrate tracking cache registers cleanly
          id(learn_active_address) = ir_address;
          id(learned_best_command) = ir_command;

          ESP_LOGD("main", "Sony Command:---- 0x%04X ----", (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }
      
  on_lg:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_LG || id(ir_receiver_allowed_protocol) == 255) {
          std::string ir_protocolStr = "LG";
          uint32_t ir_address = (x.data >> 16) & 0xFFFF; 
          uint32_t ir_command = x.data & 0xFFFF; 
          uint16_t ir_command_repeats = 0; 
  
          id(learn_active_address) = ir_address;
          id(learned_best_command) = ir_command;

          ESP_LOGD("main", "LG Command:---- 0x%04X ----", (unsigned int)ir_command);
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }

  on_panasonic:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_PANASONIC || id(ir_receiver_allowed_protocol) == 255) {
          std::string ir_protocolStr = "PANASONIC";
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = 0; 
  
          id(learn_active_address) = ir_address;
          id(learned_best_command) = ir_command;

          ESP_LOGD("main", "PANASONIC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }


  on_rc5:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_RC5 || id(ir_receiver_allowed_protocol) == 255) {
          std::string ir_protocolStr = "RC5";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          
          // RC5 sends full frames repeatedly during a hold.
          // If it matches our live running cache register, force it into repeat execution mode.
          uint16_t ir_command_repeats = (id(global_cached_command) == ir_command) ? 1 : 0;
  
          // Hydrate the global tracking cache cleanly
          id(learn_active_address) = ir_address;
          id(learned_best_command) = ir_command;

          ESP_LOGD("main", "RC5 Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }

  on_rc6:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_RC6 || id(ir_receiver_allowed_protocol) == 255) {
          std::string ir_protocolStr = "RC6";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          
          // RC6 sends full frames repeatedly during a hold.
          // If it matches our live running cache register, force it into repeat execution mode.
          uint16_t ir_command_repeats = (id(global_cached_command) == ir_command) ? 1 : 0;
  
          // Hydrate the global tracking cache cleanly
          id(learn_active_address) = ir_address;
          id(learned_best_command) = ir_command;

          ESP_LOGD("main", "RC6 Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }





globals:
  - id: profile_has_been_stored
    type: int
    initial_value: '0'
    restore_value: yes
    
  - id: active_remote_layout
    type: int
    initial_value: ${def_profile}
    restore_value: yes

  - id: ir_receiver_allowed_protocol 
    type: uint8_t
    restore_value: no
    initial_value: '0' 
    
  - id: ir_receiver_mode
    # 0 IR_MODE_DEACTIVATED (no active profile found)
    # 1 IR_MODE_ACTION
    # 2 IR_MODE_SET_PROFILE
    # 3 IR_MODE_LEARN
    type: uint32_t
    restore_value: no
    initial_value: "IR_MODE_DEACTIVATED" # Starts safe to avoid errant boot noise panics
    
  - id: global_cached_command
    type: uint32_t
    initial_value: '0'
  - id: global_last_raw_packet_time
    type: uint32_t
    initial_value: '0'
  - id: global_initial_press_time
    type: uint32_t
    initial_value: '0'
  - id: global_last_processed_time
    type: uint32_t
    initial_value: '0'
  - id: global_sony_stream_time
    type: uint32_t
    initial_value: '0'
  - id: global_sony_frame_count
    type: int
    initial_value: '0'
  - id: global_is_holding
    type: bool
    initial_value: 'false'
    
  # SEQUENTIAL ENGINE STATE VARIABLES
  - id: global_token_clear_armed
    type: bool
    initial_value: 'false'
  - id: debounce_safety_lock
    type: bool
    initial_value: 'false'
  - id: global_intercept_active
    type: bool
    initial_value: 'false'
  - id: last_ir_press
    type: uint32_t
    initial_value: '0'
  - id: global_long_hold_handled
    type: bool
    initial_value: 'false'

  
  # Macro State Machine Variables
  - id: macro_workflow_state
    type: int
    initial_value: 'MACRO_STATE_IDLE' # MACRO_STATE_IDLE, MACRO_STATE_RECORDING, MACRO_STATE_AWAITING_HOTKEY, MACRO_STATE_LIFTOFF_SHIELD
  - id: macro_assigned_shared_slot
    type: int
    initial_value: '0'
  - id: macro_recording_active
    type: bool
    initial_value: 'false'
  - id: macro_playback_active
    type: bool
    initial_value: 'false'
  - id: macro_step_counter
    type: int
    initial_value: '0'
  - id: macro_last_event_time
    type: uint32_t
    initial_value: '0'
  - id: macro_assignment_cooldown
    type: uint32_t
    initial_value: '0'
  - id: macro_play_prefix_active
    type: bool
    initial_value: 'false'

  - id: action_string 
    type: std::string
    restore_value: no
    initial_value: '"                                "'  #spaces in initial_value are intentional
    
  # Remote profile learning globals. 
  - id: ir_window_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: learned_best_command
    type: uint32_t
    restore_value: no
    initial_value: '0'
        
  - id: learn_sniff_start_time
    type: uint32_t
    initial_value: '0'
    restore_value: no

  - id: learn_last_save_time # used to avoid repeated button during IR learning.
    type: uint32_t
    initial_value: '0'
    restore_value: no
        
  - id: learn_active_protocol
    type: uint8_t
    initial_value: '0' # Default to PROTO_UNKNOWN
    restore_value: no
    
  - id: learn_active_address
    type: uint32_t
    initial_value: '0'
    restore_value: no

  - id: learn_detected_protocol
    type: uint8_t
    initial_value: '0' # Default to PROTO_UNKNOWN
    restore_value: no
    
  - id: learn_cache_protocol
    type: std::array<uint8_t, 40>
    initial_value: '{0}' # Flattens array initialization cleanly for compiler tracks
    restore_value: no

  - id: learn_cache_address
    type: std::array<uint32_t, 40>
    initial_value: '{0, 0}'
    restore_value: no    

  - id: learn_cache_command
    type: std::array<uint32_t, 40>
    initial_value: '{0, 0}'
    restore_value: no
        
  - id: learn_cache_idx   
    type: int
    initial_value: '-1'
    restore_value: no   

  - id: session_captured_codes # command codes are stored here during learning
    type: std::array<uint32_t, 40> # Expanded from 32 to 40 to safely accommodate extra custom buttons
    initial_value: '{0}'
    restore_value: no
    
  - id: learn_current_button_idx
    type: int
    initial_value: '0'
    restore_value: no


# ====================================================================
#                   
script:

  # ====================================================================
  # Centralized Projector Macro Session Status Indicators
  # ====================================================================
  - id: macro_indicator_start
    mode: restart
    then:
      - lambda: |-
          // 🛠️ FIXED: Arrow pointer notation used for cross-compiled hardware execution script paths
          id(turn_led_on_custom)->execute(0.3f, 1.0f, 0.2f, 0.8f); 
          
          ESP_LOGI("MACRO_INDICATOR", "Projector notification: Session opened.");
          fire_bluetooth_hid_action("volume_up", KEY_EVENT_DOWN);
          vTaskDelay(pdMS_TO_TICKS(50));
          fire_bluetooth_hid_action("volume_up", KEY_EVENT_UP);

  - id: macro_indicator_end
    mode: restart
    then:
      - lambda: |-
          // 🛠️ FIXED: Arrow pointer notation used cleanly for execution pathing
          id(turn_led_on_custom)->stop();
          id(turn_led_off_custom)->execute();
      
          ESP_LOGI("MACRO_INDICATOR", "Projector notification: Session finalized/aborted.");
          fire_bluetooth_hid_action("volume_down", KEY_EVENT_DOWN);
          vTaskDelay(pdMS_TO_TICKS(50));
          fire_bluetooth_hid_action("volume_down", KEY_EVENT_UP);

# # ====================================================================
  # Hydrate Binding Registry Map from Flash Storage Slots during System Boot
  # ====================================================================
  - id: hydrate_macro_bindings_from_flash
    mode: single
    then: 
      - lambda: !lambda |-
          uint64_t binding_nvs_key = 3104711294ULL;
          auto pref_obj = esphome::global_preferences->make_preference<UniversalBindingRegistry>(binding_nvs_key);
          
          if (pref_obj.load(&global_binding_registry) && global_binding_registry.struct_version == CURRENT_MACRO_VERSION) {
            ESP_LOGI("NVS_BIND", "Universal macro shortcut matrix recovered successfully.");
          } else {
            std::memset(&global_binding_registry, 0, sizeof(global_binding_registry));
            global_binding_registry.struct_version = CURRENT_MACRO_VERSION;
            global_binding_registry.total_bound_keys = 0;
            for (int i = 0; i < MAX_BOUND_HOTKEYS; i++) {
               global_binding_registry.bindings[i].shared_macro_slot = 255;
            }
            pref_obj.save(&global_binding_registry);
            ESP_LOGW("NVS_BIND", "Mismatched binding signature. Initialized clean empty layouts.");
          }

          // ============================================================
          // NEW ADDITION: DYNAMIC SELF-HEALING SWEEP FOR MACRO STEP SLOTS
          // ============================================================
          ESP_LOGD("NVS_MACRO", "Validating persistent macro step memory models...");
          for (int slot = 0; slot < MAX_BOUND_HOTKEYS; slot++) {
            uint64_t macro_nvs_key = 384720194ULL + slot;
            auto macro_pref = esphome::global_preferences->make_preference<UniversalFlashMacro>(macro_nvs_key);
            
            static UniversalFlashMacro test_macro;
            if (macro_pref.load(&test_macro)) {
              // If data exists but version is wrong, nuke it safely
              if (test_macro.struct_version != CURRENT_MACRO_VERSION) {
                ESP_LOGW("NVS_MACRO", "Slot %d contains outdated structure version (%u). Wiping entry...", slot, (unsigned int)test_macro.struct_version);
                std::memset(&test_macro, 0, sizeof(test_macro));
                test_macro.struct_version = CURRENT_MACRO_VERSION;
                test_macro.total_steps = 0;
                macro_pref.save(&test_macro);
              }
            }
          }
          esphome::global_preferences->sync(); // Lock changes cleanly into the partition


  # ====================================================================
  # STEP 1: Put system into Action Capture Recording State
  # ====================================================================
  - id: start_macro_mapping_session
    parameters:
      target_shared_slot: int
    mode: single
    then:
      - lambda: |-
          // 1. Defensively boundary-check the slot bounds against our max registry size (12 slots)
          if (target_shared_slot < 0 || target_shared_slot >= MAX_BOUND_HOTKEYS) {
            ESP_LOGE("MACRO_WORKFLOW", "Invalid macro slot target: %d. Aborting session.", target_shared_slot);
            return;
          }

      - script.execute: macro_indicator_start

      - lambda: |-

          // 2. Initialize tracking parameters and clear out our global RAM buffer workspace
          id(macro_assigned_shared_slot) = target_shared_slot;
          id(macro_step_counter) = 0;
          
          // Clear out the time anchor to 0 so the first recorded key never calculates a delta against pre-record clicks
          id(macro_last_event_time) = 0; 
          
          id(macro_recording_active) = true;    // Set active recording state flag
          
          std::memset(&active_recording_buffer, 0, sizeof(active_recording_buffer));
          active_recording_buffer.struct_version = CURRENT_MACRO_VERSION; // Align structure configuration tracker signatures
          
          // 3. Shift the system live mode flag to recording state
          id(macro_workflow_state) = MACRO_STATE_RECORDING; 
          
          // 4. Update the visual panels and throw operational system status logs
          id(display_show)->execute(false, "Macro Record", "Press Buttons...", "Stop w Macro Record");
          ESP_LOGI("MACRO_WORKFLOW", "Recording sequence initiated for Global Shared Slot: %d", target_shared_slot);
      - script.execute: macro_record_timeout_watcher
     
  # ====================================================================
  # STEP 2: Stop capturing clicks and transition to Hotkey Listen mode
  # ====================================================================
  - id: end_macro_action_capture
    mode: single
    then:
      - lambda: |-
          if (id(macro_workflow_state) == MACRO_STATE_RECORDING) {
            if (id(macro_step_counter) == 0) {
              id(macro_workflow_state) = MACRO_STATE_IDLE; 
              id(macro_recording_active) = false; 
              id(display_show)->execute(false, "Record Canceled", "No actions pressed", "Action Mode");
              ESP_LOGW("MACRO_WORKFLOW", "No keys were captured during the session. Aborting macro recording.");
          
              // indicate immediate empty abort
              id(macro_indicator_end)->execute();
              return;
            }

            id(macro_workflow_state) = MACRO_STATE_AWAITING_HOTKEY; 
            id(display_show)->execute(false, "Assign Hotkey", "Click desired button", "");
            ESP_LOGW("MACRO_WORKFLOW", "Actions successfully cached (%d steps). Awaiting button to bind.", id(macro_step_counter));
          } else {
            ESP_LOGW("MACRO_WORKFLOW", "End command ignored: System is not actively recording a session.");
          }

  # ====================================================================
  # STEP 3: Flash Persistence Commit Actions (Called internally by ir_map_processor)
  # ====================================================================
  - id: commit_macro_to_flash_slot
    parameters:
      macro_slot: int
    mode: single
    then:
      - lambda: |-
          // Calculate an independent, unique macro base NVS partition storage key offset space
          uint64_t macro_nvs_key = 384720194ULL + macro_slot;
          auto pref_obj = esphome::global_preferences->make_preference<UniversalFlashMacro>(macro_nvs_key);
          
          // Flush the data out of live RAM directly into the targeted non-volatile storage slot
          active_recording_buffer.total_steps = id(macro_step_counter);
          pref_obj.save(&active_recording_buffer);
          
          // Enforce a hard flash sync across partitions immediately
          esphome::global_preferences->sync();
          ESP_LOGI("NVS_MACRO", "Successfully committed Universal Shared Macro Slot %d (%d steps) directly to NVS Flash.", 
                   macro_slot, active_recording_buffer.total_steps);

  # ====================================================================
  # STEP 4: Save the Universal Cross-Profile Assignment Registry Map to Flash
  # ====================================================================
  - id: save_binding_registry_to_nvs
    mode: single
    then:
      - lambda: |-
          uint64_t binding_nvs_key = 3104711294ULL;
          auto pref_obj = esphome::global_preferences->make_preference<UniversalBindingRegistry>(binding_nvs_key);
          
          // Force the persistent save signature block up to version 4
          global_binding_registry.struct_version = CURRENT_MACRO_VERSION;
          pref_obj.save(&global_binding_registry);
          esphome::global_preferences->sync();
          
          ESP_LOGI("NVS_BIND", "Universal cross-profile identity shortcut mapping directory successfully synced to NVS.");


  # ====================================================================
  # Macro recording timeout watcher
  # ====================================================================
  - id: macro_record_timeout_watcher
    mode: restart
    then: 
      - delay: 60s
      - lambda: !lambda |-
          // If the system is still stuck in recording mode after 60s, abort it
          if (id(macro_workflow_state) == MACRO_STATE_RECORDING) {
            ESP_LOGW("MACRO_WORKFLOW", "Macro recording timed out due to inactivity. Reverting to idle.");
            
            // Reset state machine variables safely
            id(macro_workflow_state) = MACRO_STATE_IDLE;
            id(macro_recording_active) = false;
            id(macro_step_counter) = 0;
            
            // Clean up display panel status
            id(showing_special_info) = true;
            id(display_show)->execute(false, "Record Timeout", "Inactivity Abort", "Action Mode");
            
            // Shut down status LEDs and sends volume_down pulse via single execution
            id(macro_indicator_end)->execute();
          }

  # ====================================================================
  # Macro assignment timeout watcher
  # ====================================================================
  - id: macro_assignment_timeout_watcher
    mode: restart
    then:
      - delay: 30s
      - lambda: |-
          // If the system is still stuck in Hotkey Listen Mode after 30s, abort it
          if (id(macro_workflow_state) == MACRO_STATE_AWAITING_HOTKEY) {
            ESP_LOGW("MACRO_WORKFLOW", "Hotkey assignment timed out due to inactivity. Reverting to idle.");
            
