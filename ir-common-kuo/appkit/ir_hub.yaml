  # ====================================================================
  # Button learning phase 0 and phase A settling timer
  # Does deferred assessement and handling of inbound IR during learing
  # Multiple IR signals are received with a single button push. Many are invalid.
  # Caching and evaluating them after all arrive allows section of valid one.
  # We separately analyze raw IR packets to determine underlying protocol.

  - id: ir_settling_timer
    mode: single
    then: 
      - delay: 120ms
      - lambda: |-
          uint32_t now = millis();
          
          id(ir_window_active) = false;
          int b_idx = id(learn_current_button_idx);

          // 2. Safe repeat lockout condition check
          if (now - id(learn_last_save_time) < 400) {
            id(learn_cache_clear).execute();
            return;
          }

          if (b_idx < (int)TOTAL_SYSTEM_BUTTONS) {
            if (b_idx == -1) {
              if (id(learn_detected_protocol) == PROTO_UNKNOWN) {
                id(learn_cache_clear).execute();
                id(learn_active_protocol) = PROTO_UNKNOWN;
                id(learn_active_address) = 0x0;             
                id(learned_best_command) = 0;             
                return; 
              }
            
              auto& primary_array = id(learn_cache_protocol);
              uint8_t target = id(learn_detected_protocol);
              
              // Search strictly within the range defined by MAX_LEARNED_PROFILES
              int index = -1;
              for (int i = 0; i < MAX_LEARNED_PROFILES; i++) {
                if (primary_array[i] == target) {
                  index = i;
                  break;
                }
              }
            
              if (index == -1) {
                id(learn_cache_clear).execute();
                id(learn_active_protocol) = PROTO_UNKNOWN;
                id(learn_active_address) = 0x0;             
                id(learned_best_command) = 0;             
                return; 
              } else {
                id(learn_active_address)  = id(learn_cache_address)[index];
                id(learn_active_protocol) = id(learn_detected_protocol);    
                id(ir_receiver_allowed_protocol) = id(learn_active_protocol);
                
                b_idx = 0;
                id(learn_current_button_idx) = 0;
              }   
            }
            
            // CRITICAL DEFENSIVE GUARD: Explicitly block negative indices from reaching downstream handlers
            if (b_idx < 0 || b_idx >= (int)TOTAL_SYSTEM_BUTTONS) {
              id(learn_cache_clear).execute();
              return;
            }
                
            // Process IR captures into current button    
            auto& secondary_array = id(learn_cache_protocol);
            uint8_t active_target = id(learn_active_protocol);
            
            int index = -1;
            for (size_t i = 0; i < secondary_array.size(); i++) {
              if (secondary_array[i] == active_target) {
                index = i;
                break;
              }
            }
          
            if (index != -1) {
              id(learned_best_command) = id(learn_cache_command)[index]; 
              id(session_captured_codes).at(b_idx) = id(learned_best_command);

              // Lock the timestamp track so trailing repeats get ignored
              id(learn_last_save_time) = now; 
              
              b_idx++; 
              id(learn_current_button_idx) = b_idx;
              
              // Flash sequence alterations
              if (b_idx == (int)TOTAL_SYSTEM_BUTTONS) {
                id(flash_led_custom).execute(5, 100, 0.6, 1.0, 0.0);
                id(flash_led_custom).execute(5, 150, 0.2, 1.0, 0.4);
              } else {
                if (b_idx % 5 == 0) {
                  id(flash_led_custom).execute(1, 460, 0.0, 1.0, 0.0);
                } else {
                  id(flash_led_custom).execute(1, 200, 0.6, 1.0, 0.6);
                }              
              }
              
              id(learn_cache_clear).execute();
              id(learn_mode_timeout_watcher).execute(); // Reset 30s timer
              
              // SAFE HALT GATE: Evaluate state ONLY after increment step completes
              if (b_idx < (int)TOTAL_SYSTEM_BUTTONS) {
                ESP_LOGI("IR Learn", "Press ====== IR BUTTON ====== %s ======", learn_button_names[b_idx]);
                id(display_show)->execute(false, "IR Learn:", "Press Btn", std::string(learn_button_names[b_idx]));
              } else {
                ESP_LOGI("IR Learn", "All buttons captured! ====== Awaiting save selection...0=OK  1=Up  2=Rt  3=Dn  4=Lf");
                id(display_show)->execute(true, "Mem Slot", "0=OK 1=Up 2=Rt=", "3=Dn 4=Lf");
              }
                  
            } else {
              id(learn_cache_clear).execute();
              id(learn_active_protocol) = PROTO_UNKNOWN;
              id(learn_active_address) = 0x0;
              id(learned_best_command) = 0;             
              return; 
            }
          }


  # ====================================================================
  # handle ir button presses for all protocols after IR data converted to 
  # common format protocolStr, address, command, command_repeats
  # ====================================================================
  - id: general_IR_received_handler
    parameters:
      ir_protocolStr: std::string
      ir_address: uint32_t
      ir_command: uint32_t
      ir_command_repeats: uint16_t
    then:
      - lambda: |-
          uint32_t now = millis();

          uint8_t incoming_proto = PROTO_UNKNOWN;
          if (ir_protocolStr == "NEC") incoming_proto = PROTO_NEC;
          else if (ir_protocolStr == "JVC") incoming_proto = PROTO_JVC;
          else if (ir_protocolStr == "SONY") incoming_proto = PROTO_SONY;
          else if (ir_protocolStr == "LG") incoming_proto = PROTO_LG;
          else if (ir_protocolStr == "PANASONIC") incoming_proto = PROTO_PANASONIC;
          else if (ir_protocolStr == "RC5") incoming_proto = PROTO_RC5;
          else if (ir_protocolStr == "RC6") incoming_proto = PROTO_RC6;

          // Fetch the current active remote layout index
          int current_idx = id(active_remote_layout);
          int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;
          
          if (current_idx < 0 || current_idx >= total_valid_slots) {
            ESP_LOGE("IR_HUB", "Active remote layout index %d is out of bounds!", current_idx);
            return; 
          }
          
          // Pull constraints instantly straight out of the active runtime workspace
          const auto& active_profile = active_profile_workspace;


          switch(id(ir_receiver_mode)) {
            case IR_MODE_DEACTIVATED: { // deactivated --------------
              ESP_LOGD("IR HUB", "IR Receiver deactivated. No active profile.");
              break;
            } // -- end case IR_MODE_DEACTIVATED


            // ================================================================
            case IR_MODE_ACTION: { // action mode (LONG PRESS COMPATIBLE) ------------------
              const auto& active_profile = active_profile_workspace;
              const IRCommand* found_cmd = nullptr;
              for (const auto& kv_pair : active_profile.cmd_codes) {
                if (kv_pair.first == ir_command && ir_address == active_profile.device_address) {
                  found_cmd = &kv_pair.second;
                  break;
                }
              }
            
              if (found_cmd == nullptr) {
                id(global_cached_command) = 0;
                return; 
              }
            
              id(action_string).assign(found_cmd->action_string);
              std::string cmd_name = found_cmd->action_string;
            
              // 🛠️ FIX: INDEPENDENT CLICK SPLITTING LAYER
              // If the same key is hit again after a quiet window (>130ms), force-terminate 
              // the old hold state programmatically before executing the new down stroke.
              if (id(global_cached_command) == ir_command) {
                if (now - id(global_last_processed_time) > 130) {
                  ESP_LOGD("IR_HUB", "Quiet gap detected (%ums). Splitting sequential clicks cleanly.", (unsigned int)(now - id(global_last_processed_time)));
                  
                  // Programmatically fire the release edge for the previous click
                  id(ir_map_processor).execute(ir_command, 2); // 2 = UP
                  
                  // Reset tracking variables to guarantee a fresh DOWN edge below
                  id(global_cached_command) = 0;
                  id(global_is_holding) = false;
                }
              }

              if (id(global_cached_command) != ir_command) {
                bool is_system_key = (cmd_name == "macro_record" || cmd_name == "macro_play");
                if (!is_system_key) {
                  uint32_t delta_press = now - id(last_ir_press);
                  if (delta_press < 50) return;
                }
                id(last_ir_press) = now;
            
                id(global_cached_command) = ir_command;
                id(global_initial_press_time) = now;
                id(global_last_processed_time) = now;
                
                id(ir_map_processor).execute(ir_command, 0); // 0 = DOWN
              } 
              else {
                id(global_is_holding) = true;
                id(ir_map_processor).execute(ir_command, 1); // 1 = HOLDING / REPEAT
                id(global_last_processed_time) = now;
              }
            
              id(macro_assignment_cooldown) = now; 
              break;
            }
            // ===========  end case IR_MODE_ACTION ========


            // ================================================================
            case IR_MODE_SET_PROFILE: { // set profile ----------
              ESP_LOGD("IR HUB", "Checking incoming packet against profile registry via Flash Streaming...");
              bool match_found = false;
              int matched_index = -1;
              int factory = static_cast<int>(factory_count);

              // 1. SCAN CUSTOM NVS FLASH SLOTS FIRST (Iterating backwards like your original code)
              for (int slot = MAX_LEARNED_PROFILES - 1; slot >= 0; slot--) {
                uint64_t slot_nvs_key = 1948204712ULL + slot;
                auto pref_obj = esphome::global_preferences->make_preference<FlashStoredProfile>(slot_nvs_key);
                
                static FlashStoredProfile flash_p;
                if (pref_obj.load(&flash_p) && flash_p.struct_version == CURRENT_PROFILE_VERSION) {
                  // Fast validation check: Skip blank templates or protocol mismatches instantly
                  if (flash_p.total_keys == 0 || flash_p.protocol != incoming_proto || flash_p.device_address != ir_address) {
                    continue; 
                  }
                  
                  // Scan the keys residing entirely inside this temporary stack-allocated flash block
                  for (uint16_t k = 0; k < flash_p.total_keys; k++) {
                    if (flash_p.keys[k].irCommand == ir_command) {
                      matched_index = factory + slot; // Calculate true dynamic index position
                      match_found = true;
                      break;
                    }
                  }
                }
                if (match_found) break;
              }

              // 2. SCAN HARDCODED FACTORY PROFILES ON-DEMAND IF NO CUSTOM MATCH WAS FOUND
              if (!match_found) {
                for (int i = 0; i < factory; i++) {
                  // Stream factory layout headers temporarily into the single RAM workspace container
                  load_profile_to_workspace(i);
                                    
                  if (active_profile_workspace.protocol == incoming_proto && active_profile_workspace.device_address == ir_address) {
                    for (const auto& kv_pair : active_profile_workspace.cmd_codes) {
                      if (kv_pair.first == ir_command) {
                        matched_index = i;
                        match_found = true;
                        break;
                      }
                    }
                  }
                  if (match_found) break;
                }
              }

              // 3. EXECUTE METADATA ENGAGEMENT PASS IF A PROFILE KEY MATCH WAS FOUND
              if (match_found && matched_index != -1) {
                id(set_profile_timeout_watcher).stop();
                
                

                // Hydrate and lock the true winning layout completely into active RAM workspace
                load_profile_to_workspace(matched_index);
                
                id(active_remote_layout) = matched_index;
                id(setup_ir_receiver_for_current_profile).execute();
                id(profile_has_been_stored) = 1; // remember that profile has been set
                
                id(ir_receiver_mode) = IR_MODE_ACTION; // Securely revert right back to Action Mode
                
                id(flash_led_custom).execute(4, 50, 1.0, 0.0, 0.0);
                id(flash_led_custom).execute(2, 100, 0.0, 1.0, 0.0);

                id(display_show)->execute(true, "Setting Profile", 
                                                active_profile_workspace.profile_name, 
                                                "Wait 5 seconds");
                // FORCE AN INSTANT FOREGROUND REFRESH
                id(last_active_idx_seen) = matched_index;
                static char ir_change_buf[128];
                const char* kind = (matched_index < factory) ? "internal" : "custom";
                snprintf(ir_change_buf, sizeof(ir_change_buf), "idx=%d  %s  [%s]",
                         matched_index,
                         active_profile_workspace.profile_name.c_str(),
                         kind);
                id(ir_active_profile_ts).publish_state(ir_change_buf);
                // =====
                                                
                                                
              } else {
                // SAFETY ARREST FALLBACK: If the scanned code completely missed all records, 
                // instantly rehydrate your actually running configuration layout back into RAM
                load_profile_to_workspace(id(active_remote_layout));
                ESP_LOGD("IR HUB", "No profile registry match found for incoming signature.");
              }
              break;
            } //-- end case IR_MODE_SET_PROFILE


            // ================================================================
            case IR_MODE_LEARN: { // learn mode --------------
              int b_idx = id(learn_current_button_idx);

              int cache_idx = id(learn_cache_idx);
              cache_idx++;
              if (cache_idx < MAX_LEARNED_PROFILES) {
                id(learn_cache_protocol)[cache_idx] = incoming_proto;
                id(learn_cache_address)[cache_idx]  = ir_address;
                id(learn_cache_command)[cache_idx]  = ir_command;
                id(learn_cache_idx) = cache_idx;
              }

              ESP_LOGD("IR Learn", "cache index %d... command: 0x%X", (int)cache_idx, (unsigned int)ir_command);
                         
              if (!id(ir_window_active)) {
                id(ir_window_active) = true;
                id(ir_settling_timer).execute();
              }                 
              
              // --- Evaluation Step: User has completed all button pushes ---
              if (b_idx == (int)TOTAL_SYSTEM_BUTTONS) {
                int selected_slot = -1;
                
                // Inspecting the captured codes inside your local workspace arrays
                // to determine which profile slot to store within
                // number of option selection buttons here must match with MAX_LEARNED_PROFILES 
                if (ir_command == id(session_captured_codes).at(6))       selected_slot = 0; // enter
                else if (ir_command == id(session_captured_codes).at(4))  selected_slot = 1; // up
                else if (ir_command == id(session_captured_codes).at(5))  selected_slot = 2; // down
                
                if (selected_slot != -1) {
                  id(learn_mode_timeout_watcher).stop();

                  // Hydrate our temporary single container in memory with the newly learned data
                  active_profile_workspace.profile_name = "Memory " + std::to_string(selected_slot);
                  active_profile_workspace.protocol = id(learn_active_protocol);
                  active_profile_workspace.device_address = id(learn_active_address);
                  active_profile_workspace.cmd_clear_token_arm = id(session_captured_codes).at(23);
                  active_profile_workspace.cmd_clear_token_fire = id(session_captured_codes).at(6);

                  active_profile_workspace.cmd_codes.clear();
                  active_profile_workspace.cmd_codes.reserve((int)TOTAL_SYSTEM_BUTTONS);
                  
                  for (size_t i = 0; i < (int)TOTAL_SYSTEM_BUTTONS; i++) {
                    IRCommand cmd;
                    std::strncpy(cmd.action_string, learn_button_names[i], sizeof(cmd.action_string) - 1);
                    cmd.action_string[sizeof(cmd.action_string) - 1] = '\0'; 
                    
                    // Hidden remote comment label maps cleanly directly out of our single truth name tables
                    std::strncpy(cmd.button_name, learn_button_names[i], sizeof(cmd.button_name) - 1);
                    cmd.button_name[sizeof(cmd.button_name) - 1] = '\0';

                    active_profile_workspace.cmd_codes.push_back({ id(session_captured_codes).at(i), cmd });
                  }

                  // ============================================================
                  // FLUSH THE ACTIVE RAM CONTAINER STRAIGHT TO FLASH SLOTS
                  // ============================================================
                  commit_database_to_flash(selected_slot);
                  // ============================================================

                  id(flash_led_custom).execute(4, 100, 0.0, 0.0, 1.0);
                  id(flash_led_custom).execute(2, 200, 0.0, 1.0, 0.0);
                  id(display_show)->execute(true, "Stored Profile", active_profile_workspace.profile_name, "Operational");
                  
                  size_t target_vector_index = factory_count + selected_slot;
                  id(active_remote_layout) = (int)target_vector_index; 
                  id(setup_ir_receiver_for_current_profile).execute();
                  id(ir_receiver_mode) = IR_MODE_ACTION; // Return safely to Action Mode
                  return;
                } else {
                  ESP_LOGW("IR Learn", "Invalid saving key pressed.");
                  return;
                }
              }
              break;
            } //------- end case IR_MODE_LEARN

            // ================================================================
            default:
              // if we fall to here, something is awry with ir_receiver_mode
              ESP_LOGD("IR HUB", "Unknown ir_receiver_mode.");

              break;
          }
 

  # ====================================================================
  # Execute the actual actions commanded by inbound IR (Unified Pass)
  # ====================================================================
  - id: ir_map_processor
    parameters:
      ir_command: uint32_t
      event_state: int  # 0 = DOWN (Press), 1 = HOLDING (Repeat), 2 = UP (Release)
    then:
      - lambda: |-
          uint32_t now = millis();
          
          // ============================================================
          // 1. BOUNDARY VALIDATION & NATIVE WORKSPACE METADATA LOOKUP
          // ============================================================
          int current_idx = id(active_remote_layout);
          int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;
          if (current_idx < 0 || current_idx >= total_valid_slots) {
            ESP_LOGE("IR_HUB", "Active remote layout index %d is out of bounds!", current_idx);
            return;
          }
          
          const auto& active_profile = active_profile_workspace;
          const IRCommand* found_cmd = nullptr;

          for (const auto& kv_pair : active_profile.cmd_codes) {
            if (kv_pair.first == ir_command) {
              found_cmd = &kv_pair.second;
              break;
            }
          }

          if (found_cmd == nullptr) {
            static IRCommand web_fallback_cmd;
            if (!id(action_string).empty()) {
              std::strncpy(web_fallback_cmd.action_string, id(action_string).c_str(), sizeof(web_fallback_cmd.action_string) - 1);
              web_fallback_cmd.action_string[sizeof(web_fallback_cmd.action_string) - 1] = '\0';
              found_cmd = &web_fallback_cmd;
            }
          }

          if (found_cmd == nullptr) {
            ESP_LOGV("IR_HUB", "Command 0x%X not mapped in current layout profile workspace.", (unsigned int)ir_command);
            return; 
          }
          
          std::string cmd_name = found_cmd->action_string;
          uint32_t current_duration = now - id(global_initial_press_time);

          // ====================================================================
          // INTERCEPT A: TWO-STAGE HOTKEY ASSIGNMENT ENGINE (END OF CAPTURE)
          // ====================================================================
          if (id(macro_workflow_state) == MACRO_STATE_AWAITING_HOTKEY) {
            if (event_state == KEY_EVENT_HOLDING) return; 
            if (event_state == KEY_EVENT_DOWN) {
              if (millis() - id(macro_assignment_cooldown) < 400) return;
          
              id(macro_assignment_timeout_watcher)->stop();
          
              int target_shared_slot = -1;
              const char* key_name = found_cmd->action_string;
              
              if (std::strcmp(key_name, "cursor_enter") == 0)      { target_shared_slot = 0; }
              else if (std::strcmp(key_name, "cursor_up") == 0)    { target_shared_slot = 1; }
              else if (std::strcmp(key_name, "cursor_right") == 0) { target_shared_slot = 2; }
              else if (std::strcmp(key_name, "cursor_down") == 0)  { target_shared_slot = 3; }
              else if (std::strcmp(key_name, "cursor_left") == 0)  { target_shared_slot = 4; }
              else if (std::strcmp(key_name, "shortcut_1") == 0)   { target_shared_slot = 5; }
              else if (std::strcmp(key_name, "shortcut_2") == 0)   { target_shared_slot = 6; }
              else if (std::strcmp(key_name, "shortcut_3") == 0)   { target_shared_slot = 7; }
              else if (std::strcmp(key_name, "shortcut_4") == 0)   { target_shared_slot = 8; }
          
              if (target_shared_slot == -1) {
                ESP_LOGE("MACRO_WORKFLOW", "Binding Rejected! Key '%s' is an invalid hotkey destination.", key_name);
                id(showing_special_info) = true;
                id(display_show)->execute(false, "Assignment Error", "Invalid Key Destination", "Action Mode");
                id(macro_recording_active) = false;
                id(macro_workflow_state) = MACRO_STATE_IDLE; 
                
                id(macro_indicator_end)->execute();
                return; 
              }
          
              id(macro_recording_active) = false; 
              int match_idx = -1;
              uint16_t current_loop_idx = 0;
              uint16_t bounds_limit = global_binding_registry.total_bound_keys;
          
              while (current_loop_idx != bounds_limit) {
                if (std::strcmp(global_binding_registry.bindings[current_loop_idx].action_string, key_name) == 0) {
                  match_idx = (int)current_loop_idx;
                  break;
                }
                current_loop_idx += 1;
              }
          
              if (match_idx == -1 && global_binding_registry.total_bound_keys != MAX_BOUND_HOTKEYS) {
                match_idx = (int)global_binding_registry.total_bound_keys;
                global_binding_registry.total_bound_keys += 1;
              }
          
              if (match_idx != -1) {
                std::memset(global_binding_registry.bindings[match_idx].action_string, 0, MAX_ACTION_STRING_LEN);
                std::strncpy(global_binding_registry.bindings[match_idx].action_string, key_name, MAX_ACTION_STRING_LEN - 1);
                global_binding_registry.bindings[match_idx].action_string[MAX_ACTION_STRING_LEN - 1] = '\0';
                global_binding_registry.bindings[match_idx].shared_macro_slot = target_shared_slot;
                
                id(commit_macro_to_flash_slot).execute(target_shared_slot);
                id(save_binding_registry_to_nvs).execute();
          
                id(macro_indicator_end)->execute();
          
                char slot_msg_buf[32];
                char key_msg_buf[48];
                snprintf(slot_msg_buf, sizeof(slot_msg_buf), "Macro Bound Slot %d", target_shared_slot);
                snprintf(key_msg_buf, sizeof(key_msg_buf), "Key: %s", key_name);
          
                id(showing_special_info) = true;
                id(display_show)->execute(true, std::string(slot_msg_buf), std::string(key_msg_buf), "Action Mode");
                
                ESP_LOGW("MACRO_WORKFLOW", "Macro sequence committed to Fixed NVS Slot %d for button: %s", target_shared_slot, key_name);
              }
              id(macro_workflow_state) = MACRO_STATE_LIFTOFF_SHIELD; 
              return; 
            }
            if (event_state == KEY_EVENT_UP) {
              id(macro_workflow_state) = MACRO_STATE_IDLE; 
              return; 
            }
          }

          // ====================================================================
          // INTERCEPT B: HOTKEY LIFTOFF SHIELD TRAPPER (STATE 99)
          // ====================================================================
          if (id(macro_workflow_state) == 99) {
            if (event_state == KEY_EVENT_HOLDING) return; 
            if (event_state == KEY_EVENT_UP) {
              id(macro_workflow_state) = MACRO_STATE_IDLE; 
              return; 
            }
          }

          // ====================================================================
          // TOGGLE CODES: STATE 0 ENTRY (DOWN) OR STATE 1 EXIT (DOWN) VIA RECORD KEY
          // ====================================================================
          if (std::strcmp(found_cmd->action_string, "macro_record") == 0 && event_state == KEY_EVENT_DOWN) {
            if (id(macro_workflow_state) == MACRO_STATE_IDLE) {
              id(start_macro_mapping_session)->execute(0); 
              return; 
            } 
            else if (id(macro_workflow_state) == MACRO_STATE_RECORDING) {
              id(macro_record_timeout_watcher)->stop();
              
              while (id(macro_step_counter) > 0) {
                int check_idx = id(macro_step_counter) - 1;
                if (std::strcmp(active_recording_buffer.steps[check_idx].action_string, found_cmd->action_string) == 0) {
                  id(macro_step_counter) = check_idx;
                } else {
                  break;
                }
              }

              active_recording_buffer.total_steps = id(macro_step_counter);
          
              if (id(macro_step_counter) == 0) {
                id(macro_workflow_state) = MACRO_STATE_IDLE;
                id(macro_recording_active) = false;
                ESP_LOGW("MACRO_WORKFLOW", "Recording sequence empty. Aborting workflow.");
                id(showing_special_info) = true;
                id(display_show)->execute(false, "Record Canceled", "No steps cached", "Action Mode");
                
                id(turn_led_on_custom)->stop();
                id(turn_led_off_custom)->execute();                
                return;
              }

              active_recording_buffer.struct_version = CURRENT_MACRO_VERSION;
              id(macro_workflow_state) = MACRO_STATE_AWAITING_HOTKEY;
              
              ESP_LOGW("MACRO_WORKFLOW", "Recording stopped. Awaiting assignment click...");
              id(showing_special_info) = true;
              id(display_show)->execute(false, "Assign Hotkey:", "CLICK desired button", "to save macro...");
              id(macro_assignment_timeout_watcher)->execute();
              return;
            }
          }

          // ====================================================================
          // TRIGGER PLAYBACK PREFIX WINDOW ON PLAY CLICK
          // ====================================================================
          if (std::strcmp(found_cmd->action_string, "macro_play") == 0 && event_state == KEY_EVENT_DOWN) {
            if (id(macro_workflow_state) == MACRO_STATE_IDLE) {
              id(macro_play_prefix_active) = true;
              
              id(showing_special_info) = true;
              id(display_show)->execute(false, "Macro Playback", "Awaiting Hotkey...", "5s Timeout Gate");
              id(macro_play_prefix_timeout_watcher)->execute(); 
              return;
            }
          }

          // ====================================================================
          // INTERCEPT C: PREFIX PLAYBACK RUNNER GATE
          // ====================================================================
          if (id(macro_play_prefix_active)) {
            if (event_state == KEY_EVENT_DOWN) {
              uint8_t prefix_slot = get_bound_macro_slot(found_cmd->action_string);
              id(macro_play_prefix_active) = false;
              id(macro_play_prefix_timeout_watcher)->stop();

              if (prefix_slot != 255) {
                id(debounce_safety_lock) = true;
                id(release_debounce_lock)->execute();
                ESP_LOGI("MACRO_WORKFLOW", "Playback Hotkey Matched! Launching Macro Slot Sequence: %d", prefix_slot);
                id(play_universal_shared_macro)->execute(prefix_slot);
                return;
              } else {
                id(showing_special_info) = true;
                id(display_show)->execute(false, "Playback Canceled", "No Macro Bound", "Action Mode");
                id(showing_special_expiration_timer).execute();
                return;
              }
            }
            else if (event_state == KEY_EVENT_UP) {
              return;
            }
          }

          // ====================================================================
          // UNIFIED HOOK: PASSIVE MID-STREAM CAPTURE REGISTRATION PIPELINE
          // ====================================================================
          if (id(macro_workflow_state) == MACRO_STATE_RECORDING) {
            id(macro_record_timeout_watcher)->execute(); // Keep session alive
            
            if (std::strcmp(found_cmd->action_string, "macro_play") != 0 && 
                std::strcmp(found_cmd->action_string, "macro_record") != 0) {

              int step_idx = id(macro_step_counter);

              // Swallow holding noise frames; our timing engine targets clean state edges exclusively
              if (event_state != KEY_EVENT_HOLDING && step_idx < MAX_MACRO_STEPS) {
                
                // Defensive structural guard against contact bounce noise
                if (event_state == KEY_EVENT_UP && step_idx > 0 && 
                    active_recording_buffer.steps[step_idx - 1].event_state == KEY_EVENT_UP &&
                    (now - id(macro_last_event_time) < 30)) {
                  return;
                }

                uint32_t delta = 0;
                if (step_idx > 0) {
                  if (event_state == KEY_EVENT_UP) {
                    // --- BRANCH 1: SPECIAL CONSTRAINT TARGET (POWER_OFF OVERRIDE) ---
                    if (std::strcmp(found_cmd->action_string, "power_off") == 0) {
                      delta = 1500; 
                      ESP_LOGD("MACRO_REC", "Special Case Applied: Clamped 'power_off' hold to 1500ms");
                    } else {
                      // --- BRANCH 2: SMART ADAPTIVE AUTOCORRECT FILTER ---
                      uint32_t true_hold = now - id(macro_last_event_time);
                      if (true_hold < 450) {
                        delta = 50; // Clean up tired or accidental sluggish holds back into a standard tap
                        ESP_LOGD("MACRO_REC", "Cleanup Filter Active: Normalized %ums hold down to 50ms tap", (unsigned int)true_hold);
                      } else {
                        delta = true_hold; // Intentional, sustained physical long-press duration cached
                      }
                    }
                  } else {
                    // Calculate human pacing interval gap between distinct button selections
                    delta = now - id(macro_last_event_time);
                    if (delta < 200) delta = 200; // Protect spacing gap minimum threshold floor
                  }
                  if (delta > 65535) delta = 65535;
                }

                std::memset(active_recording_buffer.steps[step_idx].action_string, 0, MAX_ACTION_STRING_LEN);
                std::strncpy(active_recording_buffer.steps[step_idx].action_string, found_cmd->action_string, MAX_ACTION_STRING_LEN - 1);
                
                active_recording_buffer.steps[step_idx].event_state = (uint8_t)event_state;
                active_recording_buffer.steps[step_idx].delay_ms = (uint16_t)delta;
                
                id(macro_last_event_time) = now;
                id(macro_step_counter) = step_idx + 1;
                active_recording_buffer.total_steps = id(macro_step_counter);
                
                ESP_LOGI("MACRO_REC", "Inline Mirror Captured -> Step [%d]: %s (State: %d, Delay: %u ms)", 
                         step_idx, found_cmd->action_string, event_state, (unsigned int)delta);
              }
            }
            // Control safely flows straight into the system output and driver components down below...
          }

          // ============================================================
          // POPULATE DYNAMIC TRACKING SENSOR STRINGS
          // ============================================================
          if (id(macro_playback_active) == true) {
            return; 
          }

          if (!id(global_token_clear_armed)) {
            id(action_string).assign(found_cmd->action_string);
            
            if (get_bound_macro_slot(found_cmd->action_string) != 255) {
              id(action_string).append(" *");
            } else if (event_state == KEY_EVENT_HOLDING && current_duration >= 4000) {
              id(action_string).append(" [hold]");
            } else if (event_state == KEY_EVENT_HOLDING) {
              id(action_string).append(" ..");
            }
          }

          char cmd_buf[32] = {0};
          char addr_buf[32] = {0};
          snprintf(cmd_buf, sizeof(cmd_buf), "0x%04X", (unsigned int)ir_command);
          snprintf(addr_buf, sizeof(addr_buf), "0x%04X", (unsigned int)active_profile.device_address);
          std::string commandStr(cmd_buf);
          std::string addressStr(active_profile.profile_name);

          if (id(showing_special_info) == true) {
            id(showing_special_expiration_timer).execute();
          } else {
            id(display_show)->execute(false, id(action_string), addressStr, commandStr);
          }

          // ============================================================
          // PROGRAMMATIC SCRIPT INTERCEPT INTERFACE
          // ============================================================
          bool is_automated_script_action = (std::strcmp(found_cmd->action_string, "power_off") == 0 || 
                                             std::strcmp(found_cmd->action_string, "power_on") == 0);
          
          if (is_automated_script_action) {
            if (event_state == KEY_EVENT_DOWN) {
              auto* target_btn = resolve_button(found_cmd->action_string);
              if (target_btn != nullptr) {
                target_btn->press(); 
                ESP_LOGI("IR_PROCESSOR", "IR Map redirected pass-through to native macro script for: %s", found_cmd->action_string);
              } else {
                fire_bluetooth_hid_action(found_cmd->action_string, event_state);
              }
              
              id(global_cached_command) = 0;
              id(global_initial_press_time) = 0;
              id(global_last_processed_time) = 0;
              id(global_is_holding) = false;
            }
            return; 
          }

          // ============================================================
          // UNIFIED ACTION DRIVER INJECTION PIPELINE
          // ============================================================
          if (std::strcmp(found_cmd->action_string, "token_sniff") == 0) {
            if (event_state == KEY_EVENT_DOWN) {
              id(showing_special_info) = true;
              id(sniffing_sequence).execute(); 
            }
            return;
          } 
          else if (std::strcmp(found_cmd->action_string, "token_recall") == 0) {
            if (event_state == KEY_EVENT_DOWN) {
              id(showing_special_info) = true;
              id(execute_token_recall_routine).execute();
            }
            return;
          } 
          else if (std::strcmp(found_cmd->action_string, "token_clear") == 0) {
            if (event_state == KEY_EVENT_DOWN) {
              id(run_token_clear_worker).execute();
            }
            return;
          }

          if (id(global_cached_command) != ir_command) {
            if (event_state == KEY_EVENT_DOWN) {
              id(global_cached_command) = ir_command;
              id(global_initial_press_time) = now;
              id(global_last_processed_time) = now;
            }
          } else {
            if (event_state == KEY_EVENT_HOLDING) {
              id(global_is_holding) = true;
              id(global_last_processed_time) = now;
            }
          }

          // Transmit directly down into your low-level hardware BLE abstraction layers
          fire_bluetooth_hid_action(found_cmd->action_string, event_state);

          if (event_state == KEY_EVENT_UP) {
            id(global_cached_command) = 0;
            id(global_initial_press_time) = 0;
            id(global_last_processed_time) = 0;
            id(global_is_holding) = false;
          }
          
          id(macro_assignment_cooldown) = now;
          
  # ========== END of ir_map_processor ===================================
  # ======================================================================



  # Set up IR receiver to accept commands from current profile

  # ====================================================================
  # Point hardware setup directly to the loaded runtime workspace
  # ====================================================================
  - id: setup_ir_receiver_for_current_profile
    then:
      - lambda: |-
          size_t true_hardware_index = id(active_remote_layout);
          int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;

          if (true_hardware_index >= total_valid_slots) {
            ESP_LOGW("Profile Control", "Target index out of bounds! Overriding to safe default layout...");
            id(active_remote_layout) = id(default_profile); 
            true_hardware_index = id(default_profile);
            load_profile_to_workspace(true_hardware_index);
          }

          // Read directly from the actual workspace container instead of the proxy bridge layout array
          const auto& active_profile = active_profile_workspace;
          id(ir_receiver_mode) = IR_MODE_ACTION; 
          
          // Force apply the newly loaded protocol byte filter rules straight to the hardware layer
          id(ir_receiver_allowed_protocol) = active_profile.protocol;
          
          ESP_LOGI("Profile Control", "Profile layout '%s' engaged via index %d. Allowed Protocol ID: %d (%s)", 
                   active_profile.profile_name.c_str(), 
                   (int)true_hardware_index,
                   (int)active_profile.protocol,
                   to_string(active_profile.protocol)); 

            

  # =================================================================
  # Automatic hardware lock release timer step
  - id: release_debounce_lock
    then:
      - delay: 110ms
      - globals.set:
          id: debounce_safety_lock
          value: 'false'

  # Automated 5-Second Expiration Timer
  - id: token_clear_safety_timeout
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(global_token_clear_armed);'
          then:
            - globals.set:
                id: global_token_clear_armed
                value: 'false'
            - lambda: |-
                ESP_LOGI("IR Safety", "Sequence timed out. Gate locked.");
                id(myDisplay_line1) = "Timed Out";
                id(myDisplay_line2) = "Clear Token";
                id(myDisplay_line3) = "Canceled";


  # Showing special info expiration timer
  - id: showing_special_expiration_timer
    mode: restart
    then:
      - delay: 4s # how long without another IR button press before special display times out.
      - lambda: |-
                ESP_LOGD("Info Show", "Showing special info timed out.");
                id(showing_special_info) = false;


  - id: set_profile_timeout_watcher
    mode: restart
    then:
      - delay: 15s
      - lambda: |-
          if (id(ir_receiver_mode) == IR_MODE_SET_PROFILE) {
            id(ir_receiver_mode) = IR_MODE_ACTION; // Return to action mode
            ESP_LOGW("IR Hub", "Set Profile Mode timed out after 15 seconds. Reverting to action mode.");
            
            // Explicitly declare variables inside this scope block
            int current_idx = id(active_remote_layout);
            std::string current_name = "Default";
            
            int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;
            if (current_idx >= 0 && current_idx < total_valid_slots) {
              current_name = active_profile_workspace.profile_name;
            }

            id(display_show)->execute(false,
                                     "Setup Timed Out",
                                     current_name,
                                     "Action Mode");
          }


  # ====================================================================
       
interval:
  # ====================================================================
  # HIGH-VELOCITY NON-BLOCKING STATE FLUSHER (LONG PRESS EDITIONS)
  # ====================================================================
  - interval: 40ms
    then:
      - lambda: |-
          if (id(macro_workflow_state) == MACRO_STATE_AWAITING_HOTKEY) {
            return; 
          }

          uint32_t now = millis();
          if (id(global_cached_command) != 0) {
            // RESTORED: Standard 140ms timeout ensures data-less IR repeat bursts (110ms) are not cut off
            if (now - id(global_last_raw_packet_time) >= 140) {
              
              id(ir_map_processor).execute(id(global_cached_command), 2); // 2 = UP/Release

              id(global_cached_command) = 0;
              id(global_initial_press_time) = 0;
              id(global_last_processed_time) = 0;
              id(global_is_holding) = false;
              id(global_long_hold_handled) = false;
            }
          }


  # ====================================================================
  # TIMER 2: True One-Shot Post-Boot Storage Recovery & Workspace Hydration
  # ====================================================================
  # UNCHANGED: Kept exactly as original to protect safe system boots.
  - interval: 1.0sec 
    id: boot_initialization_timer 
    then:
      - lambda: |-

          ESP_LOGI("ir_hub", "Executing secure unified workspace hydration pass...");
          
          int boot_idx = id(active_remote_layout); 
          flash_hydration_complete = true; 

          // --- FRESH NVRAM FOOTPRINT DETECTION ---
          if (boot_idx == 0) {
            if (id(profile_has_been_stored) == 0) {
              // This is a fresh erase! Use the user's compile-time def_profile
              ESP_LOGW("ir_hub", "Fresh uninitialized NVRAM detected! Using default profile: %d", ${def_profile});
              boot_idx = ${def_profile};
              id(active_remote_layout) = boot_idx;
              
            } else {
              // The user explicitly stored index 0 (AWOL) in the past. Simply keep it.
              ESP_LOGI("ir_hub", "Restoring explicitly saved AWOL layout (Index 0).");
            }
            // Mark profile as having been saved
            id(profile_has_been_stored) = 1;
          } //--- end FRESH NVRAM

          int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;
          if (boot_idx < 0 || boot_idx >= total_valid_slots) {
            boot_idx = id(default_profile);
            id(active_remote_layout) = boot_idx;
          }

          load_profile_to_workspace(boot_idx);
          id(selected_profile_slot) = boot_idx;

          auto select_obj = id(ir_profile_slot_selector);
          if (boot_idx >= 0 && boot_idx < total_valid_slots) {
            // Note: The dropdown timer handles selector state population directly at boot
            ESP_LOGD("boot_loader", "Workspace hydration complete for active index: %d", boot_idx);
          }

          static char boot_buf[128];
          const char* kind = (boot_idx < (int)factory_count) ? "internal" : "custom";
          snprintf(boot_buf, sizeof(boot_buf), "idx=%d  %s  [%s]",
                   boot_idx,
                   active_profile_workspace.profile_name.c_str(),
                   kind);
          id(ir_active_profile_ts).publish_state(boot_buf);

      - script.execute: hydrate_macro_bindings_from_flash
      - script.execute: setup_ir_receiver_for_current_profile
      - lambda: |-      
          id(ir_receiver_mode) = IR_MODE_ACTION; 
          id(ir_active_profile_ts).update();

      - script.execute: display_token_remote_profile
      - component.suspend: boot_initialization_timer
