interval:
  # ====================================================================
  # TIMER 1: Process IR hold repeat loops
  # ====================================================================
  - interval: 80ms
    then:
      - lambda: |-
          uint32_t now = millis();
          if (id(global_cached_command) != 0) {
            if (now - id(global_last_raw_packet_time) >= 100) return; 
            if (id(global_is_holding)) {
              id(ir_map_processor).execute(id(global_cached_command), true);
            } else {
              if (now - id(global_initial_press_time) >= 300) { 
                id(global_is_holding) = true;
                id(ir_map_processor).execute(id(global_cached_command), true);
              }
            }
          }
     
  # ====================================================================
  # TIMER 2: True One-Shot Post-Boot Storage Recovery & Mapping
  # ====================================================================
  - interval: 2.0sec 
    id: boot_initialization_timer 
    then:
      # PASS 1: Native verification gate forces factory maps into index positions 0-12
      - if:
          condition:
            lambda: 'return remote_profiles.empty();'
          then:
            - script.execute: populate_factory_profiles
            - logger.log: "System baseline check: Factory profiles built cleanly. Awaiting next pass..."
            - delay: 100ms 

      # PASS 2: Safely read our persistent custom layout tracks out of the physical NVS blocks
      - lambda: |-
          ESP_LOGI("ir_hub", "Executing physical flash database rehydration pass...");
          load_saved_flash_profiles();
          link_hardware_buttons();
          ESP_LOGI("ir_hub", "Hardware pointer mapping complete. System armed.");
          
      - script.execute: setup_ir_receiver_for_current_profile
      - lambda: |-      
          id(ir_receiver_mode) = 1; // Securely move device into active listening mode

      - script.execute: display_token_remote_profile
      
      # The Kill Switch: Permanently shuts down this initialization timer loop
      - component.suspend: boot_initialization_timer
