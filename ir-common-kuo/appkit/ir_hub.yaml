# ir-common-kuo/ir-hub.yaml
esphome:
  name: ir-hub



#====================================================================
#=========================== IR Receiver ============================  
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us       
  idle: 20ms         
  tolerance: 35%     
  dump:
    - raw
    - nec
    - jvc
    - sony
    - lg
    - panasonic
    - rc5
    - rc6
    
  # 1. Updates timestamp every single time ANY raw IR pulse or repeat packet burst hits the pin
  on_raw:
    - lambda: |-
        id(global_last_raw_packet_time) = millis();
        if (!id(ir_timeout_watcher).is_running()) {
          id(ir_timeout_watcher).execute();
        }

    - lambda: |-
        if (x.size() < 2) return;

        uint32_t head_mark = x[0];
        uint32_t head_space = std::abs(x[1]);
        size_t total_pulses = x.size();

        std::string proto = "UNKNOWN";

        // --- 1. MANCHESTER / SHORT-HEADER PROTOCOLS (RC5 & RC6) ---
        if (head_mark >= 700 && head_mark <= 1100 && total_pulses >= 18 && total_pulses <= 30) {
          proto = "RC5";
        }
        else if (head_mark >= 2400 && head_mark <= 2900 && head_space >= 700 && head_space <= 1100) {
          if (total_pulses >= 34 && total_pulses <= 46) {
            proto = "RC6";
          }
        }

        // --- 2. STANDARD SPACE/DISTANCE PROTOCOLS ---
        if (proto == "UNKNOWN") {
          // JVC Test: 8.4ms Mark / 4.2ms Space. (Accepts large pulse arrays to accommodate compound repeat buffers)
          if (head_mark >= 7600 && head_mark < 8800 && head_space >= 3800 && head_space <= 4600) {
            proto = "JVC";
          }
          // SONY Test: Header pulse 2.4ms, short space < 900us, max 42 pulses
          else if (head_mark >= 2100 && head_mark <= 2700 && head_space < 900 && total_pulses <= 42) {
            proto = "SONY";
          }
          // PANASONIC Test: Header 3.4ms, space 1.7ms
          else if (head_mark >= 3100 && head_mark <= 3700 && head_space >= 1500 && head_space <= 2000) {
            proto = "PANASONIC";
          }
          // LG Test: Symmetric 4.5ms Mark / 4.5ms Space
          else if (head_mark >= 4000 && head_mark <= 5000 && head_space >= 4000 && head_space <= 5000) {
            proto = "LG";
          }
          // NEC / TViX Test: 9.0ms Mark
          else if (head_mark >= 8500 && head_mark <= 9500) {
            proto = "NEC";
          }
        }
        
        // --- 3. FALLBACK SANITY CHECK (For Headerless Repeat Packets) ---
        if (proto == "UNKNOWN") {
          // Captures JVC headerless repeat data streams (Exact 34 pulses, small initial timing signature)
          if (total_pulses == 34 && head_mark >= 400 && head_mark <= 600 && head_space >= 1400 && head_space <= 1800) {
            proto = "JVC";
          }
          // Check Sony second (captures Sony 12-bit, 15-bit, and 20-bit codes with native short spacing)
          else if (total_pulses >= 24 && total_pulses <= 42 && head_space < 1000) {
            proto = "SONY";
          } 
          else if (total_pulses >= 64 && total_pulses <= 68) proto = "NEC";
          else if (total_pulses >= 96 && total_pulses <= 102) proto = "PANASONIC";
        }

        // Assign back to global hub learning variable
        id(learn_detected_protocol) = proto;
        
        ESP_LOGD("IR_RECOGNIZER", "Detected Protocol: %s (Mark: %uus, Space: %uus, Pulses: %u)", 
         proto.c_str(), (unsigned int)head_mark, (unsigned int)head_space, total_pulses);



  # ======= MULTI-PROTOCOL CONVERSION GATES =======

  on_nec:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == "NEC" || id(ir_receiver_allowed_protocol) == "ALL") {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "NEC";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = x.command_repeats;
  
          ESP_LOGD("main", "NEC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
          
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }

  on_jvc:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == "JVC" || id(ir_receiver_allowed_protocol) == "ALL") {
          // set up common format address, command, command_repeats, etc
          std::string ir_protocolStr = "JVC";
          
          uint32_t ir_address = (x.data >> 8) & 0xFF;
          uint32_t ir_command = x.data & 0xFF;
          uint16_t ir_command_repeats = 0; // JVC protocol does not have have command_repeats 
  
          ESP_LOGD("main", "JVC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }

  on_sony:
    # Sony is handled differently because it does not have a true, separate per device address
    # Instead, Sony has a single long code of variable length. The entirety of which must be tested against.
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == "SONY" || id(ir_receiver_allowed_protocol) == "ALL") {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "SONY"; 
          
          uint32_t ir_address = 0; // Sony does not have separate address. In Sony IRmaps we set target_address to zero.
          uint32_t ir_command = x.data;
          uint16_t ir_command_repeats = 0; // Sony does not have command_repeats
  
          ESP_LOGD("main", "Sony Command:---- 0x%04X ----", (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }
      
  on_lg:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == "LG" || id(ir_receiver_allowed_protocol) == "ALL") {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "LG";
          
          uint32_t ir_address = 0; // LG does not have separate address. In LG IRmaps we set target_address to zero.
          uint32_t ir_command = x.data;
          uint16_t ir_command_repeats = 0; // LG does not have command_repeats
  
          ESP_LOGD("main", "LG Command:---- 0x%04X ----", (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }


  on_panasonic:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == "PANASONIC" || id(ir_receiver_allowed_protocol) == "ALL") {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "PANASONIC";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = 0; // RC5 does not have command_repeats
  
          ESP_LOGD("main", "PANASONIC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }


  on_rc5:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == "RC5" || id(ir_receiver_allowed_protocol) == "ALL") {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "RC5";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = 0; // RC5 does not have command_repeats
  
          ESP_LOGD("main", "RC5 Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }


  on_rc6:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == "RC6" || id(ir_receiver_allowed_protocol) == "ALL") {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "RC6";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = 0; // RC5 does not have command_repeats
  
          ESP_LOGD("main", "RC6 Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }





globals:
  - id: active_remote_layout
    type: int
    initial_value: ${def_profile}
    restore_value: yes

  - id: ir_receiver_allowed_protocol #ALL, NEC, JVC, SONY, LG, PANASONIC, RC5, RC6
    type: std::string
    restore_value: no
    
  - id: ir_receiver_mode
    # 0 deactivated (no active profile found)
    # 1 action
    # 2 set profile
    # 3 learn
    
    type: uint32_t
    restore_value: no
    initial_value: "0" #start disabled to avoid crash from errant ir noise at boot.

  - id: global_cached_command
    type: uint32_t
    initial_value: '0'
  - id: global_last_raw_packet_time
    type: uint32_t
    initial_value: '0'
  - id: global_initial_press_time
    type: uint32_t
    initial_value: '0'
  - id: global_last_processed_time
    type: uint32_t
    initial_value: '0'
  - id: global_sony_stream_time
    type: uint32_t
    initial_value: '0'
  - id: global_sony_frame_count
    type: int
    initial_value: '0'
  - id: global_is_holding
    type: bool
    initial_value: 'false'
    
  # SEQUENTIAL ENGINE STATE VARIABLES
  - id: global_token_clear_armed
    type: bool
    initial_value: 'false'
  - id: debounce_safety_lock
    type: bool
    initial_value: 'false'
  - id: global_intercept_active
    type: bool
    initial_value: 'false'
  - id: last_ir_press #time data for debouncing.
    type: uint32_t
    initial_value: '0'
    
  - id: commandName 
    type: std::string
    restore_value: no
    initial_value: '"                                "'     
    
  # Remote profile learning globals. 
  - id: ir_window_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: learned_best_command
    type: uint32_t
    restore_value: no
    initial_value: '0'
        
  - id: learn_sniff_start_time
    type: uint32_t
    initial_value: '0'
    restore_value: no


  - id: learn_last_save_time # used to avoid repeated button during IR learning.
    type: uint32_t
    initial_value: '0'
    restore_value: no
        
  - id: learn_active_protocol
    type: std::string
    initial_value: '""'
    restore_value: no
  - id: learn_active_address
    type: uint32_t
    initial_value: '0'
    restore_value: no

 
  - id: learn_detected_protocol
    type: std::string
    initial_value: '""'
    restore_value: no
  - id: learn_cache_protocol
    type: std::array<std::string, 5>
    initial_value: '{""}'
    restore_value: no
  - id: learn_cache_address
    type: std::vector<uint32_t>
    initial_value: '{0, 0, 0, 0, 0}'
    restore_value: no    
  - id: learn_cache_command
    type: std::vector<uint32_t>
    initial_value: '{0, 0, 0, 0, 0}'
    restore_value: no
  - id: learn_cache_idx   
    type: int
    initial_value: '-1'
    restore_value: no   

  - id: session_captured_codes #command codes are stored here during learning
    type: std::array<uint32_t, 27>
    initial_value: '{0}'
    restore_value: no
  - id: learn_current_button_idx
    type: int
    initial_value: '0'
    restore_value: no




#====================================================================
script:
  
  

  # ====================================================================
  # Load and link profiles from NVRAM. Doing after delay helps avoids core panic
  
  - id: standalone_system_hydration
    mode: single
    then:
      - delay: 1s  # Safe window allowing Bluetooth to cleanly finish opening NVS
      - lambda: |-
          ESP_LOGI("ir_hub", "Safe flash window open. Hydrating profiles via framework preference registry...");
          
          // 1. Call the function ALREADY in your ir_profile.h header file
          load_saved_flash_profiles();
          
          // 2. Safely map text targets to true ESPHome component button pointer addresses
          link_hardware_buttons();
          
          // 3. Fire background layout and profile execution engines
          id(setup_ir_receiver_for_current_profile).execute();
          id(ir_receiver_mode) = 1; // Set to action mode
          
          id(display_token_remote_profile).execute();
          
          ESP_LOGI("ir_hub", "Local memory profiles fully active and standalone-ready.");

  
  # ====================================================================
  # Erase learned profiles from NVS Memory Slots

  - id: wipe_all_nvs_profiles
    then:
      - lambda: |-
          ESP_LOGW("NVS Flash", "Factory wipe initiated. Clearing all 5 profile tracks...");
          
          static FlashStoredProfile blank_profile;
          
          for (uint16_t slot = 0; slot < 5; slot++) {
            uint64_t slot_nvs_key = 1948204712ULL + slot;
            auto pref_obj = esphome::global_preferences->make_preference<FlashStoredProfile>(slot_nvs_key);
            
            std::memset(&blank_profile, 0, sizeof(blank_profile));
            pref_obj.save(&blank_profile);
          }
          
          esphome::global_preferences->sync();

          if (remote_profiles.size() > factory_count) {
            remote_profiles.resize(factory_count);
          }
          
          id(active_remote_layout) = id(default_profile); // Reset profile to default Projector
          id(setup_ir_receiver_for_current_profile).execute();
          id(ir_receiver_mode) = 1; // Set to action mode

          
          ESP_LOGI("NVS Flash", "All segmented profile registers cleared. Vector restored to factory factory rules.");
          
          id(display_show)->execute(true,
                                   "Flash NVS Wiped",
                                   "All Chs Cleared",
                                   "Epson Default");


  # ====================================================================
  # IR code learning mode scrpts
  # ====================================================================


  - id: start_learning_mode
    then:
      - lambda: |-
          id(ir_receiver_mode) = 3; 
          id(learn_current_button_idx) = -1; // -1 means we are sniffing for the best protocol
          id(learn_sniff_start_time) = 0;
          id(learn_last_save_time) = 0; // reset button repeat lockout timer
          id(ir_receiver_allowed_protocol) = "ALL"; 
          
          id(display_show)->execute(false, "Learning IR", "Press Btn", "power_on");
          ESP_LOGI("IR Learn", "Learning active. Click power_on to establish protocol footprint.");
          
          id(learn_cache_clear).execute();
          
          // Start the 30-second timeout countdown
          id(learn_mode_timeout_watcher).execute();


  - id: learn_mode_timeout_watcher
    mode: restart
    then:
      - delay: 30s
      - lambda: |-
          // If 30 seconds pass without a key refreshing this timer, abort learning mode
          if (id(ir_receiver_mode) == 3) {
            ESP_LOGW("IR Learn", "Learning mode timed out due to inactivity. Reverting to action mode.");
            
            // Clean up state tracking variables
            id(learn_current_button_idx) = 0;
            id(learn_sniff_start_time) = 0;
            
            // Restore normal receiver properties
            id(setup_ir_receiver_for_current_profile).execute(); // Reload previous profile parameters
            id(ir_receiver_mode) = 1; // Return back to action mode

            id(display_show)->execute(false,
                                     "Learning Aborted",
                                     "Inactivity Timeout",
                                     "Action Mode");
          }

  - id: learn_cache_clear
    then:
      - lambda: |-
          for (uint16_t idx = 0; idx < 5; idx++) {
             id(learn_cache_protocol)[idx] = "";
             id(learn_cache_address)[idx] = 0;
             id(learn_cache_command)[idx] = 0;
          }
          id(learn_cache_idx) = -1;

  # ============= Button learning phase 0 and phase A settling timer
  # Does deferred assessement and handling of inbound IR during learing
  # Multiple IR signals are received with a single button push. Many are invalid.
  # Caching and evaluating them after all arrive allows section of valid one.
  # We separately analyze raw IR packets to determine underlying protocol.

  # ====================================================================
  # Button learning phase 0 and phase A settling timer
  # Does deferred assessment and handling of inbound IR during learning
  # ====================================================================
  - id: ir_settling_timer
    mode: single
    then: 
      - delay: 120ms
      - lambda: |-
          // 1. Declare the clock variable at the ABSOLUTE TOP of the block
          uint32_t now = millis();
          
          id(ir_window_active) = false;
          int b_idx = id(learn_current_button_idx);

          // 2. Safely apply the Sony repeat lockout condition check
          if (now - id(learn_last_save_time) < 500) {
            id(learn_cache_clear).execute();
            return;
          }

          static const std::vector<std::string> learn_button_names = {
            "power_on", "power_off", "cursor_left", "cursor_right", "cursor_up", "cursor_down",
            "cursor_enter", "settings_menu", "back", "home", "game_menu", "input", "picture",
            "focus_manual", "focus_auto", "shortcut_1", "shortcut_2", "shortcut_3", "shortcut_4",
            "volume_up", "volume_down", "mute", "token_sniff", "token_clear", "token_recall",
            "BT_start_pair", "BT_clear_pair"
          };

          if (b_idx < 27) {
            if (b_idx == -1) {
              if (id(learn_detected_protocol) == "UNKNOWN") {
                id(learn_cache_clear).execute();
                id(learn_active_protocol) = "";
                id(learn_active_address) = 0x0;             
                id(learned_best_command) = 0;             
                return; 
              }
            
              auto& primary_array = id(learn_cache_protocol);
              std::string target = id(learn_detected_protocol);
              auto it = std::find(primary_array.begin(), primary_array.end(), target);
            
              if (it == primary_array.end()) {
                id(learn_cache_clear).execute();
                id(learn_active_protocol) = "";
                id(learn_active_address) = 0x0;             
                id(learned_best_command) = 0;             
                return; 
              } else {
                int index = std::distance(primary_array.begin(), it);
                id(learn_active_address)  = id(learn_cache_address)[index];
                id(learn_active_protocol) = id(learn_detected_protocol);    
                id(ir_receiver_allowed_protocol) = id(learn_active_protocol);
                
                b_idx = 0;
                id(learn_current_button_idx) = 0;
              }   
            }
                
            // process IR captures into current button    
            auto& secondary_array = id(learn_cache_protocol);
            std::string active_target = id(learn_active_protocol);
            auto it = std::find(secondary_array.begin(), secondary_array.end(), active_target);
          
            if (it != secondary_array.end()) {
              int index = std::distance(secondary_array.begin(), it);
              
              id(learned_best_command) = id(learn_cache_command)[index]; 
              id(session_captured_codes).at(b_idx) = id(learned_best_command);
              
              // Lock the timestamp track so trailing repeats get ignored
              id(learn_last_save_time) = now; 
              
              b_idx++; 
              id(learn_current_button_idx) = b_idx;
              
              id(learn_cache_clear).execute();
              id(learn_mode_timeout_watcher).execute(); // Reset 30s timer
              
              // SAFE HALT GATE: Evaluate state ONLY after increment step completes
              if (b_idx < 27) {
                ESP_LOGI("IR Learn", "Press IR button for %s", learn_button_names.at(b_idx).c_str());
                id(display_show)->execute(false, "IR Learn:", "Press Btn", learn_button_names.at(b_idx));
              } else {
                ESP_LOGI("IR Learn", "All buttons captured! Awaiting save selection...0=OK  1=Up  2=Rt  3=Dn  4=Lf");
                id(display_show)->execute(true, "Mem Slot", "0=OK 1=Up 2=Rt=", "3=Dn 4=Lf");
              }
                  
            } else {
              id(learn_cache_clear).execute();
              id(learn_active_protocol) = "";
              id(learn_active_address) = 0x0;
              id(learned_best_command) = 0;             
              return; 
            }
          }


  # ====================================================================
  # handle ir button presses for all protocols after IR data converted to 
  # common format protocolStr, address, command, command_repeats
  # ====================================================================
  - id: general_IR_received_handler
    parameters:
      ir_protocolStr: std::string
      ir_address: uint32_t
      ir_command: uint32_t
      ir_command_repeats: uint16_t
    then:
      - lambda: |-
          uint32_t now = millis();

          // Fetch the current active remote layout index
          int current_idx = id(active_remote_layout);
          
          // Calculate true index. Wrapped FACTORY_COUNT to ensure scope access if defined globally.
          size_t true_hardware_index = (current_idx < 0) ? (factory_count + (current_idx * -1) - 1) : current_idx;

          // Abort if the index is out of bounds for your profile list
          if (true_hardware_index >= remote_profiles.size()) {
            return; 
          }
          
          const auto& active_profile = remote_profiles[true_hardware_index];
          
          //ESP_LOGD("IR HUB", "IR Receiver after current_idx. Current Mode: %lu", id(ir_receiver_mode));


          switch(id(ir_receiver_mode)) {
            case 0: {// deactivated --------------
              ESP_LOGD("IR HUB", "IR Receiver deactivated. No active profile.");

              break;
            }
            
            
            case 3: { // learn mode --------------

              static const std::vector<std::string> learn_button_names = {
                "power_on", "power_off", "cursor_left", "cursor_right", "cursor_up", "cursor_down",
                "cursor_enter", "settings_menu", "back", "home", "game_menu", "input", "picture",
                "focus_manual", "focus_auto", "shortcut_1", "shortcut_2", "shortcut_3", "shortcut_4",
                "volume_up", "volume_down", "mute", "token_sniff", "token_clear", "token_recall",
                "BT_start_pair", "BT_clear_pair"
              };

              int b_idx = id(learn_current_button_idx);

             
              // We received an ir signal, possibly one of several from an event. We do not yet know which is correct protocol.
              // Cache all inbound IR data. On_raw is simultaneously determining which protocol matche inbound signals.
              // at end of aggregation window, we will determine which of the received IR signals to use.
              
              int cache_idx = id(learn_cache_idx); // last slot that has been filled
              cache_idx++;
                 if (cache_idx < 5) {
                   id(learn_cache_protocol).at(cache_idx) = ir_protocolStr; // store inbound IR signal info
                   id(learn_cache_address)[cache_idx]  = ir_address;
                   id(learn_cache_command)[cache_idx]  = ir_command;
                   id(learn_cache_idx) = cache_idx;
                 }


              ESP_LOGD("IR Learn", "cache index  %d... command: 0x%X (Addr: 0x%X protocol %s)", 
                         cache_idx, (unsigned int)ir_command, (unsigned int)ir_address, ir_protocolStr.c_str());
                         
                                       
              if (!id(ir_window_active)) {
                // Open the 120ms aggregation gate.
                id(ir_window_active) = true;
                
                ESP_LOGD("IR Learn", "Opening 120ms aggregation window for button index %d... Staged: 0x%X (Addr: 0x%X via %s)", 
                         b_idx, (unsigned int)ir_command, (unsigned int)ir_address, ir_protocolStr.c_str());
                id(ir_settling_timer).execute();
              }                 
              

              // ====================================================================
              // PHASE B: SELECT STORAGE SLOT AND SAVE (Index 27)
              // ====================================================================
              if (b_idx == 27) {
                // SEPARATED CHECK: Evaluate the pressed command directly for saving targets
                int selected_slot = -1;

                // Match allocation slot using directional controls from the newly learned sequence
                if (ir_command == id(session_captured_codes).at(6))       selected_slot = 0; // cursor_enter (OK = slot 0)
                else if (ir_command == id(session_captured_codes).at(4))  selected_slot = 1; // cursor_up    (Up = slot 1)
                else if (ir_command == id(session_captured_codes).at(3))  selected_slot = 2; // cursor_right (Right = slot 2)
                else if (ir_command == id(session_captured_codes).at(5))  selected_slot = 3; // cursor_down  (Down = slot 3)
                else if (ir_command == id(session_captured_codes).at(2))  selected_slot = 4; // cursor_left  (Left = slot 4)
                
                if (selected_slot != -1) {
                  id(learn_mode_timeout_watcher).stop(); // Stop inactivity clock

                  IRProfile learned_profile;
                  learned_profile.profile_name = "Memory " + std::to_string(selected_slot);
                  learned_profile.protocol = id(learn_active_protocol);
                  learned_profile.device_address = id(learn_active_address);
                  
                  // Map security tokens matching standard indexing positions
                  learned_profile.cmd_clear_token_arm = id(session_captured_codes).at(23);  // token_clear
                  learned_profile.cmd_clear_token_fire = id(session_captured_codes).at(6);  // cursor_enter

                  // Dynamic pointer resolution link loop
                  for (size_t i = 0; i < learn_button_names.size(); i++) {
                    std::string b_id = learn_button_names.at(i);
                    learned_profile.cmd_codes[id(session_captured_codes).at(i)] = { b_id, resolve_button(b_id) };
                  }

                  // Fit profile into target vector index array placement (Slots 13 to 17)
                  size_t target_vector_index = factory_count + selected_slot;
                  while (remote_profiles.size() <= target_vector_index) {
                    remote_profiles.push_back({ "Placeholder", "NEC", 0, 0, 0, {} });
                  }
                  
                  remote_profiles[target_vector_index] = learned_profile;
                  ESP_LOGI("IR Learn", "Saved profile to vector slot %d (Memory Slot %d)", (int)target_vector_index, selected_slot);

                  // 1. Queue configuration to preference engine structures
                  commit_database_to_flash();
                  
                  ESP_LOGW("IR Learn", "Forcing instant NVS flash partition sync. Do not disconnect power...");
                  esphome::global_preferences->sync(); // <=== FORCES HARD INSTANT WRITE TO SILICON
                                
                  id(display_show)->execute(true, "Stored Profile", learned_profile.profile_name, "Operational");
                  
                  // change into negative index for learned profiles
                  id(active_remote_layout) = ((selected_slot + 1) * -1); 

                  id(setup_ir_receiver_for_current_profile).execute();
                  id(ir_receiver_mode) = 1; // Return to Action mode
 
                  return; // Hard return path to prevent falling past case logic
                  
                } else {
                  ESP_LOGW("IR Learn", "Invalid saving key pressed. Use your newly learned Arrow Keys or OK.");
                  return; // Keep waiting for a valid save mapping key press
                }
              }

              break;

            }  
            case 2: { // set profile ----------
              // Direct implementation approach: Test incoming packets.
              // If we find an absolute match, switch profiles and exit to Mode 1.
              // If no match, log it and do NOTHING, leaving the 30-second timer to close out.
              
              ESP_LOGD("IR HUB", "checking incoming packet against profile registry directly...");

              bool match_found = false;

              // Loop through all active profiles loaded in your global system vector in reverse order
              // Reverse order gives user learned profiles precedence over factory profiles
              for (size_t i = remote_profiles.size(); i > 0; ) {
                i--; // Decrement first to safely convert the 1-based count to a 0-based index
                const auto& profile = remote_profiles[i];
              
                // Gate 1: Check protocol matching constraints
                if (profile.protocol != ir_protocolStr) continue;
              
                // Gate 2: Check address validation loops
                if (profile.device_address != ir_address) continue;
              
                // Gate 3: Check if command hex code matches any target profile key
                if (profile.cmd_codes.find(ir_command) != profile.cmd_codes.end()) {
              
                  // SUCCESS PATH: Stop the 15-second countdown immediately!
                  id(set_profile_timeout_watcher).stop();
              
                  id(active_remote_layout) = static_cast<int>(i);
                  id(setup_ir_receiver_for_current_profile).execute();
                  id(ir_receiver_mode) = 1; // Return back to action mode
                  
                  id(display_show)->execute(true,
                                            "Setting Profile",
                                            profile.profile_name,
                                            "Wait 5 seconds");
                                            
                  match_found = true;
                  break; // Break completely out of the for-loop
                }
              }

              // --- DEFERRED FAILURE HANDLING ---
              // If the loop finished and no match flag was raised, let phantom protocols pass silently.
              if (!match_found) {
                ESP_LOGD("IR HUB", "Packet (%s, Addr: 0x%X, Cmd: 0x%X) did not match. Waiting for next decode stream...", 
                         ir_protocolStr.c_str(), (unsigned int)ir_address, (unsigned int)ir_command);
              }

              break; // Standard exit out of switch case 2
            }






            case 1: { // action -----------------------------------------------
              if (now - id(last_ir_press) < 30) return;
              id(last_ir_press) = now;


              ESP_LOGD("IR HUB", "IR Receiver normal IR button action processing.");

              //Reminder of IRProfile structure
              //struct IRProfile {
              //  std::string profile_name;
              //  std::string protocol;
              //  uint32_t device_address;
              //  uint32_t cmd_clear_token_arm;  
              //  uint32_t cmd_clear_token_fire; 
              //  std::map<uint32_t, IRCommand> cmd_codes;
  
              // active_profile.device_address


              // Handle special actions clear arming, and trigger first
              if (ir_address == active_profile.device_address) {
                if (ir_command == active_profile.cmd_clear_token_arm) {
                  id(global_token_clear_armed) = true;
                  id(token_clear_safety_timeout).execute();
                  
                  id(display_show)->execute(false,
                                           "Token Clear Requested",
                                           "To Confirm",
                                           "Press Select");
                  return; // STOP FLOW Armed to await fire code
                }
                
                if (ir_command == active_profile.cmd_clear_token_fire && id(global_token_clear_armed)) {
                  id(global_token_clear_armed) = false;
                  id(token_clear_safety_timeout).stop();
                  id(token_clear)->press(); // clears token and reports on myDisplay
                  return; // STOP FLOW fire code received. Token cleared.
                }
                
                if (ir_command != active_profile.cmd_clear_token_fire && ir_command != active_profile.cmd_clear_token_arm && id(global_token_clear_armed)) {
                  id(global_token_clear_armed) = false;
                  id(token_clear_safety_timeout).stop();
        
                  id(display_show)->execute(false,
                                           "Not Confirmed",
                                           "Wrong Key",
                                           "Canceled");
                  return; // STOP FLOW Unexpected non-fire code arrived. Cancel arming
                }
              }  
    
              // --- Normal IR action Path ---
      
              char cmd_buf[32] = {0};
              char addr_buf[32] = {0};
              snprintf(cmd_buf, sizeof(cmd_buf), "0x%04X", (unsigned int)ir_command);
              snprintf(addr_buf, sizeof(addr_buf), "0x%04X", (unsigned int)ir_address);
                      
              std::string commandStr(cmd_buf);
              std::string addressStr(addr_buf);
                      
              if (ir_address != active_profile.device_address) {
                // does not match target device adddress
                id(display_show)->execute(false,
                               ir_protocolStr + " protocol",
                               addressStr,
                               commandStr);
                
                id(global_cached_command) = 0;
                id(global_is_holding) = false;
                return; // STOP FLOW
      
              } else { 
                // matches device address. Change addressStr to human readable name
                addressStr = active_profile.profile_name; 
      
                // MODIFIED KEYPRESS STRATEGY BELOW:
                if (id(global_cached_command) != ir_command || id(global_initial_press_time) == 0) {
                  // A brand-new initial button click event
                  id(global_cached_command) = ir_command;
                  id(global_initial_press_time) = now; 
                  id(global_last_processed_time) = now;
                  id(global_last_raw_packet_time) = now; // Synchronize heartbeat
                  id(global_is_holding) = false;      
                  
                  // Execute first-press click immediately
                  id(ir_map_processor).execute(ir_command, false); 
                  
                } else {
                  // Ongoing stream of identical repeat packets (Epson holding pattern)
                  // Feed the heartbeat timer. DO NOT fire the map processor here.
                  // This lets the external interval loop evaluate the 500ms delay window.
                  id(global_last_raw_packet_time) = now;
                }
              }
              
              // Usually display of commandName, addressStr, and commandStr
              // However, if during processing the command, special info became displayed, showing_special_info indicates
              // we should not immediately overwrite special info. However, start a timer to clear showing_special_info state.
    
              if (id(showing_special_info) == true) {
                ESP_LOGD("Info Show", "Showing special info. Timer started.");
                id(showing_special_expiration_timer).execute();
              
              } else {
                // Show usual button press info. commandName is global in which processing against profile IRmap left human readable name of successfully mapped command.
                id(display_show)->execute(false,
                                             id(commandName),
                                             addressStr,
                                             commandStr);
              }       
             
              break;
            }
              
            default:
              // if we fall to here, something is awry with ir_receiver_mode
              ESP_LOGD("IR HUB", "Unknown ir_receiver_mode.");

              break;
          }
 

  # ====================================================================
  # Execute the actual actions commanded by inbound IR 
 
  - id: ir_map_processor
    parameters:
      ir_command: uint32_t
      is_hold: bool

    then:
      - lambda: |-
          int current_idx = id(active_remote_layout);
          if (!(0 <= current_idx && current_idx < remote_profiles.size())) {
            return; 
          }
          const auto& active_profile = remote_profiles[current_idx]; 

          auto it = active_profile.cmd_codes.find(ir_command);

          if (it != active_profile.cmd_codes.end()) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                // Safeguard allocations via assign
                id(commandName).assign(it->second.name + " (Hold)");
                ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
              } else {
                id(commandName).assign(it->second.name);
                ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
              }
            }
            
            // DIRECT ROUTING
            if (it->second.name == "token_sniff") {
              id(showing_special_info) = true;
              id(sniffing_sequence).execute(); 
            } 
            else if (it->second.name == "token_recall") {
              id(showing_special_info) = true;
              id(execute_token_recall_routine).execute();
            } 
            else if (it->second.name == "token_clear") {
              id(run_token_clear_worker).execute();
            }
            else if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
            
          } else {
            // SAFE RETRIEVAL GUARD RAIL:
            id(commandName).assign("Unassigned"); 
            ESP_LOGW("IR Guard", "Safely skipped an unmapped hex code sequence: 0x%X", (unsigned int)ir_command);
          }
 
 
 
  # ====================================================================
  # Set up IR receiver to accept commands from current profile

  - id: setup_ir_receiver_for_current_profile
    then:
      - lambda: |-
          int current_idx = id(active_remote_layout);
          size_t true_hardware_index = 0;

          // DYNAMIC TRANSLATION RAILS
          if (current_idx < 0) {
            // Its a custom learned profile! (e.g., -1 means Custom Slot 0)
            int custom_slot = (current_idx * -1) - 1; 
            true_hardware_index = factory_count + custom_slot;
          } else {
            // It is a standard factory profile
            true_hardware_index = current_idx;
          }
          
          // BOUNDARY CHECK USING TRANSLATED INDEX
          if (true_hardware_index >= remote_profiles.size()) {
            ESP_LOGW("Profile Control", "Target index out of bounds! Overriding to safe default layout...");
            id(active_remote_layout) = id(default_profile); 
            true_hardware_index = id(default_profile);
          }

          const auto& active_profile = remote_profiles[true_hardware_index];
          id(ir_receiver_mode) = 1; 
          id(ir_receiver_allowed_protocol) = active_profile.protocol;
          
          ESP_LOGI("Profile Control", "Profile layout '%s' engaged via index %d.", 
                   active_profile.profile_name.c_str(), current_idx);
          
          
  #----------------------------------------
  

  #----------------------------------------
  # High Speed Timeout Watcher Register Cleanup
  - id: ir_timeout_watcher
    mode: restart
    then:
      - while:
          condition:
            lambda: |-
               return (millis() - id(global_last_raw_packet_time) < 200);
          then:
            - delay: 15ms
      - lambda: |-
          id(global_cached_command) = 0;
          id(global_initial_press_time) = 0;  
          id(global_sony_stream_time) = 0;
          id(global_is_holding) = false;
          id(global_sony_frame_count) = 0;

  # Automatic hardware lock release timer step
  - id: release_debounce_lock
    then:
      - delay: 110ms
      - globals.set:
          id: debounce_safety_lock
          value: 'false'

  # Automated 5-Second Expiration Timer
  - id: token_clear_safety_timeout
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(global_token_clear_armed);'
          then:
            - globals.set:
                id: global_token_clear_armed
                value: 'false'
            - lambda: |-
                ESP_LOGI("IR Safety", "Sequence timed out. Gate locked.");
                id(myDisplay_line1) = "Timed Out";
                id(myDisplay_line2) = "Clear Token";
                id(myDisplay_line3) = "Canceled";


  # Showing special info expiration timer
  - id: showing_special_expiration_timer
    mode: restart
    then:
      - delay: 2s # how long without another IR button press before special display times out.
      - lambda: |-
                ESP_LOGD("Info Show", "Showing special info timed out.");
                id(showing_special_info) = false;


  - id: set_profile_timeout_watcher
    mode: restart # Automatically restarts the 15s clock if double-clicked repeatedly
    then:
      - delay: 15s
      - lambda: |-
          // If 15 seconds passed and the user is still stuck in setup profile mode, abort safely
          if (id(ir_receiver_mode) == 2) {
            id(ir_receiver_mode) = 1; // Return to action mode
            ESP_LOGW("IR Hub", "Set Profile Mode timed out after 30 seconds. Reverting to action mode.");
            
            // Restore active layout profile metadata on your display panel
            int current_idx = id(active_remote_layout);
            std::string current_name = "Default";
            if (0 <= current_idx && current_idx < remote_profiles.size()) {
              current_name = remote_profiles[current_idx].profile_name;
            }

            id(display_show)->execute(false,
                                     "Setup Timed Out",
                                     current_name,
                                     "Action Mode");
          }


