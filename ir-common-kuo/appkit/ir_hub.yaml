  # ====================================================================
  # WATCHDOG-SAFE COOPERATIVE ASYNCHRONOUS PLAYBACK ENGINE (LONG-HOLD EDITIONS)
  # ====================================================================
  - id: play_universal_shared_macro
    parameters:
      shared_slot_id: int
    mode: single
    then:
      - lambda: |-
          id(macro_playback_active) = true;
          uint64_t macro_nvs_key = 384720194ULL + shared_slot_id;
          auto pref_obj = esphome::global_preferences->make_preference<UniversalFlashMacro>(macro_nvs_key);
          
          pref_obj.load(&active_recording_buffer);
          
          if (active_recording_buffer.struct_version != CURRENT_MACRO_VERSION || active_recording_buffer.total_steps == 0) {
            ESP_LOGW("MACRO_PLAY", "Playback Aborted: Slot %d empty or version mismatch.", shared_slot_id);
            id(macro_playback_active) = false;
            id(showing_special_info) = true;
            id(display_show)->execute(false, "Playback Error", "Empty/Invalid Slot", "Action Mode");
            id(showing_special_expiration_timer).execute(); 
            return;
          }

          ESP_LOGI("MACRO_PLAY", "Starting Asynchronous Playback for Slot %d (%d steps cached)...", shared_slot_id, active_recording_buffer.total_steps);          
          id(showing_special_info) = true;
          id(display_show)->execute(false, "Macro Playing...", std::to_string(shared_slot_id), "Please wait...");

          id(macro_step_counter) = 0;
          
      - while:
          condition:
            lambda: |-
              extern UniversalFlashMacro active_recording_buffer; 
              return (id(macro_step_counter) < active_recording_buffer.total_steps);
          then:
            # ============================================================
            # STEP A: DYNAMIC PACING & KEEP-ALIVE COMPILER HOLD LOGIC
            # ============================================================
            - lambda: |-
                extern UniversalFlashMacro active_recording_buffer;
                int idx = id(macro_step_counter);
                uint32_t raw_delay = active_recording_buffer.steps[idx].delay_ms;

                id(macro_last_event_time) = raw_delay;
                ESP_LOGD("MACRO_PLAY", "   -> Step [%d]: Total delay budget: %ums", idx, (unsigned int)raw_delay);

            # If the current step is a release (UP) edge following a press (DOWN) edge,
            # we evaluate if the duration qualifies as a sustained hold (> 400 ms).
            - if:
                condition:
                  lambda: |-
                    extern UniversalFlashMacro active_recording_buffer;
                    int idx = id(macro_step_counter);
                    // Check if this step is a release edge meant to hold down an active key
                    return (active_recording_buffer.steps[idx].event_state == KEY_EVENT_UP && id(macro_last_event_time) > 400);
                then:
                  # --- SUSTAINED HOLD STREAMING GATES (> 300ms) ---
                  - while:
                      condition:
                        lambda: 'return (id(macro_last_event_time) > 40);'
                      then:
                        - delay: 40ms
                        - lambda: |-
                            extern UniversalFlashMacro active_recording_buffer;
                            int idx = id(macro_step_counter);
                            const auto& step = active_recording_buffer.steps[idx];

                            // Issue continuous keep-alive updates using the HOLDING state (1)
                            ESP_LOGV("MACRO_PLAY", "Sending Keep-Alive frame for: %s", step.action_string);
                            fire_bluetooth_hid_action(step.action_string, 1); 

                            // Deduct the elapsed interval from our pacing tracking cache
                            id(macro_last_event_time) -= 40;
                  
                  # Consume any small remaining remainder window under 40ms cleanly
                  - delay: !lambda "return id(macro_last_event_time);"

                else:
                  # --- STANDARD TAP DELAY PATH (<= 300ms) ---
                  - delay: !lambda "return id(macro_last_event_time);"


            # ============================================================
            # STEP B: UNIFIED HYBRID DRIVER INJECTION PIPELINE (PLAYBACK)
            # ============================================================
            - lambda: |-
                extern UniversalFlashMacro active_recording_buffer;
                int idx = id(macro_step_counter);
                const auto& step = active_recording_buffer.steps[idx];

                if (step.event_state == KEY_EVENT_DOWN) {
                  ESP_LOGI("MACRO_PLAY", "Firing Step [%d]: DOWN -> '%s'", idx, step.action_string);
                  
                  if (std::strcmp(step.action_string, "power_on") == 0) {
                    id(power_on).press();
                    id(macro_step_counter) = idx + 1;
                    return;
                  }
                  else if (std::strcmp(step.action_string, "power_off") == 0) {
                    id(power_off).press();
                    id(macro_step_counter) = idx + 1;
                    return;
                  }
                                    
                  // 🛠️ FIX: Direct pass-through to your existing, unified injection engine!
                  fire_bluetooth_hid_action(step.action_string, 0); // 0 = DOWN
                }
                else if (step.event_state == KEY_EVENT_UP) {
                  ESP_LOGI("MACRO_PLAY", "Firing Step [%d]: UP -> Releasing '%s'", idx, step.action_string);
                  
                  if (std::strcmp(step.action_string, "power_on") == 0 || std::strcmp(step.action_string, "power_off") == 0) {
                    id(macro_step_counter) = idx + 1;
                    return;
                  }
           
                  // 🛠️ FIX: Direct pass-through to your existing, unified injection engine!
                  fire_bluetooth_hid_action(step.action_string, 2); // 2 = UP
                }
                
                id(macro_step_counter) = idx + 1;

      - lambda: |-
          id(macro_playback_active) = false;
          ESP_LOGI("MACRO_PLAY", "Asynchronous macro playback completed successfully.");

          id(showing_special_info) = true;
          id(display_show)->execute(true, "Macro Complete", "All steps executed", "Action Mode");
          id(showing_special_expiration_timer).execute();



