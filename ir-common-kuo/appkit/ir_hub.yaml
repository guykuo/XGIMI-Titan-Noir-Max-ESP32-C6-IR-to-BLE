# ir-common-kuo/ir-hub.yaml

#====================================================================
#=========================== IR Receiver ============================  
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us       
  idle: 20ms         
  tolerance: 35%     
  # dump:
  #   - raw
  #   - nec
  #   - jvc
  #   - sony
  #   - lg
  #   - panasonic
  #   - rc5
  #   - rc6
    
  # 1. Updates timestamp every single time ANY raw IR pulse or repeat packet burst hits the pin
  on_raw:
    - lambda: |-
        id(global_last_raw_packet_time) = millis();
        if (!id(ir_timeout_watcher).is_running()) {
          id(ir_timeout_watcher).execute();
        }

    - lambda: |-
        // Boundary Check: Ensure we have at least 2 elements before querying array indices
        if (x.size() < 2) return;

        uint32_t head_mark = x[0];
        uint32_t head_space = std::abs(x[1]);
        size_t total_pulses = x.size();

        uint8_t proto = PROTO_UNKNOWN;

        // --- 1. MANCHESTER / SHORT-HEADER PROTOCOLS (RC5 & RC6) ---
        if (head_mark >= 700 && head_mark <= 1100 && total_pulses >= 18 && total_pulses <= 30) {
          proto = PROTO_RC5;
        }
        else if (head_mark >= 2400 && head_mark <= 2900 && head_space >= 700 && head_space <= 1100) {
          if (total_pulses >= 34 && total_pulses <= 46) {
            proto = PROTO_RC6;
          }
        }

        // --- 2. STANDARD SPACE/DISTANCE PROTOCOLS ---
        if (proto == PROTO_UNKNOWN) {
          // JVC Test: 8.4ms Mark / 4.2ms Space
          if (head_mark >= 7600 && head_mark < 8800 && head_space >= 3800 && head_space <= 4600) {
            proto = PROTO_JVC;
          }
          // SONY Test: Header pulse 2.4ms, short space < 900us, max 42 pulses
          else if (head_mark >= 2100 && head_mark <= 2700 && head_space < 900 && total_pulses <= 42) {
            proto = PROTO_SONY;
          }
          // PANASONIC Test: Header 3.4ms, space 1.7ms
          else if (head_mark >= 3100 && head_mark <= 3700 && head_space >= 1500 && head_space <= 2000) {
            proto = PROTO_PANASONIC;
          }
          // LG Test: Symmetric 4.5ms Mark / 4.5ms Space
          else if (head_mark >= 4000 && head_mark <= 5000 && head_space >= 4000 && head_space <= 5000) {
            proto = PROTO_LG;
          }
          // NEC / TViX Test: 9.0ms Mark
          else if (head_mark >= 8500 && head_mark <= 9500) {
            proto = PROTO_NEC;
          }
        }
        
        // --- 3. FALLBACK SANITY CHECK (For Headerless Repeat Packets) ---
        if (proto == PROTO_UNKNOWN) {
          if (total_pulses == 34 && head_mark >= 400 && head_mark <= 600 && head_space >= 1400 && head_space <= 1800) {
            proto = PROTO_JVC;
          }
          else if (total_pulses >= 24 && total_pulses <= 42 && head_space < 1000) {
            proto = PROTO_SONY;
          } 
          else if (total_pulses >= 64 && total_pulses <= 68) { proto = PROTO_NEC; }
          else if (total_pulses >= 96 && total_pulses <= 102) { proto = PROTO_PANASONIC; }
        }

        id(learn_detected_protocol) = proto;
        
        ESP_LOGD("IR_RECOGNIZER", "Detected Protocol: %s (Mark: %uus, Space: %uus, Pulses: %u)", 
         to_string(proto), (unsigned int)head_mark, (unsigned int)head_space, total_pulses);

  # ======= MULTI-PROTOCOL CONVERSION GATES =======

  on_nec:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_NEC || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "NEC";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = x.command_repeats;
  
          ESP_LOGD("main", "NEC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
          
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }

  on_jvc:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_JVC || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats, etc
          std::string ir_protocolStr = "JVC";
          
          uint32_t ir_address = (x.data >> 8) & 0xFF;
          uint32_t ir_command = x.data & 0xFF;
          uint16_t ir_command_repeats = 0; // JVC protocol does not have have command_repeats 
  
          ESP_LOGD("main", "JVC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }

  on_sony:
    # Sony is handled differently because it does not have a true, separate per device address
    # Instead, Sony has a single long code of variable length. The entirety of which must be tested against.
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_SONY || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "SONY"; 
          
          uint32_t ir_address = 0; // Sony does not have separate address. In Sony IRmaps we set target_address to zero.
          uint32_t ir_command = x.data;
          uint16_t ir_command_repeats = 0; // Sony does not have command_repeats
  
          ESP_LOGD("main", "Sony Command:---- 0x%04X ----", (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }
      
  on_lg:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_LG || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "LG";
          
          uint32_t ir_address = 0; // LG does not have separate address. In LG IRmaps we set target_address to zero.
          uint32_t ir_command = x.data;
          uint16_t ir_command_repeats = 0; // LG does not have command_repeats
  
          ESP_LOGD("main", "LG Command:---- 0x%04X ----", (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }


  on_panasonic:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_PANASONIC || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "PANASONIC";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = 0; // RC5 does not have command_repeats
  
          ESP_LOGD("main", "PANASONIC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }


  on_rc5:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_RC5 || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "RC5";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = 0; // RC5 does not have command_repeats
  
          ESP_LOGD("main", "RC5 Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }


  on_rc6:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_RC6 || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "RC6";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = 0; // RC5 does not have command_repeats
  
          ESP_LOGD("main", "RC6 Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }





globals:

  - id: active_remote_layout
    type: int
    initial_value: ${def_profile}
    restore_value: yes

  - id: ir_receiver_allowed_protocol 
    type: uint8_t
    restore_value: no
    initial_value: '0' # Default to PROTO_UNKNOWN (or write 255 if you want a global 'ALL' token flag)
    
  - id: ir_receiver_mode
    # 0 deactivated (no active profile found)
    # 1 action
    # 2 set profile
    # 3 learn
    type: uint32_t
    restore_value: no
    initial_value: "0" #start disabled to avoid crash from errant ir noise at boot.

  - id: global_cached_command
    type: uint32_t
    initial_value: '0'
  - id: global_last_raw_packet_time
    type: uint32_t
    initial_value: '0'
  - id: global_initial_press_time
    type: uint32_t
    initial_value: '0'
  - id: global_last_processed_time
    type: uint32_t
    initial_value: '0'
  - id: global_sony_stream_time
    type: uint32_t
    initial_value: '0'
  - id: global_sony_frame_count
    type: int
    initial_value: '0'
  - id: global_is_holding
    type: bool
    initial_value: 'false'
    
  # SEQUENTIAL ENGINE STATE VARIABLES
  - id: global_token_clear_armed
    type: bool
    initial_value: 'false'
  - id: debounce_safety_lock
    type: bool
    initial_value: 'false'
  - id: global_intercept_active
    type: bool
    initial_value: 'false'
  - id: last_ir_press #time data for debouncing.
    type: uint32_t
    initial_value: '0'
    
  - id: commandName 
    type: std::string
    restore_value: no
    initial_value: '"                                "'     
    
  # Remote profile learning globals. 
  - id: ir_window_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: learned_best_command
    type: uint32_t
    restore_value: no
    initial_value: '0'
        
  - id: learn_sniff_start_time
    type: uint32_t
    initial_value: '0'
    restore_value: no

  - id: learn_last_save_time # used to avoid repeated button during IR learning.
    type: uint32_t
    initial_value: '0'
    restore_value: no
        
  - id: learn_active_protocol
    type: uint8_t
    initial_value: '0' # Default to PROTO_UNKNOWN
    restore_value: no
    
  - id: learn_active_address
    type: uint32_t
    initial_value: '0'
    restore_value: no

  - id: learn_detected_protocol
    type: uint8_t
    initial_value: '0' # Default to PROTO_UNKNOWN
    restore_value: no
    
  - id: learn_cache_protocol
    type: std::array<uint8_t, 50>
    initial_value: '{0}' # Flattens array initialization cleanly for compiler tracks
    restore_value: no


  - id: learn_cache_address
    type: std::array<uint32_t, 50>
    initial_value: '{0, 0}'
    restore_value: no    

  - id: learn_cache_command
    type: std::array<uint32_t, 50>
    initial_value: '{0, 0}'
    restore_value: no
        
  - id: learn_cache_idx   
    type: int
    initial_value: '-1'
    restore_value: no   

  - id: session_captured_codes #command codes are stored here during learning
    type: std::array<uint32_t, 27>
    initial_value: '{0}'
    restore_value: no
  - id: learn_current_button_idx
    type: int
    initial_value: '0'
    restore_value: no




#====================================================================
script:
  
  

  # ====================================================================
  # Load and link profiles from NVRAM. Doing after delay helps avoids core panic
  
  - id: standalone_system_hydration
    mode: single
    then:
      - delay: 1s  # Safe window allowing Bluetooth to cleanly finish opening NVS
      - lambda: |-
          ESP_LOGI("ir_hub", "Safe flash window open. Hydrating profiles via framework preference registry...");
          
          // 1. Call the function ALREADY in your ir_profile.h header file
          load_saved_flash_profiles();
          
          // 2. Safely map text targets to true ESPHome component button pointer addresses
          link_hardware_buttons();
          
          // 3. Fire background layout and profile execution engines
          id(setup_ir_receiver_for_current_profile).execute();
          id(ir_receiver_mode) = 1; // Set to action mode
          
          id(display_token_remote_profile).execute();
          
          ESP_LOGI("ir_hub", "Local memory profiles fully active and standalone-ready.");

  
  # ====================================================================
  # Erase learned profiles from NVS Memory Slots (On-Demand Version)
  # ====================================================================
  - id: wipe_all_nvs_profiles
    then:
      - lambda: |-
          ESP_LOGW("NVS Flash", "Factory wipe initiated. Clearing all custom profile tracks...");
          
          static FlashStoredProfile blank_profile;
          
          // Clear all isolated custom preference database slots sequentially
          for (uint16_t slot = 0; slot < MAX_LEARNED_PROFILES; slot++) {
            uint64_t slot_nvs_key = 1948204712ULL + slot;
            auto pref_obj = esphome::global_preferences->make_preference<FlashStoredProfile>(slot_nvs_key);
            
            std::memset(&blank_profile, 0, sizeof(blank_profile));
            pref_obj.save(&blank_profile);
          }
          
          esphome::global_preferences->sync();

          // Reset selection layout tracking parameters to your safe factory default
          id(active_remote_layout) = id(default_profile); 
          
          // ============================================================
          // HYDRATE DEFAULT FACTORY REMOTE BACK INTO ACTIVE WORKSPACE
          // ============================================================
          load_profile_to_workspace(id(default_profile));
          // ============================================================
          
          id(setup_ir_receiver_for_current_profile).execute();
          id(ir_receiver_mode) = 1; // Return safely back to active Action Mode

          ESP_LOGI("NVS Flash", "All custom memory blocks wiped cleanly. System restored to default factory rules.");

          // Display panel text status sync pass
          int current_idx = id(active_remote_layout);
          
          // Because the workspace container is fully hydrated, we can read its profile name directly
          id(display_show)->execute(true,
                                   "Memory Profiles",
                                   "All Cleared",
                                   "Using " + active_profile_workspace.profile_name);



  # ====================================================================
  # IR code learning mode scripts
  # ====================================================================


  - id: start_learning_mode
    then:
      - lambda: |-
          id(ir_receiver_mode) = 3; 
          id(learn_current_button_idx) = -1; // -1 means we are sniffing for the best protocol
          id(learn_sniff_start_time) = 0;
          id(learn_last_save_time) = 0; // reset button repeat lockout timer
          id(ir_receiver_allowed_protocol) = 255; //255 is ALL
          
          id(display_show)->execute(false, "LEARNING IR", "Press Btn", "power_on");
          ESP_LOGI("IR Learn", "Learning active. Click power_on to establish protocol footprint.");
          
          id(learn_cache_clear).execute();
          
          // Start the 30-second timeout countdown
          id(learn_mode_timeout_watcher).execute();


  - id: learn_mode_timeout_watcher
    mode: restart
    then:
      - delay: 30s
      - lambda: |-
          // If 30 seconds pass without a key refreshing this timer, abort learning mode
          if (id(ir_receiver_mode) == 3) {
            ESP_LOGW("IR Learn", "Learning mode timed out due to inactivity. Reverting to action mode.");
            
            // Clean up state tracking variables
            id(learn_current_button_idx) = 0;
            id(learn_sniff_start_time) = 0;
            
            // Restore normal receiver properties
            id(setup_ir_receiver_for_current_profile).execute(); // Reload previous profile parameters
            id(ir_receiver_mode) = 1; // Return back to action mode

            id(display_show)->execute(false,
                                     "Learning Aborted",
                                     "Inactivity Timeout",
                                     "Action Mode");
          }


  - id: learn_cache_clear
    then:
      - lambda: |-
          for (size_t idx = 0; idx < id(learn_cache_protocol).size(); idx++) {
             id(learn_cache_protocol)[idx] = PROTO_UNKNOWN;
             id(learn_cache_address)[idx] = 0;
             id(learn_cache_command)[idx] = 0;
          }
          id(learn_cache_idx) = -1;


  # ====================================================================
  # Button learning phase 0 and phase A settling timer
  # Does deferred assessement and handling of inbound IR during learing
  # Multiple IR signals are received with a single button push. Many are invalid.
  # Caching and evaluating them after all arrive allows section of valid one.
  # We separately analyze raw IR packets to determine underlying protocol.

  - id: ir_settling_timer
    mode: single
    then: 
      - delay: 120ms
      - lambda: |-
          uint32_t now = millis();
          
          id(ir_window_active) = false;
          int b_idx = id(learn_current_button_idx);

          // 2. Safe repeat lockout condition check
          if (now - id(learn_last_save_time) < 500) {
            id(learn_cache_clear).execute();
            return;
          }

          if (b_idx < (int)TOTAL_LEARN_BUTTONS) {
            if (b_idx == -1) {
              if (id(learn_detected_protocol) == PROTO_UNKNOWN) {
                id(learn_cache_clear).execute();
                id(learn_active_protocol) = PROTO_UNKNOWN;
                id(learn_active_address) = 0x0;             
                id(learned_best_command) = 0;             
                return; 
              }
            
              auto& primary_array = id(learn_cache_protocol);
              uint8_t target = id(learn_detected_protocol);
              
              // Search strictly within the range defined by MAX_LEARNED_PROFILES
              int index = -1;
              for (int i = 0; i < MAX_LEARNED_PROFILES; i++) {
                if (primary_array[i] == target) {
                  index = i;
                  break;
                }
              }
            
              if (index == -1) {
                id(learn_cache_clear).execute();
                id(learn_active_protocol) = PROTO_UNKNOWN;
                id(learn_active_address) = 0x0;             
                id(learned_best_command) = 0;             
                return; 
              } else {
                id(learn_active_address)  = id(learn_cache_address)[index];
                id(learn_active_protocol) = id(learn_detected_protocol);    
                id(ir_receiver_allowed_protocol) = id(learn_active_protocol);
                
                b_idx = 0;
                id(learn_current_button_idx) = 0;
              }   
            }
            
            // CRITICAL DEFENSIVE GUARD: Explicitly block negative indices from reaching downstream handlers
            if (b_idx < 0 || b_idx >= (int)TOTAL_LEARN_BUTTONS) {
              id(learn_cache_clear).execute();
              return;
            }
                
            // Process IR captures into current button    
            auto& secondary_array = id(learn_cache_protocol);
            uint8_t active_target = id(learn_active_protocol);
            
            int index = -1;
            for (size_t i = 0; i < secondary_array.size(); i++) {
              if (secondary_array[i] == active_target) {
                index = i;
                break;
              }
            }
          
            if (index != -1) {
              id(learned_best_command) = id(learn_cache_command)[index]; 
              id(session_captured_codes).at(b_idx) = id(learned_best_command);

              // Lock the timestamp track so trailing repeats get ignored
              id(learn_last_save_time) = now; 
              
              b_idx++; 
              id(learn_current_button_idx) = b_idx;
              
              // Flash sequence alterations
              if (b_idx == (int)TOTAL_LEARN_BUTTONS) {
                id(flash_led_custom).execute(5, 100, 0.6, 1.0, 0.0);
                id(flash_led_custom).execute(5, 150, 0.2, 1.0, 0.4);
              } else {
                if (b_idx % 5 == 0) {
                  id(flash_led_custom).execute(1, 460, 0.0, 1.0, 0.0);
                } else {
                  id(flash_led_custom).execute(1, 200, 0.6, 1.0, 0.6);
                }              
              }
              
              id(learn_cache_clear).execute();
              id(learn_mode_timeout_watcher).execute(); // Reset 30s timer
              
              // SAFE HALT GATE: Evaluate state ONLY after increment step completes
              if (b_idx < (int)TOTAL_LEARN_BUTTONS) {
                ESP_LOGI("IR Learn", "Press ====== IR BUTTON ====== %s ======", learn_button_names[b_idx]);
                id(display_show)->execute(false, "IR Learn:", "Press Btn", std::string(learn_button_names[b_idx]));
              } else {
                ESP_LOGI("IR Learn", "All buttons captured! ====== Awaiting save selection...0=OK  1=Up  2=Rt  3=Dn  4=Lf");
                id(display_show)->execute(true, "Mem Slot", "0=OK 1=Up 2=Rt=", "3=Dn 4=Lf");
              }
                  
            } else {
              id(learn_cache_clear).execute();
              id(learn_active_protocol) = PROTO_UNKNOWN;
              id(learn_active_address) = 0x0;
              id(learned_best_command) = 0;             
              return; 
            }
          }


  # ====================================================================
  # handle ir button presses for all protocols after IR data converted to 
  # common format protocolStr, address, command, command_repeats
  # ====================================================================
  - id: general_IR_received_handler
    parameters:
      ir_protocolStr: std::string
      ir_address: uint32_t
      ir_command: uint32_t
      ir_command_repeats: uint16_t
    then:
      - lambda: |-
          uint32_t now = millis();

          uint8_t incoming_proto = PROTO_UNKNOWN;
          if (ir_protocolStr == "NEC") incoming_proto = PROTO_NEC;
          else if (ir_protocolStr == "JVC") incoming_proto = PROTO_JVC;
          else if (ir_protocolStr == "SONY") incoming_proto = PROTO_SONY;
          else if (ir_protocolStr == "LG") incoming_proto = PROTO_LG;
          else if (ir_protocolStr == "PANASONIC") incoming_proto = PROTO_PANASONIC;
          else if (ir_protocolStr == "RC5") incoming_proto = PROTO_RC5;
          else if (ir_protocolStr == "RC6") incoming_proto = PROTO_RC6;

          // Fetch the current active remote layout index
          int current_idx = id(active_remote_layout);
          int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;
          
          if (current_idx < 0 || current_idx >= total_valid_slots) {
            ESP_LOGE("IR_HUB", "Active remote layout index %d is out of bounds!", current_idx);
            return; 
          }
          
          // Pull constraints instantly straight out of the active runtime workspace
          const auto& active_profile = active_profile_workspace;


          switch(id(ir_receiver_mode)) {
            case 0: { // deactivated --------------
              ESP_LOGD("IR HUB", "IR Receiver deactivated. No active profile.");
              break;
            } // -- end case 0

            case 1: { // action -----------------------------------------------
              if (now - id(last_ir_press) < 120) return; // Low limit before debounce failure
              id(last_ir_press) = now;

              // Pull constraints instantly straight out of the active runtime workspace
              const auto& active_profile = active_profile_workspace;

              ESP_LOGI("IR_HUB", "IR processing Protocol %s      Address 0x%X,      Command 0x%X", ir_protocolStr.c_str(), (unsigned int)ir_address, (unsigned int)ir_command);

              // --- Handle special actions: clear arming, and trigger first ---
              if (ir_address == active_profile.device_address) {
                if (ir_command == active_profile.cmd_clear_token_arm) {
                  id(global_token_clear_armed) = true;
                  id(token_clear_safety_timeout).execute();
                  id(display_show)->execute(false, "Token Clear Requested", "To Confirm", "Press Select");
                  return; 
                }
                if (ir_command == active_profile.cmd_clear_token_fire && id(global_token_clear_armed)) {
                  id(global_token_clear_armed) = false;
                  id(token_clear_safety_timeout).stop();
                  id(token_clear)->press(); 
                  return; 
                }
                if (ir_command != active_profile.cmd_clear_token_fire && ir_command != active_profile.cmd_clear_token_arm && id(global_token_clear_armed)) {
                  id(global_token_clear_armed) = false;
                  id(token_clear_safety_timeout).stop();
                  id(display_show)->execute(false, "Not Confirmed", "Wrong Key", "Canceled");
                  return; 
                }
              }  
    
              // --- Normal IR action Path & Matching ---
              const IRCommand* found_cmd = nullptr;
              for (const auto& kv_pair : active_profile.cmd_codes) {
                if (kv_pair.first == ir_command && ir_address == active_profile.device_address) {
                  found_cmd = &kv_pair.second;
                  break;
                }
              }

              char cmd_buf[32] = {0};
              char addr_buf[32] = {0};
              snprintf(cmd_buf, sizeof(cmd_buf), "0x%04X", (unsigned int)ir_command);
              snprintf(addr_buf, sizeof(addr_buf), "0x%04X", (unsigned int)ir_address);
                      
              std::string commandStr(cmd_buf);
              std::string addressStr(addr_buf);
                      
              if (found_cmd == nullptr) {
                id(display_show)->execute(false, ir_protocolStr + " protocol", addressStr, commandStr);
                id(global_cached_command) = 0;
                id(global_is_holding) = false;
                return; 
              } else { 
                addressStr = active_profile.profile_name; 
                
                // ============================================================
                // RESTORED TIMING TRACKING ENGINE LINES
                // ============================================================
                if (id(global_cached_command) != ir_command || id(global_initial_press_time) == 0) {
                  id(global_cached_command) = ir_command;
                  id(global_initial_press_time) = now; 
                  id(global_last_processed_time) = now;
                  id(global_last_raw_packet_time) = now; 
                  id(global_is_holding) = false;      
                  
                  // Executing hidden action paths on the fly via visible token name
                  id(commandName).assign(found_cmd->name);

                  if (std::strcmp(found_cmd->name, "token_sniff") == 0) {
                    id(showing_special_info) = true;
                    id(sniffing_sequence).execute(); 
                  } 
                  else if (std::strcmp(found_cmd->name, "token_recall") == 0) {
                    id(showing_special_info) = true;
                    id(execute_token_recall_routine).execute();
                  } 
                  else if (std::strcmp(found_cmd->name, "token_clear") == 0) {
                    id(run_token_clear_worker).execute();
                  }
                  else {
                    auto* dynamic_button_target = resolve_button(found_cmd->name);
                    if (dynamic_button_target != nullptr) {
                       dynamic_button_target->press();
                    }
                  }
                } else {
                  id(global_last_raw_packet_time) = now;
                }
                // ============================================================
              }
              
              ESP_LOGI("IR HUB", "Translated to Xgimi %s", id(commandName).c_str());

              if (id(showing_special_info) == true) {
                ESP_LOGD("IR HUB", "Showing special info. Timer started.");
                id(showing_special_expiration_timer).execute();
              } else {
                id(display_show)->execute(false, id(commandName), addressStr, commandStr);
              }       
              break;
            } //-- end case 1


            case 2: { // set profile ----------
              ESP_LOGD("IR HUB", "Checking incoming packet against profile registry via Flash Streaming...");
              bool match_found = false;
              int matched_index = -1;
              int factory = static_cast<int>(factory_count);

              // 1. SCAN CUSTOM NVS FLASH SLOTS FIRST (Iterating backwards like your original code)
              for (int slot = MAX_LEARNED_PROFILES - 1; slot >= 0; slot--) {
                uint64_t slot_nvs_key = 1948204712ULL + slot;
                auto pref_obj = esphome::global_preferences->make_preference<FlashStoredProfile>(slot_nvs_key);
                
                static FlashStoredProfile flash_p;
                if (pref_obj.load(&flash_p) && flash_p.struct_version == CURRENT_STRUCT_VERSION) {
                  // Fast validation check: Skip blank templates or protocol mismatches instantly
                  if (flash_p.total_keys == 0 || flash_p.protocol != incoming_proto || flash_p.device_address != ir_address) {
                    continue; 
                  }
                  
                  // Scan the keys residing entirely inside this temporary stack-allocated flash block
                  for (uint16_t k = 0; k < flash_p.total_keys; k++) {
                    if (flash_p.keys[k].hex_code == ir_command) {
                      matched_index = factory + slot; // Calculate true dynamic index position
                      match_found = true;
                      break;
                    }
                  }
                }
                if (match_found) break;
              }

              // 2. SCAN HARDCODED FACTORY PROFILES ON-DEMAND IF NO CUSTOM MATCH WAS FOUND
              if (!match_found) {
                for (int i = 0; i < factory; i++) {
                  // Stream factory layout headers temporarily into the single RAM workspace container
                  load_profile_to_workspace(i);
                  
                  if (active_profile_workspace.protocol == incoming_proto && active_profile_workspace.device_address == ir_address) {
                    for (const auto& kv_pair : active_profile_workspace.cmd_codes) {
                      if (kv_pair.first == ir_command) {
                        matched_index = i;
                        match_found = true;
                        break;
                      }
                    }
                  }
                  if (match_found) break;
                }
              }

              // 3. EXECUTE METADATA ENGAGEMENT PASS IF A PROFILE KEY MATCH WAS FOUND
              if (match_found && matched_index != -1) {
                id(set_profile_timeout_watcher).stop();
                
                // Hydrate and lock the true winning layout completely into active RAM workspace
                load_profile_to_workspace(matched_index);
                
                id(active_remote_layout) = matched_index;
                id(setup_ir_receiver_for_current_profile).execute();
                id(ir_receiver_mode) = 1; // Securely revert right back to Action Mode
                
                id(flash_led_custom).execute(4, 50, 1.0, 0.0, 0.0);
                id(flash_led_custom).execute(2, 100, 0.0, 1.0, 0.0);

                id(display_show)->execute(true, "Setting Profile", 
                                                active_profile_workspace.profile_name, 
                                                "Wait 5 seconds");
                // FORCE AN INSTANT FOREGROUND REFRESH
                id(last_active_idx_seen) = matched_index;
                static char ir_change_buf[128];
                const char* kind = (matched_index < factory) ? "internal" : "custom";
                snprintf(ir_change_buf, sizeof(ir_change_buf), "idx=%d  %s  [%s]",
                         matched_index,
                         active_profile_workspace.profile_name.c_str(),
                         kind);
                id(ir_active_profile_ts).publish_state(ir_change_buf);
                // =====
                                                
                                                
              } else {
                // SAFETY ARREST FALLBACK: If the scanned code completely missed all records, 
                // instantly rehydrate your actually running configuration layout back into RAM
                load_profile_to_workspace(id(active_remote_layout));
                ESP_LOGD("IR HUB", "No profile registry match found for incoming signature.");
              }
              break;
            } //-- end case 2


            case 3: { // learn mode --------------
              int b_idx = id(learn_current_button_idx);

              int cache_idx = id(learn_cache_idx);
              cache_idx++;
              if (cache_idx < MAX_LEARNED_PROFILES) {
                id(learn_cache_protocol)[cache_idx] = incoming_proto;
                id(learn_cache_address)[cache_idx]  = ir_address;
                id(learn_cache_command)[cache_idx]  = ir_command;
                id(learn_cache_idx) = cache_idx;
              }

              ESP_LOGD("IR Learn", "cache index %d... command: 0x%X", cache_idx, (unsigned int)ir_command);
                         
              if (!id(ir_window_active)) {
                id(ir_window_active) = true;
                id(ir_settling_timer).execute();
              }                 
              
              // --- Evaluation Step: User has completed all button pushes ---
              if (b_idx == (int)TOTAL_LEARN_BUTTONS) {
                int selected_slot = -1;
                
                // Inspecting the captured codes inside your local workspace arrays
                if (ir_command == id(session_captured_codes).at(6))       selected_slot = 0;
                else if (ir_command == id(session_captured_codes).at(4))  selected_slot = 1;
                else if (ir_command == id(session_captured_codes).at(3))  selected_slot = 2;
                else if (ir_command == id(session_captured_codes).at(5))  selected_slot = 3;
                else if (ir_command == id(session_captured_codes).at(2))  selected_slot = 4;
                
                if (selected_slot != -1) {
                  id(learn_mode_timeout_watcher).stop();

                  // Hydrate our temporary single container in memory with the newly learned data
                  active_profile_workspace.profile_name = "Memory " + std::to_string(selected_slot);
                  active_profile_workspace.protocol = id(learn_active_protocol);
                  active_profile_workspace.device_address = id(learn_active_address);
                  active_profile_workspace.cmd_clear_token_arm = id(session_captured_codes).at(23);
                  active_profile_workspace.cmd_clear_token_fire = id(session_captured_codes).at(6);

                  active_profile_workspace.cmd_codes.clear();
                  active_profile_workspace.cmd_codes.reserve((int)TOTAL_LEARN_BUTTONS);
                  
                  for (size_t i = 0; i < (int)TOTAL_LEARN_BUTTONS; i++) {
                    IRCommand cmd;
                    std::strncpy(cmd.name, learn_button_names[i], sizeof(cmd.name) - 1);
                    cmd.name[sizeof(cmd.name) - 1] = '\0';
                    
                    // Hidden remote comment label maps cleanly directly out of our single truth name tables
                    std::strncpy(cmd.button_name, learn_button_names[i], sizeof(cmd.button_name) - 1);
                    cmd.button_name[sizeof(cmd.button_name) - 1] = '\0';

                    active_profile_workspace.cmd_codes.push_back({ id(session_captured_codes).at(i), cmd });
                  }

                  // ============================================================
                  // FLUSH THE ACTIVE RAM CONTAINER STRAIGHT TO FLASH SLOTS
                  // ============================================================
                  commit_database_to_flash(selected_slot);
                  // ============================================================

                  id(flash_led_custom).execute(4, 100, 0.0, 0.0, 1.0);
                  id(flash_led_custom).execute(2, 200, 0.0, 1.0, 0.0);
                  id(display_show)->execute(true, "Stored Profile", active_profile_workspace.profile_name, "Operational");
                  
                  size_t target_vector_index = factory_count + selected_slot;
                  id(active_remote_layout) = (int)target_vector_index; 
                  id(setup_ir_receiver_for_current_profile).execute();
                  id(ir_receiver_mode) = 1; // Return safely to Action Mode
                  return;
                } else {
                  ESP_LOGW("IR Learn", "Invalid saving key pressed.");
                  return;
                }
              }
              break;
            } //-- end case 3



              
            default:
              // if we fall to here, something is awry with ir_receiver_mode
              ESP_LOGD("IR HUB", "Unknown ir_receiver_mode.");

              break;
          }
 

  # ====================================================================
  # Execute the actual actions commanded by inbound IR 
 
  - id: ir_map_processor
    parameters:
      ir_command: uint32_t
      is_hold: bool

    then:
      - lambda: |-
          int current_idx = id(active_remote_layout);
          int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;
          if (!(0 <= current_idx && current_idx < total_valid_slots)) return;
          
          const auto& active_profile = active_profile_workspace; 

          const IRCommand* found_cmd = nullptr;
          for (const auto& kv_pair : active_profile.cmd_codes) {
            if (kv_pair.first == ir_command) {
              found_cmd = &kv_pair.second;
              break;
            }
          }

          if (found_cmd != nullptr) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                // HARDENED: Raw character buffer evaluation avoids generating dynamic string duplicates
                id(commandName).assign(std::string(found_cmd->name) + " (Hold)");
              } else {
                id(commandName).assign(found_cmd->name);
              }
            }
            
            if (std::strcmp(found_cmd->name, "token_sniff") == 0) {
              id(showing_special_info) = true;
              id(sniffing_sequence).execute(); 
            } 
            else if (std::strcmp(found_cmd->name, "token_recall") == 0) {
              id(showing_special_info) = true;
              id(execute_token_recall_routine).execute();
            } 
            else if (std::strcmp(found_cmd->name, "token_clear") == 0) {
              id(run_token_clear_worker).execute();
            }
            else {
              auto* dynamic_button_target = resolve_button(found_cmd->name);
              if (dynamic_button_target != nullptr) {
                 dynamic_button_target->press();
              }
            }
          } else {
            id(commandName).assign("Unassigned"); 
          }

 
 
  # ====================================================================
  # Set up IR receiver to accept commands from current profile

  - id: setup_ir_receiver_for_current_profile
    then:
      - lambda: |-
          size_t true_hardware_index = id(active_remote_layout);

          if (true_hardware_index >= remote_profiles.size()) {
            ESP_LOGW("Profile Control", "Target index out of bounds! Overriding to safe default layout...");
            id(active_remote_layout) = id(default_profile); 
            true_hardware_index = id(default_profile);
          }

          const auto& active_profile = remote_profiles[true_hardware_index];
          id(ir_receiver_mode) = 1; 
          
          // FIXED: Fast byte copy handles validation permissions instantaneously with 0 allocations
          id(ir_receiver_allowed_protocol) = active_profile.protocol;
          
          ESP_LOGI("Profile Control", "Profile layout '%s' engaged via index %d.", 
                   active_profile.profile_name.c_str(), (int)true_hardware_index); 
          
          
  #----------------------------------------
  

  #----------------------------------------
  # High Speed Timeout Watcher Register Cleanup
  - id: ir_timeout_watcher
    mode: restart
    then:
      - while:
          condition:
            lambda: |-
               return (millis() - id(global_last_raw_packet_time) < 200);
          then:
            - delay: 15ms
      - lambda: |-
          id(global_cached_command) = 0;
          id(global_initial_press_time) = 0;  
          id(global_sony_stream_time) = 0;
          id(global_is_holding) = false;
          id(global_sony_frame_count) = 0;

  # Automatic hardware lock release timer step
  - id: release_debounce_lock
    then:
      - delay: 110ms
      - globals.set:
          id: debounce_safety_lock
          value: 'false'

  # Automated 5-Second Expiration Timer
  - id: token_clear_safety_timeout
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(global_token_clear_armed);'
          then:
            - globals.set:
                id: global_token_clear_armed
                value: 'false'
            - lambda: |-
                ESP_LOGI("IR Safety", "Sequence timed out. Gate locked.");
                id(myDisplay_line1) = "Timed Out";
                id(myDisplay_line2) = "Clear Token";
                id(myDisplay_line3) = "Canceled";


  # Showing special info expiration timer
  - id: showing_special_expiration_timer
    mode: restart
    then:
      - delay: 2s # how long without another IR button press before special display times out.
      - lambda: |-
                ESP_LOGD("Info Show", "Showing special info timed out.");
                id(showing_special_info) = false;


  - id: set_profile_timeout_watcher
    mode: restart # Automatically restarts the 15s clock if double-clicked repeatedly
    then:
      - delay: 15s
      - lambda: |-
          // If 15 seconds passed and the user is still stuck in setup profile mode, abort safely
          if (id(ir_receiver_mode) == 2) {
            id(ir_receiver_mode) = 1; // Return to action mode
            ESP_LOGW("IR Hub", "Set Profile Mode timed out after 30 seconds. Reverting to action mode.");
            
            // Restore active layout profile metadata on your display panel
            int current_idx = id(active_remote_layout);
            std::string current_name = "Default";
            if (0 <= current_idx && current_idx < remote_profiles.size()) {
              current_name = remote_profiles[current_idx].profile_name;
            }

            id(display_show)->execute(false,
                                     "Setup Timed Out",
                                     current_name,
                                     "Action Mode");
          }


# ==================================================          
     
interval:
  
  # ================================================
  # TIMER 1: Process IR hold repeat loops
  # ================================================
  - interval: 80ms
    then:
      - lambda: |-
          uint32_t now = millis();
          if (id(global_cached_command) != 0) {
            if (now - id(global_last_raw_packet_time) >= 100) return; 
            if (id(global_is_holding)) {
              id(ir_map_processor).execute(id(global_cached_command), true);
            } else {
              if (now - id(global_initial_press_time) >= 400) { 
                id(global_is_holding) = true;
                id(ir_map_processor).execute(id(global_cached_command), true);
              }
            }
          }
     
  # ====================================================================
  # TIMER 2: True One-Shot Post-Boot Storage Recovery & Workspace Hydration
  # ====================================================================
  - interval: 1.0sec 
    id: boot_initialization_timer 
    then:
      - lambda: |-
          ESP_LOGI("ir_hub", "Executing secure unified workspace hydration pass...");
          
          // 1. Read the last saved profile index directly from your global persistent preference register
          int boot_idx = id(active_remote_layout); 
          
          flash_hydration_complete = true; 

          // Safety boundary defense ceiling check against empty or corrupted memory states
          int total_valid_slots = static_cast<int>(factory_count) + MAX_LEARNED_PROFILES;
          if (boot_idx < 0 || boot_idx >= total_valid_slots) {
            boot_idx = id(default_profile);
            id(active_remote_layout) = boot_idx;
          }

          // 2. TRIGGER ON-DEMAND HYDRATION: Pull exactly one layout block into your active RAM workbench
          load_profile_to_workspace(boot_idx);
          id(selected_profile_slot) = boot_idx;

          // 3. Synchronize your frontend dashboard dropdown tracking box component state seamlessly
          auto select_obj = id(ir_profile_slot_selector);
          if (boot_idx >= 0 && boot_idx < (int)select_obj->traits.get_options().size()) {
            select_obj->publish_state(select_obj->traits.get_options()[boot_idx]);
          }
          // FORCE INITIAL TEXT SENSOR POPULATION AT BOOT
          static char boot_buf[128];
          const char* kind = (boot_idx < (int)factory_count) ? "internal" : "custom";
          snprintf(boot_buf, sizeof(boot_buf), "idx=%d  %s  [%s]",
                   boot_idx,
                   active_profile_workspace.profile_name.c_str(),
                   kind);
          id(ir_active_profile_ts).publish_state(boot_buf);


      ## 4. Arm your hardware parameters and lock execution registers
      - script.execute: setup_ir_receiver_for_current_profile
      - lambda: |-      
          id(ir_receiver_mode) = 1; // Set immediately to Action Mode for normal use
          id(ir_active_profile_ts).update();

      - script.execute: display_token_remote_profile
      - component.suspend: boot_initialization_timer
