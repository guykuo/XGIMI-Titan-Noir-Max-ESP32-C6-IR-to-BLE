# ir-common-kuo/ir-hub.yaml

#====================================================================
#=========================== IR Receiver ============================  
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us       
  idle: 10ms         
  tolerance: 35%     
  # dump:
  #   - raw
  #   - nec
  #   - jvc
  #   - sony
  #   - lg
  #   - panasonic
  #   - rc5
  #   - rc6
    
  # 1. Updates timestamp every single time ANY raw IR pulse or repeat packet burst hits the pin
  on_raw:
    - lambda: |-
        id(global_last_raw_packet_time) = millis();

    - lambda: |-
        // Boundary Check: Ensure we have at least 2 elements before querying array indices
        if (x.size() < 2) return;

        uint32_t head_mark = x[0];
        uint32_t head_space = std::abs(x[1]);
        size_t total_pulses = x.size();

        uint8_t proto = PROTO_UNKNOWN;

        // --- 1. MANCHESTER / SHORT-HEADER PROTOCOLS (RC5 & RC6) ---
        if (head_mark >= 700 && head_mark <= 1100 && total_pulses >= 18 && total_pulses <= 30) {
          proto = PROTO_RC5;
        }
        else if (head_mark >= 2400 && head_mark <= 2900 && head_space >= 700 && head_space <= 1100) {
          if (total_pulses >= 34 && total_pulses <= 46) {
            proto = PROTO_RC6;
          }
        }

        // --- 2. STANDARD SPACE/DISTANCE PROTOCOLS ---
        if (proto == PROTO_UNKNOWN) {
          // JVC Test: 8.4ms Mark / 4.2ms Space
          if (head_mark >= 7600 && head_mark < 8800 && head_space >= 3800 && head_space <= 4600) {
            proto = PROTO_JVC;
          }
          // SONY Test: Header pulse 2.4ms, short space < 900us, max 42 pulses
          else if (head_mark >= 2100 && head_mark <= 2700 && head_space < 900 && total_pulses <= 42) {
            proto = PROTO_SONY;
          }
          // PANASONIC Test: Header 3.4ms, space 1.7ms
          else if (head_mark >= 3100 && head_mark <= 3700 && head_space >= 1500 && head_space <= 2000) {
            proto = PROTO_PANASONIC;
          }
          // LG Test: Symmetric 4.5ms Mark / 4.5ms Space
          else if (head_mark >= 4000 && head_mark <= 5000 && head_space >= 4000 && head_space <= 5000) {
            proto = PROTO_LG;
          }
          // NEC / TViX Test: 9.0ms Mark
          else if (head_mark >= 8500 && head_mark <= 9500) {
            proto = PROTO_NEC;
          }
        }
        
        // --- 3. FALLBACK SANITY CHECK (For Headerless Repeat Packets) ---
        if (proto == PROTO_UNKNOWN) {
          if (total_pulses == 34 && head_mark >= 400 && head_mark <= 600 && head_space >= 1400 && head_space <= 1800) {
            proto = PROTO_JVC;
          }
          else if (total_pulses >= 24 && total_pulses <= 42 && head_space < 1000) {
            proto = PROTO_SONY;
          } 
          else if (total_pulses >= 64 && total_pulses <= 68) { proto = PROTO_NEC; }
          else if (total_pulses >= 96 && total_pulses <= 102) { proto = PROTO_PANASONIC; }
        }

        id(learn_detected_protocol) = proto;
        
        ESP_LOGD("IR_RECOGNIZER", "Detected Protocol: %s (Mark: %uus, Space: %uus, Pulses: %u)", 
         to_string(proto), (unsigned int)head_mark, (unsigned int)head_space, total_pulses);

  # ======= MULTI-PROTOCOL CONVERSION GATES =======

  on_nec:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_NEC || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "NEC";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = x.command_repeats;
  
          ESP_LOGD("main", "NEC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
          
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }

  on_jvc:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_JVC || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats, etc
          std::string ir_protocolStr = "JVC";
          
          uint32_t ir_address = (x.data >> 8) & 0xFF;
          uint32_t ir_command = x.data & 0xFF;
          uint16_t ir_command_repeats = 0; // JVC protocol does not have have command_repeats 
  
          ESP_LOGD("main", "JVC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }

  on_sony:
    # Sony is handled differently because it does not have a true, separate per device address
    # Instead, Sony has a single long code of variable length. The entirety of which must be tested against.
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_SONY || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "SONY"; 
          
          uint32_t ir_address = 0; // Sony does not have separate address. In Sony IRmaps we set target_address to zero.
          uint32_t ir_command = x.data;
          uint16_t ir_command_repeats = 0; // Sony does not have command_repeats
  
          ESP_LOGD("main", "Sony Command:---- 0x%04X ----", (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }
      
  on_lg:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_LG || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "LG";
          
          // EXTRACT ADDRESS: Isolate the upper 16 bits (e.g., 0x20DF)
          uint32_t ir_address = (x.data >> 16) & 0xFFFF; 
          
          // EXTRACT COMMAND: Isolate the lower 16 bits
          uint32_t ir_command = x.data & 0xFFFF; 

          uint16_t ir_command_repeats = 0; // LG does not have command_repeats
  
          ESP_LOGD("main", "LG Command:---- 0x%04X ----", (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }


  on_panasonic:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_PANASONIC || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "PANASONIC";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = 0; // RC5 does not have command_repeats
  
          ESP_LOGD("main", "PANASONIC Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }


  on_rc5:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_RC5 || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "RC5";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = 0; // RC5 does not have command_repeats
  
          ESP_LOGD("main", "RC5 Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }


  on_rc6:
    - lambda: |-
        if (id(ir_receiver_allowed_protocol) == PROTO_RC6 || id(ir_receiver_allowed_protocol) == 255) {
          // set up common format address, command, command_repeats
          std::string ir_protocolStr = "RC6";
          
          uint32_t ir_address = x.address;
          uint32_t ir_command = x.command;
          uint16_t ir_command_repeats = 0; // RC5 does not have command_repeats
  
          ESP_LOGD("main", "RC6 Address:-- 0x%02X --, Command:---- 0x%02X ----", (unsigned int)ir_address, (unsigned int)ir_command);
  
          id(general_IR_received_handler)->execute(ir_protocolStr, ir_address, ir_command, ir_command_repeats);
        }





globals:

  - id: active_remote_layout
    type: int
    initial_value: ${def_profile}
    restore_value: yes

  - id: ir_receiver_allowed_protocol 
    type: uint8_t
    restore_value: no
    initial_value: '0' 
    
  - id: ir_receiver_mode
    # 0 deactivated (no active profile found)
    # 1 action
    # 2 set profile
    # 3 learn
    type: uint32_t
    restore_value: no
    initial_value: "0" #start disabled to avoid crash from errant ir noise at boot.

  - id: global_cached_command
    type: uint32_t
    initial_value: '0'
  - id: global_last_raw_packet_time
    type: uint32_t
    initial_value: '0'
  - id: global_initial_press_time
    type: uint32_t
    initial_value: '0'
  - id: global_last_processed_time
    type: uint32_t
    initial_value: '0'
  - id: global_sony_stream_time
    type: uint32_t
    initial_value: '0'
  - id: global_sony_frame_count
    type: int
    initial_value: '0'
  - id: global_is_holding
    type: bool
    initial_value: 'false'
    
  # SEQUENTIAL ENGINE STATE VARIABLES
  - id: global_token_clear_armed
    type: bool
    initial_value: 'false'
  - id: debounce_safety_lock
    type: bool
    initial_value: 'false'
  - id: global_intercept_active
    type: bool
    initial_value: 'false'
  - id: last_ir_press
    type: uint32_t
    initial_value: '0'
  - id: global_long_hold_handled
    type: bool
    initial_value: 'false'

  
  # Macro State Machine Variables
  - id: macro_workflow_state
    type: int
    initial_value: '0' # 0=Idle, 1=Capture, 2=Wait-for-Hotkey
  - id: macro_assigned_shared_slot
    type: int
    initial_value: '0'
  - id: macro_recording_active
    type: bool
    initial_value: 'false'
  - id: macro_playback_active
    type: bool
    initial_value: 'false'
  - id: macro_step_counter
    type: int
    initial_value: '0'
  - id: macro_last_event_time
    type: uint32_t
    initial_value: '0'
  - id: macro_assignment_cooldown
    type: uint32_t
    initial_value: '0'
  - id: macro_play_prefix_active
    type: bool
    initial_value: 'false'

    
    
  - id: commandName 
    type: std::string
    restore_value: no
    initial_value: '"                                "'     
    
  # Remote profile learning globals. 
  - id: ir_window_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: learned_best_command
    type: uint32_t
    restore_value: no
    initial_value: '0'
        
  - id: learn_sniff_start_time
    type: uint32_t
    initial_value: '0'
    restore_value: no

  - id: learn_last_save_time # used to avoid repeated button during IR learning.
    type: uint32_t
    initial_value: '0'
    restore_value: no
        
  - id: learn_active_protocol
    type: uint8_t
    initial_value: '0' # Default to PROTO_UNKNOWN
    restore_value: no
    
  - id: learn_active_address
    type: uint32_t
    initial_value: '0'
    restore_value: no

  - id: learn_detected_protocol
    type: uint8_t
    initial_value: '0' # Default to PROTO_UNKNOWN
    restore_value: no
    
  - id: learn_cache_protocol
    type: std::array<uint8_t, 50>
    initial_value: '{0}' # Flattens array initialization cleanly for compiler tracks
    restore_value: no

  - id: learn_cache_address
    type: std::array<uint32_t, 50>
    initial_value: '{0, 0}'
    restore_value: no    

  - id: learn_cache_command
    type: std::array<uint32_t, 50>
    initial_value: '{0, 0}'
    restore_value: no
        
  - id: learn_cache_idx   
    type: int
    initial_value: '-1'
    restore_value: no   

  - id: session_captured_codes #command codes are stored here during learning
    type: std::array<uint32_t, 32> #27 + 5 when ENABLE_EXTRA_BUTTONS
    initial_value: '{0}'
    restore_value: no
  - id: learn_current_button_idx
    type: int
    initial_value: '0'
    restore_value: no




#====================================================================
script:

  # ====================================================================
  # Hydrate Binding Registry Map from Flash Storage Slots during System Boot
  # ====================================================================
  - id: hydrate_macro_bindings_from_flash
    mode: single
    then:
      - lambda: |-
          // 1. Establish connection to your absolute identity binding registry partition key
          uint64_t binding_nvs_key = 3104711294ULL;
          auto pref_obj = esphome::global_preferences->make_preference<UniversalBindingRegistry>(binding_nvs_key);
          
          // 2. Attempt to stream data from the physical memory block back into your runtime RAM registry
          if (pref_obj.load(&global_binding_registry) && global_binding_registry.struct_version == 3) {
            ESP_LOGI("NVS_BIND", "🚀 Universal macro shortcut matrix recovered successfully. %d active bindings loaded.", 
                     global_binding_registry.total_bound_keys);
            
            // Log the loaded associations out to your debug terminal line item paths for easy verification
            for (uint16_t i = 0; i < global_binding_registry.total_bound_keys; i++) {
              const char* action_name = decode_id_to_action_string(global_binding_registry.bindings[i].universal_action_id);
              ESP_LOGD("NVS_BIND", "   -> Bound Shortcut Key: '%s' (Type %d) maps to Universal Shared Macro Slot: %d", 
                       action_name, 
                       global_binding_registry.bindings[i].action_type,
                       global_binding_registry.bindings[i].shared_macro_slot);
            }
          } else {
            // 3. DEFENSIVE SAFETY RESETS: Initial system installation initialization block pass
            std::memset(&global_binding_registry, 0, sizeof(global_binding_registry));
            global_binding_registry.struct_version = 3;
            global_binding_registry.total_bound_keys = 0;
            
            // Pre-seed all unassigned bindings to our designated sentinel value (255)
            for (int i = 0; i < MAX_BOUND_HOTKEYS; i++) {
               global_binding_registry.bindings[i].shared_macro_slot = 255;
            }
            
            ESP_LOGW("NVS_BIND", "No matching macro binding file signature found. Initialized fresh, empty routing layout maps.");
          }

  # ====================================================================
  # STEP 1: Put system into Action Capture Recording State
  # ====================================================================
  - id: start_macro_mapping_session
    parameters:
      target_shared_slot: int
    mode: single
    then:
      - lambda: |-
          // 1. Defensively boundary-check the slot bounds against our max registry size (12 slots)
          if (target_shared_slot < 0 || target_shared_slot >= MAX_BOUND_HOTKEYS) {
            ESP_LOGE("MACRO_WORKFLOW", "Invalid macro slot target: %d. Aborting session.", target_shared_slot);
            return;
          }

          // 2. Initialize tracking parameters and clear out our global RAM buffer workspace
          id(macro_assigned_shared_slot) = target_shared_slot;
          id(macro_step_counter) = 0;
          id(macro_last_event_time) = millis(); // Initialize time anchor to track step delays cleanly
          id(macro_recording_active) = true;    // Set active recording state flag
          
          std::memset(&active_recording_buffer, 0, sizeof(active_recording_buffer));
          active_recording_buffer.struct_version = 3; // Align structure configuration tracker signatures
          
          // 3. Shift the system live mode flag to recording state
          id(macro_workflow_state) = 1; 
          
          // 4. Update the visual panels and throw operational system status logs
          id(display_show)->execute(false, "⏺️ Macro Record", "Press Buttons...", "Click End when Done");
          ESP_LOGI("MACRO_WORKFLOW", "Recording sequence initiated for Global Shared Slot: %d", target_shared_slot);

  # ====================================================================
  # STEP 2: Stop capturing clicks and transition to Hotkey Listen mode
  # ====================================================================
  - id: end_macro_action_capture
    mode: single
    then:
      - lambda: |-
          if (id(macro_workflow_state) == 1) {
            // Check if we actually caught anything before shifting workflows
            if (id(macro_step_counter) == 0) {
              id(macro_workflow_state) = 0; // Abort out to idle safely
              id(macro_recording_active) = false; // Release recording flag on cancel
              id(display_show)->execute(false, "Record Canceled", "No actions pressed", "Action Mode");
              ESP_LOGW("MACRO_WORKFLOW", "No keys were captured during the session. Aborting macro recording.");
              return;
            }

            // Shift state machine to wait for the user to hold down their designated hotkey
            id(macro_workflow_state) = 2; 
            
            id(display_show)->execute(false, "💾 Assign Hotkey", "HOLD desired button", "for 3 seconds...");
            ESP_LOGW("MACRO_WORKFLOW", "Actions successfully cached (%d steps). Awaiting 3-second hold to bind.", id(macro_step_counter));
          } else {
            ESP_LOGW("MACRO_WORKFLOW", "End command ignored: System is not actively recording a session.");
          }

  # ====================================================================
  # STEP 3: Flash Persistence Commit Actions (Called internally by ir_map_processor)
  # ====================================================================
  - id: commit_macro_to_flash_slot
    parameters:
      macro_slot: int
    mode: single
    then:
      - lambda: |-
          // Calculate an independent, unique macro base NVS partition storage key offset space
          uint64_t macro_nvs_key = 384720194ULL + macro_slot;
          auto pref_obj = esphome::global_preferences->make_preference<UniversalFlashMacro>(macro_nvs_key);
          
          // Flush the data out of live RAM directly into the targeted non-volatile storage slot
          active_recording_buffer.total_steps = id(macro_step_counter);
          pref_obj.save(&active_recording_buffer);
          
          // Enforce a hard flash sync across partitions immediately
          esphome::global_preferences->sync();
          ESP_LOGI("NVS_MACRO", "Successfully committed Universal Shared Macro Slot %d (%d steps) directly to NVS Flash.", 
                   macro_slot, active_recording_buffer.total_steps);

  # ====================================================================
  # STEP 4: Save the Universal Cross-Profile Assignment Registry Map to Flash
  # ====================================================================
  - id: save_binding_registry_to_nvs
    mode: single
    then:
      - lambda: |-
          uint64_t binding_nvs_key = 3104711294ULL;
          auto pref_obj = esphome::global_preferences->make_preference<UniversalBindingRegistry>(binding_nvs_key);
          
          global_binding_registry.struct_version = 3;
          pref_obj.save(&global_binding_registry);
          esphome::global_preferences->sync();
          
          ESP_LOGI("NVS_BIND", "Universal cross-profile identity shortcut mapping directory successfully synced to NVS.");


  # ====================================================================
  # WATCHDOG-SAFE COOPERATIVE ASYNCHRONOUS PLAYBACK ENGINE (FIXED)
  # ====================================================================
  - id: play_universal_shared_macro
    parameters:
      shared_slot_id: int
    mode: single
    then:
      - lambda: |-
          id(macro_playback_active) = true;
          uint64_t macro_nvs_key = 384720194ULL + shared_slot_id;
          auto pref_obj = esphome::global_preferences->make_preference<UniversalFlashMacro>(macro_nvs_key);
          
          static UniversalFlashMacro playback_buffer;
          if (!pref_obj.load(&playback_buffer) || playback_buffer.total_steps == 0) {
            ESP_LOGW("MACRO_PLAY", "Playback Aborted: Slot %d is empty.", shared_slot_id);
            id(macro_playback_active) = false;
            return;
          }
          
          ESP_LOGI("MACRO_PLAY", "▶️ Starting Asynchronous Playback for Slot %d (%d steps cached)...", shared_slot_id, playback_buffer.total_steps);
          id(showing_special_info) = true;
          id(display_show)->execute(false, "Macro Playing...", std::to_string(shared_slot_id), "Please wait...");

          id(macro_step_counter) = 0;

      - while:
          condition:
            lambda: |-
              uint64_t macro_nvs_key = 384720194ULL + shared_slot_id;
              auto pref_obj = esphome::global_preferences->make_preference<UniversalFlashMacro>(macro_nvs_key);
              static UniversalFlashMacro playback_buffer;
              pref_obj.load(&playback_buffer);
              return (id(macro_step_counter) < playback_buffer.total_steps);
          then:
            # STEP A: Extract step delay data and handle pauses asynchronously
            - lambda: |-
                uint64_t macro_nvs_key = 384720194ULL + shared_slot_id;
                auto pref_obj = esphome::global_preferences->make_preference<UniversalFlashMacro>(macro_nvs_key);
                static UniversalFlashMacro playback_buffer;
                pref_obj.load(&playback_buffer);
                
                int idx = id(macro_step_counter);
                uint32_t raw_delay = playback_buffer.steps[idx].delay_ms;
                uint8_t current_state = playback_buffer.steps[idx].event_state;

                // FIXED TIMING MODEL: If an UP (Release) step carries a standard quick-tap 
                // duration tracking signature (< 350ms), compress its delay spacing down 
                // to 0ms since the driver already completed the atomic tap on the DOWN pass!
                if (current_state == 2 && raw_delay < 350) {
                  id(macro_last_event_time) = 0; 
                  ESP_LOGV("MACRO_PLAY", "   -> Step [%d]: Compressed redundant release lag (%dms -> 0ms)", idx, raw_delay);
                } else {
                  // Keep true pacing interval for long-press holds and spaces between keys
                  id(macro_last_event_time) = raw_delay;
                }

            
            - delay: !lambda "return id(macro_last_event_time);"

            # ============================================================
            # STEP B: Fire low-level driver injections directly over the air
            # ============================================================
            - lambda: |-
                uint64_t macro_nvs_key = 384720194ULL + shared_slot_id;
                auto pref_obj = esphome::global_preferences->make_preference<UniversalFlashMacro>(macro_nvs_key);
                static UniversalFlashMacro playback_buffer;
                pref_obj.load(&playback_buffer);
                
                int idx = id(macro_step_counter);
                const auto& step = playback_buffer.steps[idx];
                const char* state_str = (step.event_state == 0) ? "DOWN" : ((step.event_state == 2) ? "UP" : "HOLD");

                // ============================================================
                // 🚦 INTELLIGENT DUPLICATION-PREVENTION GATEWAY
                // ============================================================
                bool should_fire_hardware = false;

                if (step.event_state == 0) {
                  // Always execute on a fresh key-down press event step entry
                  should_fire_hardware = true;
                } 
                else if (step.event_state == 2) {
                  // If this is an UP step, check if the previous step was a DOWN for the same key.
                  // If it was, skip this step to prevent double-sending!
                  if (idx > 0) {
                    const auto& prev_step = playback_buffer.steps[idx - 1];
                    if (prev_step.action_payload == step.action_payload && prev_step.event_state == 0) {
                      should_fire_hardware = false;
                    } else {
                      should_fire_hardware = true; // Fallback for release-recorded standalone items
                    }
                  } else {
                    should_fire_hardware = true; 
                  }
                }
                
                // ============================================================
                // 📡 DRIVER TRANSMISSION PIPELINE
                // ============================================================
                if (should_fire_hardware) {
                  if (step.action_type == 0) { // Keyboard Payload
                    ESP_LOGI("MACRO_PLAY", "   🔥 Step [%d]: Executing Keyboard Payload 0x%02X [State: %s]", idx, step.action_payload, state_str);
                    id(xgimi_remote_controller).press_keyboard((uint8_t)step.action_payload);
                  } 
                  else if (step.action_type == 1) { // Consumer Payload
                    ESP_LOGI("MACRO_PLAY", "   🔥 Step [%d]: Executing Consumer Payload 0x%04X [State: %s]", idx, step.action_payload, state_str);
                    id(xgimi_remote_controller).press_consumer(step.action_payload);
                  }
                  else if (step.action_type == 2) { // Named Token System Action
                    const char* action_name = decode_id_to_action_string(step.action_payload);
                    ESP_LOGI("MACRO_PLAY", "   🔥 Step [%d]: Executing Token System Action '%s' [State: %s]", idx, action_name, state_str);
                    
                    auto* target_btn = resolve_button(action_name);
                    if (target_btn != nullptr) {
                       target_btn->press(); 
                    } else {
                       uint8_t resolved_type = 2;
                       uint16_t resolved_id = encode_action_to_id(action_name, resolved_type);
                       if (resolved_id != 0xFFFF) {
                         if (resolved_type == 0) {
                           id(xgimi_remote_controller).press_keyboard((uint8_t)resolved_id);
                         } else if (resolved_type == 1) {
                           id(xgimi_remote_controller).press_consumer(resolved_id);
