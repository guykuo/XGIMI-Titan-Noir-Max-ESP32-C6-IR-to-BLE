substitutions:

  shortcut_1_name: Shortcut 1
  shortcut_2_name: Shortcut 2
  shortcut_3_name: Shortcut 3
  shortcut_4_name: Shortcut 4

esp32_ble:
  id: esp32c6_ble
  name: "${ble_remote_name}" # Kuo remote name here
  io_capability: none
  auth_req_mode: bond
  min_key_size: 7
  max_key_size: 16
  max_connections: 1
    
esp32_ble_server:
  id: esp32c6_ble_server
  appearance: 0x0180
  manufacturer_data: [0x46, 0x00]
  max_clients: 1
  services:
    # Exact identity fields reported by the original remote.
    - uuid: 0x180A
      characteristics:
        - uuid: 0x2A29
          read: true
          value: "Seneasy"
        - uuid: 0x2A24
          read: true
          value: "${ble_remote_name}" # remote name
        # - uuid: 0x2A25
        #   read: true
        #   value: "20260205"
        # - uuid: 0x2A26
        #   read: true
        #   value: "V1.0.0"
        - uuid: 0x2A50
          read: true
          # USB VID source, VID 000D, PID 3843, version 0003 (little-endian).
          value: [0x02, 0x0D, 0x00, 0x43, 0x38, 0x03, 0x00]

    - uuid: 0x180F
      characteristics:
        - uuid: 0x2A19
          read: true
          notify: true
          value: [100]

    - uuid: 0x1812
      advertise: true
      characteristics:
        - uuid: 0x2A4A
          read: true
          # HID 1.11, no country code, normally connectable + remote wake.
          value: [0x11, 0x01, 0x00, 0x03]

        - uuid: 0x2A4B
          read: true
          # Byte-for-byte descriptor captured from the original XGIMI remote.
          value:
            [
              0x05, 0x01, 0x09, 0x06, 0xA1, 0x01, 0x05, 0x07,
              0x09, 0x06, 0xA1, 0x01, 0x85, 0x01, 0x95, 0x08,
              0x75, 0x08, 0x15, 0x00, 0x25, 0xFF, 0x19, 0x00,
              0x29, 0xFF, 0x81, 0x00, 0xC0, 0x05, 0x0C, 0x09,
              0x01, 0xA1, 0x01, 0x85, 0x02, 0x95, 0x03, 0x75,
              0x10, 0x15, 0x00, 0x26, 0x9C, 0x02, 0x19, 0x00,
              0x2A, 0x9C, 0x02, 0x81, 0x00, 0xC0, 0xC0
            ]

        - uuid: 0x2A4C
          write_no_response: true
          value: [0x00]

        - uuid: 0x2A4E
          read: true
          write_no_response: true
          value: [0x01]

        - uuid: 0x2A4D
          id: xgimi_keyboard_report
          read: true
          notify: true
          value: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          descriptors:
            - uuid: 0x2908
              read: true
              write: false
              value: [0x01, 0x01]

        - uuid: 0x2A4D
          id: xgimi_consumer_report
          read: true
          notify: true
          value: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          descriptors:
            - uuid: 0x2908
              read: true
              write: false
              value: [0x02, 0x01]

xgimi_remote:
  id: xgimi_remote_controller
  remote_name: "${ble_remote_name}" # Kuo cannot pass a param in this version bluetooth stack
  wake_token: !secret xgimi_wake_token
  ble_id: esp32c6_ble
  ble_server_id: esp32c6_ble_server
  keyboard_report_id: xgimi_keyboard_report
  consumer_report_id: xgimi_consumer_report


# ====================================================================

binary_sensor:
  - platform: template
    name: "Projector Remote Connected"
    id: projector_remote_connected
    lambda: return id(xgimi_remote_controller).is_connected();

  - platform: template
    name: "Projector Remote Authenticated"
    id: projector_remote_authenticated
    lambda: return id(xgimi_remote_controller).is_authenticated();

  - platform: template
    name: "Projector Keyboard Notifications"
    id: projector_keyboard_notifications
    lambda: return id(xgimi_remote_controller).is_keyboard_subscribed();

  - platform: template
    name: "Projector Consumer Notifications"
    id: projector_consumer_notifications
    lambda: return id(xgimi_remote_controller).is_consumer_subscribed();
    
# ====================================================================
script:
  - id: async_power_off_hold
    mode: single
    then: 
      - lambda: |-
          // 1. Fire the initial DOWN packet immediately
          fire_bluetooth_hid_action("power_off", 0); 
      - delay: 1500ms
      - lambda: |-
          // 2. Fire the trailing UP packet safely
          fire_bluetooth_hid_action("power_off", 2); 
      - delay: 200ms

# ====================================================================
# ====================================================================

button:
# ====================================================================
# CORRECTED UNIFIED TEMPLATE BUTTON MATRIX (COMPLETE SUITE)
# ====================================================================

  # --- SPECIAL HIGH-UTILITY POWER & DURATION CONTROLS ---
  - platform: template
    name: "Power On"
    id: power_on
    icon: mdi:power
    on_press:
      - lambda: |-
          id(xgimi_remote_controller).start_wake_burst();

  - platform: template
    name: "Power Off"
    id: power_off
    icon: mdi:power-off
    on_press:
      - script.execute: async_power_off_hold

  # --- STANDARD PASS-THROUGH KEYBOARD INTERACTION LOOPS ---
