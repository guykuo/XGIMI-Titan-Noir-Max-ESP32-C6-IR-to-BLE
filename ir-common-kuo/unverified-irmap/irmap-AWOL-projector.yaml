# valerion projector
packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

remote_receiver:
  id: ir_receiver
  dump: nec
  on_sony: !remove
  on_lg: !remove
  on_jvc: !remove

substitutions:
  target_ir_address: "0x7300"
  remote_display_name: "Valerion Prj"

  # =============================================================
  # DEFINE token clearing gate buttons
  cmd_token_clear_arm: "0x17"    # Valerion: HDMI 1
  cmd_token_clear_fire: "0x14" # Valerion: OK / ENTER

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t
      is_hold: bool
    then:
      - lambda: |-
          id(nec_broadcast_processor).execute(command, (uint16_t)(command >> 16), (uint16_t)(command & 0xFFFF), is_hold);

  - id: nec_broadcast_processor
    parameters:
      command: uint32_t     
      device_addr: uint16_t  
      pure_cmd: uint16_t     
      is_hold: bool       
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // Resolved duplicate mapping entries to prevent compiler warnings or key overwrites
          static const std::map<uint16_t, IRCommand> nec_codes = {
            { 0xA7,       { "power_on",      id(power_on) } },          // power on
            { 0x67,       { "power_off", id(power_off_immediately) } }, // power off
            { 0x24,       { "cursor_left",   id(cursor_left) } },    // left arrow
            { 0xA4,       { "cursor_right",  id(cursor_right) } },   // right arrow
            { 0x64,       { "cursor_up",     id(cursor_up) } },      // up arrow
            { 0xE4,       { "cursor_down",   id(cursor_down) } },    // down arrow
            { 0x14,       { "cursor_enter",  id(cursor_enter) } },   // ok
            { 0x5A,       { "settings_menu", id(settings_menu) } },  // menu
            { 0x3A,       { "back",          id(back) } },           // back
            { 0xDA,       { "home",          id(home) } },           // home
            { 0x1B,       { "game_menu",     id(game_menu) } },      // profile
            { 0x48,       { "input",         id(input) } },          // input
            { 0xDA,       { "picture",       id(picture) } },        // open AI
            { 0x9B,       { "focus_manual",  id(focus_manual) } },   // focus
            { 0x47,       { "focus_auto",    id(focus_auto) } },     // live guide
            { 0xBB,       { "shortcut_1",    id(shortcut_1) } },     // Prime Video
            { 0x3B,       { "shortcut_2",    id(shortcut_2) } },     // Netflix
            { 0x7B,       { "shortcut_3",    id(shortcut_3) } },     // Disney
            { 0xDB,       { "shortcut_4",    id(shortcut_4) } },     // YouTube
            { 0x50,       { "volume_up",     id(volume_up) } },      // volume up
            { 0xD0,       { "volume_down",   id(volume_down) } },    // volume down
            { 0xD8,       { "mute",          id(mute) } },           // mute
            { 0xE7,       { "token_sniff",   id(token_sniff) } },    // HDMI 1
            { 0x17,       { "token_clear",   id(token_clear) } },    // HDMI 2
            { 0x97,       { "token_recall",  id(token_recall) } },   // HDMI 3
            { 0x07,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // Back + Down
            { 0xC7,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }  // Back + Home
          };

          auto it = nec_codes.find(pure_cmd);
          if (it != nec_codes.end()) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                id(myDisplay_line1) = it->second.name + " (Hold)";
                id(myDisplay_line2) = "${remote_display_name}"; 
                id(myDisplay_line3) = ""; 
                ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
              } else {
                id(myDisplay_line1) = it->second.name;
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
                ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
              }
            }

            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!id(global_token_clear_armed)) {
              if (!is_hold) {
                id(myDisplay_line1) = "Unassigned";
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
              }
            }
          }
