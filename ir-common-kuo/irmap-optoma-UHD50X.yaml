# irmap-optoma-UHD50X.yaml
# Optoma UHD50X projector

packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

remote_receiver:
  id: ir_receiver
  dump: nec
  on_sony: !remove
  on_lg: !remove
  on_jvc: !remove

substitutions:
  target_ir_address: "0xCD32"
  remote_display_name: "Optoma Proj"
  
  # =============================================================
  # DEFINE token clearing gate buttons
  cmd_token_clear_arm: "0x9A65"    # Optoma: User 1
  cmd_token_clear_fire: "0xF00F"   # Optoma: OK

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t
      is_hold: bool
    then:
      - lambda: |-
          id(nec_broadcast_processor).execute(command, (uint16_t)(command >> 16), (uint16_t)(command & 0xFFFF), is_hold);

  - id: nec_broadcast_processor
    parameters:
      command: uint32_t     
      device_addr: uint16_t  
      pure_cmd: uint16_t     
      is_hold: bool       
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // Strict unique map loaded with genuine Optoma production command codes
          static const std::map<uint16_t, IRCommand> nec_codes = {
            { 0xFD02,       { "power_on",      id(power_on) } },              // power on
            { 0xD12E,       { "power_off",     id(power_off_immediately) } }, // power off
            { 0xEF10,       { "cursor_left",   id(cursor_left) } },    // left arrow
            { 0xED12,       { "cursor_right",  id(cursor_right) } },   // right arrow
            { 0xEE11,       { "cursor_up",     id(cursor_up) } },      // up arrow
            { 0xEB14,       { "cursor_down",   id(cursor_down) } },    // down arrow
            { 0xF00F,       { "cursor_enter",  id(cursor_enter) } },   // ok
            { 0xF10E,       { "settings_menu", id(settings_menu) } },  // menu
            { 0x9C63,       { "back",          id(back) } },           // sleep
            { 0xE916,       { "input",         id(input) } },          // input HDMI 1
            { 0xCF30,       { "game_menu",     id(game_menu) } },      // input HDMI 2
            { 0xFA05,       { "picture",       id(picture) } },        // mode
            { 0x9B64,       { "focus_manual",  id(focus_manual) } },   // aspect
            { 0xBB44,       { "focus_auto",    id(focus_auto) } },     // DB
            { 0xE41B,       { "shortcut_1",    id(shortcut_1) } },     // input VGA 1
            { 0xE11E,       { "shortcut_2",    id(shortcut_2) } },     // input VGA 2
            { 0xE31C,       { "shortcut_3",    id(shortcut_3) } },     // input video
            { 0xE817,       { "shortcut_4",    id(shortcut_4) } },     // input YPbPr
            { 0x7689,       { "volume_up",     id(volume_up) } },      // 3D
            { 0xF807,       { "volume_down",   id(volume_down) } },    // keystone
            { 0xAD52,       { "mute",          id(mute) } },           // mute
            { 0xC936,       { "token_sniff",   id(token_sniff) } },    // user 1
            { 0x9A65,       { "token_clear",   id(token_clear) } },    // user 2
            { 0x9966,       { "token_recall",  id(token_recall) } },    // user 3
            { 0xBE41,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // brightness
            { 0xBD42,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }  // contrast
          };

          auto it = nec_codes.find(pure_cmd);
          if (it != nec_codes.end()) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                id(myDisplay_line1) = it->second.name + " (Hold)";
                id(myDisplay_line2) = "${remote_display_name}"; 
                id(myDisplay_line3) = ""; 
                ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
              } else {
                id(myDisplay_line1) = it->second.name;
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
                ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
              }
            }

            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!id(global_token_clear_armed)) {
              if (!is_hold) {
                id(myDisplay_line1) = "Unassigned";
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
              }
            }
          }
