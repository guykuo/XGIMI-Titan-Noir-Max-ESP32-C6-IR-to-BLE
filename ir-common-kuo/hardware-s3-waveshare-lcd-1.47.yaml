# ============= BEGIN Configuration Options KUO ==========

substitutions:
# ***** basic board and GPIO wiring
  
  board_type: "esp32-s3-devkitc-1" # <== set board type here
  framework_type: "esp-idf" # <========= set board framewark. 
  
  pin_ir_receiver: GPIO1 # <============ set GPIO pin for IR sensor. 

  pin_indicator_LED: GPIO38 # <========== set GPIO pin for LED indicator

  pin_boot_btn: GPIO0 # <====== Most ESP boards use pin 0 for boot button. 
  
  # ======================================================================
  
    
light:
  - platform: esp32_rmt_led_strip  # REPAIRED: Correct ESPHome driver for C6 addressable LEDs
    id: sniffer_led
    pin: ${pin_indicator_LED}
    chipset: WS2812
    num_leds: 1
    rgb_order: GRB
    name: "Sniffer Indicator"
    
script:
  - id: flash_led_custom
    parameters:
      count: int         # Number of flashes
      red: float         # Red value (0.0 to 1.0)
      green: float       # Green value (0.0 to 1.0)
      blue: float        # Blue value (0.0 to 1.0)
    mode: restart
    then:
      - repeat:
          count: !lambda "return count;"
          then:
            # --- TURN RGB LED ON WITH DYNAMIC COLOR ---
            # Pass your script parameters to the light.turn_on action via lambdas
            - light.turn_on:
                id: sniffer_led
                red: !lambda "return red;"
                green: !lambda "return green;"
                blue: !lambda "return blue;"
                brightness: 0.2
                transition_length: 0s
            - delay: 150ms

            # --- TURN RGB LED OFF ---
            - light.turn_off:
                id: sniffer_led
                transition_length: 0s
            - delay: 150ms
            
            
  - id: turn_led_on_custom
    parameters:
      red: float         # Red channel (0.0 to 1.0)
      green: float       # Green channel (0.0 to 1.0)
      blue: float        # Blue channel (0.0 to 1.0)
      brightness: float  # Brightness (0.0 to 1.0)
    mode: restart
    then:
      - light.turn_on:
          id: sniffer_led
          red: !lambda "return red;"
          green: !lambda "return green;"
          blue: !lambda "return blue;"
          brightness: !lambda "return brightness;"
          transition_length: 0s  # Turns on instantly without a fade
          
          
  - id: turn_led_off_custom
    mode: restart
    then:
      - light.turn_off:
          id: sniffer_led
          transition_length: 0s  # Turns off instantly without a fade

# ========  Display Specific Implementation ========

# Download font for text rendering
font:
  - file: "gfonts://Roboto"
    id: my_fontSmall
    size: 9

  - file: "gfonts://Roboto"
    id: my_fontMedium
    size: 10

  - file: "gfonts://Roboto"
    id: my_fontLarge
    size: 12

    
spi:
  clk_pin: GPIO40
  mosi_pin: GPIO45


display:
  - platform: st7789v
    model: "Waveshare 1.47in 172X320" # Pre-configured model profile
    id: oled_display
    cs_pin: GPIO42
    dc_pin: GPIO41
    reset_pin: GPIO39
    backlight_pin: GPIO48
    rotation: 0°
    pages:
      - id: active_page_std
        lambda: |-
          it.print(0, 0,  id(my_fontMedium), id(OLED_line1).c_str());
          it.print(0, 11, id(my_fontLarge), id(OLED_line2).c_str());
          it.print(0, 24, id(my_fontLarge), id(OLED_line3).c_str());

      - id: active_page_small
        lambda: |-
          it.print(0, 0,  id(my_fontSmall), id(OLED_line1).c_str());
          it.print(0, 12, id(my_fontSmall), id(OLED_line2).c_str());
          it.print(0, 24, id(my_fontSmall), id(OLED_line3).c_str());

      - id: blank_page
        lambda: |-
          // Leaving lambda completely blank turns all pixels off safely
