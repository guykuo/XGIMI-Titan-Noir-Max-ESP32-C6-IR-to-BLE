# jvc vcr
packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

remote_receiver:
  id: ir_receiver
  dump: jvc
  on_nec: !remove
  on_sony: !remove
  on_lg: !remove

substitutions:
  target_ir_address: "0x03C2"
  remote_display_name: "JVC VCR"
  
  # =============================================================
  # DEFINE token clearing gate buttons
  cmd_token_clear_arm: "0xC2A4"    # 5
  cmd_token_clear_fire: "0xC23C"   # OK

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t
      is_hold: bool
    then:
      - lambda: |-
          // JVC VCR Payload Matrix: Extract standard upper address context and lower raw commands
          id(jvc_broadcast_processor).execute(command, (uint16_t)((command >> 8) & 0xFF), (uint16_t)(command & 0xFF), is_hold);

  - id: jvc_broadcast_processor
    parameters:
      command: uint32_t     
      device_addr: uint16_t  
      pure_cmd: uint16_t     
      is_hold: bool       
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // Strict unique map to prevent compiler errors and map overwrites
          static const std::map<uint32_t, IRCommand> jvc_codes = {
            { 0xC2C3,       { "back",          id(back) } },          // review
            { 0xC218,       { "cursor_down",   id(cursor_down) } },   // cursor down
            { 0xC261,       { "cursor_down_alt", id(cursor_down) } }, // cursor down (harmony)
            { 0xC23C,       { "cursor_enter",  id(cursor_enter) } },  // OK
            { 0xC2A8,       { "cursor_left",   id(cursor_left) } },   // cursor left
            { 0xC228,       { "cursor_right",  id(cursor_right) } },  // cursor right (harmony)
            { 0xC241,       { "cursor_up",     id(cursor_up) } },     // cursor up
            { 0xC298,       { "cursor_up_alt", id(cursor_up) } },     // cursor up (harmony)
            { 0xC2E4,       { "focus_auto",    id(focus_auto) } },    // 7
            { 0xC214,       { "focus_manual",  id(focus_manual) } },  // 8
            { 0xC26C,       { "cancel",        id(home) } },          // cancel
            { 0xC2C8,       { "input",         id(input) } },         // tv/vcr
            { 0xC2EC,       { "settings_menu", id(settings_menu) } }, // menu
            { 0xC207,       { "settings_menu_alt", id(settings_menu) } }, // memu (alternate) 
            { 0xC230,       { "game_menu",     id(game_menu) } },     // game menu
            { 0xC2B0,       { "mute",          id(mute) } },          // pause
            { 0xC260,       { "picture",       id(picture) } },       // fast forward
            { 0xC2D0,       { "power_on",      id(power_on) } },      // power (as discrete)
            { 0xC2B8,       { "power_on_alt",  id(power_on) } },      // power (alternate)
            { 0xC258,       { "power_off",     id(power_off_immediately) } }, // discrete off
            { 0xC2E8,       { "power_off_alt1", id(power_off_immediately) } }, // audio monitor
            { 0xC2CC,       { "power_off_alt2", id(power_off_immediately) } }, // 0
            { 0xC283,       { "shortcut_1",    id(shortcut_1) } },    // prog
            { 0xC2BC,       { "shortcut_2",    id(shortcut_2) } },    // prog check
            { 0xC28C,       { "shortcut_3",    id(shortcut_3) } },    // SP/EP
            { 0xC269,       { "shortcut_4",    id(shortcut_4) } },    // skip search
            { 0xC293,       { "volume_down",   id(volume_down) } },   // start up
            { 0xC213,       { "volume_up",     id(volume_up) } },     // start down
            { 0xC224,       { "token_sniff",   id(token_sniff) } },   // 4
            { 0xC2A4,       { "token_clear",   id(token_clear) } },   // 5
            { 0xC264,       { "token_recall",  id(token_recall) } },  // 6
            { 0xC284,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // 1
            { 0xC244,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }  // 2
          };

          auto it = jvc_codes.find(command);
          if (it != jvc_codes.end()) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                id(myDisplay_line1) = it->second.name + " (Hold)";
                id(myDisplay_line2) = "${remote_display_name}"; 
                id(myDisplay_line3) = ""; 
                ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
              } else {
                id(myDisplay_line1) = it->second.name;
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
                ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
              }
            }

            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!id(global_token_clear_armed)) {
              if (!is_hold) {
                id(myDisplay_line1) = "Unassigned";
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
              }
            }
          }
