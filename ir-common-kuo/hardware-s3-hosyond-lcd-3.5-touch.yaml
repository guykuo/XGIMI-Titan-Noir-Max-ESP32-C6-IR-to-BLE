# Hosyond ESP32-S3 Touchscreen Module, 3.5" 240x320 IPS LCD EPS32 Display
# ============= BEGIN Configuration Options KUO ==========

substitutions:
  pin_ir_receiver: GPIO45 # spare GPIO on expansion pin connector
  pin_indicator_LED: GPIO40 # neopixel
  pin_sniff_btn: GPIO0 # use boot button to start sniff

  display_BL_percent: 50%
  
# Core Architecture Declaration
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3 # variant needed to keep compiler tuned for the S3 chip core
  framework:
    type: esp-idf

# ============= END Configuration Options KUO ==========

esphome:
  name: esp32s3-hello-world
  friendly_name: ESP32-S3 Hello World

  on_boot:
    - priority: 100.0
      then:
        - output.set_level:
            id: display_backlight
            level: ${display_BL_percent}

psram:
  mode: octal
  speed: 80MHz

globals:
    # ======= myDisplay display globals
  - id: myDisplay_line1
    type: std::string  
    restore_value: no
    initial_value: '"IR to BLE Kuo"'

  - id: myDisplay_line2
    restore_value: no
    type: std::string  
    #assign at boot
    
  - id: myDisplay_line3
    restore_value: no
    type: std::string  
    initial_value: '"Translator"'
          
          
light:
  - platform: esp32_rmt_led_strip # neopixel
    id: sniffer_led
    pin: ${pin_indicator_LED}
    chipset: WS2812
    num_leds: 1
    rgb_order: GRB # unusual order
    name: "Sniffer Indicator"

output: 
  - platform: ledc # display backlight engine
    pin: GPIO41       
    id: display_backlight
    frequency: 4000Hz    

  - platform: gpio
    pin: GPIO48
    id: hardware_reset_line

script:
  - id: flash_led_custom
    parameters:
      count: int         # Number of flashes
      red: float         # Red value (0.0 to 1.0)
      green: float       # Green value (0.0 to 1.0)
      blue: float        # Blue value (0.0 to 1.0)
    mode: restart
    then:
      - repeat:
          count: !lambda "return count;"
          then:
            # --- TURN RGB LED ON WITH DYNAMIC COLOR ---
            - light.turn_on:
                id: sniffer_led
                red: !lambda "return red;"
                green: !lambda "return green;"
                blue: !lambda "return blue;"
                brightness: 0.2
                transition_length: 0s
            - delay: 200ms

            # --- TURN RGB LED OFF ---
            - light.turn_off:
                id: sniffer_led
                transition_length: 0s
            - delay: 200ms
            
  - id: turn_led_on_custom
    parameters:
      red: float         # Red channel (0.0 to 1.0)
      green: float       # Green channel (0.0 to 1.0)
      blue: float        # Blue channel (0.0 to 1.0)
      brightness: float  # Brightness (0.0 to 1.0)
    mode: restart
    then:
      - light.turn_on:
          id: sniffer_led
          red: !lambda "return red;"
          green: !lambda "return green;"
          blue: !lambda "return blue;"
          brightness: !lambda "return brightness;"
          transition_length: 0s  
          
  - id: turn_led_off_custom
    mode: restart
    then:
      - light.turn_off:
          id: sniffer_led
          transition_length: 0s  


# ========  Display Specific Implementation ========

font:
  - file: "gfonts://Roboto"
    id: my_fontSmall
    size: 30
  - file: "gfonts://Roboto"
    id: my_fontMedium
    size: 35
  - file: "gfonts://Roboto"
    id: my_fontLarge
    size: 40

    
# Configure the 4-bit Hardware Quad-SPI bus
spi:
  id: tft_qspi
  type: quad        
  clk_pin: GPIO12   
  data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]

# Master Display Component Configuration
display:
  - platform: mipi_spi
    id: myDisplay
    spi_id: tft_qspi
    model: ST7789V
    bus_mode: quad
    cs_pin: GPIO10
    reset_pin: GPIO43 # Not real reset GPIO0, just declaring one helps boot up display after flashing.
    rotation: 0
    dimensions: 320X480     
    invert_colors: true
    color_order: RGB    
    data_rate: 80MHz    
    update_interval: 0.3s

    # factory initialization matrix sequence
