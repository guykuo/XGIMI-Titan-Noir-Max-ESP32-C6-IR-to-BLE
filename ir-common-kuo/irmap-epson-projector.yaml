packages:
  base_ir_engine: !include ir-architecture-base.yaml

substitutions:
  # FIXED: Pointing to Epson's standard factory-certified native address baseline
  target_ir_address: "0x41B6"
  remote_display_name: "Epson Proj"
  
  # FIXED: Formatted to target your core engine's variable name for the 0x10EF token_clear code
  hold_exclusion_condition: "id(global_cached_command) == 0x12ED"

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t
      is_hold: bool
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // hex keys are LSB-First ESPHome sniffer codes. 
          static const std::map<uint32_t, IRCommand> nec_codes = {
            { 0x1AE5,       { "back",          id(back) } },           // Epson: ESC (Back)
            { 0x6A95,       { "cursor_down",   id(cursor_down) } },    // Epson: DOWN ARROW
            { 0xAA55,       { "cursor_enter",  id(cursor_enter) } },   // Epson: ENTER
            { 0xEA15,       { "cursor_left",   id(cursor_left) } },    // Epson: LEFT ARROW
            { 0x2AD5,       { "cursor_right",  id(cursor_right) } },   // Epson: RIGHT ARROW
            { 0xCA35,       { "cursor_up",     id(cursor_up) } },      // Epson: UP ARROW
            { 0x8679,       { "focus_auto",    id(focus_auto) } },     // Epson: MEMORY
            { 0x36C9,       { "focus_manual",  id(focus_manual) } },   // Epson: LENS Button
            { 0xBC43,       { "home",          id(home) } },           // Epson: Default
            { 0x22DD,       { "input",         id(input) } },          // Epson: HDMI 1 Button
            { 0x4AB5,       { "settings_menu", id(settings_menu) } },  // Epson: MENU
            { 0x24DB,       { "game_menu",     id(game_menu) } },      // Epson: USER
            //{ 0x12ED,       { "mute",          id(mute) } },           // Epson: out of buttons
            { 0xDC23,       { "picture",       id(picture) } },        // Epson: COLOR MODE
            { 0x807F,       { "power_on",      id(power_on) } },       // Epson: POWER ON Discrete
            { 0x40BF,       { "power_off",     id(power_off_immediately) } }, // Epson: POWER OFF Discrete
            { 0x46B9,       { "shortcut_1",    id(shortcut_1) } },     // Epson: ASPECT
            { 0x8B74,       { "shortcut_2",    id(shortcut_2) } },     // Epson: Frame Interp
            { 0x10EF,       { "shortcut_3",    id(shortcut_3) } },     // Epson: DYNAMIC CONTRAST
            { 0x4B34,       { "shortcut_4",    id(shortcut_4) } },     // Epson: LIGHT SOURCE 
            { 0xFC03,       { "token_sniff",   id(token_sniff) } },    // Epson: GAMMA
            { 0x12ED,       { "token_clear",   id(token_clear) } },    // Epson: BLANK
            //{ 0x4B34,       { "token_recall",  id(token_recall) } },   // Epson: out of buttons
            { 0x0BFA,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // Epson: HDR
            { 0xF40B,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }  // Epson: PATTERN
          }; // Structural semicolon to close map declaration

          // Operational safety intercept loop for repeating button holds
          if (is_hold && (${hold_exclusion_condition})) {
            ESP_LOGW("IR Safety", "Hold repeat blocked for safety excluded command: 0x%04X", command);
            return;
          }

          auto it = nec_codes.find(command);
          if (it != nec_codes.end()) {
            if (is_hold) {
              id(OLED_line1) = it->second.name + " (Hold)";
              ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
            } else {
              id(OLED_line1) = it->second.name;
              ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
            }

            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!is_hold) {
              id(OLED_line1) = "Unassigned";
            }
          }
