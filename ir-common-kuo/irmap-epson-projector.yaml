# Epson Projector

# ======= KUO Begin remote_receiver =========
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us
  idle: 10ms
  tolerance: 25%
  dump: 
    - nec
    
  on_nec:
      then:
        - script.execute: display_timeout_handler
        - lambda: |-
            struct IRCommand {
              std::string name;
              esphome::template_::TemplateButton* button_obj;
            };
 
            static const std::map<uint16_t, IRCommand> nec_codes = {
              { 0x58A7,       { "back",          id(back) } },           // Epson: ESC (Back)
              { 0x56A9,       { "cursor_down",   id(cursor_down) } },    // Epson: DOWN ARROW
              { 0x55AA,       { "cursor_enter",  id(cursor_enter) } },   // Epson: ENTER
              { 0x57A8,       { "cursor_left",   id(cursor_left) } },    // Epson: LEFT ARROW
              { 0x54AB,       { "cursor_right",  id(cursor_right) } },   // Epson: RIGHT ARROW
              { 0x53AC,       { "cursor_up",     id(cursor_up) } },      // Epson: UP ARROW
              { 0x9867,       { "focus_auto",    id(focus_auto) } },     // Epson: AUTO (Auto Setup)
              { 0x6C93,       { "focus_manual",  id(focus_manual) } },   // Epson: ASPECT RATIO ADJUST
              { 0x32CD,       { "home",          id(home) } },           // Epson: HOME BUTTON
              { 0xC13E,       { "input",         id(input) } },          // Epson: SOURCE SEARCH / INPUT
              { 0x51AE,       { "settings_menu", id(settings_menu) } },  // Epson: MENU
              { 0x51AE,       { "settings_menu", id(settings_menu) } },  // Epson: MENU (Fallback)
              { 0x9C63,       { "game_menu",     id(game_menu) } },      // Epson: INFO PANEL
              { 0x48B7,       { "mute",          id(mute) } },           // Epson: A/V MUTE (Blank Screen)
              { 0x3BC4,       { "picture",       id(picture) } },        // Epson: COLOR MODE
              { 0x01FE,       { "power_on",      id(power_on) } },       // Epson: POWER ON/OFF (Toggle/Discrete Variant)
              { 0x01FE,       { "power_on",      id(power_on) } },       // Epson: POWER ON/OFF (Fallback)
              { 0x01FE,       { "power_off_immediately", id(power_off_immediately) } }, // Epson: POWER ON/OFF
              { 0x01FE,       { "power_off_immediately", id(power_off_immediately) } }, // Epson: POWER ON/OFF (Fallback)
              { 0x619E,       { "shortcut_1",    id(shortcut_1) } },     // Epson: MEMORY (Load / Save Slots)
              { 0x5BA4,       { "shortcut_2",    id(shortcut_2) } },     // Epson: KEYSTONE CORRECTION
              { 0xD22D,       { "shortcut_3",    id(shortcut_3) } },     // Epson: SPLIT SCREEN WINDOW
              { 0x24DB,       { "shortcut_4",    id(shortcut_4) } },     // Epson: USER CUSTOM BUTTON
              { 0x4CB3,       { "volume_down",   id(volume_down) } },    // Epson: VOLUME DOWN
              { 0x4BB4,       { "volume_up",     id(volume_up) } },      // Epson: VOLUME UP
              { 0x11EE,       { "token_sniff",   id(token_sniff) } },    // Epson: NUMPAD 1 PLACEHOLDER
              { 0x12ED,       { "token_clear",   id(token_clear) } },    // Epson: NUMPAD 2 PLACEHOLDER
              { 0x13EC,       { "token_recall",  id(token_recall) } },   // Epson: NUMPAD 3 PLACEHOLDER
              { 0x14EB,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // Epson: NUMPAD 4 PLACEHOLDER
              { 0x15EA,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }, // Epson: NUMPAD 5 PLACEHOLDER
            };

            static uint32_t last_global_ir_time = 0;
            uint32_t now = millis();
            
            // Drop hardware bouncing duplicate frames from trailing Epson packet blasts
            if (now - last_global_ir_time < 250) {
              return;
            }

            std::stringstream ss1;
            ss1 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.command;
            std::string rc_code_1_str = ss1.str(); 
            
            std::stringstream ss2;
            ss2 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.address;
            std::string rc_code_2_str = ss2.str(); 
            
            id(OLED_line2) = rc_code_2_str; 
            id(OLED_line3) = rc_code_1_str; 
            
            if (x.address == 0x3085) {
              id(OLED_line2) = "Epson Proj"; 
              
              auto it = nec_codes.find(x.command); 
              
              if (it != nec_codes.end()) {
                last_global_ir_time = now; 
                
                id(OLED_line1) = it->second.name; 
                ESP_LOGD("IR Translated", "IR ---> : %s", it->second.name.c_str());
            
                if (it->second.button_obj != nullptr) {
                  it->second.button_obj->press(); 
                }
              } else {
                id(OLED_line1) = "Unassigned"; 
              }
            } else {
              id(OLED_line1) = "Not Epson Proj IR"; 
            }
            
# ======= KUO End remote_receiver ============
