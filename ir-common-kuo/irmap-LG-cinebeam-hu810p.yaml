packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

substitutions:
  # True LG Electronics protocol extended hardware address baseline
  target_ir_address: "0xFB04"
  remote_display_name: "LG Cinebeam"
  
  # EXCLUSION RULES FOR SAFETY: Blocks token_clear from executing hold repeat cascades
  hold_exclusion_condition: "command == 0xEA15"

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t
      is_hold: bool
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // Clean, strict unique map built from genuine production LG webOS data codes
          static const std::map<uint32_t, IRCommand> nec_codes = {
            { 0xD728,       { "back",          id(back) } },          // Back / Return
            { 0xBE41,       { "cursor_down",   id(cursor_down) } },   // cursor down
            { 0xBB44,       { "cursor_enter",  id(cursor_enter) } },  // OK / Select
            { 0x7807,       { "cursor_left",   id(cursor_left) } },   // cursor left
            { 0xF906,       { "cursor_right",  id(cursor_right) } },  // cursor right
            { 0xBF40,       { "cursor_up",     id(cursor_up) } },     // cursor up
            { 0x8679,       { "focus_manual",  id(focus_manual) } },  // aspect ratio
            { 0x4FB0,       { "focus_auto",    id(focus_auto) } },    // play
            { 0x837C,       { "home",          id(home) } },          // home
            { 0xF40B,       { "input",         id(input) } },         // Input Toggle
            { 0xBC43,       { "settings_menu", id(settings_menu) } }, // menu
            { 0xFE01,       { "game_menu",     id(game_menu) } },     // channel down
            { 0xF609,       { "mute",          id(mute) } },          // mute
            { 0xB24D,       { "picture",       id(picture) } },       // Picture Mode
            { 0xF708,       { "power_on",      id(power_on) } },      // power toggle
            { 0x23DC,       { "power_on-alt",  id(power_on) } },      // Discrete Power On
            { 0x2CC3,       { "power_off_immediately", id(power_off_immediately) } }, // Discrete Power Off
            { 0xEF10,       { "power_off_alt", id(power_off_immediately) } }, // 0
            { 0x8d72,       { "shortcut_1",    id(shortcut_1) } },    // red
            { 0x8e71,       { "shortcut_2",    id(shortcut_2) } },    // green
            { 0x9C63,       { "shortcut_3",    id(shortcut_3) } },    // yellow
            { 0x9E61,       { "shortcut_4",    id(shortcut_4) } },    // blue
            { 0xFC03,       { "volume_down",   id(volume_down) } },   // volume down
            { 0xFD02,       { "volume_up",     id(volume_up) } },     // volume up
            { 0xEB14,       { "token_sniff",   id(token_sniff) } },   // 4
            { 0xEA15,       { "token_clear",   id(token_clear) } },   // 5
            { 0xE916,       { "token_recall",  id(token_recall) } },  // 6
            { 0xA956,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // netflix
            { 0xA35C,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }  // prime video
          }; // Map structural close terminator

          // Global safety filter blocking repetitive hold executions on specified codes
          if (is_hold && (${hold_exclusion_condition})) {
            ESP_LOGW("IR Safety", "Hold repeat blocked for safety excluded command: 0x%04X", (unsigned int)command);
            return;
          }

          auto it = nec_codes.find(command);
          if (it != nec_codes.end()) {
            if (is_hold) {
              id(OLED_line1) = it->second.name + " (Hold)";
              ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
            } else {
              id(OLED_line1) = it->second.name;
              ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
            }

            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!is_hold) {
              id(OLED_line1) = "Unassigned";
            }
          }
