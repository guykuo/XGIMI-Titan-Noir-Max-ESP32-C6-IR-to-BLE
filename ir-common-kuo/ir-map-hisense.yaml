
# Global variables to save the latest parsed IR data
globals:
  - id: last_xgimi_TN_command
    type: std::string  
    initial_value: '"IR to BLE Kuo"'

  - id: last_IR_address
    type: std::string  
    initial_value: '"Hisense-Xgimi"'
    
  - id: last_IR_instruction
    type: std::string  
    initial_value: '"READY"'

 
 # ======= KUO Begin remote_receiver =========
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us
  idle: 10ms
  tolerance: 25%
  dump: 
    - nec
    
  on_nec:
      then:
        - script.execute: display_timeout_handler
        - lambda: |-
            struct IRCommand {
              std::string name;
              esphome::template_::TemplateButton* button_obj;
            };
 
            static const std::map<uint16_t, IRCommand> nec_codes = {
              { 0xFB04,       { "back",          id(back) } },
              { 0xA857,       { "cursor_down",   id(cursor_down) } },
              { 0xA55A,       { "cursor_enter",  id(cursor_enter) } },
              { 0xA758,       { "cursor_left",   id(cursor_left) } },
              { 0xA659,       { "cursor_right",  id(cursor_right) } },
              { 0xA956,       { "cursor_up",     id(cursor_up) } },
              { 0xE817,       { "focus_auto",    id(focus_auto) } },
              { 0xE718,       { "focus_manual",  id(focus_manual) } },
              { 0xBC43,       { "settings_menu", id(settings_menu) } },
              { 0xB54A,       { "settings_menu", id(settings_menu) } },
              { 0xB54A,       { "home",          id(home) } },
              { 0x718E,       { "home",          id(home) } },
              { 0xF40B,       { "input",         id(input) } },
              { 0x35CA,       { "game_menu",     id(game_menu) } },
              { 0xF609,       { "mute",          id(mute) } },
              { 0xFF00,       { "picture",       id(picture) } },
              { 0xF708,       { "power_on",      id(power_on) } },
              { 0x8E71,       { "power_on",      id(power_on) } },
              { 0xEF10,       { "power_off",     id(power_off_held) } },
              { 0x8D72,       { "power_off",     id(power_off_held) } },
              { 0xAB54,       { "shortcut_1",    id(shortcut_1) } },
              { 0xAA55,       { "shortcut_2",    id(shortcut_2) } },
              { 0xAD52,       { "shortcut_3",    id(shortcut_3) } },
              { 0xAC53,       { "shortcut_4",    id(shortcut_4) } },
              { 0xFC03,       { "volume_down",   id(volume_down) } },
              { 0xFD02,       { "volume_up",     id(volume_up) } },
              { 0xB847,       { "BT_start_pair", id(bluetooth_pairing_start) } },
              { 0xB649,       { "BT_clear_pair", id(bluetooth_pairing_clear) } },
            };

            
            std::stringstream ss1;
            // x.command provides the 16-bit NEC data command sequence
            ss1 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.command;
            std::string rc_code_1_str = ss1.str(); 
            
            
            std::stringstream ss2;
            // x.address provides the 16-bit NEC device address block
            ss2 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.address;
            std::string rc_code_2_str = ss2.str(); 

            // Hisense should always be x.address 0xFB04 
            // Only execute the button mapping lookup if the address matches 0xFB04
            if (x.address == 0xFB04) {
              // It is a Hisense device address, but we must also check its command for a match
              rc_code_2_str = "Hisense"; // report address as human readable Hisense
              
              auto it = nec_codes.find(x.command); // search table for IR command match
              
              if (it != nec_codes.end()) {
                id(last_xgimi_TN_command) = it->second.name; // remember xgimi command
                
                if (it->second.button_obj != nullptr) {
                  it->second.button_obj->press(); // press associated template button
                }
                
              } else {
                id(last_xgimi_TN_command) = "Unassigned";
                
 
              }
            } else {
              // It is an NEC code, but not a Hisense
              id(last_xgimi_TN_command) = "Not Hisense IR";
            }
            
            id(last_IR_address) = rc_code_2_str;
            id(last_IR_instruction) = rc_code_1_str;
# ======= KUO End remote_receiver ============
