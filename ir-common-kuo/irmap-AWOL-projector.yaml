# valerion projector
packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

remote_receiver:
  id: ir_receiver
  dump: nec
  on_sony: !remove
  on_lg: !remove
  on_jvc: !remove

substitutions:
  target_ir_address: "0x40BF"
  remote_display_name: "Valerion Prj"

  # =============================================================
  # DEFINE token clearing gate buttons
  cmd_token_clear_arm: "0x02FD"    # Valerion: APP SHORTCUT 2 (YouTube)
  cmd_token_clear_fire: "0x7A85"   # Valerion: OK / ENTER

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t
      is_hold: bool
    then:
      - lambda: |-
          id(nec_broadcast_processor).execute(command, (uint16_t)(command >> 16), (uint16_t)(command & 0xFFFF), is_hold);

  - id: nec_broadcast_processor
    parameters:
      command: uint32_t     
      device_addr: uint16_t  
      pure_cmd: uint16_t     
      is_hold: bool       
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // Resolved duplicate mapping entries to prevent compiler warnings or key overwrites
          static const std::map<uint16_t, IRCommand> nec_codes = {
            { 0x7B84,       { "back",          id(back) } },           // Valerion: BACK / EXIT
            { 0x4DB2,       { "cursor_down",   id(cursor_down) } },    // Valerion: DOWN ARROW
            { 0x7A85,       { "cursor_enter",  id(cursor_enter) } },   // Valerion: OK / ENTER
            { 0x4CB3,       { "cursor_left",   id(cursor_left) } },    // Valerion: LEFT ARROW
            { 0x4EB1,       { "cursor_right",  id(cursor_right) } },   // Valerion: RIGHT ARROW
            { 0x4FB0,       { "cursor_up",     id(cursor_up) } },      // Valerion: UP ARROW
            { 0x728D,       { "focus_auto",    id(focus_auto) } },     // Valerion: AUTO FOCUS
            { 0x50AF,       { "focus_manual",  id(focus_manual) } },   // Valerion: MANUAL FOCUS
            { 0x6A95,       { "home",          id(home) } },           // Valerion: HOME (Smart Hub / Android TV)
            { 0x8C73,       { "input",         id(input) } },          // Valerion: SOURCE SELECT (HDMI 1)
            { 0x659A,       { "settings_menu", id(settings_menu) } },  // Valerion: QUICK SETTINGS
            { 0x1AE5,       { "game_menu",     id(game_menu) } },      // Valerion: INFO STATUS Panel
            { 0xEA15,       { "mute",          id(mute) } },           // Valerion: MUTE (Unified or 0xFF00 block)
            { 0x25DA,       { "picture",       id(picture) } },        // Valerion: PICTURE MODE (Theater/Filmmaker cycle)
            { 0x6F90,       { "power_on",      id(power_on) } },       // Valerion: DISCRETE POWER ON
            { 0x6E91,       { "power_off_immediately", id(power_off_immediately) } }, // Valerion: DISCRETE POWER OFF
            { 0x23DC,       { "shortcut_1",    id(shortcut_1) } },     // Valerion: KEYSTONE CORRECTION
            { 0x09F6,       { "shortcut_2",    id(shortcut_2) } },     // Valerion: OPTICAL ZOOM ADJ
            { 0x0AF5,       { "shortcut_3",    id(shortcut_3) } },     // Valerion: 3D MODE SWITCH
            { 0x27D8,       { "shortcut_4",    id(shortcut_4) } },     // Valerion: MEMORY STORAGE SLOT
            { 0xF807,       { "volume_down",   id(volume_down) } },    // Valerion: VOLUME MINUS
            { 0xBC43,       { "volume_up",     id(volume_up) } },      // Valerion: VOLUME PLUS
            { 0x01FE,       { "token_sniff",   id(token_sniff) } },    // Valerion: APP SHORTCUT 1 (Netflix)
            { 0x02FD,       { "token_clear",   id(token_clear) } },    // Valerion: APP SHORTCUT 2 (YouTube)
            { 0x03FC,       { "token_recall",  id(token_recall) } },   // Valerion: APP SHORTCUT 3 (Prime Video)
            { 0x04FB,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // Valerion: BT REMOTE PAIR TRIGGER
            { 0x05FA,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }  // Valerion: BT REMOTE RESET TRIGGER
          };

          auto it = nec_codes.find(pure_cmd);
          if (it != nec_codes.end()) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                id(myDisplay_line1) = it->second.name + " (Hold)";
                id(myDisplay_line2) = "${remote_display_name}"; 
                id(myDisplay_line3) = ""; 
                ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
              } else {
                id(myDisplay_line1) = it->second.name;
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
                ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
              }
            }

            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!id(global_token_clear_armed)) {
              if (!is_hold) {
                id(myDisplay_line1) = "Unassigned";
                id(myDisplay_line2) = "${remote_display_name}"; 
                // myDisplay_line3 already has command hex placed by base architecture
              }
            }
          }
