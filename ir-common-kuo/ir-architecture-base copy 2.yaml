# ir-common-kuo/ir-architecture-base.yaml

remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us
  idle: 10ms
  tolerance: 25%
  dump: 
    - nec
    - pioneer
    - sony
    - lg 

  # 1. Updates timestamp every single time ANY raw IR pulse or repeat packet burst hits the pin
  on_raw:
    - lambda: |-
        id(global_last_raw_packet_time) = millis();
        if (!id(ir_timeout_watcher).is_running()) {
          id(ir_timeout_watcher).execute();
        }

  # 2. Handles NEC-style packets natively
  on_nec:
    - script.execute: display_timeout_handler
    - lambda: |-
        static uint32_t last_global_ir_time = 0;
        uint32_t now = millis();
        if (now - last_global_ir_time < 250) return;

        std::stringstream ss1, ss2;
        ss1 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.command;
        ss2 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.address;
        id(OLED_line2) = ss2.str(); 
        id(OLED_line3) = ss1.str(); 
        
        if (x.address == ${target_ir_address}) {
          id(OLED_line2) = "${remote_display_name}"; 
          last_global_ir_time = now; 
          id(global_cached_command) = x.command;
          id(global_initial_press_time) = now; 
          id(global_is_holding) = false;      
          id(master_ir_processor).execute(x.command, false);
        } else {
          id(OLED_line1) = "Not Match Address"; 
          id(global_cached_command) = 0;
          id(global_is_holding) = false;
        }

  # 3. Handles LG-style parameters cleanly by parsing x.data bit-structures
  on_lg:
    - script.execute: display_timeout_handler
    - lambda: |-
        static uint32_t last_global_ir_time = 0;
        uint32_t now = millis();
        if (now - last_global_ir_time < 250) return;

        uint16_t lg_address = (x.data >> 16) & 0xFFF;
        uint16_t lg_command = x.data & 0xFFFF;

        std::stringstream ss1, ss2;
        ss1 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << lg_command;
        ss2 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << lg_address;
        id(OLED_line2) = ss2.str(); 
        id(OLED_line3) = ss1.str(); 
        
        if (lg_address == ${target_ir_address}) {
          id(OLED_line2) = "${remote_display_name}"; 
          last_global_ir_time = now; 
          id(global_cached_command) = lg_command;
          id(global_initial_press_time) = now; 
          id(global_is_holding) = false;      
          id(master_ir_processor).execute(lg_command, false); 
        } else {
          id(OLED_line1) = "Not Match Address"; 
          id(global_cached_command) = 0;
          id(global_is_holding) = false;
        }

  # 4. FIXED: Shifted from x.bits to x.nbits to satisfy the native ESPHome SIRC compiler structural fields
  on_sony:
    - script.execute: display_timeout_handler
    - lambda: |-
        static uint32_t last_global_ir_time = 0;
        uint32_t now = millis();
        
        // Sony SIRC protocol command payload sits cleanly inside the lower 7-bits of x.data
        uint32_t sony_cmd = x.data & 0x7F; 
        
        // FIXED: Using x.nbits for dynamic frame parsing sizes safely
        uint32_t sony_address = 0;
        if (x.nbits == 12) {
          sony_address = (x.data >> 7) & 0x1F;   // 5-bit address width
        } else if (x.nbits == 15) {
          sony_address = (x.data >> 7) & 0xFF;   // 8-bit address width
        } else {
          sony_address = (x.data >> 7) & 0x1FFF; // 13-bit address width
        }

        // Convert command using your constant multiplier rules
        uint32_t reconstructed_code = (0x3085 << 7) | sony_cmd;

        if (!id(global_is_holding) && (now - last_global_ir_time < 250) && (reconstructed_code == id(global_cached_command))) {
          return;
        }

        std::stringstream ss1, ss2;
        ss1 << "0x" << std::uppercase << std::setfill('0') << std::setw(2) << std::hex << sony_cmd;
        ss2 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << sony_address;
        id(OLED_line2) = ss2.str(); 
        id(OLED_line3) = ss1.str(); 
        
        if (sony_address == ${target_ir_address}) {
          id(OLED_line2) = "${remote_display_name}"; 
          
          if (id(global_cached_command) != sony_cmd) {
            last_global_ir_time = now; 
            id(global_cached_command) = sony_cmd; 
            id(global_initial_press_time) = now; 
            id(global_is_holding) = false;      
            id(master_ir_processor).execute(sony_cmd, false);
          } else {
            id(global_last_raw_packet_time) = now;
          }
        } else {
          id(OLED_line1) = "Not Match Address";
        }
        
globals:
  - id: global_cached_command
    type: uint32_t
    initial_value: '0'
  - id: global_last_raw_packet_time
    type: uint32_t
    initial_value: '0'
  - id: global_initial_press_time
    type: uint32_t
    initial_value: '0'
  - id: global_is_holding
    type: bool
    initial_value: 'false'

script:
  - id: ir_timeout_watcher
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return (millis() - id(global_last_raw_packet_time) < 140);'
          then:
            - delay: 20ms
      - lambda: |-
          id(global_cached_command) = 0;
          id(global_is_holding) = false;

interval:
  - interval: 110ms
    then:
      - lambda: |-
          uint32_t now = millis();
          
          if (id(global_cached_command) != 0) {
            if (${hold_exclusion_condition}) return;

            if (now - id(global_last_raw_packet_time) >= 140) return;

            if (id(global_is_holding)) {
              id(master_ir_processor).execute(id(global_cached_command), true);
            } else {
              if (now - id(global_initial_press_time) >= 450) {
                id(global_is_holding) = true;
                id(master_ir_processor).execute(id(global_cached_command), true);
              }
            }
          }
