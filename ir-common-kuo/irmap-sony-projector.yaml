packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

substitutions:
  target_ir_address: "0x001A"  
  remote_display_name: "Sony Proj"
  
  hold_exclusion_condition: "id(global_cached_command) == 0x0F" 

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t   # Receives the clean, raw 7-bit command byte directly
      is_hold: bool
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // SINGLE SOURCE OF TRUTH: Rebuilt using official, raw 7-bit Sony SIRC factory command codes
          static const std::map<uint32_t, IRCommand> sony_codes = {
            { 0x5C,       { "back",          id(back) } },           // Command 0x005C (EXIT)
            { 0x34,       { "cursor_down",   id(cursor_down) } },    // Command 0x0034 (DOWN ARROW)
            { 0x54,       { "cursor_enter",  id(cursor_enter) } },   // Command 0x0054 (ENTER)
            { 0x35,       { "cursor_left",   id(cursor_left) } },    // Command 0x0035 (LEFT ARROW)
            { 0x33,       { "cursor_right",  id(cursor_right) } },   // Command 0x0033 (RIGHT ARROW)
            { 0x32,       { "cursor_up",     id(cursor_up) } },      // Command 0x0032 (UP ARROW)
            { 0x42,       { "focus_auto",    id(focus_auto) } },     // Command 0x0042 (FOCUS / LENS ADJUST)
            { 0x26,       { "focus_manual",  id(focus_manual) } },   // Command 0x0026 (APA / ADJ RESET)
            { 0x25,       { "input",         id(input) } },          // Command 0x0025 (INPUT SELECT)
            { 0x36,       { "settings_menu", id(settings_menu) } },  // Command 0x0036 (MENU)
            { 0x5D,       { "game_menu",     id(game_menu) } },      // Command 0x005D (STATUS / INFO)
            { 0x28,       { "mute",          id(mute) } },           // Command 0x0028 (MUTING)
            { 0x40,       { "picture",       id(picture) } },        // Command 0x0040 (PICTURE MODE CALIBRATION)
            { 0x2F,       { "power_on",      id(power_on) } },       // Command 0x002F (DISCRETE POWER ON)
            { 0x2E,       { "power_off_immediately", id(power_off_immediately) } }, // Command 0x002E (DISCRETE POWER OFF)
            { 0x4A,       { "shortcut_1",    id(shortcut_1) } },     // Command 0x004A (ASPECT RATIO)
            { 0x4B,       { "shortcut_2",    id(shortcut_2) } },     // Command 0x004B (MOTIONFLOW)
            { 0x49,       { "shortcut_3",    id(shortcut_3) } },     // Command 0x0049 (3D MODE)
            { 0x5E,       { "shortcut_4",    id(shortcut_4) } },     // Command 0x005E (COLOR SPACE)
            { 0x1B,       { "volume_down",   id(volume_down) } },    // Command 0x1B (RESET button)
            { 0x4D,       { "volume_up",     id(volume_up) } },      // Command 0x4D (REALISM button)
            { 0x10,       { "token_sniff",   id(token_sniff) } },    // Command 0x10 (DYNAMIC / STANDARD button)
            { 0x0F,       { "token_clear",   id(token_clear) } },    // Command 0x0F (CINEMA FILM 1 / FILM 2 button)
            { 0x3E,       { "token_recall",  id(token_recall) } },   // Command 0x3E (REF / TV / GAME or USER button)
            { 0x0E,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // Command 0x0E (BRIGHTNESS button)
            { 0x48,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }  // Command 0x48 (CONTRAST button)
          };

          // Operational safety intercept loop for repeating button holds
          if (is_hold && (${hold_exclusion_condition})) {
            ESP_LOGW("IR Safety", "Hold repeat blocked for safety excluded command: 0x%04X", (unsigned int)command);
            return;
          }

          auto it = sony_codes.find(command);
          if (it != sony_codes.end()) {
            if (is_hold) {
              id(myDisplay_line1) = it->second.name + " (Hold)";
              ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
            } else {
              id(myDisplay_line1) = it->second.name;
              ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
            }

            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!is_hold) {
              id(myDisplay_line1) = "Unassigned";
            }
          }
