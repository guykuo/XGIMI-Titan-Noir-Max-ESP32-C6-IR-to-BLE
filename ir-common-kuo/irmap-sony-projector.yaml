# sony projector
packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

remote_receiver:
  id: ir_receiver
  dump: sony
  on_nec: !remove
  on_lg: !remove
  on_jvc: !remove
  on_pronto: !remove

substitutions:
  target_ir_address: "0x001A"  
  remote_display_name: "Sony Proj"

  # =============================================================
  # DEFINE token clearing gate buttons
  cmd_token_clear_arm: "0x0CAB54"   # FILM 1
  cmd_token_clear_fire: "0x002D2A"  # OK / ENTER (Verified)

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t   
      is_hold: bool       
    then:
      - lambda: |-
          // Fixed LSB-First Extraction: Command is bottom 7 bits, Address is everything above
          uint8_t pure_command = command & 0x7F;
          uint16_t dynamic_address = command >> 7; 

          id(sony_broadcast_processor).execute(command, dynamic_address, pure_command, is_hold);

  - id: sony_broadcast_processor
    parameters:
      command: uint32_t     
      device_addr: uint16_t  
      pure_cmd: uint16_t     
      is_hold: bool       
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          static const std::map<uint32_t, IRCommand> sony_codes = {
            { 0x003A2A,       { "power_on",      id(power_on) } },       // DISCRETE POWER ON
            { 0x00542A,       { "power_on_alt",  id(power_on) } },       // Toggle POWER ON
            { 0x007A2A,       { "power_off", id(power_off_immediately)}},// DISCRETE POWER OFF
            { 0x00562A,       { "cursor_up",     id(cursor_up) } },      // UP ARROW (Verified)
            { 0x00362A,       { "cursor_down",   id(cursor_down) } },    // DOWN ARROW (Verified)
            { 0x00162A,       { "cursor_left",   id(cursor_left) } },    // LEFT ARROW (Verified)
            { 0x00662A,       { "cursor_right",  id(cursor_right) } },   // RIGHT ARROW (Verified)
            { 0x002D2A,       { "cursor_enter",  id(cursor_enter) } },   // OK / ENTER (Verified)
            { 0x004A2A,       { "settings_menu", id(settings_menu) } },  // MENU button
            { 0x006F2A,       { "back",          id(back) } },           // RESET
            { 0x06AB54,       { "game_menu",     id(game_menu) } },      // GAME
            { 0x07AB54,       { "picture",       id(picture) } },        // GAMMA CORRECTION
            { 0x00752A,       { "input",         id(input) } },          // INPUT SELECT
            { 0x026B54,       { "focus_manual",  id(focus_manual) } },   // FOCUS / LENS ADJUST (Verified)
            { 0x0FAB54,       { "focus_auto",    id(focus_auto) } },     // advanced IRIS (Verified)
            { 0x076B54,       { "shortcut_1",    id(shortcut_1) } },     // ASPECT RATIO (Verified!)
            { 0x00502A,       { "shortcut_2",    id(shortcut_2) } },     // MOTIONFLOW
            { 0x0DCB54,       { "shortcut_3",    id(shortcut_3) } },     // 3D MOTION (Verified!)
            { 0x0D2B54,       { "shortcut_4",    id(shortcut_4) } },     // COLOR SPACE (Verified!)
            { 0x000C2A,       { "volume_up",     id(volume_up) } },      // CONTRAST 
            { 0x004C2A,       { "volume_down",   id(volume_down) } },    // CONTRAST DOWN
            { 0x0EAB54,       { "mute",          id(mute) } },           // PHOTO
            { 0x032B54,       { "token_sniff",   id(token_sniff) } },    // REALITY
            { 0x0CAB54,       { "token_clear",   id(token_clear) } },    // FILM 1
            { 0x01AB54,       { "token_recall",  id(token_recall) } },   // FILM 2
            { 0x007C2A,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // BRIGHTNESS DOWN
            { 0x003C2A,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }  // BRIGHTNESS UP
          };

          auto it = sony_codes.find(command);
          if (it != sony_codes.end()) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                id(myDisplay_line1) = it->second.name + " (Hold)";
              } else {
                id(myDisplay_line1) = it->second.name;
              }
              id(myDisplay_line2) = "${remote_display_name}"; 
              // myDisplay_line3 already has raw hex code from base architecture
            }
            
            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!id(global_token_clear_armed)) {
              if (!is_hold) {
                uint8_t bit_depth = (command > 0x007FFF) ? 20 : ((command > 0x000FFF) ? 15 : 12);
                id(myDisplay_line1) = "Sony Unk(" + std::to_string(bit_depth) + "b)";
                
                char addr_buf[32];
                snprintf(addr_buf, sizeof(addr_buf), "A:0x%04X  C:0x%02X", device_addr, pure_cmd);
                id(myDisplay_line2) = std::string(addr_buf);
                // myDisplay_line3 already has raw hex code from base architecture
              }
            }
          }
