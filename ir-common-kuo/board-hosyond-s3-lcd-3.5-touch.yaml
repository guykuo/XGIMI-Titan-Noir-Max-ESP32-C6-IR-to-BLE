    on_page_change:
      - then:
          - if:
              condition:
                lambda: 'return (const esphome::display::DisplayPage*)to == id(blank_page);'
              then:
                - light.turn_off:
                    id: panel_backlight
              else:
                - light.turn_on:
                    id: panel_backlight
                    brightness: ${panel_BL_percent}

    pages:
      - id: active_page_std
        lambda: |-
          auto L1color = Color(255, 100, 0);
          auto L2color = Color(255, 120, 0);
          auto L3color = Color(255, 150, 0);
          
          char buf1[32] = {0}; char buf2[32] = {0}; char buf3[32] = {0};
          snprintf(buf1, sizeof(buf1), "%.25s", id(myDisplay_line1).c_str());
          snprintf(buf2, sizeof(buf2), "%.25s", id(myDisplay_line2).c_str());
          snprintf(buf3, sizeof(buf3), "%.20s", id(myDisplay_line3).c_str());
          
          it.print(5, 10,  id(my_fontSmall), L1color, esphome::display::TextAlign::TOP_LEFT, buf1);
          it.print(5, 50,  id(my_fontSmall), L2color, esphome::display::TextAlign::TOP_LEFT, buf2);
          it.print(5, 90, id(my_fontMedium), L3color, esphome::display::TextAlign::TOP_LEFT, buf3);
          
          ${draw_all_remote_buttons}
          
      - id: active_page_small
        lambda: |-
            auto L1color = Color(255, 130, 0);
            auto L2color = Color(255, 130, 0);
            auto L3color = Color(255, 130, 0);
            
            it.print(5, 10,  id(my_fontSmall), L1color, id(myDisplay_line1).c_str());
            it.print(5, 50,  id(my_fontSmall), L2color, id(myDisplay_line2).c_str());
            it.print(5, 90, id(my_fontSmall), L3color, id(myDisplay_line3).c_str());
                        
            ${draw_all_remote_buttons}

      - id: profiles_menu_page
        lambda: |-
          auto text_color = Color(200, 200, 200);
          auto header_color = Color(58, 166, 255);
          auto accent_color = Color(255, 100, 0);
          auto lines_color = Color(50, 50, 50);
          auto font_btn = id(my_fontButton);
          auto font_sm = id(my_fontSmall);

          // Top Info Banner Area
          it.print(5, 10, id(my_fontMedium), header_color, "PROFILE SELECTION");
          it.print(5, 45, font_sm, text_color, "Active Slot Index Position:");
          
          char cur_profile_str[64];
          snprintf(cur_profile_str, sizeof(cur_profile_str), "Slot %d: %s", id(active_remote_profile), active_profile_workspace.profile_name.c_str());
          it.print(5, 75, font_sm, accent_color, cur_profile_str);

          // Render Grid Intercept Boxes (2 Columns x 4 Rows for profiles)
          it.horizontal_line(0, 140, 320, lines_color);
          for(int r = 1; r <= 8; r++) {
            it.horizontal_line(0, 144 + (r * 42), 320, lines_color);
          }
          it.vertical_line(160, 140, 336, lines_color);

          // Column 0 / Factory Presets
          it.print(80,  158, font_btn, text_color, esphome::display::TextAlign::TOP_CENTER, "[0] AWOL Proj");
          it.print(80,  200, font_btn, text_color, esphome::display::TextAlign::TOP_CENTER, "[1] BenQ Proj");
          it.print(80,  242, font_btn, text_color, esphome::display::TextAlign::TOP_CENTER, "[2] Epson Proj");
          it.print(80,  284, font_btn, text_color, esphome::display::TextAlign::TOP_CENTER, "[3] Hisense");
          it.print(80,  326, font_btn, text_color, esphome::display::TextAlign::TOP_CENTER, "[7] LG Proj");
          it.print(80,  368, font_btn, text_color, esphome::display::TextAlign::TOP_CENTER, "[8] Optoma");
          it.print(80,  410, font_btn, text_color, esphome::display::TextAlign::TOP_CENTER, "[9] Sony Proj");

          // Column 1 / User Learned Custom Profile Non-Volatile Slots
          it.print(240, 158, font_btn, text_color, esphome::display::TextAlign::TOP_CENTER, "[10] Sony XBR");
