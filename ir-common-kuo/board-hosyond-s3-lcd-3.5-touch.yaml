# Hosyond ESP32-S3 Touchscreen Module, 3.5" 240x320 IPS LCD EPS32 Display
# ============= BEGIN Configuration Options KUO ==========

substitutions:
  pin_ir_receiver: GPIO45 
  pin_indicator_LED: GPIO40 
  pin_action_btn: GPIO0 
  pin_action_btn_pullup: true
  wifi_tx_power: "14dB"
  panel_BL_percent: "50%"
  def_profile: "0"

  # ─── 🟢 THE UNIFIED TEXT MACRO BLUEPRINT ───
  draw_all_remote_buttons: |-
    auto grid_line_color = Color(60, 60, 60);
    auto text_btn_color = Color(180, 180, 180);
    auto font_btn = id(my_fontButton); 
    auto yellow_nav_color = Color(255, 215, 0);

    it.horizontal_line(0, 140, 320, grid_line_color);
    for(int r = 1; r <= 8; r++) {
      it.horizontal_line(0, 144 + (r * 42), 320, grid_line_color);
    }
    it.vertical_line(160, 140, 340, grid_line_color);
    it.vertical_line(80,  186, 298, grid_line_color); 
    it.vertical_line(240, 186, 298, grid_line_color); 
    
    it.print(80,  158, font_btn, Color(255,50,50), esphome::display::TextAlign::TOP_CENTER, "ON");
    it.print(240, 158, font_btn, Color(255,50,50), esphome::display::TextAlign::TOP_CENTER, "OFF");
    
    // Rows 1-5 same as original...
    it.print(40,  200, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "Home");
    it.print(120, 200, font_btn, yellow_nav_color, esphome::display::TextAlign::TOP_CENTER, "Up");
    it.print(200, 200, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "Game");
    it.print(280, 200, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "Vol+");
    
    it.print(40,  242, font_btn, yellow_nav_color, esphome::display::TextAlign::TOP_CENTER, "Left");
    it.print(120, 242, font_btn, yellow_nav_color, esphome::display::TextAlign::TOP_CENTER, "Enter");
    it.print(200, 242, font_btn, yellow_nav_color, esphome::display::TextAlign::TOP_CENTER, "Right");
    it.print(280, 242, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "Vol-");
    
    it.print(40,  284, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "Back");
    it.print(120, 284, font_btn, yellow_nav_color, esphome::display::TextAlign::TOP_CENTER, "Down");
    it.print(200, 284, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "Menu");
    it.print(280, 284, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "Mute");
    
    it.print(40,  326, font_btn, Color(100,200,100), esphome::display::TextAlign::TOP_CENTER, "Foc Man");
    it.print(120, 326, font_btn, Color(100,200,100), esphome::display::TextAlign::TOP_CENTER, "Foc Auto");
    it.print(200, 326, font_btn, Color(100,200,100), esphome::display::TextAlign::TOP_CENTER, "Pict");
    it.print(280, 326, font_btn, Color(100,200,100), esphome::display::TextAlign::TOP_CENTER, "Input");
    
    it.print(40,  368, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "S1");
    it.print(120, 368, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "S2");
    it.print(200, 368, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "S3");
    it.print(280, 368, font_btn, text_btn_color, esphome::display::TextAlign::TOP_CENTER, "S4");

    it.print(40,  410, font_btn, Color(150,100,220), esphome::display::TextAlign::TOP_CENTER, "M REC");
    it.print(120, 410, font_btn, Color(150,100,220), esphome::display::TextAlign::TOP_CENTER, "M Play");
    it.print(200, 410, font_btn, text_btn_color,     esphome::display::TextAlign::TOP_CENTER, "BT Pair");
    it.print(280, 410, font_btn, text_btn_color,     esphome::display::TextAlign::TOP_CENTER, "BT Clear");
    
    it.print(40,  452, font_btn, Color(200,200,100), esphome::display::TextAlign::TOP_CENTER, "Tkn Sniff");
    it.print(120, 452, font_btn, Color(200,200,100), esphome::display::TextAlign::TOP_CENTER, "Tkn Wipe");
    it.print(200, 452, font_btn, Color(200,200,100), esphome::display::TextAlign::TOP_CENTER, "Tkn Recall");
    it.print(280, 452, font_btn, Color(0,191,255),   esphome::display::TextAlign::TOP_CENTER, "Profile");

  
# Core Architecture Declaration
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3 # variant needed to keep compiler tuned for the S3 chip core
  framework:
    type: esp-idf

# ============= END Configuration Options KUO ==========

esphome:
  on_boot:
    - priority: -50.0
      then:
        - light.turn_on: 
            id: panel_backlight
            brightness: ${panel_BL_percent}
  build_flags:
    - "-DHAS_PHYSICAL_TOUCHSCREEN_MENU=1"
    
                
external_components:
  - source: 
      type: local
      path: components
    components: [ hosyond_st77922_touch ]
    
# Instantiate the C++ loop hook directly via standard initialization lambdas
hosyond_st77922_touch:
  id: touch_bridge


psram:
  mode: octal
  speed: 80MHz

globals:

  # New latches to stop the infinite execution loop
  - id: touch_active_latch
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: touch_last_action
    type: std::string
    restore_value: no
    initial_value: '""'

  
  
    # ======= myDisplay display globals
  - id: myDisplay_line1
    type: std::string  
    restore_value: no
    initial_value: ''

  - id: myDisplay_line2
    restore_value: no
    type: std::string  
    initial_value: ''
    
  - id: myDisplay_line3
    restore_value: no
    type: std::string  
    initial_value: ''    
          
          
light:
  - platform: esp32_rmt_led_strip # neopixel
    id: indicator_led
    pin: ${pin_indicator_LED}
    chipset: WS2812
    num_leds: 1
    rgb_order: GRB
    name: "Sniffer Indicator"
    internal: true

  - platform: monochromatic  
    name: "Display Backlight"
    id: panel_backlight
    output: backlight_pwm
    default_transition_length: 0.1s
    gamma_correct: 0 
    restore_mode: ALWAYS_OFF    
    internal: true

output: 
  - platform: ledc # display backlight engine
    pin: GPIO41       
    id: backlight_pwm
    frequency: 4000Hz    



script:
  - id: flash_led_custom
    parameters:
      count: int         # Number of flashes
      dwell: int         # duration of flash in msec
      red: float         # Red value (0.0 to 1.0)
      green: float       # Green value (0.0 to 1.0)
      blue: float        # Blue value (0.0 to 1.0)
    mode: queued
    then:
      - repeat:
          count: !lambda "return count;"
          then:
            # --- TURN RGB LED ON WITH DYNAMIC COLOR ---
            - light.turn_on:
                id: indicator_led
                red: !lambda "return red;"
                green: !lambda "return green;"
                blue: !lambda "return blue;"
                brightness: 0.2
                transition_length: 0s
            - delay: !lambda "return dwell;"

            # --- TURN RGB LED OFF ---
            - light.turn_off:
                id: indicator_led
                transition_length: 0s
            - delay: !lambda "return dwell;"
            
  - id: turn_led_on_custom
    parameters:
      red: float         # Red channel (0.0 to 1.0)
      green: float       # Green channel (0.0 to 1.0)
      blue: float        # Blue channel (0.0 to 1.0)
      brightness: float  # Brightness (0.0 to 1.0)
    mode: single
    then:
      - light.turn_on:
          id: indicator_led
          red: !lambda "return red;"
          green: !lambda "return green;"
          blue: !lambda "return blue;"
          brightness: !lambda "return brightness;"
          transition_length: 0s  
          
  - id: turn_led_off_custom
    mode: single
    then:
      - light.turn_off:
          id: indicator_led
          transition_length: 0s  


  # ─── MAPPING MACRO LAYOUT UTILITY HOOKS ───
  - id: go_to_profiles_page
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("DISPLAY", "ENGAGING PROFILES VIEWPORT LOCK");

          // 🛠️ THE PROTECTION GATER: 
          // Setting this to true blocks your background cleanup scripts 
          // from erasing your touch lock variables while selecting slots.
          id(showing_special_info) = true; 
          
          id(touch_bridge).last_action = "PROFILE_MENU_LOCK"; 
          id(myDisplay).show_page(id(profiles_menu_page)); 
                    
          
  - id: go_to_remote_page
    mode: single
    then:
      - lambda: |-
          // Re-engage normal background display overrides only when returning to the dashboard
          id(showing_special_info) = false; 
          id(touch_bridge).last_action = "";
          
          id(myDisplay).show_page(id(active_page_std));

# ============= General Display Scripts ============
  # --- myDisplay display 3 lines and auto dim display ---
  - id: display_show
    mode: restart 
    parameters:
      small_text: bool
      line1: string  
      line2: string
      line3: string
   
    then:
      - lambda: |-
          // ─── HEX conversion to use defined ENUMS ───
          char wake_buf[16];
          char pad_buf[16];
          
          snprintf(wake_buf, sizeof(wake_buf), "0x%04X", (unsigned int)SOURCE_TOUCH_WAKE);
          snprintf(pad_buf, sizeof(pad_buf),   "0x%04X", (unsigned int)SOURCE_TOUCH_PAD);

          if (line3 == wake_buf) { // Matches SOURCE_TOUCH_WAKE ("0x9999")
            id(myDisplay_line1) = "Touch Screen";
            id(myDisplay_line2) = line2; 
            id(myDisplay_line3) = "Ready";
            
          } else if (line3 == pad_buf) { // Matches SOURCE_TOUCH_PAD ("0xBBBB")
            id(myDisplay_line1) = line1; 
            id(myDisplay_line2) = line2;
            id(myDisplay_line3) = "Touch Screen";
            
          } else {
            id(myDisplay_line1) = line1; 
            id(myDisplay_line2) = line2;
            id(myDisplay_line3) = line3;
          }
                              
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 60s 

      # If the system is actively recording a macro or awaiting a hotkey,
      # skip turning the screen black to keep your logged steps fully visible.
      - if:
          condition:
            lambda: |-
              int current_state = id(macro_workflow_state);
              return (current_state == MACRO_STATE_RECORDING || current_state == MACRO_STATE_AWAITING_HOTKEY);
          then:
            - logger.log: "Macro engine active. Suppressing display sleep timeout pass."
          else:
            - display.page.show: blank_page


# --- myDisplay modify a line and auto dim display ---

  - id: display_modify_a_line
    mode: restart 
    parameters:
      small_text: bool
      whichLine: int
      aline: string  # Reverted to framework-supported keyword
   
    then:
      - lambda: |-
          switch (whichLine) {
            case 1:
              id(myDisplay_line1) = aline; 
              break;
            case 2:
              id(myDisplay_line2) = aline;
              break;
            case 3:
              id(myDisplay_line3) = aline;
              break;
            default:
              break;
          }
          
      - if:
          condition:
            lambda: |-
              return id(myDisplay_disabled);
          then:
            - display.page.show: blank_page
          else:
            - if:
                condition:
                  lambda: |-
                    return small_text;
                then:
                   - display.page.show: active_page_small
                else:
                   - display.page.show: active_page_std

      - delay: 60s 

      # If the system is actively recording a macro or awaiting a hotkey,
      # skip turning the screen black to keep your logged steps fully visible.
      - if:
          condition:
            lambda: |-
              int current_state = id(macro_workflow_state);
              return (current_state == MACRO_STATE_RECORDING || current_state == MACRO_STATE_AWAITING_HOTKEY);
          then:
            - logger.log: "Macro engine active. Suppressing display sleep timeout pass."
          else:
            - display.page.show: blank_page



# ========  Display Specific Implementation ========

font:
  - file: "gfonts://Roboto"
    id: my_fontSmall
    size: 25
  - file: "gfonts://Roboto"
    id: my_fontMedium
    size: 30
  - file: "gfonts://Roboto"
    id: my_fontLarge
    size: 40
  - file: "gfonts://Roboto"
    id: my_fontButton
    size: 14          # Dedicated compact font just for the layout buttons



# Configure the 4-bit Hardware Quad-SPI bus
spi:
  id: tft_qspi
  type: quad        
  clk_pin: GPIO12   
  data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]


# ====================================================================
# 2. RENDER THE INTERACTIVE GRAPHIC TOUCH BOXES ON SCREEN
# ====================================================================
display:
  - platform: mipi_spi
    id: myDisplay
    spi_id: tft_qspi
    model: ST7789V
    bus_mode: quad
    cs_pin: GPIO10
    reset_pin: GPIO43 
    rotation: 0
    dimensions: 320X480     
    invert_colors: true
    color_order: RGB    
    data_rate: 80MHz    
    update_interval: 0.3s # 🔥 CHANGED: Gives ESP-IDF breathing room between frames


    # factory initialization matrix sequence
    init_sequence:
