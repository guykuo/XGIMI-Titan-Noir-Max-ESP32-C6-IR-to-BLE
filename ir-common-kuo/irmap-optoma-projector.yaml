# optoma projector
packages:
  base_ir_engine: !include appkit/ir-architecture-base.yaml

remote_receiver:
  id: ir_receiver
  dump: nec
  on_sony: []   # Total hardware lockout for cross-talk
  on_lg: []
  on_jvc: []

substitutions:
  target_ir_address: "0xCD32"
  remote_display_name: "Optoma Proj"
  
  # =============================================================
  # DEFINE token clearing gate buttons
  cmd_token_clear_arm: "0xE31C"    # Optoma: 5
  cmd_token_clear_fire: "0x3AC5"   # Optoma: ENTER

script:
  - id: master_ir_processor
    parameters:
      command: uint32_t
      is_hold: bool
    then:
      - lambda: |-
          id(nec_broadcast_processor).execute(command, (uint16_t)(command >> 16), (uint16_t)(command & 0xFFFF), is_hold);

  - id: nec_broadcast_processor
    parameters:
      command: uint32_t     
      device_addr: uint16_t  
      pure_cmd: uint16_t     
      is_hold: bool       
    then:
      - lambda: |-
          struct IRCommand {
            std::string name;
            esphome::template_::TemplateButton* button_obj;
          };

          // Strict unique map loaded with genuine Optoma production command codes
          static const std::map<uint16_t, IRCommand> nec_codes = {
            { 0x5CA3,       { "back",          id(back) } },           // Optoma: ESCAPE / BACK
            { 0x38C7,       { "cursor_down",   id(cursor_down) } },    // Optoma: DOWN ARROW
            { 0x3AC5,       { "cursor_enter",  id(cursor_enter) } },   // Optoma: ENTER
            { 0x37C8,       { "cursor_left",   id(cursor_left) } },    // Optoma: LEFT ARROW
            { 0x36C9,       { "cursor_right",  id(cursor_right) } },   // Optoma: RIGHT ARROW / RE-SYNC
            { 0x39C6,       { "cursor_up",     id(cursor_up) } },      // Optoma: UP ARROW
            { 0x7887,       { "focus_auto",    id(focus_auto) } },     // Optoma: BRIGHTNESS
            { 0x7B84,       { "focus_manual",  id(focus_manual) } },   // Optoma: KEYSTONE MINUS
            { 0x7788,       { "settings_menu", id(settings_menu) } },  // Optoma: MENU
            { 0x6996,       { "game_menu",     id(game_menu) } },      // Optoma: INFO PANEL
            { 0xFC03,       { "mute",          id(mute) } },           // Optoma: AV MUTE (Blank Screen)
            { 0x6699,       { "picture",       id(picture) } },        // Optoma: DISPLAY MODE
            { 0xFD02,       { "power_on",      id(power_on) } },       // Optoma: DISCRETE POWER ON
            { 0xD12E,       { "power_off_immediately", id(power_off_immediately) } }, // Optoma: DISCRETE POWER OFF
            { 0x41BE,       { "shortcut_1",    id(shortcut_1) } },     // Optoma: ASPECT RATIO
            { 0x7A85,       { "shortcut_2",    id(shortcut_2) } },     // Optoma: KEYSTONE PLUS
            { 0x1CE3,       { "shortcut_3",    id(shortcut_3) } },     // Optoma: 3D MODE
            { 0x55AA,       { "shortcut_4",    id(shortcut_4) } },     // Optoma: CONTRAST TOOL
            { 0x708F,       { "volume_down",   id(volume_down) } },    // Optoma: VOLUME MINUS
            { 0x738C,       { "volume_up",     id(volume_up) } },      // Optoma: VOLUME PLUS
            { 0x8F70,       { "token_sniff",   id(token_sniff) } },    // Optoma: 4
            { 0xE31C,       { "token_clear",   id(token_clear) } },    // Optoma: 5
            { 0xE619,       { "token_recall",  id(token_recall) } },   // Optoma: 6
            { 0xE51A,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // 7
            { 0xE817,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }  // 8
          };

          auto it = nec_codes.find(pure_cmd);
          if (it != nec_codes.end()) {
            if (!id(global_token_clear_armed)) {
              if (is_hold) {
                id(myDisplay_line1) = it->second.name + " (Hold)";
                id(myDisplay_line2) = "${remote_display_name}"; 
                id(myDisplay_line3) = ""; 
                ESP_LOGD("IR Hold Loop", "Repeating Button Stream Press: %s", it->second.name.c_str());
              } else {
                id(myDisplay_line1) = it->second.name;
                id(myDisplay_line2) = "${remote_display_name}"; 
                id(myDisplay_line3) = ""; 
                ESP_LOGD("IR Translated", "IR First Press ---> : %s", it->second.name.c_str());
              }
            }

            if (it->second.button_obj != nullptr) {
              it->second.button_obj->press();
            }
          } else {
            if (!id(global_token_clear_armed)) {
              if (!is_hold) {
                id(myDisplay_line1) = "Unassigned";
                id(myDisplay_line2) = "${remote_display_name}"; 
                id(myDisplay_line3) = ""; 
              }
            }
          }
