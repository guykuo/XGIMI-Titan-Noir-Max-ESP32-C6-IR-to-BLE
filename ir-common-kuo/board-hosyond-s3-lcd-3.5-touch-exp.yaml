      - [0xB7, 0x07, 0x0A, 0x0E, 0x06, 0x05, 0x03, 0x2B, 0x03, 0x03, 0x42, 0x07, 0x10, 0x10, 0x2E, 0x3F, 0x0D]
      - [0xB8, 0x07, 0x0A, 0x0D, 0x05, 0x05, 0x02, 0x2B, 0x02, 0x03, 0x42, 0x06, 0x10, 0x0F, 0x2E, 0x3F, 0x0D]
      - [0xB9, 0x23, 0x23]
      - [0xBF, 0x10, 0x14, 0x14, 0x0B, 0x0B, 0x0B]
      - [0xF2, 0x00]
      - [0x73, 0x04, 0xDA, 0x12, 0x54, 0x47]
      - [0x77, 0x6B, 0x5B, 0xFD, 0xC3, 0xC5]
      - [0x7A, 0x15, 0x27]
      - [0x7B, 0x04, 0x57]
      - [0x7E, 0x01, 0x0E]
      - [0xBF, 0x36]
      - [0xE3, 0x40, 0x40]
      - [0xF0, 0x00]
      - [0xD0, 0x00]
      - [0x2A, 0x00, 0x00, 0x01, 0x3F]
      - [0x2B, 0x00, 0x00, 0x01, 0xDF]
      - [0x21]
      - [0x11]
      - DELAY 120ms
      - [0x29]
      - [0x2C]
      # - [0x3A, 0x01]
      - [0x36, 0x00]
      - [0x35, 0x01]
      - DELAY 20ms

    on_page_change:
      - then:
          - if:
              condition:
                lambda: 'return to == id(blank_page);'
              then:
                - light.turn_off:
                    id: display_backlight
              else:
                - light.turn_on:
                    id: display_backlight
                    brightness: ${display_BL_percent}

    pages:
      - id: active_page_std
        lambda: |-
            // ─── A: TOP RUNTIME DATA LOGGING PORTAL VIEWPORT ───
            auto L1color = Color(255, 100, 0);
            auto L2color = Color(255, 120, 0);
            auto L3color = Color(255, 150, 0);
            auto grid_line_color = Color(60, 60, 60);
            auto text_btn_color = Color(180, 180, 180);
            
            // Use static formatting blocks to prevent memory leakage and boundary errors
            char buf1[32] = {0};
            char buf2[32] = {0};
            char buf3[32] = {0};
            
            snprintf(buf1, sizeof(buf1), "%.25s", id(myDisplay_line1).c_str());
            snprintf(buf2, sizeof(buf2), "%.25s", id(myDisplay_line2).c_str());
            snprintf(buf3, sizeof(buf3), "%.20s", id(myDisplay_line3).c_str());
            
            it.print(5, 20,  id(my_fontSmall), L1color, esphome::display::TextAlign::TOP_LEFT, buf1);
            it.print(5, 60,  id(my_fontSmall), L2color, esphome::display::TextAlign::TOP_LEFT, buf2);
            it.print(5, 100, id(my_fontMedium), L3color, esphome::display::TextAlign::TOP_LEFT, buf3);
            
            // Boundary dividing line between logs and keys
            it.horizontal_line(0, 140, 320, grid_line_color);
            
            // ─── B: VERTICAL GRID LINES (4 Columns) ───
            it.vertical_line(80,  140, 340, grid_line_color);
            it.vertical_line(160, 140, 340, grid_line_color);
            it.vertical_line(240, 140, 340, grid_line_color);
            
            // ─── C: HORIZONTAL GRID ROWS (8 Rows) ───
            for(int r = 1; r <= 8; r++) {
              it.horizontal_line(0, 144 + (r * 42), 320, grid_line_color);
            }
            
            // ─── D: VISUAL BUTTON LABELS CENTERED TO COORD CELLS ───
            // Row 0 - Optimized wide spans for Power Split Handshakes
            it.print(80,  152, id(my_fontSmall), Color(255,50,50), esphome::display::TextAlign::TOP_CENTER, "ON");
            it.print(240, 152, id(my_fontSmall), Color(255,50,50), esphome::display::TextAlign::TOP_CENTER, "OFF");
            // Row 1
            it.print(40,  194, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "HOME");
            it.print(120, 194, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "UP");
            it.print(200, 194, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "GAME");
            it.print(280, 194, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "V+");
            // Row 2
            it.print(40,  236, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "LF");
            it.print(120, 236, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "ENT");
            it.print(200, 236, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "RT");
            it.print(280, 236, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "V-");
            // Row 3
            it.print(40,  278, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "BK");
            it.print(120, 278, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "DN");
            it.print(200, 278, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "MENU");
            it.print(280, 278, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "MUT");
            // Row 4
            it.print(40,  320, id(my_fontSmall), Color(100,200,100), esphome::display::TextAlign::TOP_CENTER, "F_M");
            it.print(120, 320, id(my_fontSmall), Color(100,200,100), esphome::display::TextAlign::TOP_CENTER, "F_A");
            it.print(200, 320, id(my_fontSmall), Color(100,200,100), esphome::display::TextAlign::TOP_CENTER, "PIC");
            it.print(280, 320, id(my_fontSmall), Color(100,200,100), esphome::display::TextAlign::TOP_CENTER, "INP");
            // Row 5
            it.print(40,  362, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "S1");
            it.print(120, 362, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "S2");
            it.print(200, 362, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "S3");
            it.print(280, 362, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "S4");
            // Row 6
            it.print(40,  404, id(my_fontSmall), Color(150,100,220), esphome::display::TextAlign::TOP_CENTER, "REC");
            it.print(120, 404, id(my_fontSmall), Color(150,100,220), esphome::display::TextAlign::TOP_CENTER, "PLY");
            it.print(200, 404, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "PAIR");
            it.print(280, 404, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "CLR");
            // Row 7
            it.print(40,  446, id(my_fontSmall), Color(200,200,100), esphome::display::TextAlign::TOP_CENTER, "SNF");
            it.print(120, 446, id(my_fontSmall), Color(200,200,100), esphome::display::TextAlign::TOP_CENTER, "WIP");
            it.print(200, 446, id(my_fontSmall), Color(200,200,100), esphome::display::TextAlign::TOP_CENTER, "RCL");
            it.print(280, 446, id(my_fontSmall), text_btn_color, esphome::display::TextAlign::TOP_CENTER, "B_C");

      - id: active_page_small
        lambda: |-
            auto L1color = Color(255, 130, 0);
            auto L2color = Color(255, 130, 0);
            auto L3color = Color(255, 130, 0);
            
            it.print(5, 30,  id(my_fontMedium), L1color, id(myDisplay_line1).c_str());
            it.print(5, 70,  id(my_fontMedium), L2color, id(myDisplay_line2).c_str());
            it.print(5, 110,  id(my_fontMedium),L3color, id(myDisplay_line3).c_str());

      - id: blank_page
        lambda: |-
          // Leaving lambda completely blank turns all pixels off safely
