# Hosyond ESP32-S3 Touchscreen Module, 3.5" 240x320 IPS LCD EPS32 Display
# ============= BEGIN Configuration Options KUO ==========

substitutions:
  pin_ir_receiver: GPIO45 # spare GPIO on expansion pin connector
  pin_indicator_LED: GPIO40 # neopixel
  pin_action_btn: GPIO0 # use boot button to start actions
  pin_action_btn_pullup: true
  wifi_tx_power: "14dB"

  display_BL_percent: 50%
  
# Core Architecture Declaration
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3 # variant needed to keep compiler tuned for the S3 chip core
  framework:
    type: esp-idf

# ============= END Configuration Options KUO ==========

esphome:
  on_boot:

    - priority: 100.0
      then:
        - light.turn_on:
            id: display_backlight
            brightness: ${display_BL_percent}

external_components:
  - source: 
      type: local
      path: components
    components: [ st77922_touch ]

# Instantiate the C++ loop hook directly via standard initialization lambdas
st77922_touch:



psram:
  mode: octal
  speed: 80MHz

globals:

  # New latches to stop the infinite execution loop
  - id: touch_active_latch
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: touch_last_action
    type: std::string
    restore_value: no
    initial_value: '""'

  
  
    # ======= myDisplay display globals
  - id: myDisplay_line1
    type: std::string  
    restore_value: no
    initial_value: ''

  - id: myDisplay_line2
    restore_value: no
    type: std::string  
    initial_value: ''
    
  - id: myDisplay_line3
    restore_value: no
    type: std::string  
    initial_value: ''    
          
          
light:
  - platform: esp32_rmt_led_strip # neopixel
    id: indicator_led
    pin: ${pin_indicator_LED}
    chipset: WS2812
    num_leds: 1
    rgb_order: GRB
    name: "Sniffer Indicator"
    internal: true

  - platform: monochromatic  
    name: "Display Backlight"
    id: display_backlight
    output: backlight_pwm
    default_transition_length: 0.5s
    gamma_correct: 0          # Keeps response linear 
    restore_mode: ALWAYS_OFF    
    internal: true

output: 
  - platform: ledc # display backlight engine
    pin: GPIO41       
    id: backlight_pwm
    frequency: 4000Hz    



script:
  - id: flash_led_custom
    parameters:
      count: int         # Number of flashes
      dwell: int         # duration of flash in msec
      red: float         # Red value (0.0 to 1.0)
      green: float       # Green value (0.0 to 1.0)
      blue: float        # Blue value (0.0 to 1.0)
    mode: queued
    then:
      - repeat:
          count: !lambda "return count;"
          then:
            # --- TURN RGB LED ON WITH DYNAMIC COLOR ---
            - light.turn_on:
                id: indicator_led
                red: !lambda "return red;"
                green: !lambda "return green;"
                blue: !lambda "return blue;"
                brightness: 0.2
                transition_length: 0s
            - delay: !lambda "return dwell;"

            # --- TURN RGB LED OFF ---
            - light.turn_off:
                id: indicator_led
                transition_length: 0s
            - delay: !lambda "return dwell;"
            
  - id: turn_led_on_custom
    parameters:
      red: float         # Red channel (0.0 to 1.0)
      green: float       # Green channel (0.0 to 1.0)
      blue: float        # Blue channel (0.0 to 1.0)
      brightness: float  # Brightness (0.0 to 1.0)
    mode: single
    then:
      - light.turn_on:
          id: indicator_led
          red: !lambda "return red;"
          green: !lambda "return green;"
          blue: !lambda "return blue;"
          brightness: !lambda "return brightness;"
          transition_length: 0s  
          
  - id: turn_led_off_custom
    mode: single
    then:
      - light.turn_off:
          id: indicator_led
          transition_length: 0s  


# ========  Display Specific Implementation ========

font:
  - file: "gfonts://Roboto"
    id: my_fontSmall
    size: 30
  - file: "gfonts://Roboto"
    id: my_fontMedium
    size: 35
  - file: "gfonts://Roboto"
    id: my_fontLarge
    size: 40

    
# Configure the 4-bit Hardware Quad-SPI bus
spi:
  id: tft_qspi
  type: quad        
  clk_pin: GPIO12   
  data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]



# ====================================================================
# NATIVE HARDWARE-MANAGED SITRONIX/GOODIX TOUCH COMPONENT
# ====================================================================
i2c:
  - id: touch_i2c
    sda: GPIO4
    scl: GPIO8
    scan: true
    frequency: 100kHz

touchscreen:
  - platform: gt911
    id: hosyond_touch
    display: myDisplay  
    i2c_id: touch_i2c
    address: 0x5D
    
    # By assigning these here without any manual output configurations, 
    # ESPHome automatically loops the reset/int voltage states on boot.
    interrupt_pin: GPIO3
    reset_pin: GPIO48
        
    on_touch:
      - then:
          - lambda: |-
              int tx = touch.x;
              int ty = touch.y;
              
              if (ty < 144) return;
              
              int col = tx / 80;          
              int row = (ty - 144) / 42;  
              
              std::string action = "";
              bool is_monostable = false; 
              
              if (row == 0) {
                action = (col < 2) ? "power_on" : "power_off";
                is_monostable = true;
              }
              else if (row == 1) { 
                if (col == 0) action = "home";
                if (col == 1) action = "cursor_up";
                if (col == 2) action = "game_menu";
                if (col == 3) action = "volume_up";
              }
              else if (row == 2) { 
                if (col == 0) action = "cursor_left";
                if (col == 1) action = "cursor_enter";
                if (col == 2) action = "cursor_right";
                if (col == 3) action = "volume_down";
              }
              else if (row == 3) { 
                if (col == 0) action = "back";
                if (col == 1) action = "cursor_down";
                if (col == 2) action = "settings_menu";
                if (col == 3) action = "mute";
              }
              else if (row == 4) { 
                if (col == 0) action = "focus_manual";
                if (col == 1) action = "focus_auto";
                if (col == 2) action = "picture";
                if (col == 3) action = "input";
                if (col == 0 || col == 1) is_monostable = true;
              }
              else if (row == 5) { 
                if (col == 0) action = "shortcut_1";
                if (col == 1) action = "shortcut_2";
                if (col == 2) action = "shortcut_3";
                if (col == 3) action = "shortcut_4";
              }
              else if (row == 6) { 
                if (col == 0) action = "macro_record";
                if (col == 1) action = "macro_play";
                if (col == 2) action = "ble_pair";
                if (col == 3) action = "ble_clear";
                is_monostable = true;
              }
              else if (row == 7) { 
                if (col == 0) action = "token_sniff";
                if (col == 1) action = "token_clear";
                if (col == 2) action = "token_recall";
                is_monostable = true;
              }
              
              if (action == "") return;
              
              static std::string last_action = "";
              static uint32_t last_trigger_time = 0;
              
              if (last_action != action || (millis() - last_trigger_time > 250)) {
                if (last_action != action) {
                  execute_action_pipeline(action, KEY_EVENT_DOWN, 0xEFFF);
                } else if (!is_monostable) {
                  execute_action_pipeline(action, KEY_EVENT_HOLDING, 0xEFFF);
                }
                last_action = action;
                last_trigger_time = millis();
              }

    on_release:
      - then:
          - lambda: |-
              execute_action_pipeline("release_all", KEY_EVENT_UP, 0xEFFF);

# ====================================================================
# 2. RENDER THE INTERACTIVE GRAPHIC TOUCH BOXES ON SCREEN
# ====================================================================
display:
  - platform: mipi_spi
    id: myDisplay
    spi_id: tft_qspi
    model: ST7789V
    bus_mode: quad
    cs_pin: GPIO10
    reset_pin: GPIO43 
    rotation: 0
    dimensions: 320X480     
    invert_colors: true
    color_order: RGB    
    data_rate: 80MHz    
    update_interval: 0.3s # 🔥 CHANGED: Gives ESP-IDF breathing room between frames


