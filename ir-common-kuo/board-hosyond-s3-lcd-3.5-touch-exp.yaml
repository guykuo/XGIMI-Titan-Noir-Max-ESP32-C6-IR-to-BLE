      - [0xB3, 0x00, 0x30]
      - [0xF1, 0x00]
      - [0x71, 0xD0]
      - [0x66, 0x02, 0x3F]
      - [0xBE, 0x26, 0x00, 0x9D]
      - [0x70, 0x01, 0xA0, 0x11, 0x40, 0xE0, 0x00, 0x11, 0x69, 0x11, 0x00, 0x00, 0x1A]
      - [0x90, 0x04, 0x04, 0x55, 0x74, 0x00, 0x40, 0x43, 0x27, 0x27]
