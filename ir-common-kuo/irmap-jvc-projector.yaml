# JVC Projector

# ======= KUO Begin remote_receiver =========
remote_receiver:
  id: ir_receiver
  pin:
    number: ${pin_ir_receiver}
    inverted: true
    mode:
      input: true
      pullup: true
  filter: 50us
  idle: 10ms
  tolerance: 25%
  dump: 
    - nec
    
  on_nec:
      then:
        - script.execute: display_timeout_handler
        - lambda: |-
            struct IRCommand {
              std::string name;
              esphome::template_::TemplateButton* button_obj;
            };
 
            static const std::map<uint16_t, IRCommand> nec_codes = {
              { 0x7303,       { "back",          id(back) } },           // JVC: EXIT
              { 0x7335,       { "cursor_down",   id(cursor_down) } },    // JVC: DOWN ARROW
              { 0x732F,       { "cursor_enter",  id(cursor_enter) } },   // JVC: OK / ENTER
              { 0x7336,       { "cursor_left",   id(cursor_left) } },    // JVC: LEFT ARROW
              { 0x7334,       { "cursor_right",  id(cursor_right) } },   // JVC: RIGHT ARROW
              { 0x7337,       { "cursor_up",     id(cursor_up) } },      // JVC: UP ARROW
              { 0x7330,       { "focus_auto",    id(focus_auto) } },     // JVC: LENS CONTROL
              { 0x73D4,       { "focus_manual",  id(focus_manual) } },   // JVC: LENS MEMORY
              { 0x732C,       { "home",          id(home) } },           // JVC: MENU (Fallback)
              { 0x7304,       { "input",         id(input) } },          // JVC: INPUT
              { 0x732C,       { "settings_menu", id(settings_menu) } },  // JVC: MENU
              { 0x732C,       { "settings_menu", id(settings_menu) } },  // JVC: MENU (Fallback)
              { 0x731E,       { "game_menu",     id(game_menu) } },      // JVC: INFO
              { 0x7314,       { "mute",          id(mute) } },           // JVC: HIDE (Blank Screen)
              { 0x7341,       { "picture",       id(picture) } },        // JVC: PIC MODE
              { 0x7305,       { "power_on",      id(power_on) } },       // JVC: DISCRETE POWER ON
              { 0x7305,       { "power_on",      id(power_on) } },       // JVC: DISCRETE POWER ON (Fallback)
              { 0x7306,       { "power_off_immediately", id(power_off_immediately) } }, // JVC: DISCRETE POWER OFF
              { 0x7306,       { "power_off_immediately", id(power_off_immediately) } }, // JVC: DISCRETE POWER OFF (Fallback)
              { 0x7374,       { "shortcut_1",    id(shortcut_1) } },     // JVC: GAMMA
              { 0x7375,       { "shortcut_2",    id(shortcut_2) } },     // JVC: COLOR TEMP
              { 0x738A,       { "shortcut_3",    id(shortcut_3) } },     // JVC: C.M.D. (Clear Motion Drive)
              { 0x73D5,       { "shortcut_4",    id(shortcut_4) } },     // JVC: 3D
              { 0x7335,       { "volume_down",   id(volume_down) } },    // JVC: DOWN ARROW (Fallback)
              { 0x7337,       { "volume_up",     id(volume_up) } },      // JVC: UP ARROW (Fallback)
              { 0x7301,       { "token_sniff",   id(token_sniff) } },    // JVC: CUSTOM RESERVED 1
              { 0x7302,       { "token_clear",   id(token_clear) } },    // JVC: CUSTOM RESERVED 2
              { 0x7307,       { "token_recall",  id(token_recall) } },   // JVC: CUSTOM RESERVED 3
              { 0x7308,       { "BT_start_pair", id(bluetooth_pairing_start) } }, // JVC: CUSTOM RESERVED 4
              { 0x7309,       { "BT_clear_pair", id(bluetooth_pairing_clear) } }, // JVC: CUSTOM RESERVED 5
            };

            static uint32_t last_global_ir_time = 0;
            uint32_t now = millis();
            
            // Drop hardware bouncing duplicate frames from trailing JVC packet blasts
            if (now - last_global_ir_time < 250) {
              return;
            }

            std::stringstream ss1;
            ss1 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.command;
            std::string rc_code_1_str = ss1.str(); 
            
            std::stringstream ss2;
            ss2 << "0x" << std::uppercase << std::setfill('0') << std::setw(4) << std::hex << x.address;
            std::string rc_code_2_str = ss2.str(); 
            
            id(OLED_line2) = rc_code_2_str; 
            id(OLED_line3) = rc_code_1_str; 
            
            if (x.address == 0x0073) {
              id(OLED_line2) = "JVC Proj"; 
              
              auto it = nec_codes.find(x.command); 
              
              if (it != nec_codes.end()) {
                last_global_ir_time = now; 
                
                id(OLED_line1) = it->second.name; 
                ESP_LOGD("IR Translated", "IR ---> : %s", it->second.name.c_str());
            
                if (it->second.button_obj != nullptr) {
                  it->second.button_obj->press(); 
                }
              } else {
                id(OLED_line1) = "Unassigned"; 
              }
            } else {
              id(OLED_line1) = "Not JVC Proj IR"; 
            }
            
# ======= KUO End remote_receiver ============
